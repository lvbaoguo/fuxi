<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>错题本 · 连对3次移出</title>
  <style>
    :root {
      --bg: #efe8dc; --card: #fffdf8; --ink: #1c1917; --muted: #78716c;
      --line: #e4ddd2; --blue: #1d4ed8; --green: #166534; --red: #991b1b;
    }
    * { box-sizing: border-box; }
    html, body { touch-action: manipulation; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(900px 420px at 0% 0%, #fecaca66, transparent), var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 14px 12px 72px; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 12px; font-size: 0.9rem; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 12px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .grow { flex: 1 1 auto; }
    button {
      font: inherit; font-weight: 700; border-radius: 8px; border: 1px solid var(--line);
      padding: 8px 10px; background: #fff; color: var(--ink); cursor: pointer;
    }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.good { background: var(--green); color: #fff; border-color: var(--green); }
    button.ghost { background: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; }
    .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .q-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
    .q-meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 6px; }
    .q-text { font-weight: 700; font-size: 1.02rem; margin-bottom: 10px; }
    .opt {
      display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff;
    }
    .opt.on { border-color: var(--blue); background: #eff6ff; }
    .opt.right { border-color: var(--green); background: #ecfdf5; }
    .opt.wrong { border-color: #fca5a5; background: #fef2f2; }
    .explain { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f5f5f4; font-size: 0.9rem; }
    .points { margin: 8px 0 0; padding-left: 1.2em; }
    .points[hidden] { display: none !important; }
    .short-pane {
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      background: #fff; margin-top: 10px;
    }
    .short-pane.official h4 { margin: 0 0 8px; font-size: 0.88rem; font-weight: 700; color: #9a3412; }
    .short-pane ol { margin: 0; padding-left: 1.15em; }
    .short-pane li { margin: 6px 0; font-size: 0.95rem; line-height: 1.45; }
    mark.key { background: #fde68a; padding: 0 2px; border-radius: 3px; font-weight: 700; }
    .short-why-banner {
      margin: 0; border: 1px solid #86efac; border-radius: 10px;
      background: linear-gradient(180deg, #f0fdf4 0%, #ecfdf5 100%); overflow: hidden;
    }
    .short-why-banner > summary {
      list-style: none; cursor: pointer; padding: 12px 14px; font-size: 0.92rem;
      font-weight: 700; color: #166534; user-select: none;
    }
    .short-why-banner > summary::-webkit-details-marker { display: none; }
    .short-why-banner > summary::before { content: "▸ "; color: #15803d; }
    .short-why-banner[open] > summary::before { content: "▾ "; }
    .short-why-body {
      padding: 0 14px 14px; border-top: 1px dashed #bbf7d0;
      font-size: 0.9rem; line-height: 1.55; color: #14532d; white-space: pre-wrap;
    }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .nav-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .toast {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: #1c1917; color: #fff; padding: 10px 14px; border-radius: 8px;
      max-width: min(520px, calc(100% - 24px)); z-index: 30; font-size: 0.9rem;
    }
    .toast[hidden] { display: none !important; }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="margin-bottom:10px;">
      <a class="ghost" href="index.html" style="text-decoration:none;display:inline-block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-weight:700;">← 回每日作业</a>
      <span class="grow"></span>
    </div>
    <h1 id="page-title">错题本</h1>
    <p class="sub" id="page-sub">选择答错会进来。连对 <b>3</b> 次才移出（中途再错清零）。答对后整本打乱。与每日作业共用本机进度。</p>

    <div class="card">
      <div class="tabs">
        <button type="button" class="on" id="tab-mc">选择错题</button>
        <button type="button" id="tab-short">简答错题</button>
      </div>
      <div id="work"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="data.js"></script>
  <script>
    (function () {
      const BANK = window.ZUOYE_BANK;
      if (!BANK) {
        document.body.innerHTML = "<p style='padding:24px'>缺少 data.js</p>";
        return;
      }
      const STORE = "pansan2-zuoye-forced-progress";
      const STORE_LEGACY = "pansan2-zuoye-forced-v3";
      const WRONG_CLEAR_STREAK = 3;
      const courseName = { history: "近代史", xi: "习思想" };
      const $ = (id) => document.getElementById(id);
      const IS_FAV = /(?:\?|&)mode=fav(?:&|$)/.test(location.search || "");

      function normalizeWrongMap(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          const v = map[k];
          if (!v) return;
          if (typeof v === "object") out[id] = { streak: Math.max(0, Math.floor(Number(v.streak) || 0)) };
          else out[id] = { streak: 0 };
        });
        return out;
      }
      function normalizeFavMap(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          const v = map[k];
          if (!v) return;
          out[id] = { at: (typeof v === "object" && v.at) || new Date().toISOString() };
        });
        return out;
      }

      function load() {
        try {
          let raw = JSON.parse(localStorage.getItem(STORE) || "null");
          if (!raw) raw = JSON.parse(localStorage.getItem(STORE_LEGACY) || "null");
          if (!raw || typeof raw !== "object") {
            return {
              v: 8,
              wrongMc: {},
              wrongShort: {},
              favMc: {},
              favShort: {},
              mcOk: {},
              shortOk: {},
              mcDay: {},
              pinnedPlans: {},
            };
          }
          return {
            v: raw.v || 8,
            wrongMc: normalizeWrongMap(raw.wrongMc),
            wrongShort: normalizeWrongMap(raw.wrongShort),
            favMc: normalizeFavMap(raw.favMc),
            favShort: normalizeFavMap(raw.favShort),
            mcOk: raw.mcOk || {},
            shortOk: raw.shortOk || {},
            shortDraft: raw.shortDraft || {},
            mcDay: raw.mcDay || {},
            pinnedPlans: raw.pinnedPlans || {},
            tapAnswer: !!raw.tapAnswer,
            mcShuffle: !!raw.mcShuffle,
            mcShuffleDate: raw.mcShuffleDate || null,
            mcShuffleIds: Array.isArray(raw.mcShuffleIds) ? raw.mcShuffleIds.slice() : null,
            exportedAt: raw.exportedAt || null,
          };
        } catch (_) {
          return {
            v: 8,
            wrongMc: {},
            wrongShort: {},
            favMc: {},
            favShort: {},
            mcOk: {},
            shortOk: {},
            mcDay: {},
            pinnedPlans: {},
          };
        }
      }

      /** 合并写回，避免错题页把每日草稿等字段冲掉 */
      function save() {
        state.exportedAt = new Date().toISOString();
        try {
          let raw = {};
          try {
            raw = JSON.parse(localStorage.getItem(STORE) || "{}") || {};
          } catch (_) {
            raw = {};
          }
          const next = Object.assign({}, raw, {
            v: Math.max(Number(raw.v) || 0, 8),
            wrongMc: state.wrongMc,
            wrongShort: state.wrongShort,
            favMc: state.favMc || {},
            favShort: state.favShort || {},
            mcOk: state.mcOk,
            shortOk: state.shortOk,
            mcDay: state.mcDay,
            pinnedPlans: state.pinnedPlans,
            exportedAt: state.exportedAt,
          });
          if (state.shortDraft) next.shortDraft = state.shortDraft;
          localStorage.setItem(STORE, JSON.stringify(next));
          localStorage.setItem(STORE_LEGACY, JSON.stringify(next));
        } catch (_) {}
      }

      function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => {
          el.hidden = true;
        }, 3500);
      }

      function noteMcWrong(id) {
        state.wrongMc[id] = { streak: 0 };
      }
      function noteMcRight(id) {
        if (!state.wrongMc[id]) return { removed: false, streak: 0 };
        const streak = (state.wrongMc[id].streak || 0) + 1;
        if (streak >= WRONG_CLEAR_STREAK) {
          delete state.wrongMc[id];
          return { removed: true, streak };
        }
        state.wrongMc[id] = { streak };
        return { removed: false, streak };
      }
      function noteShortWrong(id) {
        state.wrongShort[id] = { streak: 0 };
      }
      function noteShortRight(id) {
        if (!state.wrongShort[id]) return { removed: false, streak: 0 };
        const streak = (state.wrongShort[id].streak || 0) + 1;
        if (streak >= WRONG_CLEAR_STREAK) {
          delete state.wrongShort[id];
          return { removed: true, streak };
        }
        state.wrongShort[id] = { streak };
        return { removed: false, streak };
      }
      function removeFavMc(id) {
        if (state.favMc) delete state.favMc[id];
      }
      function removeFavShort(id) {
        if (state.favShort) delete state.favShort[id];
      }

      let state = load();
      let tab = "mc";
      let mcIdx = 0;
      let shortIdx = 0;
      let mcOrder = null; /* id[] 打乱序 */
      let shortOrder = null;
      let picked = null;
      let judged = false;
      let shortRevealed = false;

      if (IS_FAV) {
        document.title = "收藏录 · 反复练习";
        $("page-title").textContent = "收藏录";
        $("page-sub").innerHTML =
          "每日作业点「收」进来。可反复练；答对会同步推进错题本连对（满 3 次移出错题本，收藏仍保留，除非点移出收藏）。";
      }

      function shuffleIds(ids) {
        const a = ids.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function sourceMcIds() {
        return Object.keys(IS_FAV ? state.favMc || {} : state.wrongMc || {});
      }
      function sourceShortIds() {
        return Object.keys(IS_FAV ? state.favShort || {} : state.wrongShort || {});
      }

      function syncMcOrder() {
        const ids = sourceMcIds();
        const alive = IS_FAV ? state.favMc || {} : state.wrongMc || {};
        if (!mcOrder) mcOrder = shuffleIds(ids);
        else {
          mcOrder = mcOrder.filter((id) => alive[id]);
          ids.forEach((id) => {
            if (mcOrder.indexOf(id) < 0) mcOrder.push(id);
          });
        }
      }
      function syncShortOrder() {
        const ids = sourceShortIds();
        const alive = IS_FAV ? state.favShort || {} : state.wrongShort || {};
        if (!shortOrder) shortOrder = shuffleIds(ids);
        else {
          shortOrder = shortOrder.filter((id) => alive[id]);
          ids.forEach((id) => {
            if (shortOrder.indexOf(id) < 0) shortOrder.push(id);
          });
        }
      }

      /** 答对后整本重洗，并尽量避开刚答过的那道，防止连着刷同一题 */
      function reshuffleMcAfter(avoidId) {
        const ids = sourceMcIds();
        mcOrder = shuffleIds(ids);
        if (!mcOrder.length) {
          mcIdx = 0;
          return;
        }
        if (mcOrder.length === 1) {
          mcIdx = 0;
          return;
        }
        let idx = Math.floor(Math.random() * mcOrder.length);
        let guard = 0;
        while (mcOrder[idx] === avoidId && guard < 30) {
          idx = Math.floor(Math.random() * mcOrder.length);
          guard += 1;
        }
        mcIdx = idx;
      }
      function reshuffleShortAfter(avoidId) {
        const ids = sourceShortIds();
        shortOrder = shuffleIds(ids);
        if (!shortOrder.length) {
          shortIdx = 0;
          return;
        }
        if (shortOrder.length === 1) {
          shortIdx = 0;
          return;
        }
        let idx = Math.floor(Math.random() * shortOrder.length);
        let guard = 0;
        while (shortOrder[idx] === avoidId && guard < 30) {
          idx = Math.floor(Math.random() * shortOrder.length);
          guard += 1;
        }
        shortIdx = idx;
      }

      function mcList() {
        syncMcOrder();
        return mcOrder.map((id) => BANK.mcById[id]).filter(Boolean);
      }
      function shortList() {
        syncShortOrder();
        return shortOrder.map((id) => BANK.shortById[id]).filter(Boolean);
      }

      function renderMc() {
        const list = mcList();
        $("tab-mc").textContent = (IS_FAV ? "选择收藏 " : "选择错题 ") + list.length;
        $("tab-short").textContent = (IS_FAV ? "简答收藏 " : "简答错题 ") + shortList().length;
        if (!list.length) {
          $("work").innerHTML = IS_FAV
            ? "<p class='hint'>收藏录还没有选择题。回每日作业点「收」。</p>"
            : "<p class='hint'>没有选择错题。去每日作业里答错会自动进来。</p>";
          return;
        }
        if (mcIdx >= list.length) mcIdx = list.length - 1;
        if (mcIdx < 0) mcIdx = 0;
        const q = list[mcIdx];
        const streak = (state.wrongMc[q.id] && state.wrongMc[q.id].streak) || 0;
        const name = (BANK.names[q.course] && BANK.names[q.course][q.ch]) || "";
        const box = document.createElement("div");
        box.className = "q-card";
        box.innerHTML =
          '<div class="q-meta">' +
          courseName[q.course] +
          " · 第" +
          q.ch +
          "章 · " +
          (mcIdx + 1) +
          "/" +
          list.length +
          (IS_FAV ? " · 收藏反复练" : "") +
          " · 错题连对 " +
          streak +
          "/" +
          WRONG_CLEAR_STREAK +
          " · " +
          name +
          "</div>" +
          '<div class="q-text"></div><div id="opts"></div><div id="explain" class="explain" hidden></div>' +
          '<div class="nav-btns">' +
          '<button type="button" class="primary" id="btn-judge">提交</button>' +
          '<button type="button" class="ghost" id="btn-prev">上一题</button>' +
          '<button type="button" class="ghost" id="btn-next">下一题</button>' +
          (IS_FAV
            ? '<button type="button" class="ghost" id="btn-unfav">移出收藏</button>'
            : "") +
          "</div>";
        box.querySelector(".q-text").textContent = q.text;
        const opts = box.querySelector("#opts");
        q.options.forEach((o) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "opt";
          b.textContent = o.key + ". " + o.label;
          if (picked === o.key) b.classList.add("on");
          if (judged) {
            if (o.key === q.correct) b.classList.add("right");
            if (picked === o.key && picked !== q.correct) b.classList.add("wrong");
          }
          b.addEventListener("click", () => {
            picked = o.key;
            judged = false;
            render();
          });
          opts.appendChild(b);
        });
        if (judged && q.explain) {
          const ex = box.querySelector("#explain");
          ex.hidden = false;
          ex.textContent = "解析：" + q.explain + "（答案 " + q.correct + "）";
        }
        $("work").innerHTML = "";
        $("work").appendChild(box);
        $("btn-judge").addEventListener("click", () => {
          if (!picked) {
            toast("先选一个选项");
            return;
          }
          judged = true;
          if (picked === q.correct) {
            const answeredId = q.id;
            const wr = noteMcRight(answeredId);
            save();
            if (IS_FAV) {
              toast(
                wr.removed
                  ? "答对 · 错题本已移出（收藏仍在）· 题序已打乱"
                  : wr.streak
                    ? "答对 · 错题连对 " + wr.streak + "/" + WRONG_CLEAR_STREAK + " · 收藏保留"
                    : "答对 · 收藏保留 · 题序已打乱"
              );
            } else {
              toast(
                wr.removed
                  ? "连对3次，已移出 · 剩余题已打乱"
                  : "答对，连对 " + wr.streak + "/" + WRONG_CLEAR_STREAK + " · 题序已打乱"
              );
            }
            picked = null;
            judged = false;
            reshuffleMcAfter(answeredId);
            render();
          } else {
            noteMcWrong(q.id);
            save();
            toast("又错了，错题连对清零");
            render();
          }
        });
        if (IS_FAV && $("btn-unfav")) {
          $("btn-unfav").addEventListener("click", () => {
            removeFavMc(q.id);
            save();
            toast("已移出收藏录");
            picked = null;
            judged = false;
            render();
          });
        }
        $("btn-prev").addEventListener("click", () => {
          jumpMcAwayFrom(q.id);
        });
        $("btn-next").addEventListener("click", () => {
          jumpMcAwayFrom(q.id);
        });
      }

      function jumpMcAwayFrom(currentId) {
        const ids = sourceMcIds();
        if (ids.length <= 1) {
          toast(IS_FAV ? "只剩 1 道收藏，没法换题" : "只剩 1 道错题，没法换题");
          return;
        }
        mcOrder = shuffleIds(ids);
        let idx = Math.floor(Math.random() * mcOrder.length);
        let guard = 0;
        while (mcOrder[idx] === currentId && guard < 40) {
          idx = Math.floor(Math.random() * mcOrder.length);
          guard += 1;
        }
        mcIdx = idx;
        picked = null;
        judged = false;
        render();
      }

      function jumpShortAwayFrom(currentId) {
        const ids = sourceShortIds();
        if (ids.length <= 1) {
          toast(IS_FAV ? "只剩 1 道收藏，没法换题" : "只剩 1 道错题，没法换题");
          return;
        }
        shortOrder = shuffleIds(ids);
        let idx = Math.floor(Math.random() * shortOrder.length);
        let guard = 0;
        while (shortOrder[idx] === currentId && guard < 40) {
          idx = Math.floor(Math.random() * shortOrder.length);
          guard += 1;
        }
        shortIdx = idx;
        shortRevealed = false;
        render();
      }


      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      const SHORT_KEY_BANK = [
        "半殖民地半封建社会","半殖民地半封建","资本主义世界市场","主权和领土完整","两个确立","六个必须坚持",
        "中国特色社会主义","新民主主义革命","旧民主主义革命","全过程人民民主","高质量发展","全面从严治党",
        "党的全面领导","以人民为中心","中国式现代化","科技自立自强","人类命运共同体","总体国家安全观",
        "军委主席负责制","抗日民族统一战线","农村包围城市","十一届三中全会","四项基本原则","三个有利于",
        "世界观和方法论","新文化运动","马克思主义","工人阶级","政治舞台","遵义会议","土地革命","武装斗争",
        "农村根据地","整风运动","实事求是","两个务必","三大改造","一国两制","南方谈话","共同富裕","人民至上",
        "新发展理念","民族复兴","主要矛盾","根本原因","自然经济","双重任务","反帝反封建","帝国主义","封建主义",
        "无产阶级","资产阶级","小资产阶级","知识分子","革命团体","武装起义","民主共和","临时约法","洋务派",
        "封建性","依赖性","领导核心","各自为政","封建制度","西方技术","中体西用","维新派","思想启蒙","太平天国",
        "辛亥革命","五四运动","统一战线","改革开放","市场经济",
      ];
      function extractPointKeys(point) {
        const raw = String(point || "");
        const keys = [];
        SHORT_KEY_BANK.forEach((k) => {
          if (raw.indexOf(k) >= 0) keys.push(k);
        });
        (raw.match(/[「『]([^」』]+)[」』]/g) || []).forEach((m) => {
          const inner = m.replace(/^[「『]/, "").replace(/[」』]$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        (raw.match(/《([^》]+)》/g) || []).forEach((m) => {
          const inner = m.replace(/^《/, "").replace(/》$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        raw.split(/[，。；、]/).forEach((seg) => {
          const s0 = seg.replace(/\s+/g, "").trim();
          if (s0.length < 3) return;
          if (keys.some((k) => s0.indexOf(k) >= 0)) return;
          let s = s0.replace(/^(企图|必须|坚持|强调|提出|建立|实行|进行|推动|实现|促进|维护|加强|完善|健全)/, "");
          if (s.length >= 3 && s.length <= 16) keys.push(s.slice(0, 12));
          else if (s0.length >= 4 && s0.length <= 14) keys.push(s0.slice(0, 10));
        });
        return Array.from(new Set(keys));
      }
      function highlightKeys(s) {
        return escapeHtml(String(s || ""));
      }

      function renderShort() {
        const list = shortList();
        $("tab-mc").textContent = (IS_FAV ? "选择收藏 " : "选择错题 ") + mcList().length;
        $("tab-short").textContent = (IS_FAV ? "简答收藏 " : "简答错题 ") + list.length;
        if (!list.length) {
          $("work").innerHTML = IS_FAV
            ? "<p class='hint'>收藏录还没有简答。回每日作业点「收」。</p>"
            : "<p class='hint'>没有简答错题。</p>";
          return;
        }
        if (shortIdx >= list.length) shortIdx = list.length - 1;
        if (shortIdx < 0) shortIdx = 0;
        const q = list[shortIdx];
        const streak = (state.wrongShort[q.id] && state.wrongShort[q.id].streak) || 0;
        const name = (BANK.names[q.course] && BANK.names[q.course][q.ch]) || "";
        const box = document.createElement("div");
        box.className = "q-card";
        box.innerHTML =
          '<div class="q-meta">' +
          courseName[q.course] +
          " · 第" +
          q.ch +
          "章 · " +
          (shortIdx + 1) +
          "/" +
          list.length +
          (IS_FAV ? " · 收藏反复练" : "") +
          " · 错题连对 " +
          streak +
          "/" +
          WRONG_CLEAR_STREAK +
          " · " +
          name +
          "</div>" +
          '<div class="q-text"></div>' +
          (q.lead ? '<p class="hint">提示：' + q.lead + "</p>" : "") +
          '<div id="short-compare" hidden>' +
          '<details class="short-why-banner" id="short-why">' +
          "<summary>背景</summary>" +
          '<div class="short-why-body" id="short-why-body"></div></details>' +
          '<div class="short-pane official"><h4>采分点</h4><ol id="points-official"></ol></div></div>' +
          '<div class="nav-btns">' +
          '<button type="button" class="primary" id="btn-reveal">默完了，看采分点</button>' +
          '<button type="button" class="good" id="btn-pass"' +
          (shortRevealed ? "" : " disabled") +
          ">会了（计连对）</button>" +
          '<button type="button" class="ghost" id="btn-fail"' +
          (shortRevealed ? "" : " disabled") +
          ">还不会（清零）</button>" +
          '<button type="button" class="ghost" id="btn-prev">上一题</button>' +
          '<button type="button" class="ghost" id="btn-next">下一题</button>' +
          (IS_FAV
            ? '<button type="button" class="ghost" id="btn-unfav">移出收藏</button>'
            : "") +
          "</div>";
        box.querySelector(".q-text").textContent = q.text;
        const wrap = box.querySelector("#short-compare");
        if (shortRevealed) {
          wrap.hidden = false;
          const whyBody = box.querySelector("#short-why-body");
          if (whyBody) {
            whyBody.textContent =
              (q.why && String(q.why).trim()) ||
              (q.points || [])
                .map((p, i) => i + 1 + ". 对照这句想当时发生了啥，才总结成：「" + p + "」")
                .join("\n\n");
          }
          const off = box.querySelector("#points-official");
          off.innerHTML = "";
          (q.points || []).forEach((p) => {
            const li = document.createElement("li");
            li.innerHTML = highlightKeys(p);
            off.appendChild(li);
          });
        }
        $("work").innerHTML = "";
        $("work").appendChild(box);
        $("btn-reveal").addEventListener("click", () => {
          shortRevealed = true;
          render();
        });
        $("btn-pass").addEventListener("click", () => {
          const answeredId = q.id;
          const wr = noteShortRight(answeredId);
          save();
          if (IS_FAV) {
            toast(
              wr.removed
                ? "会了 · 错题本已移出（收藏仍在）"
                : wr.streak
                  ? "会了 · 错题连对 " + wr.streak + "/" + WRONG_CLEAR_STREAK + " · 收藏保留"
                  : "会了 · 收藏保留"
            );
          } else {
            toast(
              wr.removed
                ? "连对3次，已移出 · 剩余题已打乱"
                : "会了，连对 " + wr.streak + "/" + WRONG_CLEAR_STREAK + " · 题序已打乱"
            );
          }
          shortRevealed = false;
          reshuffleShortAfter(answeredId);
          render();
        });
        $("btn-fail").addEventListener("click", () => {
          noteShortWrong(q.id);
          save();
          shortRevealed = false;
          toast("错题连对清零");
          render();
        });
        if (IS_FAV && $("btn-unfav")) {
          $("btn-unfav").addEventListener("click", () => {
            removeFavShort(q.id);
            save();
            toast("已移出收藏录");
            shortRevealed = false;
            render();
          });
        }
        $("btn-prev").addEventListener("click", () => {
          jumpShortAwayFrom(q.id);
        });
        $("btn-next").addEventListener("click", () => {
          jumpShortAwayFrom(q.id);
        });
      }

      function render() {
        $("tab-mc").classList.toggle("on", tab === "mc");
        $("tab-short").classList.toggle("on", tab === "short");
        if (tab === "mc") renderMc();
        else renderShort();
      }

      $("tab-mc").addEventListener("click", () => {
        tab = "mc";
        picked = null;
        judged = false;
        render();
      });
      $("tab-short").addEventListener("click", () => {
        tab = "short";
        shortRevealed = false;
        render();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          state = load();
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
