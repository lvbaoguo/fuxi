<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>错题本 · 整本全对才移出</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pansan2-zuoye-theme");
        document.documentElement.setAttribute("data-theme", t === "eye" ? "eye" : "warm");
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "warm");
      }
    })();
  </script>
  <style>
    :root, [data-theme="warm"] {
      --bg: #efe8dc; --glow-a: #fecaca66; --card: #fffdf8; --surface: #fff;
      --ink: #1c1917; --muted: #78716c; --line: #e4ddd2;
      --blue: #1d4ed8; --green: #166534; --red: #991b1b; --on: #78716c;
      --opt-on-bg: #eff6ff; --opt-ok-bg: #ecfdf5; --opt-bad-bg: #fef2f2;
      --why-bg: linear-gradient(180deg, #f0fdf4 0%, #ecfdf5 100%);
      --why-line: #86efac; --why-ink: #166534; --why-body: #14532d; --why-dash: #bbf7d0;
      --toast-bg: #1c1917;
    }
    [data-theme="eye"] {
      --bg: #e8eaee; --glow-a: transparent; --card: #f3f4f6; --surface: #fafbfc;
      --ink: #374151; --muted: #6b7280; --line: #d1d5db;
      --blue: #3b6ea5; --green: #3f6f5a; --red: #9a4a4a; --on: #64748b;
      --opt-on-bg: #e8eef5; --opt-ok-bg: #e6efe9; --opt-bad-bg: #f3e8e8;
      --why-bg: #eef1f3; --why-line: #c5ced6; --why-ink: #4b5563; --why-body: #4b5563; --why-dash: #d1d5db;
      --toast-bg: #374151;
    }
    * { box-sizing: border-box; }
    html, body { touch-action: manipulation; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(900px 420px at 0% 0%, var(--glow-a), transparent), var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 14px 12px 72px; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 12px; font-size: 0.9rem; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 12px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .grow { flex: 1 1 auto; }
    button {
      font: inherit; font-weight: 700; border-radius: 8px; border: 1px solid var(--line);
      padding: 8px 10px; background: var(--surface); color: var(--ink); cursor: pointer;
    }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.good { background: var(--green); color: #fff; border-color: var(--green); }
    button.ghost { background: var(--surface); }
    button.on { background: var(--on); color: #fff; border-color: var(--on); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; }
    .tabs button.on { background: var(--on); color: #fff; border-color: var(--on); }
    .q-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
    .q-meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 6px; }
    .q-text { font-weight: 700; font-size: 1.02rem; margin-bottom: 10px; }
    .opt {
      display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    }
    .opt.on { border-color: var(--blue); background: var(--opt-on-bg); }
    .opt.right { border-color: var(--green); background: var(--opt-ok-bg); }
    .opt.right.flash { animation: opt-right-flash 0.35s ease-out; }
    @keyframes opt-right-flash {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.45); }
      40% { transform: scale(1.02); box-shadow: 0 0 0 6px rgba(22, 163, 74, 0.18); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }
    .opt.wrong { border-color: #fca5a5; background: var(--opt-bad-bg); }
    .explain { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f5f5f4; font-size: 0.9rem; }
    [data-theme="eye"] .explain { background: #eef1f4; }
    .points { margin: 8px 0 0; padding-left: 1.2em; }
    .points[hidden] { display: none !important; }
    .short-pane {
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      background: var(--surface); margin-top: 10px;
    }
    .short-pane.official h4 { margin: 0 0 8px; font-size: 0.88rem; font-weight: 700; color: var(--muted); }
    .short-pane ol { margin: 0; padding-left: 1.15em; }
    .short-pane li { margin: 6px 0; font-size: 0.95rem; line-height: 1.45; }
    mark.key { background: #e5e7eb; padding: 0 2px; border-radius: 3px; font-weight: 700; }
    [data-theme="warm"] mark.key { background: #fde68a; }
    .short-why-banner {
      margin: 0; border: 1px solid var(--why-line); border-radius: 10px;
      background: var(--why-bg); overflow: hidden;
    }
    .short-why-banner > summary {
      list-style: none; cursor: pointer; padding: 12px 14px; font-size: 0.92rem;
      font-weight: 700; color: var(--why-ink); user-select: none;
    }
    .short-why-banner > summary::-webkit-details-marker { display: none; }
    .short-why-banner > summary::before { content: "▸ "; color: var(--why-ink); }
    .short-why-banner[open] > summary::before { content: "▾ "; }
    .short-why-body {
      padding: 0 14px 14px; border-top: 1px dashed var(--why-dash);
      font-size: 0.9rem; line-height: 1.55; color: var(--why-body); white-space: pre-wrap;
    }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .nav-btns {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }
    .nav-btns button {
      flex: 0 0 auto;
      width: auto;
      min-width: 0;
      padding: 6px 9px;
      font-size: 0.88rem;
      line-height: 1.2;
      white-space: nowrap;
    }
    .nav-btns .ok-need-wrap,
    .nav-btns .restore-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 2px;
    }
    .nav-btns .ok-need-wrap input,
    .nav-btns .restore-wrap input {
      width: 2.6em;
      padding: 5px 4px;
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.2;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
      background: var(--surface);
      color: var(--ink);
    }
    .toast {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: var(--toast-bg); color: #fff; padding: 10px 14px; border-radius: 8px;
      max-width: min(520px, calc(100% - 24px)); z-index: 30; font-size: 0.9rem;
    }
    .toast[hidden] { display: none !important; }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="margin-bottom:10px;">
      <a class="ghost" href="index.html" style="text-decoration:none;display:inline-block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-weight:700;">← 回每日作业</a>
      <span class="grow"></span>
      <button type="button" class="ghost" id="btn-theme-warm" title="暖色纸感">暖色</button>
      <button type="button" class="ghost" id="btn-theme-eye" title="冷灰护眼">护眼</button>
    </div>
    <h1 id="page-title">错题本</h1>
    <p class="sub" id="page-sub">按科目分开收集。连对够次才暂移。「重」旁填 0 全召回、填 N 召回累计犯错≥N（不清累计）。与作业页共用本机进度。</p>

    <div class="card">
      <div class="tabs" id="tabs-course">
        <button type="button" class="on" id="tab-course-history">近代史</button>
        <button type="button" id="tab-course-xi">习思想</button>
      </div>
      <div class="tabs">
        <button type="button" class="on" id="tab-mc">选择错题</button>
        <button type="button" id="tab-short">简答错题</button>
      </div>
      <div id="work"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="data.js"></script>
  <script>
    (function () {
      const BANK = window.ZUOYE_BANK;
      if (!BANK) {
        document.body.innerHTML = "<p style='padding:24px'>缺少 data.js</p>";
        return;
      }
      const STORE = "pansan2-zuoye-forced-progress";
      const STORE_LEGACY = "pansan2-zuoye-forced-v3";
      const THEME_STORE = "pansan2-zuoye-theme";
      const WRONG_OK_NEED_DEFAULT = 2; /* 同题答对 N 次才暂移出（可「设」改） */
      let wrongOkNeed = WRONG_OK_NEED_DEFAULT;
      const courseName = { history: "近代史", xi: "习思想" };
      function clampWrongOkNeed(n) {
        const x = Math.floor(Number(n));
        if (!isFinite(x) || x < 1) return WRONG_OK_NEED_DEFAULT;
        return Math.min(20, x);
      }
      function wrongOkNeedOf() {
        return clampWrongOkNeed(wrongOkNeed);
      }
      /** 改「答对几次暂移」：按新阈值重算 parked，并刷新题序 */
      function applyWrongOkNeed(raw, opts) {
        const next = clampWrongOkNeed(raw);
        const silent = opts && opts.silent;
        wrongOkNeed = next;
        if (state) state.wrongOkNeed = next;
        const need = next;
        Object.keys(state.wrongMc || {}).forEach((id) => {
          const w = state.wrongMc[id];
          if (!w) return;
          w.parked = (w.ok || 0) >= need;
        });
        Object.keys(state.wrongShort || {}).forEach((id) => {
          const w = state.wrongShort[id];
          if (!w) return;
          w.parked = (w.ok || 0) >= need;
        });
        mcOrder = null;
        shortOrder = null;
        mcIdx = 0;
        shortIdx = 0;
        holdingFail = false;
        holdingCorrect = false;
        picked = null;
        judged = false;
        save();
        if (!IS_PERM && $("page-sub")) {
          $("page-sub").innerHTML =
            "默认<strong>点答</strong>。同题答对 <b>" +
            need +
            "</b> 次才<strong>暂移出</strong>。答对/「跳」后优先还没连对的。「重」旁填 0 全召回、N 召回累计≥N（不清累计）；「设」改连对次数。";
        }
        if (!silent) toast("已设：答对 " + need + " 次才暂移");
        render();
      }
      function bindOkNeedControls() {
        const btn = $("btn-ok-need");
        const inp = $("inp-ok-need");
        if (!btn || !inp) return;
        const commit = () => applyWrongOkNeed(inp.value);
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          commit();
        });
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            commit();
          }
        });
        inp.addEventListener("change", () => commit());
      }
      function okNeedControlsHtml(disabled) {
        return (
          '<span class="ok-need-wrap" title="答对几次才暂移出">' +
          '<button type="button" class="ghost" id="btn-ok-need"' +
          (disabled ? " disabled" : "") +
          ">设</button>" +
          '<input id="inp-ok-need" type="number" min="1" max="20" step="1" value="' +
          wrongOkNeedOf() +
          '"' +
          (disabled ? " disabled" : "") +
          " />" +
          "</span>"
        );
      }
      /** 「重」常驻：输入框=最低累计犯错次数；0=全部召回（不清 fails） */
      let restoreMinFails = 0;
      function clampRestoreMinFails(n) {
        const x = Math.floor(Number(n));
        if (!isFinite(x) || x < 0) return 0;
        return Math.min(99, x);
      }
      function restoreControlsHtml() {
        return (
          '<span class="restore-wrap" title="召回：0=全部；N=累计犯错≥N 的题；不清累计次数">' +
          '<button type="button" class="danger" id="btn-restore-all">重</button>' +
          '<input id="inp-restore-fails" type="number" min="0" max="99" step="1" value="' +
          clampRestoreMinFails(restoreMinFails) +
          '" />' +
          "</span>"
        );
      }
      function bindRestoreControls() {
        const btn = $("btn-restore-all");
        const inp = $("inp-restore-fails");
        if (!btn) return;
        if (inp) {
          inp.addEventListener("change", () => {
            restoreMinFails = clampRestoreMinFails(inp.value);
            inp.value = String(restoreMinFails);
          });
        }
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          const minF = clampRestoreMinFails(inp ? inp.value : restoreMinFails);
          restoreMinFails = minF;
          if (inp) inp.value = String(minF);
          const tip =
            minF <= 0
              ? "召回全部初始错题（含暂移）？累计犯错次数保留，连对进度清零。"
              : "召回累计犯错 ≥ " + minF + " 次的暂移题？累计次数保留，连对进度清零。";
          if (!confirm(tip)) return;
          restoreWrongByMinFails(minF);
        });
      }
      const $ = (id) => document.getElementById(id);
      const IS_PERM =
        /(?:\?|&)mode=perm(?:&|$)/.test(location.search || "") ||
        /(?:\?|&)mode=fav(?:&|$)/.test(location.search || ""); /* 旧收藏链接兼容进永久库 */
      let courseFilter = "history";
      try {
        const m = /(?:\?|&)course=(history|xi)(?:&|$)/.exec(location.search || "");
        if (m) courseFilter = m[1];
        else {
          const saved = sessionStorage.getItem("pansan2-zuoye-wrong-course");
          if (saved === "history" || saved === "xi") courseFilter = saved;
        }
      } catch (_) {}
      function setCourseFilter(c) {
        courseFilter = c === "xi" ? "xi" : "history";
        try {
          sessionStorage.setItem("pansan2-zuoye-wrong-course", courseFilter);
        } catch (_) {}
        mcOrder = null;
        shortOrder = null;
        mcIdx = 0;
        shortIdx = 0;
        holdingFail = false;
        holdingCorrect = false;
        picked = null;
        judged = false;
        shortRevealed = false;
        render();
      }
      function idInCourse(id, kind) {
        const q = kind === "short" ? BANK.shortById && BANK.shortById[id] : BANK.mcById && BANK.mcById[id];
        return !!(q && q.course === courseFilter);
      }

      function getTheme() {
        try {
          return localStorage.getItem(THEME_STORE) === "eye" ? "eye" : "warm";
        } catch (_) {
          return "warm";
        }
      }
      function applyTheme(theme, withToast) {
        const t = theme === "eye" ? "eye" : "warm";
        document.documentElement.setAttribute("data-theme", t);
        try {
          localStorage.setItem(THEME_STORE, t);
        } catch (_) {}
        if ($("btn-theme-warm")) $("btn-theme-warm").classList.toggle("on", t === "warm");
        if ($("btn-theme-eye")) $("btn-theme-eye").classList.toggle("on", t === "eye");
        if (withToast) toast(t === "eye" ? "已切到护眼" : "已切到暖色");
      }

      function normalizeWrongMap(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          const v = map[k];
          if (!v) return;
          if (typeof v === "object") {
            const need = wrongOkNeedOf();
            const ok = Math.max(0, Math.floor(Number(v.ok) || 0));
            const parked = !!v.parked || ok >= need;
            out[id] = {
              streak: Math.max(0, Math.floor(Number(v.streak) || 0)),
              ok: ok,
              parked: parked,
              fails: Math.max(0, Math.floor(Number(v.fails) || 0)), /* 累计犯错，从有此字段起计 */
            };
          } else {
            out[id] = { streak: 0, ok: 0, parked: false, fails: 0 };
          }
        });
        return out;
      }
      function normalizePermMap(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          const v = map[k];
          if (!v) return;
          if (typeof v === "object") {
            out[id] = {
              miss: Math.max(1, Math.floor(Number(v.miss) || Number(v.count) || 1)),
              at: v.at || new Date().toISOString(),
            };
          } else {
            out[id] = { miss: 1, at: new Date().toISOString() };
          }
        });
        return out;
      }
      function mergeIntoPerm(dst, src, defaultMiss) {
        const miss0 = Math.max(1, Math.floor(Number(defaultMiss) || 1));
        Object.keys(src || {}).forEach((id) => {
          const s = src[id];
          const srcMiss =
            s && typeof s === "object"
              ? Math.max(1, Math.floor(Number(s.miss) || Number(s.count) || miss0))
              : miss0;
          if (!dst[id]) {
            dst[id] = { miss: srcMiss, at: (s && s.at) || new Date().toISOString() };
          } else {
            dst[id].miss = Math.max(dst[id].miss || 1, srcMiss);
          }
        });
        return dst;
      }

      function load() {
        try {
          let raw = JSON.parse(localStorage.getItem(STORE) || "null");
          if (!raw) raw = JSON.parse(localStorage.getItem(STORE_LEGACY) || "null");
          if (!raw || typeof raw !== "object") {
            return {
              v: 8,
              wrongOkNeed: WRONG_OK_NEED_DEFAULT,
              wrongMc: {},
              wrongShort: {},
              permMc: {},
              permShort: {},
              mcOk: {},
              shortOk: {},
              mcDay: {},
              pinnedPlans: {},
            };
          }
          wrongOkNeed = clampWrongOkNeed(
            raw.wrongOkNeed != null ? raw.wrongOkNeed : WRONG_OK_NEED_DEFAULT
          );
          const wrongMc = normalizeWrongMap(raw.wrongMc);
          const wrongShort = normalizeWrongMap(raw.wrongShort);
          const permMc = normalizePermMap(raw.permMc);
          const permShort = normalizePermMap(raw.permShort);
          mergeIntoPerm(permMc, raw.favMc, 1);
          mergeIntoPerm(permShort, raw.favShort, 1);
          mergeIntoPerm(permMc, wrongMc, 1);
          mergeIntoPerm(permShort, wrongShort, 1);
          return {
            v: raw.v || 8,
            wrongOkNeed: wrongOkNeed,
            wrongMc: wrongMc,
            wrongShort: wrongShort,
            permMc: permMc,
            permShort: permShort,
            mcOk: raw.mcOk || {},
            shortOk: raw.shortOk || {},
            shortDraft: raw.shortDraft || {},
            mcDay: raw.mcDay || {},
            pinnedPlans: raw.pinnedPlans || {},
            tapAnswer: !!raw.tapAnswer,
            mcShuffle: !!raw.mcShuffle,
            mcShuffleDate: raw.mcShuffleDate || null,
            mcShuffleIds: Array.isArray(raw.mcShuffleIds) ? raw.mcShuffleIds.slice() : null,
            exportedAt: raw.exportedAt || null,
          };
        } catch (_) {
          return {
            v: 8,
            wrongOkNeed: WRONG_OK_NEED_DEFAULT,
            wrongMc: {},
            wrongShort: {},
            permMc: {},
            permShort: {},
            mcOk: {},
            shortOk: {},
            mcDay: {},
            pinnedPlans: {},
          };
        }
      }

      /** 合并写回，避免错题页把每日草稿等字段冲掉 */
      function save() {
        state.exportedAt = new Date().toISOString();
        try {
          let raw = {};
          try {
            raw = JSON.parse(localStorage.getItem(STORE) || "{}") || {};
          } catch (_) {
            raw = {};
          }
          const next = Object.assign({}, raw, {
            v: Math.max(Number(raw.v) || 0, 8),
            wrongOkNeed: wrongOkNeedOf(),
            wrongMc: state.wrongMc,
            wrongShort: state.wrongShort,
            permMc: state.permMc || {},
            permShort: state.permShort || {},
            mcOk: state.mcOk,
            shortOk: state.shortOk,
            mcDay: state.mcDay,
            pinnedPlans: state.pinnedPlans,
            exportedAt: state.exportedAt,
          });
          if (state.shortDraft) next.shortDraft = state.shortDraft;
          delete next.favMc;
          delete next.favShort;
          localStorage.setItem(STORE, JSON.stringify(next));
          localStorage.setItem(STORE_LEGACY, JSON.stringify(next));
        } catch (_) {}
      }

      function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => {
          el.hidden = true;
        }, 3500);
      }

      function bumpPermMc(id) {
        if (!id) return;
        if (!state.permMc) state.permMc = {};
        const cur = state.permMc[id];
        state.permMc[id] = {
          miss: (cur && cur.miss ? cur.miss : 0) + 1,
          at: (cur && cur.at) || new Date().toISOString(),
        };
      }
      function bumpPermShort(id) {
        if (!id) return;
        if (!state.permShort) state.permShort = {};
        const cur = state.permShort[id];
        state.permShort[id] = {
          miss: (cur && cur.miss ? cur.miss : 0) + 1,
          at: (cur && cur.at) || new Date().toISOString(),
        };
      }
      function noteMcWrong(id) {
        const prev = state.wrongMc[id];
        state.wrongMc[id] = {
          streak: 0,
          ok: 0,
          parked: false,
          fails: (prev && prev.fails ? prev.fails : 0) + 1,
        };
        bumpPermMc(id);
      }
      function noteShortWrong(id) {
        const prev = state.wrongShort[id];
        state.wrongShort[id] = {
          streak: 0,
          ok: 0,
          parked: false,
          fails: (prev && prev.fails ? prev.fails : 0) + 1,
        };
        bumpPermShort(id);
      }
      function missOfMc(id) {
        return (state.permMc && state.permMc[id] && state.permMc[id].miss) || 0;
      }
      function missOfShort(id) {
        return (state.permShort && state.permShort[id] && state.permShort[id].miss) || 0;
      }
      function wrongMcOkOf(id) {
        return (state.wrongMc[id] && state.wrongMc[id].ok) || 0;
      }
      function wrongShortOkOf(id) {
        return (state.wrongShort[id] && state.wrongShort[id].ok) || 0;
      }
      function wrongMcFailsOf(id) {
        return (state.wrongMc[id] && state.wrongMc[id].fails) || 0;
      }
      function wrongShortFailsOf(id) {
        return (state.wrongShort[id] && state.wrongShort[id].fails) || 0;
      }
      function activeWrongMcIds() {
        return Object.keys(state.wrongMc || {}).filter(
          (id) => state.wrongMc[id] && !state.wrongMc[id].parked && idInCourse(id, "mc")
        );
      }
      function activeWrongShortIds() {
        return Object.keys(state.wrongShort || {}).filter(
          (id) =>
            state.wrongShort[id] && !state.wrongShort[id].parked && idInCourse(id, "short")
        );
      }
      function allWrongMcIds() {
        return Object.keys(state.wrongMc || {}).filter((id) => idInCourse(id, "mc"));
      }
      function allWrongShortIds() {
        return Object.keys(state.wrongShort || {}).filter((id) => idInCourse(id, "short"));
      }
      function parkedWrongCount() {
        const mc = allWrongMcIds().filter((id) => state.wrongMc[id] && state.wrongMc[id].parked).length;
        const sh = allWrongShortIds().filter((id) => state.wrongShort[id] && state.wrongShort[id].parked)
          .length;
        return mc + sh;
      }

      let state = load();
      let tab = "mc";
      let mcIdx = 0;
      let shortIdx = 0;
      let mcOrder = null; /* id[] 打乱序 / 永久库排序序 */
      let shortOrder = null;
      let picked = null;
      let judged = false;
      let shortRevealed = false;
      let holdingCorrect = false;
      let holdingFail = false;
      let advanceTimer = null;
      let permSorted = false; /* 永久库：是否按错次排序 */
      let mcAttempted = {}; /* 兼容旧字段，本场答过 */
      let shortAttempted = {};

      if (IS_PERM) {
        document.title = "永久库 · 答对不删";
        $("page-title").textContent = "永久库";
        $("page-sub").innerHTML =
          "按科目查看。答错自动进来并累计错次；这里答对<strong>不会移出</strong>。点「排序」按错次从多到少。";
      } else {
        $("page-sub").innerHTML =
          "默认<strong>点答</strong>。同题答对 <b>" +
          wrongOkNeedOf() +
          "</b> 次才<strong>暂移出</strong>。答对/「跳」后优先还没连对的。「重」旁填 <b>0</b> 全召回、<b>N</b> 召回累计犯错≥N（不清累计）；「设」改连对次数。";
      }

      function shuffleIds(ids) {
        const a = ids.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function sourceMcIds() {
        return IS_PERM
          ? Object.keys(state.permMc || {}).filter((id) => idInCourse(id, "mc"))
          : activeWrongMcIds();
      }
      function sourceShortIds() {
        return IS_PERM
          ? Object.keys(state.permShort || {}).filter((id) => idInCourse(id, "short"))
          : activeWrongShortIds();
      }

      function sortIdsByMiss(ids, missFn) {
        return ids.slice().sort((a, b) => {
          const d = missFn(b) - missFn(a);
          if (d) return d;
          return String(a).localeCompare(String(b));
        });
      }

      function isAliveMc(id) {
        if (IS_PERM) return !!(state.permMc && state.permMc[id]);
        return !!(state.wrongMc && state.wrongMc[id] && !state.wrongMc[id].parked);
      }
      function isAliveShort(id) {
        if (IS_PERM) return !!(state.permShort && state.permShort[id]);
        return !!(state.wrongShort && state.wrongShort[id] && !state.wrongShort[id].parked);
      }
      function syncMcOrder() {
        const ids = sourceMcIds();
        if (!mcOrder) {
          mcOrder = IS_PERM && permSorted ? sortIdsByMiss(ids, missOfMc) : shuffleIds(ids);
        } else {
          mcOrder = mcOrder.filter((id) => isAliveMc(id));
          ids.forEach((id) => {
            if (mcOrder.indexOf(id) < 0) mcOrder.push(id);
          });
          if (IS_PERM && permSorted) mcOrder = sortIdsByMiss(mcOrder, missOfMc);
        }
      }
      function syncShortOrder() {
        const ids = sourceShortIds();
        if (!shortOrder) {
          shortOrder = IS_PERM && permSorted ? sortIdsByMiss(ids, missOfShort) : shuffleIds(ids);
        } else {
          shortOrder = shortOrder.filter((id) => isAliveShort(id));
          ids.forEach((id) => {
            if (shortOrder.indexOf(id) < 0) shortOrder.push(id);
          });
          if (IS_PERM && permSorted) shortOrder = sortIdsByMiss(shortOrder, missOfShort);
        }
      }
      /** 暂移抽走 */
      function removeFromOrder(order, id) {
        if (!order || !order.length) return;
        const pos = order.indexOf(id);
        if (pos >= 0) order.splice(pos, 1);
      }
      function wrongOkOfId(id, isShort) {
        const m = isShort ? state.wrongShort : state.wrongMc;
        return (m && m[id] && m[id].ok) || 0;
      }
      /**
       * 答完后选下一题：刚答的甩到队尾（或暂移抽走）；
       * 优先 ok===0（还没连对），再 ok&lt;阈值；尽量不立刻重复刚答的那道。
       * 答对未暂移的题仍留在库里，之后还会再出，直到连对够次。
       */
      function pickNextAfter(order, justId, remove, isShort) {
        if (!order) return 0;
        if (remove && justId) removeFromOrder(order, justId);
        else if (justId) {
          const pos = order.indexOf(justId);
          if (pos >= 0) {
            order.splice(pos, 1);
            order.push(justId);
          }
        }
        if (!order.length) return 0;
        if (order.length === 1) return 0;
        const need = wrongOkNeedOf();
        const others = order.filter((id) => id !== justId);
        const pool = others.length ? others : order.slice();
        let best = null;
        for (let i = 0; i < pool.length; i++) {
          if (wrongOkOfId(pool[i], isShort) === 0) {
            best = pool[i];
            break;
          }
        }
        if (best == null) {
          for (let i = 0; i < pool.length; i++) {
            if (wrongOkOfId(pool[i], isShort) < need) {
              best = pool[i];
              break;
            }
          }
        }
        if (best == null) best = pool[0];
        const idx = order.indexOf(best);
        return idx >= 0 ? idx : 0;
      }
      /**
       * 按累计犯错次数召回：minFails≤0 → 全部；否则 fails≥minFails。
       * 不清 fails；连对 ok/streak 清零并取消暂移。
       */
      function restoreWrongByMinFails(minFails) {
        const thr = clampRestoreMinFails(minFails);
        let n = 0;
        function revive(map, id) {
          const prev = map[id] || {};
          const fails = Math.max(0, Math.floor(Number(prev.fails) || 0));
          if (thr > 0) {
            if (fails < thr) return;
            if (!prev.parked) return; /* 已在刷的不动，只召回暂移 */
          }
          map[id] = { streak: 0, ok: 0, parked: false, fails: fails };
          n += 1;
        }
        allWrongMcIds().forEach((id) => revive(state.wrongMc, id));
        allWrongShortIds().forEach((id) => revive(state.wrongShort, id));
        mcAttempted = {};
        shortAttempted = {};
        mcOrder = shuffleIds(activeWrongMcIds());
        shortOrder = shuffleIds(activeWrongShortIds());
        mcIdx = 0;
        shortIdx = 0;
        picked = null;
        judged = false;
        holdingCorrect = false;
        holdingFail = false;
        shortRevealed = false;
        clearAdvanceTimer();
        save();
        const active = activeWrongMcIds().length + activeWrongShortIds().length;
        if (thr <= 0) {
          toast("已召回全部 " + active + " 道（处理 " + n + "）· 累计犯错保留");
        } else {
          toast(
            "已召回累计≥" + thr + " 次 · 本次 " + n + " 道 · 库内待刷 " + active + " · 累计保留"
          );
        }
        render();
      }

      function applyPermSort() {
        permSorted = true;
        mcOrder = sortIdsByMiss(sourceMcIds(), missOfMc);
        shortOrder = sortIdsByMiss(sourceShortIds(), missOfShort);
        mcIdx = 0;
        shortIdx = 0;
        picked = null;
        judged = false;
        shortRevealed = false;
        holdingCorrect = false;
        toast("已按错次从多到少排序");
        render();
      }

      /** 永久库：答对后重洗/下移，尽量避开刚答过的题 */
      function reshuffleMcAfter(avoidId) {
        const ids = sourceMcIds();
        mcOrder = shuffleIds(ids);
        if (!mcOrder.length) {
          mcIdx = 0;
          return;
        }
        if (mcOrder.length === 1) {
          mcIdx = 0;
          return;
        }
        let idx = Math.floor(Math.random() * mcOrder.length);
        let guard = 0;
        while (mcOrder[idx] === avoidId && guard < 30) {
          idx = Math.floor(Math.random() * mcOrder.length);
          guard += 1;
        }
        mcIdx = idx;
      }
      function reshuffleShortAfter(avoidId) {
        const ids = sourceShortIds();
        shortOrder = shuffleIds(ids);
        if (!shortOrder.length) {
          shortIdx = 0;
          return;
        }
        if (shortOrder.length === 1) {
          shortIdx = 0;
          return;
        }
        let idx = Math.floor(Math.random() * shortOrder.length);
        let guard = 0;
        while (shortOrder[idx] === avoidId && guard < 30) {
          idx = Math.floor(Math.random() * shortOrder.length);
          guard += 1;
        }
        shortIdx = idx;
      }

      function mcList() {
        syncMcOrder();
        return mcOrder.map((id) => BANK.mcById[id]).filter(Boolean);
      }
      function shortList() {
        syncShortOrder();
        return shortOrder.map((id) => BANK.shortById[id]).filter(Boolean);
      }

      function clearAdvanceTimer() {
        if (advanceTimer) {
          clearTimeout(advanceTimer);
          advanceTimer = null;
        }
      }

      /** 点答：点选项即判 */
      function judgeMcTap(q, key) {
        if (!q || !key || holdingCorrect || holdingFail) return;
        clearAdvanceTimer();
        picked = key;
        judged = true;
        if (key === q.correct) {
          holdingCorrect = true;
          render();
          const rightEl = document.querySelector(".opt.right");
          if (rightEl) rightEl.classList.add("flash");
          if (IS_PERM) {
            toast("对了 · 永久库保留（错" + missOfMc(q.id) + "次）");
            advanceTimer = setTimeout(() => {
              holdingCorrect = false;
              picked = null;
              judged = false;
              const n = sourceMcIds().length;
              if (permSorted && n > 0) mcIdx = (mcIdx + 1) % n;
              else reshuffleMcAfter(q.id);
              render();
            }, 380);
            return;
          }
          /* 错题本：连对够则暂移；自动搜下一道本轮未扫过的题 */
          mcAttempted[q.id] = true;
          if (!state.wrongMc[q.id])
            state.wrongMc[q.id] = { streak: 0, ok: 0, parked: false, fails: 0 };
          const w = state.wrongMc[q.id];
          w.ok = Math.min(wrongOkNeedOf(), (w.ok || 0) + 1);
          w.parked = w.ok >= wrongOkNeedOf();
          w.streak = 0;
          save();
          if (w.parked) toast("对了 " + w.ok + "/" + wrongOkNeedOf() + " · 暂移出");
          else toast("对了 " + w.ok + "/" + wrongOkNeedOf() + " · 下一题");
          advanceTimer = setTimeout(() => {
            holdingCorrect = false;
            syncMcOrder();
            mcIdx = pickNextAfter(mcOrder, q.id, w.parked, false);
            picked = null;
            judged = false;
            render();
          }, 450);
        } else if (IS_PERM) {
          noteMcWrong(q.id); /* 含永久库 miss + 错题本 fails */
          save();
          toast("又错了 · 累计 " + missOfMc(q.id) + " 次（仍留在永久库）");
          render();
        } else {
          noteMcWrong(q.id);
          mcAttempted[q.id] = true;
          save();
          holdingFail = true;
          toast("错了 · 先看解析，点「跳」继续");
          render();
        }
      }

      /** 答错看完后：点「跳」→ 连对已清零，下一题优先还没连对的 */
      function skipMcAfterFail() {
        if (!holdingFail) return;
        clearAdvanceTimer();
        syncMcOrder();
        const failId = mcOrder && mcOrder[mcIdx];
        holdingFail = false;
        holdingCorrect = false;
        if (failId) mcIdx = pickNextAfter(mcOrder, failId, false, false);
        picked = null;
        judged = false;
        toast("下一题");
        render();
      }

      function renderMc() {
        const list = mcList();
        const parkedN = IS_PERM ? 0 : parkedWrongCount();
        $("tab-mc").textContent =
          (IS_PERM ? "选择永久 " : "选择错题 ") +
          list.length +
          (!IS_PERM && parkedN ? "（暂移" + parkedN + "）" : "");
        $("tab-short").textContent = (IS_PERM ? "简答永久 " : "简答错题 ") + shortList().length;
        if (!list.length) {
          $("work").innerHTML = IS_PERM
            ? "<p class='hint'>永久库还没有选择题。答错会自动同步进来。</p>"
            : parkedN

                "）。「重」旁填 0 全召回，填 N 召回累计犯错≥N 的。</p><div class='nav-btns'>" +

        if (mcIdx >= list.length) mcIdx = list.length - 1;

        const q = list[mcIdx];
        const name = (BANK.names[q.course] && BANK.names[q.course][q.ch]) || "";

              " · " +
              name
            : "第 " +
              (mcIdx + 1) +
              "/" +
              list.length +
              " · 点答 · 连对" +

              "/" +

              "暂移 · 累计犯错" +

              "次" +
              (holdingFail ? " · 看完点跳" : "") +
              (parkedN ? " · 库内暂移" + parkedN : "")) +
          "</div>" +
          (holdingFail
            ? '<p class="hint" style="margin:0 0 8px;font-weight:700;color:var(--red);">答错了，先看解析，再点「跳」出下一题</p>'
            : "") +
          '<div class="q-text"></div><div id="opts"></div><div id="explain" class="explain" hidden></div>' +
          '<div class="nav-btns">' +
          (IS_PERM

              '<button type="button" class="ghost" id="btn-next" title="下一题">下</button>' +
              '<button type="button" class="primary" id="btn-sort-miss" title="按错次从多到少">排序</button>'
            : (holdingFail
                ? '<button type="button" class="primary" id="btn-skip-fail" title="看完了，下一道未扫过的题">跳</button>'
                : "") +
              restoreControlsHtml() +
              okNeedControlsHtml(holdingFail)) +
          "</div>";
        box.querySelector(".q-text").textContent = q.text;
        const opts = box.querySelector("#opts");
        const lockedTap = holdingFail || holdingCorrect;
        q.options.forEach((o) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "opt";
          b.textContent = o.key + ". " + o.label;
          if (picked === o.key) b.classList.add("on");
          if (judged) {
            if (o.key === q.correct) b.classList.add("right");
            if (picked === o.key && picked !== q.correct) b.classList.add("wrong");
          }
          if (holdingCorrect && o.key === q.correct) b.classList.add("flash");
          b.disabled = lockedTap;
          b.addEventListener("click", () => {
            if (holdingCorrect || holdingFail) return;
            judgeMcTap(q, o.key);
          });
          opts.appendChild(b);
        });
        if (judged) {
          const ex = box.querySelector("#explain");
          ex.hidden = false;
          ex.textContent =
            (q.explain ? "解析：" + q.explain + "（答案 " + q.correct + "）" : "答案 " + q.correct) +
            (holdingFail ? " · 看完点「跳」" : "");
        }
        $("work").innerHTML = "";
        $("work").appendChild(box);
        if (IS_PERM && $("btn-prev")) {
          $("btn-prev").addEventListener("click", () => {
            clearAdvanceTimer();
            holdingCorrect = false;
            const n = list.length;
            mcIdx = (mcIdx - 1 + n) % n;
            picked = null;
            judged = false;
            render();
          });
          $("btn-next").addEventListener("click", () => {
            clearAdvanceTimer();
            holdingCorrect = false;
            const n = list.length;
            mcIdx = (mcIdx + 1) % n;
            picked = null;
            judged = false;
            render();
          });
        }
        if (IS_PERM && $("btn-sort-miss")) {
          $("btn-sort-miss").addEventListener("click", () => applyPermSort());
        }

          $("btn-skip-fail").addEventListener("click", () => skipMcAfterFail());

        }
      }

      function jumpShortAwayFrom(dir) {

          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")

      }
      const SHORT_KEY_BANK = [
        "半殖民地半封建社会","半殖民地半封建","资本主义世界市场","主权和领土完整","两个确立","六个必须坚持",

        "农村根据地","整风运动","实事求是","两个务必","三大改造","一国两制","南方谈话","共同富裕","人民至上",
        "新发展理念","民族复兴","主要矛盾","根本原因","自然经济","双重任务","反帝反封建","帝国主义","封建主义",
        "无产阶级","资产阶级","小资产阶级","知识分子","革命团体","武装起义","民主共和","临时约法","洋务派",
        "封建性","依赖性","领导核心","各自为政","封建制度","西方技术","中体西用","维新派","思想启蒙","太平天国",
        "辛亥革命","五四运动","统一战线","改革开放","市场经济",
      ];
      function extractPointKeys(point) {
        const raw = String(point || "");
        const keys = [];
        SHORT_KEY_BANK.forEach((k) => {
          if (raw.indexOf(k) >= 0) keys.push(k);
        });
        (raw.match(/[「『]([^」』]+)[」』]/g) || []).forEach((m) => {
          const inner = m.replace(/^[「『]/, "").replace(/[」』]$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        (raw.match(/《([^》]+)》/g) || []).forEach((m) => {
          const inner = m.replace(/^《/, "").replace(/》$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        raw.split(/[，。；、]/).forEach((seg) => {
          const s0 = seg.replace(/\s+/g, "").trim();
          if (s0.length < 3) return;
          if (keys.some((k) => s0.indexOf(k) >= 0)) return;
          let s = s0.replace(/^(企图|必须|坚持|强调|提出|建立|实行|进行|推动|实现|促进|维护|加强|完善|健全)/, "");
          if (s.length >= 3 && s.length <= 16) keys.push(s.slice(0, 12));
          else if (s0.length >= 4 && s0.length <= 14) keys.push(s0.slice(0, 10));
        });
        return Array.from(new Set(keys));
      }
      function highlightKeys(s) {
        return escapeHtml(String(s || ""));

      function renderShort() {

        $("tab-mc").textContent = (IS_PERM ? "选择永久 " : "选择错题 ") + mcList().length;
        $("tab-short").textContent =
          (IS_PERM ? "简答永久 " : "简答错题 ") +
          list.length +
          (!IS_PERM && parkedN ? "（暂移" + parkedN + "）" : "");
        if (!list.length) {
          $("work").innerHTML = IS_PERM
            ? "<p class='hint'>永久库还没有简答。答错会自动同步进来。</p>"
            : "<p class='hint'>没有待刷简答错题。「重」旁填 0 全召回，填 N 召回累计≥N。</p><div class='nav-btns'>" +
              restoreControlsHtml() +
              okNeedControlsHtml(false) +
              "</div>";
          if (!IS_PERM) {
            bindRestoreControls();
            bindOkNeedControls();
          }
          return;
        }
        if (shortIdx >= list.length) shortIdx = list.length - 1;
        if (shortIdx < 0) shortIdx = 0;
        const q = list[shortIdx];
        const name = (BANK.names[q.course] && BANK.names[q.course][q.ch]) || "";
        const miss = missOfShort(q.id);
        const box = document.createElement("div");
        box.className = "q-card";
        const lock = holdingFail ? " disabled" : "";
        box.innerHTML =
          '<div class="q-meta">' +
          (IS_PERM
            ? courseName[q.course] +
              " · 第" +
              q.ch +
              "章 · " +
              (shortIdx + 1) +
              "/" +
              list.length +
              " · 错" +
              miss +
              "次 · 答对不删" +
              (permSorted ? " · 已按错次排" : "") +
              " · " +
              name
            : "第 " +
              (shortIdx + 1) +
              "/" +
              list.length +
              " · 连对" +
              wrongShortOkOf(q.id) +
              "/" +
              wrongOkNeedOf() +
              "暂移 · 累计犯错" +
              wrongShortFailsOf(q.id) +
              "次") +
          "</div>" +
          '<div class="q-text"></div>' +
          (q.lead ? '<p class="hint">提示：' + q.lead + "</p>" : "") +
          '<div id="short-compare" hidden>' +
          '<details class="short-why-banner" id="short-why">' +
          "<summary>当时的故事</summary>" +
          '<div class="short-why-body" id="short-why-body"></div></details>' +
          '<div class="short-pane official"><h4>采分点</h4><ol id="points-official"></ol></div></div>' +
          '<div class="nav-btns">' +
          '<button type="button" class="primary" id="btn-reveal"' +
          lock +
          ">默完了，看采分点</button>" +
          '<button type="button" class="good" id="btn-pass"' +
          (shortRevealed && !holdingFail ? "" : " disabled") +
          ">" +
          (IS_PERM ? "会了（不移出）" : "会了") +
          "</button>" +
          '<button type="button" class="ghost" id="btn-fail"' +
          (shortRevealed && !holdingFail ? "" : " disabled") +
          ">" +
          (IS_PERM ? "还不会（+1错次）" : "还不会") +
          "</button>" +
          (IS_PERM
            ? '<button type="button" class="ghost" id="btn-prev">上一题</button>' +
              '<button type="button" class="ghost" id="btn-next">下一题</button>' +
              '<button type="button" class="primary" id="btn-sort-miss">排序</button>'
            : (holdingFail
                ? '<button type="button" class="primary" id="btn-skip-fail">跳</button>'
                : "") +
              restoreControlsHtml() +
              okNeedControlsHtml(holdingFail)) +
          "</div>";
        box.querySelector(".q-text").textContent = q.text;
        const wrap = box.querySelector("#short-compare");
        if (shortRevealed) {
          wrap.hidden = false;
          const whyBody = box.querySelector("#short-why-body");
          if (whyBody) {
            whyBody.textContent =
              (q.why && String(q.why).trim()) ||
              (q.points || [])
                .map((p, i) => i + 1 + ". 对照这句想当时发生了啥，才总结成：「" + p + "」")
                .join("\n\n");
          }
          const off = box.querySelector("#points-official");
          off.innerHTML = "";
          (q.points || []).forEach((p) => {
            const li = document.createElement("li");
            li.innerHTML = highlightKeys(p);
            off.appendChild(li);
          });
        }
        $("work").innerHTML = "";
        $("work").appendChild(box);
        $("btn-reveal").addEventListener("click", () => {
          if (holdingFail) return;
          shortRevealed = true;
          render();
        });
        $("btn-pass").addEventListener("click", () => {
          if (holdingFail) return;
          if (IS_PERM) {
            toast("会了 · 永久库保留（错" + missOfShort(q.id) + "次）");
            shortRevealed = false;
            const n = list.length;
            if (permSorted && n > 0) shortIdx = (shortIdx + 1) % n;
            else reshuffleShortAfter(q.id);
            render();
            return;
          }
          shortAttempted[q.id] = true;
          if (!state.wrongShort[q.id])
            state.wrongShort[q.id] = { streak: 0, ok: 0, parked: false, fails: 0 };
          const w = state.wrongShort[q.id];
          w.ok = Math.min(wrongOkNeedOf(), (w.ok || 0) + 1);
          w.parked = w.ok >= wrongOkNeedOf();
          w.streak = 0;
          save();
          shortRevealed = false;
          if (w.parked) toast("会了 " + w.ok + "/" + wrongOkNeedOf() + " · 暂移出");
          else toast("会了 " + w.ok + "/" + wrongOkNeedOf() + " · 下一题");
          syncShortOrder();
          shortIdx = pickNextAfter(shortOrder, q.id, w.parked, true);
          render();
        });
        $("btn-fail").addEventListener("click", () => {
          if (holdingFail) return;
          if (IS_PERM) {
            noteShortWrong(q.id);
            save();
            toast("还不会 · 累计 " + missOfShort(q.id) + " 次");
            shortRevealed = false;
            if (permSorted) shortOrder = sortIdsByMiss(sourceShortIds(), missOfShort);
            render();
            return;
          }
          noteShortWrong(q.id);
          shortAttempted[q.id] = true;
          save();
          holdingFail = true;
          shortRevealed = true;
          toast("还不会 · 先看采分点，点「跳」继续");
          render();
        });
        if ($("btn-skip-fail")) {
          $("btn-skip-fail").addEventListener("click", () => {
            const failId = q.id;
            holdingFail = false;
            shortRevealed = false;
            syncShortOrder();
            shortIdx = pickNextAfter(shortOrder, failId, false, true);
            toast("下一题");
            render();
          });
        }
        if (IS_PERM && $("btn-prev")) {
          $("btn-prev").addEventListener("click", () => {
            jumpShortAwayFrom(-1);
          });
          $("btn-next").addEventListener("click", () => {
            jumpShortAwayFrom(1);
          });
        }
        if (IS_PERM && $("btn-sort-miss")) {
          $("btn-sort-miss").addEventListener("click", () => applyPermSort());
        }
        if (!IS_PERM) {
          bindRestoreControls();
          bindOkNeedControls();
        }
      }

      function render() {
        if ($("tab-course-history")) {
          $("tab-course-history").classList.toggle("on", courseFilter === "history");
          $("tab-course-history").textContent =
            "近代史" + (IS_PERM ? "永久" : "错题");
        }
        if ($("tab-course-xi")) {
          $("tab-course-xi").classList.toggle("on", courseFilter === "xi");
          $("tab-course-xi").textContent = "习思想" + (IS_PERM ? "永久" : "错题");
        }
        const cname = courseName[courseFilter] || "";
        if ($("page-title")) {
          $("page-title").textContent = IS_PERM ? cname + "永久库" : cname + "错题本";
        }
        $("tab-mc").classList.toggle("on", tab === "mc");
        $("tab-short").classList.toggle("on", tab === "short");
        if (tab === "mc") renderMc();
        else renderShort();
      }

      if ($("tab-course-history")) {
        $("tab-course-history").addEventListener("click", () => {
          if (holdingFail) return;
          clearAdvanceTimer();
          setCourseFilter("history");
        });
      }
      if ($("tab-course-xi")) {
        $("tab-course-xi").addEventListener("click", () => {
          if (holdingFail) return;
          clearAdvanceTimer();
          setCourseFilter("xi");
        });
      }
      $("tab-mc").addEventListener("click", () => {
        if (holdingFail) return;
        clearAdvanceTimer();
        tab = "mc";
        picked = null;
        judged = false;
        holdingCorrect = false;
        render();
      });
      $("tab-short").addEventListener("click", () => {
        if (holdingFail) return;
        clearAdvanceTimer();
        tab = "short";
        shortRevealed = false;
        render();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          /* 停看答错/答对闪动时不要清状态，否则「跳」会消失、选项被锁死 */
          const keepUi = holdingFail || holdingCorrect;
          state = load();
          applyTheme(getTheme());
          if (!keepUi) {
            clearAdvanceTimer();
            holdingFail = false;
            holdingCorrect = false;
          }
          render();
        }
      });

      if ($("btn-theme-warm")) {
        $("btn-theme-warm").addEventListener("click", () => applyTheme("warm", true));
      }
      if ($("btn-theme-eye")) {
        $("btn-theme-eye").addEventListener("click", () => applyTheme("eye", true));
      }

      applyTheme(getTheme());
      save(); /* 把迁移后的永久库写回 */
      render();
    })();
  </script>
</body>
</html>
