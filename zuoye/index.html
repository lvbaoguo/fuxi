<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>每日作业</title>
  <script>
    /* 尽早上色，避免闪一下暖底 */
    (function () {
      try {
        var t = localStorage.getItem("pansan2-zuoye-theme");
        if (t === "eye" || t === "warm") document.documentElement.setAttribute("data-theme", t);
        else document.documentElement.setAttribute("data-theme", "warm");
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "warm");
      }
    })();
  </script>
  <style>
    /* 暖色纸感（默认） */
    :root, [data-theme="warm"] {
      --bg: #efe8dc;
      --glow-a: #fecaca66;
      --glow-b: #fde68a55;
      --card: #fffdf8;
      --surface: #ffffff;
      --ink: #1c1917;
      --on: #78716c;
      --muted: #78716c;
      --line: #e4ddd2;
      --blue: #1d4ed8;
      --green: #166534;
      --red: #991b1b;
      --amber: #b45309;
      --lock-bad-bg: #7f1d1d;
      --lock-bad-ink: #fff7ed;
      --opt-on-bg: #eff6ff;
      --opt-ok-bg: #ecfdf5;
      --opt-bad-bg: #fef2f2;
      --tag-must-bg: #fff7ed;
      --tag-must-ink: #c2410c;
      --tag-must-line: #fdba74;
      --tag-fam-bg: #eff6ff;
      --tag-fam-ink: #1d4ed8;
      --tag-fam-line: #93c5fd;
      --why-bg: linear-gradient(180deg, #f0fdf4 0%, #ecfdf5 100%);
      --why-line: #86efac;
      --why-ink: #166534;
      --why-body: #14532d;
      --why-dash: #bbf7d0;
      --dict-bg: #fffbeb;
      --dict-line: #f59e0b;
      --dict-ink: #92400e;
      --hint-bg: #fef3c7;
      --hint-line: #fcd34d;
      --edit-bg: #eff6ff;
      --edit-line: #93c5fd;
      --edit-ink: #1d4ed8;
      --pill-bad-bg: #fee2e2;
      --pill-ok-bg: #dcfce7;
      --pill-mc-bg: #dbeafe;
      --chip-done-bg: #ecfdf5;
      --chip-done-line: #86efac;
      --mark-bg: #fde68a;
      --toast-bg: #1c1917;
      --shadow: rgba(28, 25, 23, 0.05);
    }
    /* 护眼冷灰（少色、低饱和） */
    [data-theme="eye"] {
      --bg: #e8eaee;
      --glow-a: transparent;
      --glow-b: transparent;
      --card: #f3f4f6;
      --surface: #fafbfc;
      --ink: #374151;
      --on: #64748b;
      --muted: #6b7280;
      --line: #d1d5db;
      --blue: #3b6ea5;
      --green: #3f6f5a;
      --red: #9a4a4a;
      --amber: #7a6548;
      --lock-bad-bg: #6b7280;
      --lock-bad-ink: #f8fafc;
      --opt-on-bg: #e8eef5;
      --opt-ok-bg: #e6efe9;
      --opt-bad-bg: #f3e8e8;
      --tag-must-bg: #eee8e2;
      --tag-must-ink: #6b5344;
      --tag-must-line: #d4c4b5;
      --tag-fam-bg: #e8eef5;
      --tag-fam-ink: #3b6ea5;
      --tag-fam-line: #b7c9dc;
      --why-bg: #eef1f3;
      --why-line: #c5ced6;
      --why-ink: #4b5563;
      --why-body: #4b5563;
      --why-dash: #d1d5db;
      --dict-bg: #eef1f4;
      --dict-line: #9ca3af;
      --dict-ink: #4b5563;
      --hint-bg: #eef1f4;
      --hint-line: #c5ced6;
      --edit-bg: #e8eef5;
      --edit-line: #b7c9dc;
      --edit-ink: #3b6ea5;
      --pill-bad-bg: #f3e8e8;
      --pill-ok-bg: #e6efe9;
      --pill-mc-bg: #e8eef5;
      --chip-done-bg: #e6efe9;
      --chip-done-line: #b7c9b8;
      --mark-bg: #e5e7eb;
      --toast-bg: #374151;
      --shadow: rgba(55, 65, 81, 0.06);
    }
    * { box-sizing: border-box; }
    /* 手机防误触双击放大；仍尽量允许系统辅助功能缩放 */
    html, body { touch-action: manipulation; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, var(--glow-a), transparent),
        radial-gradient(700px 360px at 100% 0%, var(--glow-b), transparent),
        var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 14px 12px 88px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 12px; font-size: 0.9rem; }
    .lock {
      padding: 12px 14px; border-radius: 12px; background: var(--lock-bad-bg); color: var(--lock-bad-ink);
      font-weight: 800; margin-bottom: 12px;
    }
    .lock.ok { background: var(--green); color: #ecfdf5; }
    .lock.perfect {
      background: linear-gradient(120deg, var(--amber), #ca8a04 40%, var(--green));
      color: #fffbeb;
    }
    [data-theme="eye"] .lock.perfect {
      background: var(--on);
      color: #f8fafc;
    }
    .lock small { display: block; font-weight: 500; opacity: 0.92; margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 8px 22px var(--shadow);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .grow { flex: 1 1 auto; }
    button, input, select {
      font: inherit; border-radius: 8px; border: 1px solid var(--line);
      padding: 8px 10px; background: var(--surface); color: var(--ink);
    }
    button { cursor: pointer; font-weight: 700; }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.good { background: var(--green); color: #fff; border-color: var(--green); }
    button.ghost, a.ghost {
      background: var(--surface);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    button.danger { color: var(--red); border-color: #fecaca; background: var(--surface); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pill.bad { background: var(--pill-bad-bg); color: var(--red); }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 800; background: var(--pill-bad-bg); color: var(--red);
    }
    .pill.ok { background: var(--pill-ok-bg); color: var(--green); }
    .pill.perfect {
      background: linear-gradient(90deg, #fef3c7, #bbf7d0);
      color: #854d0e;
      border: 1px solid #f59e0b;
    }
    [data-theme="eye"] .pill.perfect {
      background: var(--pill-ok-bg);
      color: var(--green);
      border-color: var(--line);
    }
    .pill.mc { background: var(--pill-mc-bg); color: var(--blue); }
    .prog-rows { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    .prog-row { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 8px; align-items: center; }
    .prog-row .lab { font-size: 0.82rem; color: var(--muted); font-weight: 700; }
    .prog-row .num { font-size: 0.82rem; color: var(--muted); white-space: nowrap; min-width: 4.5em; text-align: right; }
    .progress {
      height: 10px; background: #e7e5e4; border-radius: 999px; overflow: hidden; margin: 0;
    }
    .progress > i {
      display: block; height: 100%; width: 0; border-radius: 999px;
      background: linear-gradient(90deg, var(--amber), var(--green));
    }
    [data-theme="eye"] .progress > i {
      background: var(--on);
    }
    .prog-extra { margin: 0 0 4px; }
    .entry-tabs { display: flex; gap: 8px; margin: 0 0 10px; }
    .entry-tabs button { flex: 1; font-weight: 800; padding: 10px 12px; }
    .entry-tabs button.on {
      background: var(--on); color: #fff; border-color: var(--on);
    }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; }
    .tabs button.on {
      background: var(--on); color: #fff; border-color: var(--on);
    }
    .tabs[hidden], .prog-row[hidden], #day-nav[hidden] { display: none !important; }
    .q-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
    .q-meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 6px; }
    .tag-must {
      display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 800; vertical-align: middle;
      background: var(--tag-must-bg); color: var(--tag-must-ink); border: 1px solid var(--tag-must-line);
    }
    .tag-familiar {
      display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 800; vertical-align: middle;
      background: var(--tag-fam-bg); color: var(--tag-fam-ink); border: 1px solid var(--tag-fam-line);
    }
    .q-text { font-weight: 700; font-size: 1.02rem; margin-bottom: 10px; }
    .opt {
      display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    }
    .opt.on { border-color: var(--blue); background: var(--opt-on-bg); }
    .opt.right { border-color: var(--green); background: var(--opt-ok-bg); }
    .opt.right.flash {
      animation: opt-right-flash 0.35s ease-out;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.45);
    }
    @keyframes opt-right-flash {
      0% { transform: scale(1); background: #bbf7d0; }
      40% { transform: scale(1.03); background: #86efac; }
      100% { transform: scale(1); background: #ecfdf5; }
    }
    .opt.wrong { border-color: #fca5a5; background: var(--opt-bad-bg); }
    [data-theme="eye"] .opt.wrong { border-color: #d4a5a5; }
    .fw-burst {
      position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden;
    }
    .fw-piece {
      position: absolute; left: 50%; top: 42%;
      width: 8px; height: 8px; border-radius: 2px;
      animation: fw-fly 0.55s ease-out forwards;
    }
    @keyframes fw-fly {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); opacity: 0; }
    }
    .explain { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f5f5f4; font-size: 0.9rem; }
    .points { margin: 8px 0 0; padding-left: 1.2em; }
    .points[hidden] { display: none !important; }
    .short-answer-block[hidden] { display: none !important; }
    .short-answer-block { margin-top: 10px; }
    .short-pane {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--surface);
      margin-top: 10px;
    }
    .short-pane.official h4 {
      margin: 0 0 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--amber);
    }
    .short-edit-panel {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--edit-line);
      border-radius: 10px;
      background: var(--edit-bg);
    }
    .short-edit-panel[hidden] { display: none !important; }
    .short-edit-panel label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--edit-ink);
      margin-bottom: 6px;
    }
    .short-edit-panel textarea {
      width: 100%;
      min-height: 120px;
      font: inherit;
      line-height: 1.45;
      padding: 8px 10px;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      resize: vertical;
      box-sizing: border-box;
    }
    .short-edit-panel .row { margin-top: 8px; gap: 6px; }
    .short-edit-panel .hint {
      margin: 4px 0 0;
      font-size: 0.78rem;
      color: #64748b;
    }
    .short-pane ol {
      margin: 0;
      padding-left: 1.15em;
    }
    .short-pane li {
      margin: 6px 0;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    mark.key {
      background: var(--mark-bg);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 700;
    }
    .short-why-banner {
      margin: 0;
      border: 1px solid var(--why-line);
      border-radius: 10px;
      background: var(--why-bg);
      overflow: hidden;
    }
    .short-why-banner > summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--why-ink);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .short-why-banner > summary::-webkit-details-marker { display: none; }
    .short-why-banner > summary::before {
      content: "▸";
      display: inline-block;
      transition: transform 0.15s ease;
      color: var(--why-ink);
    }
    .short-why-banner[open] > summary::before { transform: rotate(90deg); }
    .short-why-banner > summary span.muted {
      font-weight: 500;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .short-why-body {
      padding: 0 14px 14px;
      border-top: 1px dashed var(--why-dash);
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--why-body);
      white-space: pre-wrap;
    }
    .short-why-body p {
      margin: 10px 0 0;
      white-space: pre-wrap;
    }
    .dictation {
      margin: 12px 0 4px;
      padding: 10px;
      border: 1px dashed var(--dict-line);
      border-radius: 10px;
      background: var(--dict-bg);
    }
    .dictation label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--dict-ink);
      margin-bottom: 6px;
    }
    .dictation textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      line-height: 1.5;
      background: var(--surface);
    }
    .dictation-result {
      margin-top: 8px;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .dictation-result.pass { color: var(--green); font-weight: 700; }
    .dictation-result.fail { color: var(--red); font-weight: 700; }
    .short-hint {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--hint-bg);
      border: 1px solid var(--hint-line);
      color: var(--dict-ink);
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .short-hint[hidden] { display: none !important; }
    .short-hint .hh { color: var(--amber); font-weight: 700; }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .toast {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: var(--toast-bg); color: #fff; padding: 10px 14px; border-radius: 8px;
      max-width: min(520px, calc(100% - 24px)); z-index: 30; font-size: 0.9rem;
    }
    .toast[hidden] { display: none !important; }
    /* Q 版老师桌宠 */
    .teacher-pet {
      position: fixed;
      right: max(8px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 35;
      width: 96px;
      user-select: none;
      -webkit-user-select: none;
    }
    .teacher-pet[hidden] { display: none !important; }
    .teacher-bubble {
      position: absolute;
      right: 0;
      bottom: 98px;
      width: min(220px, calc(100vw - 28px));
      padding: 8px 10px;
      border-radius: 12px 12px 4px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 8px 20px var(--shadow);
      font-size: 0.78rem;
      line-height: 1.4;
      font-weight: 700;
      color: var(--ink);
    }
    .teacher-bubble[hidden] { display: none !important; }
    .teacher-bubble.good { border-color: var(--why-line); background: var(--opt-ok-bg); color: var(--green); }
    .teacher-bubble.bad { border-color: #fca5a5; background: var(--opt-bad-bg); color: var(--red); }
    .teacher-bubble.neutral { border-color: var(--hint-line); background: var(--dict-bg); color: var(--dict-ink); }
    .teacher-fig {
      display: block;
      width: 88px;
      height: 96px;
      margin-left: auto;
      cursor: pointer;
      animation: teacher-bob 2.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 6px rgba(28, 25, 23, 0.18));
    }
    .teacher-fig:active { transform: scale(0.96); }
    @keyframes teacher-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .teacher-tools {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 2px;
    }
    .teacher-tools button {
      padding: 2px 7px;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 999px;
      background: #fff;
      opacity: 0.92;
    }
    .teacher-show {
      position: fixed;
      right: max(8px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 35;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 999px;
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.35);
    }
    .teacher-show[hidden] { display: none !important; }
    .import-panel {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafaf9;
    }
    .import-panel[hidden] { display: none !important; }
    .import-panel label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .import-panel textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      font: 0.82rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-sizing: border-box;
    }
    .import-panel .row { margin-top: 8px; gap: 8px; }
    .export-menu {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafaf9;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .export-menu[hidden] { display: none !important; }
    .export-menu button { flex: 1; min-width: 120px; }
    .wrong-menu {
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(28, 25, 23, 0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .wrong-menu[hidden] { display: none !important; }
    .wrong-menu .menu-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }
    .wrong-menu .menu-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .wrong-menu .menu-actions a,
    .wrong-menu .menu-actions button {
      flex: 1;
      min-width: 96px;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      font: inherit;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
      box-sizing: border-box;
      cursor: pointer;
    }
    .wrong-menu .menu-actions a.primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }
    a { color: var(--blue); }
    .day-nav { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; }
    .day-chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 10px;
      padding: 7px 9px; min-width: 58px; text-align: center; cursor: pointer; font: inherit;
    }
    .day-chip .d { font-weight: 800; display: block; font-size: 0.9rem; }
    .day-chip .w { font-size: 0.72rem; color: var(--muted); }
    .day-chip.on { background: var(--on); color: #fff; border-color: var(--on); }
    .day-chip.on .w { color: #d6d3d1; }
    .day-chip.done { background: var(--chip-done-bg); border-color: var(--chip-done-line); }
    .theme-menu {
      margin: -4px 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }
    .theme-menu[hidden] { display: none !important; }
    .theme-menu .menu-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .theme-menu .menu-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .theme-menu .menu-actions button {
      flex: 1;
      min-width: 120px;
    }
    .theme-menu .menu-actions button.on {
      background: var(--on);
      color: #fff;
      border-color: var(--on);

  <script>
    (function () {
      const BANK = window.ZUOYE_BANK;
      if (!BANK) {
        document.body.innerHTML = "<p style='padding:24px'>缺少 data.js</p>";
        return;
      }
      /* 进度键名固定；改 data.js / 排期不得清空已答 */
      const STORE = "pansan2-zuoye-forced-progress";
      const STORE_LEGACY = "pansan2-zuoye-forced-v3";
      const courseName = { history: "近代史", xi: "习思想" };
      const $ = (id) => document.getElementById(id);

      function todayStr() {
        const n = new Date();
        return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
      }

      function stripDayPrefix(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          if (!map[k]) return;
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          out[id] = 1;
        });
        return out;
      }

      const MC_FAIL_ALLOW = 1; /* 选择题容错：错 1 题仍合格；错 2 题起不合格 */
      const TEACHER_STORE = "pansan2-zuoye-teacher";
      const THEME_STORE = "pansan2-zuoye-theme";
      /* 上传云端：GitHub Contents API → zuoye/progress-latest.json */
      const GH_OWNER = "lvbaoguo";
      const GH_REPO = "fuxi";
      const GH_BRANCH = "master";
      const GH_PROGRESS_PATH = "zuoye/progress-latest.json";
      const GH_TOKEN_STORE = "pansan2-zuoye-gh-token";
      const CLOUD_PROGRESS_URL = "https://lvbaoguo.github.io/fuxi/zuoye/progress-latest.json";

      function getTheme() {
        try {
          const t = localStorage.getItem(THEME_STORE);
          return t === "eye" ? "eye" : "warm";
        } catch (_) {
          return "warm";
        }
      }
      function applyTheme(theme, opts) {
        const t = theme === "eye" ? "eye" : "warm";
        document.documentElement.setAttribute("data-theme", t);
        try {
          localStorage.setItem(THEME_STORE, t);
        } catch (_) {}
        const warmBtn = $("btn-theme-warm");
        const eyeBtn = $("btn-theme-eye");
        if (warmBtn) warmBtn.classList.toggle("on", t === "warm");
        if (eyeBtn) eyeBtn.classList.toggle("on", t === "eye");
        if (opts && opts.toast) {
          toast(t === "eye" ? "已切到护眼（冷灰）" : "已切到暖色纸感");
        }
      }
      function hideThemeMenu() {
        const m = $("theme-menu");
        if (m) m.hidden = true;
      }

      function emptyState() {
        return {
          v: 8,
          mcOk: {},
          shortOk: {},
          shortDraft: {},
          shortPointsCustom: {}, /* qid → 自改采分点字符串数组 */
          mcDay: {},
          wrongMc: {},
          wrongShort: {},
          favMc: {},
          favShort: {},
          pinnedPlans: {},
          mcShuffle: false, /* 选择题乱序 */
          mcShuffleDate: null,
          mcShuffleIds: null,
          exportedAt: null,
        };
      }

      function normalizeWrongMap(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          const v = map[k];
          if (!v) return;
          if (typeof v === "object") {
            out[id] = { streak: Math.max(0, Math.floor(Number(v.streak) || 0)) };
          } else {
            out[id] = { streak: 0 };
          }
        });
        return out;
      }

      function normalizeFavMap(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          const v = map[k];
          if (!v) return;
          if (typeof v === "object") {
            out[id] = { at: v.at || new Date().toISOString() };
          } else {
            out[id] = { at: new Date().toISOString() };
          }
        });
        return out;
      }

      function normalizePointsCustom(map) {
        const out = {};
        Object.keys(map || {}).forEach((id) => {
          const v = map[id];
          if (Array.isArray(v)) {
            const pts = v.map((s) => String(s || "").trim()).filter(Boolean);
            if (pts.length) out[id] = pts;
          } else if (typeof v === "string" && v.trim()) {
            const pts = v
              .split(/\n+/)
              .map((s) => s.trim())
              .filter(Boolean);
            if (pts.length) out[id] = pts;
          }
        });
        return out;
      }

      /** 本题采分点：有自改则用自改，否则题库原版 */
      function pointsFor(q) {
        if (!q || !q.id) return [];
        const custom = state.shortPointsCustom && state.shortPointsCustom[q.id];
        if (Array.isArray(custom) && custom.length) return custom;
        return q.points || [];
      }
      function hasCustomPoints(qid) {
        const custom = state.shortPointsCustom && state.shortPointsCustom[qid];
        return Array.isArray(custom) && custom.length > 0;
      }

      function normalizeState(raw) {
        const st = emptyState();
        if (!raw || typeof raw !== "object") return st;
        st.mcOk = stripDayPrefix(raw.mcOk);
        st.shortOk = stripDayPrefix(raw.shortOk);
        st.shortDraft =
          raw.shortDraft && typeof raw.shortDraft === "object" ? { ...raw.shortDraft } : {};
        st.shortPointsCustom = normalizePointsCustom(raw.shortPointsCustom);
        st.wrongMc = normalizeWrongMap(raw.wrongMc);
        st.wrongShort = normalizeWrongMap(raw.wrongShort);
        st.favMc = normalizeFavMap(raw.favMc);
        st.favShort = normalizeFavMap(raw.favShort);
        st.pinnedPlans = raw.pinnedPlans && typeof raw.pinnedPlans === "object" ? raw.pinnedPlans : {};
        st.mcDay = raw.mcDay && typeof raw.mcDay === "object" ? raw.mcDay : {};
        st.mcShuffle = !!raw.mcShuffle;
        st.mcShuffleDate = raw.mcShuffleDate || null;
        st.mcShuffleIds = Array.isArray(raw.mcShuffleIds) ? raw.mcShuffleIds.slice() : null;
        st.exportedAt = raw.exportedAt || null;
        /* 旧进度：全局 mcOk 迁到当日结果，避免一更新就全丢 */
        Object.keys(st.pinnedPlans).forEach((d) => {
          const plan = st.pinnedPlans[d];
          if (!plan || !Array.isArray(plan.mcIds)) return;
          if (!st.mcDay[d] || typeof st.mcDay[d] !== "object") st.mcDay[d] = { results: {} };
          if (!st.mcDay[d].results) st.mcDay[d].results = {};
          plan.mcIds.forEach((id) => {
            if (st.mcOk[id] && !st.mcDay[d].results[id]) st.mcDay[d].results[id] = "ok";
          });
        });
        return st;
      }

      function mergeShortDraftBackup(st) {
        if (!st.shortDraft || typeof st.shortDraft !== "object") st.shortDraft = {};
        try {
          const bak = JSON.parse(sessionStorage.getItem(STORE + "-shortDraft") || "null");
          if (bak && typeof bak === "object") {
            Object.keys(bak).forEach((k) => {
              const v = String(bak[k] || "");
              if (!v.trim()) return;
              /* 本地没有、或备份更长时采用备份，避免刷新丢半截字 */
              const cur = String(st.shortDraft[k] || "");
              if (!cur.trim() || v.length > cur.length) st.shortDraft[k] = v;
            });
          }
        } catch (_) {}
        return st;
      }

      function load() {
        try {
          let raw = JSON.parse(localStorage.getItem(STORE) || "null");
          if (!raw) {
            const legacy = JSON.parse(localStorage.getItem(STORE_LEGACY) || "null");
            if (legacy) raw = legacy;
          }
          return mergeShortDraftBackup(normalizeState(raw));
        } catch (_) {
          return mergeShortDraftBackup(emptyState());
        }
      }
      function currentShortQ() {
        try {
          const list = typeof currentShortList === "function" ? currentShortList() : [];
          if (!list.length) return null;
          let i = typeof shortIdx === "number" ? shortIdx : 0;
          if (i >= list.length) i = list.length - 1;
          if (i < 0) i = 0;
          return list[i] || null;
        } catch (_) {
          return null;
        }
      }

      function flushActiveShortDraft() {
        try {
          const ta = document.getElementById("short-dictation");
          const q = currentShortQ();
          if (!ta || !q) return;
          const v = String(ta.value || "");
          if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
          /* 有字就写入；空串绝不在这里删，避免重绘/刷新误清空 */
          if (v.trim()) state.shortDraft[q.id] = v;
        } catch (_) {}
      }

      function save() {
        flushActiveShortDraft();
        if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
        state.v = 8;
        state.exportedAt = new Date().toISOString();
        try {
          const payload = JSON.stringify(state);
          localStorage.setItem(STORE, payload);
          /* 同步写一份旧键，避免半截迁移丢数据 */
          localStorage.setItem(STORE_LEGACY, payload);
          try {
            sessionStorage.setItem(STORE + "-shortDraft", JSON.stringify(state.shortDraft));
          } catch (_) {}
        } catch (_) {}
      }

      function persistShortDraft(qid, text) {
        if (!qid) return;
        if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
        const v = String(text || "");
        /* 空串不删档：只有「简答重来」才清空，防止刷新/重绘把已写内容抹掉 */
        if (!v.trim()) return;
        state.shortDraft[qid] = v;
        save();
      }

      function restartShortQuestion(qid) {
        if (!qid) return;
        delete state.shortOk[qid];
        if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
        delete state.shortDraft[qid];
        try {
          const ta = document.getElementById("short-dictation");
          if (ta) ta.value = "";
        } catch (_) {}
        try {
          sessionStorage.setItem(STORE + "-shortDraft", JSON.stringify(state.shortDraft));
        } catch (_) {}
        save();
      }

      /** 清空全部简答默写 + 过关标记（选择题不动） */
      function restartAllShortDrafts() {
        try {
          const ta = document.getElementById("short-dictation");
          if (ta) ta.value = "";
        } catch (_) {}
        state.shortDraft = {};
        state.shortOk = {};
        try {
          sessionStorage.setItem(STORE + "-shortDraft", "{}");
        } catch (_) {}
        save();
      }

      /** 采分点去标点后的纯字，用来取句首 */
      function pointCleanChars(p) {
        return String(p || "").replace(
          /[，。；、,.!！？?：:（）()\[\]【】《》〈〉"'“”‘’\s]/g,
          ""
        );
      }

      /** 按文中出现顺序取不重叠关键词（判分词库复用） */
      function orderedPointKeyRanges(raw) {
        const keys = extractPointKeys(raw)
          .map((k) => String(k || "").replace(/\s+/g, ""))
          .filter((k) => k.length >= 2);
        const ranges = [];
        keys
          .slice()
          .sort((a, b) => b.length - a.length || a.localeCompare(b))
          .forEach((k) => {
            let from = 0;
            while (from < raw.length) {
              const j = raw.indexOf(k, from);
              if (j < 0) break;
              const end = j + k.length;
              const overlap = ranges.some((r) => !(end <= r[0] || j >= r[1]));
              if (!overlap) ranges.push([j, end, k]);
              from = j + 1;
            }
          });
        ranges.sort((a, b) => a[0] - b[0]);
        return ranges;
      }

      /**
       * 提示分步、少泄题：
       * 第 1 下只出该点句首 4 字；再点才出后面短线索（每条 ≤4 字）。
       * 短句再点 1 次；长句最多再点 2 次。不会一次甩出半句答案。
       */
      function buildShortHintChunks(q) {
        const chunks = [];
        (q.points || []).forEach((p, pi) => {
          const raw = String(p || "");
          const clean = pointCleanChars(raw);
          if (!clean) return;
          const head = clean.slice(0, 4);
          chunks.push({ pi: pi, text: head });

          const clueBudget = clean.length > 24 ? 2 : clean.length > 4 ? 1 : 0;
          if (!clueBudget) return;

          const clues = [];
          function pushClue(piece) {
            let s = pointCleanChars(piece);
            if (!s) return;
            const at = clean.indexOf(s);
            if (at >= 0 && at + s.length <= 4) return;
            if (at >= 0 && at < 4) s = s.slice(4 - at);
            if (s === head || head.indexOf(s) >= 0) return;
            if (s.length > 4) s = s.slice(0, 4);
            if (s.length < 2) return;
            if (clues.indexOf(s) >= 0) return;
            clues.push(s);
          }

          orderedPointKeyRanges(raw).forEach((r) => pushClue(r[2]));

          if (clues.length < clueBudget && clean.length > 4) {
            const rest = clean.slice(4);
            const ratios = clueBudget === 2 ? [0.28, 0.58] : [0.4];
            ratios.forEach((ratio) => {
              if (clues.length >= clueBudget || rest.length < 2) return;
              let start = Math.floor(rest.length * ratio);
              start = Math.min(Math.max(0, start), Math.max(0, rest.length - 4));
              pushClue(rest.slice(start, start + Math.min(4, rest.length - start)));
            });
          }

          clues.slice(0, clueBudget).forEach((t) => {
            chunks.push({ pi: pi, text: t });
          });
        });
        return chunks;
      }

      function formatShortHints(chunks, shown) {
        const map = {};
        chunks.slice(0, shown).forEach((c) => {
          if (!map[c.pi]) map[c.pi] = [];
          map[c.pi].push(c.text);
        });
        return Object.keys(map)
          .map(Number)
          .sort((a, b) => a - b)
          .map((pi) => pi + 1 + ". " + map[pi].join(" · "))
          .join("\n");
      }

      /** 简答提示段：采分点原句（保留顿号句号等标点），最多 3 段，点老师循环切换 */
      function buildShortHintSegments(q) {
        const segs = [];
        pointsFor(q).forEach((p) => {
          const s = String(p || "").trim();
          if (s) segs.push(s);
        });
        return segs.slice(0, 3);
      }

      function advanceShortHintByTeacher() {
        if (entryMode !== "short") return false;
        if (isTeacherHidden()) return false;
        const q = currentShortQ();
        if (!q) return false;
        const segs = buildShortHintSegments(q);
        if (!segs.length) {
          teacherSpeak("这题暂无提示", "neutral");
          return true;
        }
        const at = shortHintSegAt[q.id] || 0;
        const i = at % segs.length;
        shortHintSegAt[q.id] = at + 1;
        const text = segs[i];
        const label = i + 1 + "/" + segs.length;
        teacherSpeak(label + " · " + text, "neutral");
        return true;
      }

      function ensureMcDay(d) {
        if (!state.mcDay[d] || typeof state.mcDay[d] !== "object") state.mcDay[d] = { results: {} };
        if (!state.mcDay[d].results || typeof state.mcDay[d].results !== "object") {
          state.mcDay[d].results = {};
        }
        return state.mcDay[d];
      }
      function mcResult(d, id) {
        const day = ensureMcDay(d);
        return day.results[id] || null; /* ok | fail | null */
      }
      function setMcResult(d, id, result) {
        ensureMcDay(d).results[id] = result;
        if (result === "ok") state.mcOk[id] = 1;
      }
      function restartMcDay(d) {
        clearAdvanceTimer();
        const plan = dayPlan(d);
        ensureMcDay(d).results = {};
        (plan.mcIds || []).forEach((id) => {
          delete state.mcOk[id];

        save();
        mcIdx = 0;
        picked = null;

        answerComboOk = 0;

      }

      function noteMcWrong(id) {
        state.wrongMc[id] = { streak: 0 };
      }
      /** 每日答对不单题移出错题本；须在错题本整本一轮全对才清 */
      function noteMcRight(id) {
        return { removed: false, streak: 0, inWrong: !!state.wrongMc[id] };
      }
      function noteShortWrong(id) {
        state.wrongShort[id] = { streak: 0 };
      }
      function noteShortRight(id) {
        return { removed: false, streak: 0, inWrong: !!state.wrongShort[id] };
      }
      function wrongMcCount() {
        return Object.keys(state.wrongMc || {}).length;
      }
      function wrongShortCount() {
        return Object.keys(state.wrongShort || {}).length;
      }
      function favMcCount() {
        return Object.keys(state.favMc || {}).length;
      }
      function favShortCount() {
        return Object.keys(state.favShort || {}).length;
      }
      function isFavMc(id) {
        return !!(state.favMc && state.favMc[id]);
      }
      function isFavShort(id) {
        return !!(state.favShort && state.favShort[id]);
      }
      /** 收入收藏录，并同步进错题本（便于反复练） */
      function collectMc(id) {
        if (!id) return { ok: false, already: false };
        if (!state.favMc) state.favMc = {};
        const already = !!state.favMc[id];
        state.favMc[id] = { at: new Date().toISOString() };
        noteMcWrong(id);
        save();
        return { ok: true, already: already };
      }
      function collectShort(id) {
        if (!id) return { ok: false, already: false };

        const already = !!state.favShort[id];
        state.favShort[id] = { at: new Date().toISOString() };

      function wrongMcList() {

          .map((id) => BANK.mcById[id])

          .map((id) => BANK.shortById[id])

      }

      let state = load();
      let date = BANK.schedule.some((s) => s.date === todayStr()) ? todayStr() : BANK.schedule[0].date;
      let entryMode = "daily"; /* daily=每日选择 | short=简答背诵 */
      try {

      function keepSetFor(course) {

      function courseShortDays(course) {

      function ensureShortDayForCourse(course) {

      function courseKeepProgress(course) {

        let done = 0;
        ids.forEach((id) => {

        return { done: done, total: ids.length };
      }
      let picked = null;
      let judged = false;
      let shortRevealed = false;
      let shortMemorizeMode = false; /* 背题：默认展开采分点 */
      let shortWhyOpen = false;
      const shortHintShown = {}; /* 兼容旧逻辑；简答提示改由老师点击循环 */
      const shortHintSegAt = {}; /* qid → 下一段下标（对 segments 取模） */
      let advanceTimer = null;
      let holdingCorrect = false; /* 兼容：答对已立即跳题 */
      let answerComboOk = 0;
      let answerComboFail = 0;
      let teacherBubbleTimer = null;

      const TEACHER_LINES = {
        ok: [
          "嗯，这题过了。",

        perfect: ["完美合格！页签都给你镀金了。", "零失误！老师今天心情很好。", "完美。这种状态多来几天。"],
        failDay: ["不合格：错满 2 题了。点「重」清掉重刷。", "今日不合格。容错用完了，重来吧。"],
        idle: ["点我干嘛？去做题。", "我在看你刷题呢。", "别摸教棍，去答下一题。"],
      };

      function pickLine(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }
      function isTeacherHidden() {
        try {
          const raw = JSON.parse(localStorage.getItem(TEACHER_STORE) || "null");
          return !!(raw && raw.hidden);
        } catch (_) {
          return false;
        }
      }
      function setTeacherHidden(hidden) {

      function syncTeacherUi() {

      function teacherSpeak(msg, mood) {

        bubble.hidden = false;
        bubble.textContent = msg;
        bubble.className = "teacher-bubble" + (mood ? " " + mood : "");
        clearTimeout(teacherBubbleTimer);
        teacherBubbleTimer = setTimeout(() => {
          bubble.hidden = true;
        }, 3200);
      }
      function onAnswerFeedback(ok) {
        if (ok) {
          answerComboOk += 1;
          answerComboFail = 0;
          if (answerComboOk >= 2) {
            teacherSpeak(pickLine(TEACHER_LINES.okStreak) + "（连对" + answerComboOk + "）", "good");
          } else {
            teacherSpeak(pickLine(TEACHER_LINES.ok), "good");
          }
        } else {
          answerComboFail += 1;
          answerComboOk = 0;
          if (answerComboFail >= 2) {
            teacherSpeak(pickLine(TEACHER_LINES.failStreak) + "（连错" + answerComboFail + "）", "bad");
          } else {

          }

      }
      function teacherCommentDay(st) {
        if (!st) return;
        if (st.unqualified && st.mcAnswered >= st.mcTotal) {
          teacherSpeak(pickLine(TEACHER_LINES.failDay), "bad");
        } else if (st.perfect) {
          teacherSpeak(pickLine(TEACHER_LINES.perfect), "good");

      }

      function clearAdvanceTimer() {
        if (advanceTimer) {
          clearTimeout(advanceTimer);
          advanceTimer = null;
        }
        holdingCorrect = false;
      }

      function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => {
          el.hidden = true;
        }, 3800);
      }

      function bankDayPlan(d) {
        return BANK.schedule.find((s) => s.date === d) || BANK.schedule[0];
      }

      /** 选择题清单钉死不丢进度；简答可用 shortScheduleV 刷新顺序（近代史→习思想） */
      function dayPlan(d) {
        const src = bankDayPlan(d);
        const wantShortV = Number(BANK.shortScheduleV || 1);
        const pinned = state.pinnedPlans[d];
        if (
          pinned &&
          Array.isArray(pinned.mcIds) &&
          Array.isArray(pinned.shortIds) &&
          pinned.mcIds.length + pinned.shortIds.length > 0
        ) {
          if (Number(pinned.shortScheduleV || 0) < wantShortV) {
            pinned.shortIds = (src.shortIds || []).slice();
            pinned.phase = src.phase || pinned.phase;
            pinned.shortScheduleV = wantShortV;
            save();
          }
          return pinned;
        }
        const freeze = {
          date: d,
          phase: src.phase,
          mcIds: (src.mcIds || []).slice(),
          shortIds: (src.shortIds || []).slice(),
          shortScheduleV: wantShortV,
          pinnedAt: new Date().toISOString(),
        };
        state.pinnedPlans[d] = freeze;
        save();
        return freeze;
      }

      function isMcOk(id, d) {
        return mcResult(d || date, id) === "ok";
      }
      function isShortOk(id) {
        return !!state.shortOk[id];
      }

      function dayStats(d) {
        const plan = dayPlan(d);
        const shortIds = dayShortIds(d);
        let mcTotal = plan.mcIds.length;
        let shortTotal = shortIds.length;
        let mcOkN = 0;
        let mcFailN = 0;
        let mcAnswered = 0;
        let shortDone = 0;
        plan.mcIds.forEach((id) => {
          const r = mcResult(d, id);
          if (r === "ok") {
            mcOkN += 1;
            mcAnswered += 1;
          } else if (r === "fail") {
            mcFailN += 1;
            mcAnswered += 1;
          }
        });
        shortIds.forEach((id) => {
          if (isShortOk(id)) shortDone += 1;
        });
        /* 入口拆分：每日选择只算选择；简答背诵只算整科精简进度 */
        if (entryMode === "daily") {
          shortTotal = 0;
          shortDone = 0;
        } else {
          mcTotal = 0;
          mcOkN = 0;
          mcFailN = 0;
          mcAnswered = 0;
          const kp = courseKeepProgress(shortCourse);
          shortTotal = kp.total;
          shortDone = kp.done;
        }
        const mcEmpty = mcTotal === 0;
        const mcFinished = mcTotal > 0 && mcAnswered >= mcTotal;
        const mcPerfect = mcFinished && mcFailN === 0;
        const mcPass = mcFinished && mcFailN <= MC_FAIL_ALLOW;
        const shortOk = shortTotal === 0 || shortDone >= shortTotal;
        const total = mcTotal + shortTotal;
        const done = mcAnswered + shortDone;
        const ok = total > 0 && (mcEmpty || mcPass) && shortOk;
        const perfect = ok && (mcEmpty ? shortOk : mcPerfect);
        return {
          plan,
          shortIds,
          mcTotal,
          shortTotal,
          mcDone: mcOkN,
          mcFailN,
          mcAnswered,
          shortDone,
          total,
          done,
          unqualified: entryMode === "daily" && mcFailN > MC_FAIL_ALLOW,
          mcPerfect,
          mcPass: mcEmpty || mcPass,
          mcClean: mcEmpty || mcPass, /* 兼容旧调用：容错内也算选择过关 */
          ok,
          perfect: entryMode === "daily" && perfect,
        };
      }

      function weekdayLabel(iso) {
        const dt = new Date(iso + "T12:00:00");
        return "日一二三四五六"[dt.getDay()];
      }
      function shortDate(iso) {
        const [, m, d] = iso.split("-");
        return Number(m) + "/" + Number(d);
      }
      function shortenPhase(phase) {
        let s = String(phase || "");
        s = s.replace(/（强制）/g, "").replace(/强制/g, "");
        s = s.replace(/一刷打底·/g, "");
        s = s.replace(/先近代史简答/g, "近代史简答");
        s = s.replace(/习思想简答/g, "习思想简答");
        s = s.replace(/考前决战日/g, "考前决战");
        return s.trim() || phase;
      }

      function shuffleIds(ids) {
        const a = (ids || []).slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }
      function isMcShuffle() {
        return !!state.mcShuffle;
      }
      function rebuildMcShuffle() {
        const ids = (dayPlan(date).mcIds || []).slice();
        state.mcShuffle = true;
        state.mcShuffleDate = date;
        state.mcShuffleIds = shuffleIds(ids);
      }
      function setMcShuffle(on) {
        const next = !!on;
        flushActiveShortDraft();
        const curId = (currentMcList()[mcIdx] || {}).id;
        if (next) {
          rebuildMcShuffle();
          toast("乱序 · 今日选择已打乱");
        } else {
          state.mcShuffle = false;
          state.mcShuffleDate = null;
          state.mcShuffleIds = null;
          toast("顺序 · 按派题顺序");
        }
        save();
        const list = currentMcList();
        let ni = curId ? list.findIndex((q) => q.id === curId) : -1;
        if (ni < 0) ni = nextUnansweredMc();
        mcIdx = ni;
        picked = null;
        judged = false;
        holdingCorrect = false;
        render();
      }
      function currentMcList() {
        const planIds = dayPlan(date).mcIds || [];
        if (!isMcShuffle()) {
          return planIds.map((id) => BANK.mcById[id]).filter(Boolean);
        }
        if (
          state.mcShuffleDate !== date ||
          !Array.isArray(state.mcShuffleIds) ||
          !state.mcShuffleIds.length
        ) {
          rebuildMcShuffle();
          save();
        }
        return state.mcShuffleIds.map((id) => BANK.mcById[id]).filter(Boolean);
      }
      function sortShortsByChapter(list) {
        const courseRank = { history: 0, xi: 1 };
        return list.slice().sort((a, b) => {
          const ca = courseRank[a.course] != null ? courseRank[a.course] : 9;
          const cb = courseRank[b.course] != null ? courseRank[b.course] : 9;
          if (ca !== cb) return ca - cb;
          const cha = Number(a.ch) || 0;
          const chb = Number(b.ch) || 0;
          if (cha !== chb) return cha - chb;
          const ia = Number(a.i) || 0;
          const ib = Number(b.i) || 0;
          if (ia !== ib) return ia - ib;
          return String(a.id).localeCompare(String(b.id));
        });
      }
      /** 计划日原题量（用来按天切片） */
      function planShortList(d) {
        return dayPlan(d).shortIds.map((id) => BANK.shortById[id]).filter(Boolean);
      }
      /**
       * 简答固定按章：全书按章排好后，按每日原题量切开铺到各天（一天仍约 7～8 题）
       * 近代史日摊近代史，习思想日摊习思想
       */
      function chapterShortList(d) {
        const planList = planShortList(d);
        if (!planList.length) return [];
        const courses = Array.from(new Set(planList.map((q) => q.course).filter(Boolean)));
        if (courses.length !== 1 || !BANK.shortById) {
          return sortShortsByChapter(
            planList.filter((q) => {
              const keep = keepSetFor(q.course);
              return !keep || keep.has(q.id);
            })
          );
        }
        const course = courses[0];
        const keep = keepSetFor(course);
        const allSorted = sortShortsByChapter(
          Object.keys(BANK.shortById)
            .map((id) => BANK.shortById[id])
            .filter((q) => q && q.course === course && (!keep || keep.has(q.id)))
        );
        const peerDays = (BANK.schedule || []).filter((s) => {
          const list = planShortList(s.date);
          if (!list.length) return false;
          return list.every((q) => q.course === course);
        });
        let offset = 0;
        for (let i = 0; i < peerDays.length; i++) {
          const n = planShortList(peerDays[i].date).length;
          if (peerDays[i].date === d) {
            return allSorted.slice(offset, offset + n);
          }
          offset += n;
        }
        return sortShortsByChapter(planList.filter((q) => !keep || keep.has(q.id)));
      }
      function keepShortList(course) {
        /* 严格按 shortKeep 顺序（必背在前、眼熟在后），不再按章重排 */
        const ids = (BANK.shortKeep && BANK.shortKeep[course]) || [];
        if (!BANK.shortById || !ids.length) return [];
        return ids.map((id) => BANK.shortById[id]).filter((q) => q && q.course === course);
      }
      function shortTagLabel(q) {
        const t = q && q.shortTag;
        if (t === "must") return { cls: "tag-must", text: "🔥必背" };
        if (t === "familiar") return { cls: "tag-familiar", text: "⭐眼熟" };
        return null;
      }
      function dayShortList(d) {
        /* 简答背诵：不再按日切片，整科精简题一条龙 */
        if (entryMode === "short") return keepShortList(shortCourse);
        return chapterShortList(d);
      }
      function dayShortIds(d) {
        return dayShortList(d).map((q) => q.id);
      }
      function currentShortList() {
        if (entryMode === "short") return keepShortList(shortCourse);
        return dayShortList(date);
      }

      function nextUnansweredMc() {
        const list = currentMcList();
        for (let i = 0; i < list.length; i++) {
          if (!mcResult(date, list[i].id)) return i;
        }
        return Math.min(mcIdx, Math.max(0, list.length - 1));
      }
      function nextUnansweredShort() {
        const list = currentShortList();
        for (let i = 0; i < list.length; i++) {
          if (!isShortOk(list[i].id)) return i;
        }
        return 0;
      }

      function renderNav() {
        const nav = $("day-nav");
        nav.innerHTML = "";
        if (entryMode === "short") {
          nav.hidden = true;
          return;
        }
        nav.hidden = false;
        const days = BANK.schedule || [];
        days.forEach((s) => {
          const st = dayStats(s.date);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "day-chip";
          if (s.date === date) btn.classList.add("on");
          if (st.perfect) btn.classList.add("perfect");
          else if (st.ok) btn.classList.add("done");
          btn.innerHTML =
            '<span class="d">' +
            shortDate(s.date) +
            '</span><span class="w">' +
            weekdayLabel(s.date) +
            " " +
            st.done +
            "/" +
            st.total +
            "</span>";
          btn.addEventListener("click", () => {
            date = s.date;
            picked = null;
            judged = false;
            shortRevealed = shortMemorizeMode;
            shortWhyOpen = false;
            mcIdx = nextUnansweredMc();
            shortIdx = nextUnansweredShort();
            render();
          });
          nav.appendChild(btn);
        });
      }

      function renderLock() {
        const today = todayStr();
        const lock = $("lock");
        if (entryMode === "short") {
          const kp = courseKeepProgress(shortCourse);
          const name = shortCourse === "xi" ? "习思想" : "近代史";
          if (kp.total && kp.done >= kp.total) {
            lock.className = "lock ok";
            lock.innerHTML = name + "简答精简已过<small>" + kp.done + "/" + kp.total + "</small>";
          } else {
            lock.className = "lock";
            lock.innerHTML =
              name +
              "简答 " +
              kp.done +
              "/" +
              kp.total +
              "<small>合上书能写关键词</small>";
          }
          return;
        }
        const hasToday = BANK.schedule.some((s) => s.date === today);
        const t = dayStats(hasToday ? today : date);

      function spawnFireworks() {
        const layer = document.createElement("div");
        layer.className = "fw-burst";
        const colors = ["#22c55e", "#f59e0b", "#3b82f6", "#ef4444", "#a855f7", "#eab308"];
        for (let i = 0; i < 18; i++) {
          const p = document.createElement("i");
          p.className = "fw-piece";
          const ang = (Math.PI * 2 * i) / 18 + Math.random() * 0.2;
          const dist = 48 + Math.random() * 90;
          p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
          p.style.setProperty("--dy", Math.sin(ang) * dist + "px");
          p.style.background = colors[i % colors.length];
          p.style.animationDelay = Math.random() * 0.05 + "s";
          layer.appendChild(p);
        }
        document.body.appendChild(layer);
        setTimeout(() => {
          try {
            layer.remove();

        }, 700);

      function submitMcAnswer(q, key) {
        if (!q || !key) return;
        const already = mcResult(date, q.id);
        if (already === "ok" || already === "fail") return;
        clearAdvanceTimer();
        picked = key;
        if (key === q.correct) {
          setMcResult(date, q.id, "ok");
          noteMcRight(q.id);
          save();
          onAnswerFeedback(true);
          toast("答对");
          /* 点答：先标绿闪一下 + 烟花，再跳题 */
          holdingCorrect = true;
          judged = true;
          picked = q.correct;
          render();
          spawnFireworks();
          const rightEl = document.querySelector(".opt.right");
          if (rightEl) rightEl.classList.add("flash");
          advanceTimer = setTimeout(finishMcCorrectAdvance, 380);
        } else {
          setMcResult(date, q.id, "fail");
          noteMcWrong(q.id);
          judged = true;
          save();
          onAnswerFeedback(false);
          const after = dayStats(date);
          if (after.unqualified) {
            toast("不合格 · 已进错题本（错" + after.mcFailN + "）");
            if (after.mcAnswered >= after.mcTotal) teacherCommentDay(after);

      function extractPointKeys(point) {
        const raw = String(point || "");
        const keys = [];
        SHORT_KEY_BANK.forEach((k) => {
          if (raw.indexOf(k) >= 0) keys.push(k);
        });
        const quoted = raw.match(/[「『]([^」』]+)[」』]/g) || [];
        quoted.forEach((m) => {
          const inner = m.replace(/^[「『]/, "").replace(/[」』]$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        const books = raw.match(/《([^》]+)》/g) || [];
        books.forEach((m) => {
          const inner = m.replace(/^《/, "").replace(/》$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        /* 分句补短词：整段≤18 直接用；更长则取头尾短块，避免截断成半截词 */
        raw.split(/[，。；、]/).forEach((seg) => {
          const s0 = seg.replace(/\s+/g, "").trim();
          if (s0.length < 3) return;
          if (keys.some((k) => s0.indexOf(k) >= 0)) return;
          let s = s0.replace(
            /^(企图|必须|坚持|强调|提出|建立|实行|进行|推动|实现|促进|维护|加强|完善|健全|确立)/,
            ""
          );
          if (s.length < 3) s = s0;
          if (s.length <= 18) keys.push(s);
          else {
            keys.push(s.slice(0, 8));
            keys.push(s.slice(-8));
          }
        });
        return Array.from(new Set(keys));
      }

      function normAns(s) {
        return String(s || "")
          .replace(/\s+/g, "")
          .replace(/[，。；、,.!！？?：:（）()\[\]【】"'“”‘’]/g, "")
          .toLowerCase();

      function gradeShortDictation(text, q) {
        const ans = normAns(text);
        const points = pointsFor(q);
        const detail = [];
        let hitPoints = 0;
        points.forEach((p, i) => {
          const keys = extractPointKeys(p);
          const hit = keys.filter((k) => ans.indexOf(normAns(k)) >= 0);
          const need = keys.length <= 2 ? 1 : Math.max(1, Math.ceil(keys.length * 0.4));
          const pointOk = keys.length ? hit.length >= need : ans.length >= 12;
          if (pointOk) hitPoints += 1;
          detail.push({ i, keys, hit, pointOk, need });
        });
        const needPoints = Math.max(1, Math.ceil(points.length * (2 / 3)));
        return {
          pass: points.length > 0 && hitPoints >= needPoints,
          hitPoints,
          needPoints,
          totalPoints: points.length,
          detail,
        };
      }

      function buildExportPayload() {
        return {
          v: 8,
          type: "fuxi-zuoye-forced-progress",
          exportedAt: new Date().toISOString(),
          mcOk: state.mcOk,
          shortOk: state.shortOk,
          shortDraft: state.shortDraft || {},
          shortPointsCustom: state.shortPointsCustom || {},
          mcDay: state.mcDay,
          wrongMc: state.wrongMc,
          wrongShort: state.wrongShort,
          favMc: state.favMc || {},
          favShort: state.favShort || {},
          pinnedPlans: state.pinnedPlans,
          mcShuffle: isMcShuffle(),
          mcShuffleDate: state.mcShuffleDate || null,
          mcShuffleIds: Array.isArray(state.mcShuffleIds) ? state.mcShuffleIds.slice() : null,
        };
      }

      function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = "";
        bytes.forEach((b) => {
          bin += String.fromCharCode(b);
        });
        return btoa(bin);
      }

      function getGhToken() {
        try {
          return String(localStorage.getItem(GH_TOKEN_STORE) || "").trim();
        } catch (_) {
          return "";
        }
      }
      function setGhToken(token) {
        try {
          const t = String(token || "").trim();
          if (t) localStorage.setItem(GH_TOKEN_STORE, t);
          else localStorage.removeItem(GH_TOKEN_STORE);
        } catch (_) {}
      }
      function hideTokenPanel() {
        const p = $("token-panel");
        if (p) p.hidden = true;

        hideWrongMenu();

        ta.focus();
      }
      async function readGhError(res) {
        try {
          const err = await res.json();
          return err.message || res.statusText || String(res.status);
        } catch (_) {
          return res.statusText || String(res.status);
        }
      }
      function handleGhAuthFail(status, detail) {
        setGhToken("");
        const tip =
          status === 403
            ? "无权限(403)：Token 须勾选仓库 fuxi，且 Contents=Read and write"
            : "Token 无效(401)：请重新粘贴完整 github_pat_…";
        toast(tip + (detail ? " · " + detail : ""));
        showTokenPanel("");
      }

      function cloudProgressFetchUrl() {
        if (location.protocol === "file:") {
          return CLOUD_PROGRESS_URL + "?t=" + Date.now();
        }
        const url = new URL("progress-latest.json", location.href);
        url.searchParams.set("t", String(Date.now()));
        return url.href;
      }

      async function fetchCloudProgressSha(apiBase, headers) {
        const cur = await fetch(
          apiBase + "?ref=" + encodeURIComponent(GH_BRANCH) + "&_=" + Date.now(),
          { headers: headers, cache: "no-store" }
        );
        if (cur.status === 200) {
          const meta = await cur.json();
          return { ok: true, sha: meta.sha || null, status: 200 };
        }
        if (cur.status === 404) return { ok: true, sha: null, status: 404 };
        return {
          ok: false,
          status: cur.status,
          detail: await readGhError(cur),
        };
      }

      async function putCloudProgress(apiBase, headers, bodyText, sha, stamp) {
        const putBody = {
          message: "chore(zuoye): 上传本机进度 " + stamp.slice(0, 19),
          content: utf8ToBase64(bodyText),
          branch: GH_BRANCH,
        };
        if (sha) putBody.sha = sha;
        return fetch(apiBase, {
          method: "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, headers),
          body: JSON.stringify(putBody),
          cache: "no-store",
        });
      }

      async function uploadProgressToCloud(tokenOverride) {
        let token = (tokenOverride != null ? String(tokenOverride) : getGhToken()).trim();
        if (!token) {
          showTokenPanel("");
          toast("先粘贴 Token，再点「保存并上传」");
          return;
        }
        if (token.indexOf("github_pat_") !== 0 && token.indexOf("ghp_") !== 0) {
          showTokenPanel(token);
          toast("Token 格式不对：应以 github_pat_ 或 ghp_ 开头");
          return;
        }
        const payload = buildExportPayload();
        const bodyText = JSON.stringify(payload, null, 2);
        const apiBase =
          "https://api.github.com/repos/" +
          GH_OWNER +
          "/" +
          GH_REPO +
          "/contents/" +
          GH_PROGRESS_PATH;
        const headers = {
          Accept: "application/vnd.github+json",
          Authorization: "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28",
        };
        let sha = null;
        try {
          const got = await fetchCloudProgressSha(apiBase, headers);
          if (!got.ok) {
            if (got.status === 401 || got.status === 403) {
              handleGhAuthFail(got.status, got.detail);
              return;
            }
            toast("读取云端文件失败 " + got.status + " · " + (got.detail || ""));
            return;
          }
          sha = got.sha;
        } catch (_) {
          toast("连不上 GitHub API，检查网络后重试");
          return;
        }
        const stamp = payload.exportedAt || new Date().toISOString();
        let put;
        try {
          put = await putCloudProgress(apiBase, headers, bodyText, sha, stamp);
          /* 409=别人/本机刚改过文件，sha 过期：再拉一次最新 sha 重试 */
          if (put.status === 409) {
            const again = await fetchCloudProgressSha(apiBase, headers);
            if (again.ok) {
              put = await putCloudProgress(apiBase, headers, bodyText, again.sha, stamp);
            }
          }
        } catch (_) {
          toast("上传请求失败，检查网络后重试");
          return;
        }
        if (put.status === 401 || put.status === 403) {
          handleGhAuthFail(put.status, await readGhError(put));
          return;
        }
        if (!put.ok) {
          toast("上传失败 " + put.status + " · " + (await readGhError(put)));
          return;
        }
        setGhToken(token);
        hideTokenPanel();
        toast("已上传云端 · 手机强刷后可「从云端覆盖」");
      }

      function assertProgressPayload(payload) {
        if (
          !payload ||
          (payload.v !== 3 &&
            payload.v !== 4 &&
            payload.v !== 5 &&
            payload.v !== 6 &&
            payload.v !== 7 &&
            payload.v !== 8 &&
            payload.type !== "fuxi-zuoye-forced-progress")
        ) {
          throw new Error("bad");
        }
      }

      /** 整份覆盖本机进度（云端同步「以仓库为准」） */
      function applyReplacePayload(payload) {
        assertProgressPayload(payload);
        state = normalizeState(payload);
        save();
        mcIdx = nextUnansweredMc();
        shortIdx = nextUnansweredShort();
        picked = null;
        judged = false;
        render();
      }

      function applyImportPayload(payload) {
        assertProgressPayload(payload);
        const incoming = normalizeState(payload);
        state.mcOk = Object.assign({}, state.mcOk, incoming.mcOk);
        state.shortOk = Object.assign({}, state.shortOk, incoming.shortOk);
        state.shortDraft = Object.assign({}, state.shortDraft || {}, incoming.shortDraft || {});
        state.shortPointsCustom = Object.assign(
          {},
          state.shortPointsCustom || {},
          incoming.shortPointsCustom || {}
        );
        Object.keys(incoming.mcDay || {}).forEach((d) => {
          if (!state.mcDay[d]) state.mcDay[d] = { results: {} };
          if (!state.mcDay[d].results) state.mcDay[d].results = {};
          Object.assign(state.mcDay[d].results, (incoming.mcDay[d] && incoming.mcDay[d].results) || {});
        });
        Object.keys(incoming.wrongMc || {}).forEach((id) => {
          const cur = state.wrongMc[id];
          const inc = incoming.wrongMc[id];
          if (!cur) state.wrongMc[id] = inc;
          else state.wrongMc[id] = { streak: Math.min(cur.streak || 0, inc.streak || 0) };
        });
        Object.keys(incoming.wrongShort || {}).forEach((id) => {
          const cur = state.wrongShort[id];
          const inc = incoming.wrongShort[id];
          if (!cur) state.wrongShort[id] = inc;
          else state.wrongShort[id] = { streak: Math.min(cur.streak || 0, inc.streak || 0) };
        });
        Object.keys(incoming.favMc || {}).forEach((id) => {
          if (!state.favMc) state.favMc = {};
          if (!state.favMc[id]) state.favMc[id] = incoming.favMc[id];
        });
        Object.keys(incoming.favShort || {}).forEach((id) => {
          if (!state.favShort) state.favShort = {};
          if (!state.favShort[id]) state.favShort[id] = incoming.favShort[id];
        });
        Object.keys(incoming.pinnedPlans || {}).forEach((d) => {
          if (!state.pinnedPlans[d]) state.pinnedPlans[d] = incoming.pinnedPlans[d];
        });
        if (typeof incoming.mcShuffle === "boolean") state.mcShuffle = incoming.mcShuffle;
        if (incoming.mcShuffleDate) state.mcShuffleDate = incoming.mcShuffleDate;
        if (Array.isArray(incoming.mcShuffleIds)) state.mcShuffleIds = incoming.mcShuffleIds.slice();
        save();
        mcIdx = nextUnansweredMc();
        shortIdx = nextUnansweredShort();
        render();
      }

      function parseImportText(raw) {
        let text = String(raw || "").trim();
        if (!text) throw new Error("empty");
        // 允许整段包在 ```json ... ``` 里，或前后有说明文字时抽出首个 {...}
        const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fence) text = fence[1].trim();
        try {
          return JSON.parse(text);
        } catch (_) {
          const start = text.indexOf("{");
          const end = text.lastIndexOf("}");
          if (start >= 0 && end > start) return JSON.parse(text.slice(start, end + 1));
          throw new Error("bad");
        }
      }

      function downloadExportJson(payload) {
        const stamp = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const name =
          "zuoye-progress-" +
          stamp.getFullYear() +
          pad(stamp.getMonth() + 1) +
          pad(stamp.getDate()) +
          "-" +
          pad(stamp.getHours()) +
          pad(stamp.getMinutes()) +
          ".json";
        const blob = new Blob([JSON.stringify(payload, null, 2)], {
          type: "application/json;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return name;
      }

      }
      $("btn-cloud-upload").addEventListener("click", () => {
        onCloudUploadClick();
      });
      $("btn-theme").addEventListener("click", () => {
        const menu = $("theme-menu");
        const open = menu.hidden;
        hideExportMenu();
        hideWrongMenu();
        hideTokenPanel();
        $("import-panel").hidden = true;
        applyTheme(getTheme());
        menu.hidden = !open;
      });
      $("btn-theme-warm").addEventListener("click", () => {
        applyTheme("warm", { toast: true });
        hideThemeMenu();
      });
      $("btn-theme-eye").addEventListener("click", () => {
        applyTheme("eye", { toast: true });
        hideThemeMenu();
      });
      $("btn-export").addEventListener("click", () => {
        const menu = $("export-menu");
        const open = menu.hidden;
        $("import-panel").hidden = true;
        hideTokenPanel();
        hideWrongMenu();
        hideThemeMenu();
        menu.hidden = !open;
      });
      $("btn-export-text").addEventListener("click", async () => {
        hideExportMenu();
        await exportProgressAsText();
      });
      $("btn-export-json").addEventListener("click", () => {
        hideExportMenu();
        try {
          const name = downloadExportJson(buildExportPayload());
          toast("已下载 " + name + "（可发到另一台后用导入粘贴内容）");
        } catch (_) {
          toast("下载失败，改用「导出文本」");
        }
      });
      if ($("btn-cloud-upload-menu")) {
        $("btn-cloud-upload-menu").addEventListener("click", () => {
          onCloudUploadClick();
        });
      }

      $("btn-wrong-page").addEventListener("click", () => {
        const menu = $("wrong-menu");
        const open = menu.hidden;
        hideExportMenu();
        hideThemeMenu();
        $("import-panel").hidden = true;
        menu.hidden = !open;
      });
      $("btn-import").addEventListener("click", () => {
        hideExportMenu();
        hideWrongMenu();
        hideThemeMenu();
        hideTokenPanel();
        const panel = $("import-panel");
        panel.hidden = !panel.hidden;
        if (!panel.hidden) {
          $("import-text").value = "";
          $("import-text").focus();
        }
      });
      $("btn-import-cancel").addEventListener("click", () => {
        $("import-panel").hidden = true;
        $("import-text").value = "";
      });
      $("btn-import-apply").addEventListener("click", () => {
        try {
          applyImportPayload(parseImportText($("import-text").value));
          $("import-panel").hidden = true;
          $("import-text").value = "";
          toast("进度已合并导入（含错题本；不覆盖已钉死的日期清单）");
        } catch (_) {
          toast("导入失败：请粘贴本页导出的进度 JSON");
        }
      });
      $("btn-cloud-replace").addEventListener("click", async () => {
        if (
          !confirm(
            "用云端 progress-latest.json 整份覆盖本机进度（含错题/收藏）？本机多出来的记录会丢。确定？"
          )
        ) {
          return;
        }
        try {
          const res = await fetch(cloudProgressFetchUrl(), { cache: "no-store" });
          if (!res.ok) throw new Error("http");
          const payload = await res.json();
          applyReplacePayload(payload);
          $("import-panel").hidden = true;
          $("import-text").value = "";
          toast("已从云端覆盖本机进度");
        } catch (_) {
          toast("拉取云端失败：确认已推 progress-latest.json，或网络后重试");
        }
      });

      /* 刷新/关页/切后台前强制把当前默写框写入 localStorage，避免丢字 */
      function hardSaveShortDraft() {
        flushActiveShortDraft();
        save();
      }
      window.addEventListener("pagehide", hardSaveShortDraft);
      window.addEventListener("beforeunload", hardSaveShortDraft);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") hardSaveShortDraft();
      });

      const btnTeacherHide = $("btn-teacher-hide");
      const btnTeacherShow = $("btn-teacher-show");
      const teacherFig = $("teacher-fig");
      if (btnTeacherHide) {
        btnTeacherHide.addEventListener("click", (e) => {
          e.stopPropagation();
          setTeacherHidden(true);
        });
      }
      if (btnTeacherShow) {
        btnTeacherShow.addEventListener("click", () => {
          setTeacherHidden(false);
          teacherSpeak("我回来了。继续刷。", "neutral");
        });
      }
      if (teacherFig) {
        teacherFig.addEventListener("click", () => {
          if (advanceShortHintByTeacher()) return;
          teacherSpeak(pickLine(TEACHER_LINES.idle), "neutral");
        });
      }
      syncTeacherUi();
      applyTheme(getTheme());

      tab = entryMode === "short" ? "short" : "mc";
      if (entryMode === "short") ensureShortDayForCourse(shortCourse);
      mcIdx = nextUnansweredMc();
      shortIdx = nextUnansweredShort();
      render();
    })();
  </script>
</body>
</html>
