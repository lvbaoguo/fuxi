<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>强制每日作业 · 过及格线</title>
  <style>
    :root {
      --bg: #efe8dc;
      --card: #fffdf8;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e4ddd2;
      --blue: #1d4ed8;
      --green: #166534;
      --red: #991b1b;
      --amber: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, #fecaca66, transparent),
        radial-gradient(700px 360px at 100% 0%, #fde68a55, transparent),
        var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 14px 12px 88px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 12px; font-size: 0.9rem; }
    .lock {
      padding: 12px 14px; border-radius: 12px; background: #7f1d1d; color: #fff7ed;
      font-weight: 800; margin-bottom: 12px;
    }
    .lock.ok { background: var(--green); color: #ecfdf5; }
    .lock small { display: block; font-weight: 500; opacity: 0.92; margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 8px 22px rgba(28,25,23,0.05);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .grow { flex: 1 1 auto; }
    button, input, select {
      font: inherit; border-radius: 8px; border: 1px solid var(--line);
      padding: 8px 10px; background: #fff; color: var(--ink);
    }
    button { cursor: pointer; font-weight: 700; }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.good { background: var(--green); color: #fff; border-color: var(--green); }
    button.ghost, a.ghost {
      background: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    button.danger { color: var(--red); border-color: #fecaca; background: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pill.bad { background: #fee2e2; color: var(--red); }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 800; background: #fee2e2; color: var(--red);
    }
    .pill.ok { background: #dcfce7; color: var(--green); }
    .pill.mc { background: #dbeafe; color: #1d4ed8; }
    .progress {
      height: 10px; background: #e7e5e4; border-radius: 999px; overflow: hidden; margin: 8px 0;
    }
    .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b45309, #166534); }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; }
    .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .q-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
    .q-meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 6px; }
    .q-text { font-weight: 700; font-size: 1.02rem; margin-bottom: 10px; }
    .opt {
      display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff;
    }
    .opt.on { border-color: var(--blue); background: #eff6ff; }
    .opt.right { border-color: var(--green); background: #ecfdf5; }
    .opt.wrong { border-color: #fca5a5; background: #fef2f2; }
    .explain { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f5f5f4; font-size: 0.9rem; }
    .points { margin: 8px 0 0; padding-left: 1.2em; }
    .points[hidden] { display: none !important; }
    .short-answer-block[hidden] { display: none !important; }
    .short-answer-block { margin-top: 10px; }
    .short-pane {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      margin-top: 10px;
    }
    .short-pane.official h4 {
      margin: 0 0 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #9a3412;
    }
    .short-pane ol {
      margin: 0;
      padding-left: 1.15em;
    }
    .short-pane li {
      margin: 6px 0;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    mark.key {
      background: #fde68a;
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 700;
    }
    .short-why-banner {
      margin: 0;
      border: 1px solid #86efac;
      border-radius: 10px;
      background: linear-gradient(180deg, #f0fdf4 0%, #ecfdf5 100%);
      overflow: hidden;
    }
    .short-why-banner > summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #166534;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .short-why-banner > summary::-webkit-details-marker { display: none; }
    .short-why-banner > summary::before {
      content: "▸";
      display: inline-block;
      transition: transform 0.15s ease;
      color: #15803d;
    }
    .short-why-banner[open] > summary::before { transform: rotate(90deg); }
    .short-why-banner > summary span.muted {
      font-weight: 500;
      color: #4b5563;
      font-size: 0.82rem;
    }
    .short-why-body {
      padding: 0 14px 14px;
      border-top: 1px dashed #bbf7d0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: #14532d;
      white-space: pre-wrap;
    }
    .short-why-body p {
      margin: 10px 0 0;
      white-space: pre-wrap;
    }
    .dictation {
      margin: 12px 0 4px;
      padding: 10px;
      border: 1px dashed #f59e0b;
      border-radius: 10px;
      background: #fffbeb;
    }
    .dictation label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 6px;
    }
    .dictation textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      line-height: 1.5;
      background: #fff;
    }
    .dictation-result {
      margin-top: 8px;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .dictation-result.pass { color: #166534; font-weight: 700; }
    .dictation-result.fail { color: #991b1b; font-weight: 700; }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .toast {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: #1c1917; color: #fff; padding: 10px 14px; border-radius: 8px;
      max-width: min(520px, calc(100% - 24px)); z-index: 30; font-size: 0.9rem;
    }
    .toast[hidden] { display: none !important; }
    a { color: var(--blue); }
    .day-nav { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; }
    .day-chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 10px;
      padding: 7px 9px; min-width: 58px; text-align: center; cursor: pointer; font: inherit;
    }
    .day-chip .d { font-weight: 800; display: block; font-size: 0.9rem; }
    .day-chip .w { font-size: 0.72rem; color: var(--muted); }
    .day-chip.on { background: #1c1917; color: #fff; }
    .day-chip.on .w { color: #d6d3d1; }
    .day-chip.done { background: #ecfdf5; border-color: #86efac; }
    .nav-btns { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .nav-btns button { padding: 8px 10px; font-size: 0.88rem; }
    .order-toggle {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      margin: 0 0 10px; font-size: 0.84rem; color: var(--muted);
    }
    .order-toggle button {
      padding: 6px 10px; font-size: 0.84rem; border-radius: 8px;
      border: 1px solid var(--line); background: #fff; cursor: pointer; font: inherit;
    }
    .order-toggle button.on {
      background: #1c1917; color: #fff; border-color: #1c1917;
    }
    @media (max-width: 520px) {
      .nav-btns { gap: 5px; }
      .nav-btns button { padding: 7px 8px; font-size: 0.84rem; }
      .dictation label { font-size: 0.82rem; }
      .short-why-banner > summary { padding: 10px 12px; font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>强制每日作业 · 老师派题</h1>
    <p class="sub">不让你自己加任务。题库选择题 + 简答已按日派好，必须在本页答对/背过才能开娱乐。考试 10/24–25，10/23 前冲两门 ≥60。</p>

    <div id="lock" class="lock">今日强制作业未完成 · 不许娱乐</div>

    <div class="card row">
      <button type="button" class="ghost" id="btn-today">今天</button>
      <span class="grow hint" id="day-label"></span>
      <button type="button" class="ghost" id="btn-export">导出进度</button>
      <a class="ghost" id="btn-wrong-page" href="wrong.html" style="text-decoration:none;display:inline-flex;align-items:center;">错题本</a>
      <button type="button" class="ghost" id="btn-import">导入进度</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button type="button" class="primary" id="btn-teacher">请老师看</button>
    </div>

    <div class="day-nav" id="day-nav"></div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <strong id="phase"></strong>
        <span id="pill" class="pill">未过关</span>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <p class="hint" id="prog-text"></p>
      <div class="tabs">
        <button type="button" class="on" id="tab-mc">选择题</button>
        <button type="button" id="tab-short">简答题</button>
      </div>
      <div id="work"></div>
    </div>

    <div class="card hint">
      刷题对照（可选）：<a href="../index.html">本地 fuxi</a> ·
      <a href="https://lvbaoguo.github.io/fuxi/" target="_blank" rel="noopener">线上 fuxi</a>
      · 但过关以本页强制作业为准。
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="data.js"></script>
  <script>
    (function () {
      const BANK = window.ZUOYE_BANK;
      if (!BANK) {
        document.body.innerHTML = "<p style='padding:24px'>缺少 data.js</p>";
        return;
      }
      /* 进度键名固定；改 data.js / 排期不得清空已答 */
      const STORE = "pansan2-zuoye-forced-progress";
      const STORE_LEGACY = "pansan2-zuoye-forced-v3";
      const courseName = { history: "近代史", xi: "习思想" };
      const $ = (id) => document.getElementById(id);

      function todayStr() {
        const n = new Date();
        return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
      }

      function stripDayPrefix(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          if (!map[k]) return;
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          out[id] = 1;
        });
        return out;
      }

      const WRONG_CLEAR_STREAK = 2; /* 与刷题页错题练一致：连对 2 次才移出 */

      function emptyState() {
        return {
          v: 7,
          mcOk: {},
          shortOk: {},
          shortDraft: {},
          mcDay: {},
          wrongMc: {},
          wrongShort: {},
          pinnedPlans: {},
          shortOrderMode: "plan", /* plan=今日排期顺序 | chapter=按章节 1→2→… */
          exportedAt: null,
        };
      }

      function normalizeWrongMap(map) {
        const out = {};
        Object.keys(map || {}).forEach((k) => {
          const id = k.indexOf("|") >= 0 ? k.slice(k.indexOf("|") + 1) : k;
          const v = map[k];
          if (!v) return;
          if (typeof v === "object") {
            out[id] = { streak: Math.max(0, Math.floor(Number(v.streak) || 0)) };
          } else {
            out[id] = { streak: 0 };
          }
        });
        return out;
      }

      function normalizeState(raw) {
        const st = emptyState();
        if (!raw || typeof raw !== "object") return st;
        st.mcOk = stripDayPrefix(raw.mcOk);
        st.shortOk = stripDayPrefix(raw.shortOk);
        st.shortDraft =
          raw.shortDraft && typeof raw.shortDraft === "object" ? { ...raw.shortDraft } : {};
        st.wrongMc = normalizeWrongMap(raw.wrongMc);
        st.wrongShort = normalizeWrongMap(raw.wrongShort);
        st.pinnedPlans = raw.pinnedPlans && typeof raw.pinnedPlans === "object" ? raw.pinnedPlans : {};
        st.mcDay = raw.mcDay && typeof raw.mcDay === "object" ? raw.mcDay : {};
        st.shortOrderMode = raw.shortOrderMode === "chapter" ? "chapter" : "plan";
        st.exportedAt = raw.exportedAt || null;
        /* 旧进度：全局 mcOk 迁到当日结果，避免一更新就全丢 */
        Object.keys(st.pinnedPlans).forEach((d) => {
          const plan = st.pinnedPlans[d];
          if (!plan || !Array.isArray(plan.mcIds)) return;
          if (!st.mcDay[d] || typeof st.mcDay[d] !== "object") st.mcDay[d] = { results: {} };
          if (!st.mcDay[d].results) st.mcDay[d].results = {};
          plan.mcIds.forEach((id) => {
            if (st.mcOk[id] && !st.mcDay[d].results[id]) st.mcDay[d].results[id] = "ok";
          });
        });
        return st;
      }

      function mergeShortDraftBackup(st) {
        if (!st.shortDraft || typeof st.shortDraft !== "object") st.shortDraft = {};
        try {
          const bak = JSON.parse(sessionStorage.getItem(STORE + "-shortDraft") || "null");
          if (bak && typeof bak === "object") {
            Object.keys(bak).forEach((k) => {
              const v = String(bak[k] || "");
              if (!v.trim()) return;
              /* 本地没有、或备份更长时采用备份，避免刷新丢半截字 */
              const cur = String(st.shortDraft[k] || "");
              if (!cur.trim() || v.length > cur.length) st.shortDraft[k] = v;
            });
          }
        } catch (_) {}
        return st;
      }

      function load() {
        try {
          let raw = JSON.parse(localStorage.getItem(STORE) || "null");
          if (!raw) {
            const legacy = JSON.parse(localStorage.getItem(STORE_LEGACY) || "null");
            if (legacy) raw = legacy;
          }
          return mergeShortDraftBackup(normalizeState(raw));
        } catch (_) {
          return mergeShortDraftBackup(emptyState());
        }
      }
      function currentShortQ() {
        try {
          const list = typeof currentShortList === "function" ? currentShortList() : [];
          if (!list.length) return null;
          let i = typeof shortIdx === "number" ? shortIdx : 0;
          if (i >= list.length) i = list.length - 1;
          if (i < 0) i = 0;
          return list[i] || null;
        } catch (_) {
          return null;
        }
      }

      function flushActiveShortDraft() {
        try {
          const ta = document.getElementById("short-dictation");
          const q = currentShortQ();
          if (!ta || !q) return;
          const v = String(ta.value || "");
          if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
          /* 有字就写入；空串绝不在这里删，避免重绘/刷新误清空 */
          if (v.trim()) state.shortDraft[q.id] = v;
        } catch (_) {}
      }

      function save() {
        flushActiveShortDraft();
        if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
        state.v = 7;
        state.exportedAt = new Date().toISOString();
        try {
          const payload = JSON.stringify(state);
          localStorage.setItem(STORE, payload);
          /* 同步写一份旧键，避免半截迁移丢数据 */
          localStorage.setItem(STORE_LEGACY, payload);
          try {
            sessionStorage.setItem(STORE + "-shortDraft", JSON.stringify(state.shortDraft));
          } catch (_) {}
        } catch (_) {}
      }

      function persistShortDraft(qid, text) {
        if (!qid) return;
        if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
        const v = String(text || "");
        /* 空串不删档：只有「简答重来」才清空，防止刷新/重绘把已写内容抹掉 */
        if (!v.trim()) return;
        state.shortDraft[qid] = v;
        save();
      }

      function restartShortQuestion(qid) {
        if (!qid) return;
        delete state.shortOk[qid];
        if (!state.shortDraft || typeof state.shortDraft !== "object") state.shortDraft = {};
        delete state.shortDraft[qid];
        try {
          const ta = document.getElementById("short-dictation");
          if (ta) ta.value = "";
        } catch (_) {}
        try {
          sessionStorage.setItem(STORE + "-shortDraft", JSON.stringify(state.shortDraft));
        } catch (_) {}
        save();
      }

      function ensureMcDay(d) {
        if (!state.mcDay[d] || typeof state.mcDay[d] !== "object") state.mcDay[d] = { results: {} };
        if (!state.mcDay[d].results || typeof state.mcDay[d].results !== "object") {
          state.mcDay[d].results = {};
        }
        return state.mcDay[d];
      }
      function mcResult(d, id) {
        const day = ensureMcDay(d);
        return day.results[id] || null; /* ok | fail | null */
      }
      function setMcResult(d, id, result) {
        ensureMcDay(d).results[id] = result;
        if (result === "ok") state.mcOk[id] = 1;
      }
      function restartMcDay(d) {
        clearAdvanceTimer();
        const plan = dayPlan(d);
        ensureMcDay(d).results = {};
        (plan.mcIds || []).forEach((id) => {
          delete state.mcOk[id];
        });
        save();
        mcIdx = 0;
        picked = null;
        judged = false;
        toast("今日选择题已重来：须全部一次答对才算过关（错题本还在）");
      }

      function noteMcWrong(id) {
        state.wrongMc[id] = { streak: 0 };
      }
      function noteMcRight(id) {
        if (!state.wrongMc[id]) return { removed: false, streak: 0 };
        const streak = (state.wrongMc[id].streak || 0) + 1;
        if (streak >= WRONG_CLEAR_STREAK) {
          delete state.wrongMc[id];
          return { removed: true, streak };
        }
        state.wrongMc[id] = { streak };
        return { removed: false, streak };
      }
      function noteShortWrong(id) {
        state.wrongShort[id] = { streak: 0 };
      }
      function noteShortRight(id) {
        if (!state.wrongShort[id]) return { removed: false, streak: 0 };
        const streak = (state.wrongShort[id].streak || 0) + 1;
        if (streak >= WRONG_CLEAR_STREAK) {
          delete state.wrongShort[id];
          return { removed: true, streak };
        }
        state.wrongShort[id] = { streak };
        return { removed: false, streak };
      }
      function wrongMcCount() {
        return Object.keys(state.wrongMc || {}).length;
      }
      function wrongShortCount() {
        return Object.keys(state.wrongShort || {}).length;
      }
      function wrongMcList() {
        return Object.keys(state.wrongMc)
          .map((id) => BANK.mcById[id])
          .filter(Boolean);
      }
      function wrongShortList() {
        return Object.keys(state.wrongShort)
          .map((id) => BANK.shortById[id])
          .filter(Boolean);
      }

      let state = load();
      let date = BANK.schedule.some((s) => s.date === todayStr()) ? todayStr() : BANK.schedule[0].date;
      let tab = "mc"; /* mc | short */
      let mcIdx = 0;
      let shortIdx = 0;
      let picked = null;
      let judged = false;
      let shortRevealed = false;
      let shortWhyOpen = false;
      let advanceTimer = null;
      let holdingCorrect = false; /* 答对标绿等待自动跳 */

      function clearAdvanceTimer() {
        if (advanceTimer) {
          clearTimeout(advanceTimer);
          advanceTimer = null;
        }
        holdingCorrect = false;
      }

      function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => {
          el.hidden = true;
        }, 3800);
      }

      function bankDayPlan(d) {
        return BANK.schedule.find((s) => s.date === d) || BANK.schedule[0];
      }

      /** 选择题清单钉死不丢进度；简答可用 shortScheduleV 刷新顺序（近代史→习思想） */
      function dayPlan(d) {
        const src = bankDayPlan(d);
        const wantShortV = Number(BANK.shortScheduleV || 1);
        const pinned = state.pinnedPlans[d];
        if (
          pinned &&
          Array.isArray(pinned.mcIds) &&
          Array.isArray(pinned.shortIds) &&
          pinned.mcIds.length + pinned.shortIds.length > 0
        ) {
          if (Number(pinned.shortScheduleV || 0) < wantShortV) {
            pinned.shortIds = (src.shortIds || []).slice();
            pinned.phase = src.phase || pinned.phase;
            pinned.shortScheduleV = wantShortV;
            save();
          }
          return pinned;
        }
        const freeze = {
          date: d,
          phase: src.phase,
          mcIds: (src.mcIds || []).slice(),
          shortIds: (src.shortIds || []).slice(),
          shortScheduleV: wantShortV,
          pinnedAt: new Date().toISOString(),
        };
        state.pinnedPlans[d] = freeze;
        save();
        return freeze;
      }

      function isMcOk(id, d) {
        return mcResult(d || date, id) === "ok";
      }
      function isShortOk(id) {
        return !!state.shortOk[id];
      }

      function dayStats(d) {
        const plan = dayPlan(d);
        const shortIds = dayShortIds(d);
        const mcTotal = plan.mcIds.length;
        const shortTotal = shortIds.length;
        let mcOkN = 0;
        let mcFailN = 0;
        let mcAnswered = 0;
        let shortDone = 0;
        plan.mcIds.forEach((id) => {
          const r = mcResult(d, id);
          if (r === "ok") {
            mcOkN += 1;
            mcAnswered += 1;
          } else if (r === "fail") {
            mcFailN += 1;
            mcAnswered += 1;
          }
        });
        shortIds.forEach((id) => {
          if (isShortOk(id)) shortDone += 1;
        });
        const mcClean = mcTotal > 0 && mcFailN === 0 && mcOkN === mcTotal;
        const mcEmpty = mcTotal === 0;
        const shortOk = shortTotal === 0 || shortDone >= shortTotal;
        const total = mcTotal + shortTotal;
        const done = mcAnswered + shortDone;
        return {
          plan,
          shortIds,
          mcTotal,
          shortTotal,
          mcDone: mcOkN,
          mcFailN,
          mcAnswered,
          shortDone,
          total,
          done,
          unqualified: mcFailN > 0,
          mcClean: mcEmpty || mcClean,
          ok: total > 0 && (mcEmpty || mcClean) && shortOk,
        };
      }

      function weekdayLabel(iso) {
        const dt = new Date(iso + "T12:00:00");
        return "日一二三四五六"[dt.getDay()];
      }
      function shortDate(iso) {
        const [, m, d] = iso.split("-");
        return Number(m) + "/" + Number(d);
      }

      function currentMcList() {
        return dayPlan(date).mcIds.map((id) => BANK.mcById[id]).filter(Boolean);
      }
      function shortOrderMode() {
        return state.shortOrderMode === "chapter" ? "chapter" : "plan";
      }
      function sortShortsByChapter(list) {
        const courseRank = { history: 0, xi: 1 };
        return list.slice().sort((a, b) => {
          const ca = courseRank[a.course] != null ? courseRank[a.course] : 9;
          const cb = courseRank[b.course] != null ? courseRank[b.course] : 9;
          if (ca !== cb) return ca - cb;
          const cha = Number(a.ch) || 0;
          const chb = Number(b.ch) || 0;
          if (cha !== chb) return cha - chb;
          const ia = Number(a.i) || 0;
          const ib = Number(b.i) || 0;
          if (ia !== ib) return ia - ib;
          return String(a.id).localeCompare(String(b.id));
        });
      }
      /** 计划日派题（排期模式） */
      function planShortList(d) {
        return dayPlan(d).shortIds.map((id) => BANK.shortById[id]).filter(Boolean);
      }
      /**
       * 按章模式：全书按章排好后，按每日原题量切开铺到各天（一天仍约 7～8 题）
       * 近代史日摊近代史，习思想日摊习思想
       */
      function chapterShortList(d) {
        const planList = planShortList(d);
        if (!planList.length) return [];
        const courses = Array.from(new Set(planList.map((q) => q.course).filter(Boolean)));
        if (courses.length !== 1 || !BANK.shortById) return sortShortsByChapter(planList);
        const course = courses[0];
        const allSorted = sortShortsByChapter(
          Object.keys(BANK.shortById)
            .map((id) => BANK.shortById[id])
            .filter((q) => q && q.course === course)
        );
        const peerDays = (BANK.schedule || []).filter((s) => {
          const list = planShortList(s.date);
          if (!list.length) return false;
          return list.every((q) => q.course === course);
        });
        let offset = 0;
        for (let i = 0; i < peerDays.length; i++) {
          const n = planShortList(peerDays[i].date).length;
          if (peerDays[i].date === d) {
            return allSorted.slice(offset, offset + n);
          }
          offset += n;
        }
        return sortShortsByChapter(planList);
      }
      function dayShortList(d) {
        return shortOrderMode() === "chapter" ? chapterShortList(d) : planShortList(d);
      }
      function dayShortIds(d) {
        return dayShortList(d).map((q) => q.id);
      }
      function currentShortList() {
        return dayShortList(date);
      }
      function setShortOrderMode(mode) {
        const next = mode === "chapter" ? "chapter" : "plan";
        if (shortOrderMode() === next) return;

        const curId = (currentShortList()[shortIdx] || {}).id;
        state.shortOrderMode = next;
        save();
        const list = currentShortList();

        if (ni < 0) ni = nextUnansweredShort();
        shortIdx = ni;

        shortWhyOpen = false;
        toast(next === "chapter" ? "按章：摊到每日题量" : "排期：今日派题");
        render();
      }

      function extractPointKeys(point) {
        const raw = String(point || "");
        const keys = [];
        SHORT_KEY_BANK.forEach((k) => {
          if (raw.indexOf(k) >= 0) keys.push(k);
        });
        const quoted = raw.match(/[「『]([^」』]+)[」』]/g) || [];
        quoted.forEach((m) => {
          const inner = m.replace(/^[「『]/, "").replace(/[」』]$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        const books = raw.match(/《([^》]+)》/g) || [];
        books.forEach((m) => {
          const inner = m.replace(/^《/, "").replace(/》$/, "");
          if (inner.length >= 2) keys.push(inner);
        });
        /* 每句若还没有命中词，从分句抽短语补标/补判 */
        raw.split(/[，。；、]/).forEach((seg) => {
          const s0 = seg.replace(/\s+/g, "").trim();
          if (s0.length < 3) return;
          if (keys.some((k) => s0.indexOf(k) >= 0)) return;
          let s = s0.replace(/^(企图|必须|坚持|强调|提出|建立|实行|进行|推动|实现|促进|维护|加强|完善|健全)/, "");
          if (s.length >= 3 && s.length <= 16) keys.push(s.slice(0, 12));
          else if (s0.length >= 4 && s0.length <= 14) keys.push(s0.slice(0, 10));
        });
        return Array.from(new Set(keys));
      }

      /** 黄标与判分共用 extractPointKeys，长词优先、互不重叠 */
      function highlightKeys(s) {
        const raw = String(s || "");
        const keys = extractPointKeys(raw)
          .filter((k) => k && k.length >= 2)
          .sort((a, b) => b.length - a.length || a.localeCompare(b));
        const ranges = [];
        keys.forEach((k) => {
          let from = 0;
          while (from < raw.length) {
            const j = raw.indexOf(k, from);
            if (j < 0) break;
            const end = j + k.length;
            const overlap = ranges.some((r) => !(end <= r[0] || j >= r[1]));
            if (!overlap) ranges.push([j, end]);
            from = j + 1;
          }
        });
        ranges.sort((a, b) => a[0] - b[0]);
        let out = "";
        let pos = 0;
        ranges.forEach(([a, b]) => {
          if (a < pos) return;
          out += escapeHtml(raw.slice(pos, a));
          out += '<mark class="key">' + escapeHtml(raw.slice(a, b)) + "</mark>";
          pos = b;
        });
        out += escapeHtml(raw.slice(pos));
        return out;
      }

      function normAns(s) {
        return String(s || "")
          .replace(/\s+/g, "")
          .replace(/[，。；、,.!！？?：:（）()\[\]【】"'“”‘’]/g, "")
          .toLowerCase();

      function gradeShortDictation(text, q) {
        const ans = normAns(text);
        const points = q.points || [];
        const detail = [];
        let hitPoints = 0;
        points.forEach((p, i) => {
          const keys = extractPointKeys(p);
          const hit = keys.filter((k) => ans.indexOf(normAns(k)) >= 0);
          const need = keys.length <= 2 ? 1 : Math.max(1, Math.ceil(keys.length * 0.4));
          const pointOk = keys.length ? hit.length >= need : ans.length >= 12;
          if (pointOk) hitPoints += 1;
          detail.push({ i, keys, hit, pointOk, need });
        });
        const needPoints = Math.max(1, Math.ceil(points.length * (2 / 3)));
        return {
          pass: points.length > 0 && hitPoints >= needPoints,
          hitPoints,
          needPoints,
          totalPoints: points.length,
          detail,
        };
      }

                : "简答过关（算背过）")
        );
        /* 不跳下一题：留下来对照自己写的内容 */
        shortRevealed = true;
        render();
      }

      function showShortGrade(box, q, text, resultEl) {
        const grade = gradeShortDictation(text, q);
        shortRevealed = true;
        fillShortCompare(box, q, grade.detail);
        if (resultEl) {
          resultEl.hidden = false;
          if (grade.pass) {
            resultEl.className = "dictation-result pass";
            resultEl.textContent =
              "过关 " + grade.hitPoints + "/" + grade.totalPoints + "（需≥" + grade.needPoints + "）";
          } else {
            resultEl.className = "dictation-result fail";
            resultEl.textContent =
              "未过 " + grade.hitPoints + "/" + grade.totalPoints + "（需≥" + grade.needPoints + "）";
          }
        }
        return grade;
      }

      function renderShort() {
        const list = currentShortList();
        if (!list.length) {
          $("work").innerHTML = "<p class='hint'>这一天没有简答题。</p>";
          return;
        }
        if (shortIdx >= list.length) shortIdx = list.length - 1;
        if (shortIdx < 0) shortIdx = 0;
        const q = list[shortIdx];
        const done = isShortOk(q.id);
        const draft = (state.shortDraft && state.shortDraft[q.id]) || "";
        const box = document.createElement("div");
        box.className = "q-card";
        const order = shortOrderMode();
        box.innerHTML =
          '<div class="order-toggle">' +
          "<span>排序</span>" +
          '<button type="button" id="btn-order-plan"' +
          (order === "plan" ? ' class="on"' : "") +
          ">排期</button>" +
          '<button type="button" id="btn-order-ch"' +
          (order === "chapter" ? ' class="on"' : "") +
          ">按章</button>" +
          "</div>" +
          '<div class="q-meta">' +
          courseName[q.course] +
          " · 第" +
          q.ch +
          "章 · " +
          (shortIdx + 1) +
          "/" +
          list.length +
          (done ? " · 已过" : "") +
          "</div>" +
          '<div class="q-text"></div>' +
          '<div id="short-compare" class="short-answer-block" hidden>' +
          '<details class="short-why-banner" id="short-why">' +
          "<summary>背景</summary>" +
          '<div class="short-why-body" id="short-why-body"></div>' +
          "</details>" +
          '<div class="short-pane official"><h4>采分点</h4><ol id="points-official"></ol></div>' +
          "</div>" +
          '<div class="dictation" id="dictation-box">' +
          "<label>默写</label>" +
          '<textarea id="short-dictation" placeholder="关键词即可…"></textarea>' +
          '<div class="dictation-result" id="dictation-result" hidden></div>' +
          "</div>" +
          '<div class="nav-btns">' +
          '<button type="button" class="primary" id="btn-dictation-submit"' +
          (done ? " disabled" : "") +
          ">提交</button>" +
          '<button type="button" class="ghost" id="btn-peek-ans">答案</button>' +
          '<button type="button" class="ghost" id="btn-fail">不会</button>' +
          '<button type="button" class="ghost" id="btn-prev-s">上题</button>' +
          '<button type="button" class="ghost" id="btn-next-s">下题</button>' +
          '<button type="button" class="ghost" id="btn-jump-s">未过</button>' +
          '<button type="button" class="danger" id="btn-restart-short">重来</button>' +
          "</div>";
        box.querySelector(".q-text").textContent = q.text;
        fillShortCompare(box, q, null);
        $("work").innerHTML = "";
        $("work").appendChild(box);

        $("btn-order-plan").addEventListener("click", () => setShortOrderMode("plan"));
        $("btn-order-ch").addEventListener("click", () => setShortOrderMode("chapter"));

        const ta = box.querySelector("#short-dictation");
        const resultEl = box.querySelector("#dictation-result");
        if (ta) ta.value = draft;
        if (shortRevealed && draft) {
          showShortGrade(box, q, draft, resultEl);
        } else if (shortRevealed) {
          fillShortCompare(box, q, null);
        } else {
          syncPeekAnsBtn(box);
        }

        if (ta) {
          ta.addEventListener("input", () => persistShortDraft(q.id, ta.value));
        }

        $("btn-dictation-submit").addEventListener("click", () => {
          if (done) return;
          const text = (ta && ta.value) || "";
          if (!normAns(text) || normAns(text).length < 6) {
            toast("先写再提交");
            return;
          }
          persistShortDraft(q.id, text);
          const grade = showShortGrade(box, q, text, resultEl);
          syncPeekAnsBtn(box);
          if (grade.pass) {
            passShortQuestion(q, "过关 · 留下对照");
          } else {
            toast("未过 · 对照黄标再默");
          }
        });
        $("btn-peek-ans").addEventListener("click", () => {
          if (ta) persistShortDraft(q.id, ta.value);
          shortRevealed = !shortRevealed;
          if (shortRevealed) {
            const text = (ta && ta.value) || draft;
            if (text && normAns(text).length >= 6) {
              showShortGrade(box, q, text, resultEl);
            } else {
              fillShortCompare(box, q, null);
              if (resultEl) resultEl.hidden = true;
            }
            toast(done ? "已展开" : "已展开 · 偷看不算过关");
          } else {
            fillShortCompare(box, q, null);
            if (resultEl) resultEl.hidden = true;
            toast("已收起");
          }
          syncPeekAnsBtn(box);
        });
        $("btn-fail").addEventListener("click", () => {
          if (ta) persistShortDraft(q.id, ta.value);
          delete state.shortOk[q.id];
          noteShortWrong(q.id);
          save();
          shortRevealed = false;
          shortWhyOpen = false;
          toast("已进错题本");
          render();
        });
        $("btn-prev-s").addEventListener("click", () => {
          if (ta) persistShortDraft(q.id, ta.value);
          shortIdx = Math.max(0, shortIdx - 1);
          shortRevealed = false;
          shortWhyOpen = false;
          render();
        });
        $("btn-next-s").addEventListener("click", () => {
          if (ta) persistShortDraft(q.id, ta.value);
          shortIdx = Math.min(list.length - 1, shortIdx + 1);
          shortRevealed = false;
          shortWhyOpen = false;
          render();
        });
        $("btn-jump-s").addEventListener("click", () => {
          if (ta) persistShortDraft(q.id, ta.value);
          shortIdx = nextUnansweredShort();
          shortRevealed = false;
          shortWhyOpen = false;
          render();
        });
        $("btn-restart-short").addEventListener("click", () => {
          if (!confirm("重来本题？清默写并取消过关。")) return;
          restartShortQuestion(q.id);
          shortRevealed = false;
          shortWhyOpen = false;
          toast("已重来");
          render();
        });
      }

      function render() {
        const st = dayStats(date);
        $("day-label").textContent = date + "（周" + weekdayLabel(date) + "）";
        $("phase").textContent = st.plan.phase;
        if (st.ok) {
          $("pill").textContent = "已过关";
          $("pill").className = "pill ok";
        } else if (st.unqualified) {
          $("pill").textContent = "今日不合格";
          $("pill").className = "pill bad";
        } else if (st.mcTotal > 0 && st.mcClean) {
          $("pill").textContent = "选择题过关";
          $("pill").className = "pill mc";
        } else {
          $("pill").textContent = "未过关";
          $("pill").className = "pill";
        }
        const pct = st.total ? Math.round((st.done / st.total) * 100) : 0;
        $("bar").style.width = pct + "%";
        const wc = wrongMcCount() + wrongShortCount();
        $("prog-text").textContent =
          "选择 " +
          st.mcDone +
          "/" +
          st.mcTotal +
          (st.mcFailN ? " 错" + st.mcFailN : "") +
          (st.mcTotal > 0 && st.mcClean && !st.ok ? " 过关" : "") +
          " · 简答 " +
          st.shortDone +
          "/" +
          st.shortTotal +
          " · 合计 " +
          st.done +
          "/" +
          st.total +
          " · 错题 " +
          wc +
          (st.unqualified ? " · 不合格" : "");
        $("tab-mc").classList.toggle("on", tab === "mc");
        $("tab-short").classList.toggle("on", tab === "short");
        $("tab-mc").textContent =
          "选择 " +
          st.mcDone +
          "/" +
          st.mcTotal +
          (st.mcFailN ? " 错" + st.mcFailN : st.mcTotal > 0 && st.mcClean ? " 过关" : "");
        $("tab-short").textContent = "简答 " + st.shortDone + "/" + st.shortTotal;
        const wrongBtn = $("btn-wrong-page");
        if (wrongBtn) wrongBtn.textContent = wc ? "错题 " + wc : "错题";
        renderNav();
        renderLock();
        if (tab === "mc") renderMc();
        else renderShort();
      }

      $("tab-mc").addEventListener("click", () => {
        tab = "mc";
        picked = null;
        judged = false;
        render();
      });
      $("tab-short").addEventListener("click", () => {
        tab = "short";
        shortRevealed = false;
        shortWhyOpen = false;
        render();
      });
      $("btn-today").addEventListener("click", () => {
        date = BANK.schedule.some((s) => s.date === todayStr()) ? todayStr() : BANK.schedule[0].date;
        mcIdx = nextUnansweredMc();
        shortIdx = nextUnansweredShort();
        picked = null;
        judged = false;
        shortRevealed = false;
        shortWhyOpen = false;
        render();
      });

      function download(filename, text) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1200);
      }

      $("btn-export").addEventListener("click", () => {
        const payload = {
          v: 7,
          type: "fuxi-zuoye-forced-progress",
          exportedAt: new Date().toISOString(),
          mcOk: state.mcOk,
          shortOk: state.shortOk,
          shortDraft: state.shortDraft || {},
          mcDay: state.mcDay,
          wrongMc: state.wrongMc,
          wrongShort: state.wrongShort,
          pinnedPlans: state.pinnedPlans,
          shortOrderMode: shortOrderMode(),
        };
        download("fuxi-zuoye-progress-" + todayStr() + ".json", JSON.stringify(payload));
        toast("已下载进度，手机/电脑互导用这个");
      });
      $("btn-import").addEventListener("click", () => $("import-file").click());
      $("import-file").addEventListener("change", () => {
        const file = $("import-file").files && $("import-file").files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const payload = JSON.parse(String(reader.result || ""));
            if (
              !payload ||
              (payload.v !== 3 &&
                payload.v !== 4 &&
                payload.v !== 5 &&
                payload.v !== 6 &&
                payload.v !== 7 &&
                payload.type !== "fuxi-zuoye-forced-progress")
            ) {
              throw new Error("bad");
            }
            const incoming = normalizeState(payload);
            state.mcOk = Object.assign({}, state.mcOk, incoming.mcOk);
            state.shortOk = Object.assign({}, state.shortOk, incoming.shortOk);
            state.shortDraft = Object.assign({}, state.shortDraft || {}, incoming.shortDraft || {});
            Object.keys(incoming.mcDay || {}).forEach((d) => {
              if (!state.mcDay[d]) state.mcDay[d] = { results: {} };
              if (!state.mcDay[d].results) state.mcDay[d].results = {};
              Object.assign(state.mcDay[d].results, (incoming.mcDay[d] && incoming.mcDay[d].results) || {});
            });
            Object.keys(incoming.wrongMc || {}).forEach((id) => {
              const cur = state.wrongMc[id];
              const inc = incoming.wrongMc[id];
              if (!cur) state.wrongMc[id] = inc;
              else state.wrongMc[id] = { streak: Math.min(cur.streak || 0, inc.streak || 0) };
            });
            Object.keys(incoming.wrongShort || {}).forEach((id) => {
              const cur = state.wrongShort[id];
              const inc = incoming.wrongShort[id];
              if (!cur) state.wrongShort[id] = inc;
              else state.wrongShort[id] = { streak: Math.min(cur.streak || 0, inc.streak || 0) };
            });
            Object.keys(incoming.pinnedPlans || {}).forEach((d) => {
              if (!state.pinnedPlans[d]) state.pinnedPlans[d] = incoming.pinnedPlans[d];
            });
            if (incoming.shortOrderMode === "chapter" || incoming.shortOrderMode === "plan") {
              state.shortOrderMode = incoming.shortOrderMode;
            }
            save();
            mcIdx = nextUnansweredMc();
            shortIdx = nextUnansweredShort();
            render();
            toast("进度已合并导入（含错题本；不覆盖已钉死的日期清单）");
          } catch (_) {
            toast("导入失败：请用本页导出的进度 json");
          }
          $("import-file").value = "";
        };
        reader.readAsText(file);
      });

      $("btn-teacher").addEventListener("click", async () => {
        const st = dayStats(date);
        const lines = [
          "【请老师看·强制作业】" + date + (st.ok ? " · 已过关" : " · 未过关"),
          "选择 " + st.mcDone + "/" + st.mcTotal + " · 简答 " + st.shortDone + "/" + st.shortTotal,
          "阶段：" + st.plan.phase,
        ];
        const mcLeft = st.plan.mcIds.filter((id) => !isMcOk(id)).slice(0, 5);
        const sLeft = (st.shortIds || st.plan.shortIds).filter((id) => !isShortOk(id)).slice(0, 5);
        if (mcLeft.length) {
          lines.push("未过关选择举例：");
          mcLeft.forEach((id) => {
            const q = BANK.mcById[id];
            if (q) lines.push("- [" + courseName[q.course] + "第" + q.ch + "章] " + q.text.slice(0, 40));
          });
        }
        if (sLeft.length) {
          lines.push("未过关简答举例：");
          sLeft.forEach((id) => {
            const q = BANK.shortById[id];
            if (q) lines.push("- [" + courseName[q.course] + "第" + q.ch + "章] " + q.text.slice(0, 40));
          });
        }
        const text = lines.join("\n");
        let ok = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            ok = true;
          }
        } catch (_) {}
        if (!ok) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try {
            ok = document.execCommand("copy");
          } catch (_) {}
          ta.remove();
        }
        toast(ok ? "状态已复制，发给老师" : "复制失败，请手动发");
      });

      /* 刷新/关页/切后台前强制把当前默写框写入 localStorage，避免丢字 */
      function hardSaveShortDraft() {
        flushActiveShortDraft();
        save();
      }
      window.addEventListener("pagehide", hardSaveShortDraft);
      window.addEventListener("beforeunload", hardSaveShortDraft);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") hardSaveShortDraft();
      });

      mcIdx = nextUnansweredMc();
      shortIdx = nextUnansweredShort();
      render();
    })();
  </script>
</body>
</html>
