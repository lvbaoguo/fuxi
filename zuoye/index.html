<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>每日学习计划 · 过及格线</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffdf8;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e4ddd2;
      --blue: #1d4ed8;
      --green: #166534;
      --red: #b91c1c;
      --amber: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, #fde68a55, transparent),
        radial-gradient(700px 360px at 100% 0%, #bfdbfe55, transparent),
        var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 16px 14px 72px; }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 14px; font-size: 0.92rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(28,25,23,0.05);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .grow { flex: 1 1 auto; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--muted); }
    input, select, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }
    textarea { width: 100%; min-height: 72px; resize: vertical; }
    button {
      cursor: pointer;
      font-weight: 700;
      border-color: #d6d3d1;
    }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.good { background: var(--green); color: #fff; border-color: var(--green); }
    button.ghost { background: #fff; }
    button.danger { color: var(--red); border-color: #fecaca; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #fee2e2;
      color: var(--red);
    }
    .pill.ok { background: #dcfce7; color: var(--green); }
    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      margin: 8px 0;
    }
    .item.done { background: #f0fdf4; }
    .item-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: start;
    }
    .item h3 { margin: 0; font-size: 0.98rem; }
    .item .meta { color: var(--muted); font-size: 0.82rem; }
    .bank-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.82rem;
    }
    .bank-grid table { width: 100%; border-collapse: collapse; }
    .bank-grid th, .bank-grid td {
      border-bottom: 1px solid var(--line);
      padding: 4px 2px;
      text-align: left;
    }
    .bank-grid th { color: var(--muted); font-weight: 600; }
    .toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: #1c1917; color: #fff; padding: 10px 14px; border-radius: 8px;
      max-width: min(520px, calc(100% - 24px)); z-index: 20; font-size: 0.9rem;
    }
    .toast[hidden] { display: none !important; }
    .lock {
      padding: 12px 14px; border-radius: 12px; background: #7f1d1d; color: #fff7ed;
      font-weight: 700; margin-bottom: 12px;
    }
    .lock.ok { background: var(--green); color: #ecfdf5; }
    .lock small { display: block; font-weight: 500; opacity: 0.92; margin-top: 4px; }
    details.bank summary { cursor: pointer; font-weight: 700; }
    .hint { color: var(--muted); font-size: 0.85rem; }
    a { color: var(--blue); }
    @media (max-width: 700px) {
      .bank-grid { grid-template-columns: 1fr; }
      .item-head { grid-template-columns: auto 1fr; }
      .item-head .actions { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>每日学习计划 · 自填 + 题库对照</h1>
    <p class="sub">考试 10/24–25 · 10/23 前两门冲 ≥60（去年 53 / 54）。选择题按「从哪章到哪章刷到 100%」自填；简答自定背多少。进度在本机，支持导出/导入（手机↔电脑）。</p>

    <div id="lock" class="lock">今天的计划还没勾完 · 先别娱乐</div>

    <div class="card row">
      <label class="field">日期
        <input type="date" id="plan-date">
      </label>
      <button type="button" class="ghost" id="btn-today">今天</button>
      <span class="grow"></span>
      <button type="button" class="ghost" id="btn-export">导出</button>
      <button type="button" class="ghost" id="btn-import">导入</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button type="button" class="primary" id="btn-teacher">请老师看（复制状态）</button>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px;">
        <strong id="day-title">今日计划</strong>
        <span id="day-pill" class="pill">未完成</span>
      </div>
      <p class="hint" id="day-hint">先加「选择题重刷」和「简答背诵」条目，做完勾选。题量会按实际题库自动算出来。</p>

      <h3 style="margin:12px 0 6px;font-size:1rem;">选择题重刷（刷到 100%）</h3>
      <div id="mc-list"></div>
      <div class="row" style="margin-top:8px;">
        <label class="field">科目
          <select id="mc-course">
            <option value="history">近代史</option>
            <option value="xi">习思想</option>
          </select>
        </label>
        <label class="field">从章
          <input type="number" id="mc-from" min="1" max="18" value="1" style="width:72px">
        </label>
        <label class="field">到章
          <input type="number" id="mc-to" min="1" max="18" value="3" style="width:72px">
        </label>
        <button type="button" class="primary" id="btn-add-mc">加入今日</button>
      </div>

      <h3 style="margin:16px 0 6px;font-size:1rem;">简答背诵（自己定量）</h3>
      <div id="short-list"></div>
      <div class="row" style="margin-top:8px;">
        <label class="field">科目
          <select id="short-course">
            <option value="history">近代史</option>
            <option value="xi" selected>习思想</option>
          </select>
        </label>
        <label class="field">从章
          <input type="number" id="short-from" min="1" max="18" value="1" style="width:72px">
        </label>
        <label class="field">到章
          <input type="number" id="short-to" min="1" max="18" value="2" style="width:72px">
        </label>
        <label class="field">今天背几道（可改）
          <input type="number" id="short-count" min="1" max="80" value="6" style="width:88px">
        </label>
        <button type="button" class="primary" id="btn-add-short">加入今日</button>
      </div>
      <p class="hint" id="short-range-hint" style="margin-top:6px;"></p>

      <h3 style="margin:16px 0 6px;font-size:1rem;">今日备注</h3>
      <textarea id="day-note" placeholder="比如：晚上 9 点前写完；第 7 章选择还虚……"></textarea>

      <div class="row" style="margin-top:10px;">
        <label class="row" style="gap:6px;font-size:0.92rem;">
          <input type="checkbox" id="day-done"> 今天计划全部完成（娱乐通行证）
        </label>
      </div>
    </div>

    <div class="card">
      <strong>练题入口</strong>
      <p class="hint" style="margin:6px 0 0;">
        <a id="link-local" href="../index.html">本地 fuxi</a> ·
        <a href="https://lvbaoguo.github.io/fuxi/" target="_blank" rel="noopener">线上刷题</a>
        · 选择题进对应章节刷到全对；简答切「简答题」默采分点。
      </p>
    </div>

    <details class="card bank" open>
      <summary>实际题库一览（选章时对照）</summary>
      <div class="bank-grid" style="margin-top:10px;">
        <div>
          <strong>近代史</strong>
          <div class="hint" id="hist-sum"></div>
          <table id="hist-table"></table>
        </div>
        <div>
          <strong>习思想</strong>
          <div class="hint" id="xi-sum"></div>
          <table id="xi-table"></table>
        </div>
      </div>
    </details>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="data.js"></script>
  <script>
    (function () {
      const BANK = window.ZUOYE_BANK;
      if (!BANK) {
        document.body.innerHTML = "<p style='padding:24px'>缺少 data.js</p>";
        return;
      }
      const STORE = "pansan2-zuoye-daily-v2";
      const courseName = { history: "近代史", xi: "习思想" };
      const maxCh = { history: 10, xi: 18 };

      function todayStr() {
        const n = new Date();
        return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
      }
      function uid() {
        return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      }
      function load() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORE) || "{}");
          if (!raw || raw.v !== 2) return { v: 2, days: {}, exportedAt: null };
          if (!raw.days) raw.days = {};
          return raw;
        } catch (_) {
          return { v: 2, days: {}, exportedAt: null };
        }
      }
      function save() {
        state.exportedAt = new Date().toISOString();
        try {
          localStorage.setItem(STORE, JSON.stringify(state));
        } catch (_) {}
      }

      let state = load();
      let date = todayStr();

      const $ = (id) => document.getElementById(id);
      function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toast._t);
        toast._t = setTimeout(() => {
          el.hidden = true;
        }, 4200);
      }

      function ensureDay(d) {
        if (!state.days[d]) {
          state.days[d] = { mc: [], short: [], note: "", done: false };
        }
        const day = state.days[d];
        if (!Array.isArray(day.mc)) day.mc = [];
        if (!Array.isArray(day.short)) day.short = [];
        if (typeof day.note !== "string") day.note = "";
        if (typeof day.done !== "boolean") day.done = false;
        return day;
      }

      function clampRange(course, from, to) {
        const max = maxCh[course];
        let a = Math.max(1, Math.min(max, Number(from) || 1));
        let b = Math.max(1, Math.min(max, Number(to) || a));
        if (b < a) {
          const t = a;
          a = b;
          b = t;
        }
        return [a, b];
      }

      function sumMc(course, from, to) {
        const [a, b] = clampRange(course, from, to);
        let n = 0;
        for (let ch = a; ch <= b; ch++) {
          n += (BANK.bank[course].chapters[String(ch)] || {}).mc || 0;
        }
        return { from: a, to: b, count: n };
      }

      function sumShort(course, from, to) {
        const [a, b] = clampRange(course, from, to);
        let n = 0;
        const titles = [];
        for (let ch = a; ch <= b; ch++) {
          const info = BANK.bank[course].chapters[String(ch)] || {};
          n += info.short || 0;
          titles.push("第" + ch + "章" + (info.short || 0) + "道");
        }
        return { from: a, to: b, available: n, titles: titles.join("、") };
      }

      function dayFinished(day) {
        if (day.done) return true;
        if (!day.mc.length && !day.short.length) return false;
        const mcOk = day.mc.every((x) => x.done);
        const shortOk = day.short.every((x) => x.done);
        return mcOk && shortOk;
      }

      function renderBank() {
        $("hist-sum").textContent =
          "选择 " + BANK.bank.history.mcTotal + " · 简答 " + BANK.bank.history.shortTotal;
        $("xi-sum").textContent =
          "选择 " + BANK.bank.xi.mcTotal + " · 简答 " + BANK.bank.xi.shortTotal;
        function fill(tableId, course) {
          const tb = $(tableId);
          tb.innerHTML =
            "<thead><tr><th>章</th><th>选择</th><th>简答</th><th>名称</th></tr></thead><tbody></tbody>";
          const body = tb.querySelector("tbody");
          Object.keys(BANK.bank[course].chapters)
            .map(Number)
            .sort((a, b) => a - b)
            .forEach((ch) => {
              const info = BANK.bank[course].chapters[String(ch)];
              const tr = document.createElement("tr");
              tr.innerHTML =
                "<td>" +
                ch +
                "</td><td>" +
                info.mc +
                "</td><td>" +
                info.short +
                "</td><td>" +
                info.name +
                "</td>";
              body.appendChild(tr);
            });
        }
        fill("hist-table", "history");
        fill("xi-table", "xi");
      }

      function renderLock() {
        const day = ensureDay(todayStr());
        const ok = dayFinished(day);
        const lock = $("lock");
        if (ok) {
          lock.className = "lock ok";
          lock.innerHTML = "今日计划已勾完 · 娱乐通行证开了<small>状态可点「请老师看」发给我跟进</small>";
        } else {
          lock.className = "lock";
          const n = day.mc.length + day.short.length;
          lock.innerHTML =
            (n
              ? "今天还有未勾完的条目 · 先别娱乐"
              : "今天还没填计划 · 先加选择题区间和简答量") +
            "<small>选择题要刷到 100%；简答按你填的道数背完再勾</small>";
        }
      }

      function renderLists() {
        const day = ensureDay(date);
        $("plan-date").value = date;
        $("day-title").textContent = date + " 的计划";
        $("day-note").value = day.note || "";
        $("day-done").checked = !!day.done;
        const ok = dayFinished(day);
        const pill = $("day-pill");
        pill.textContent = ok ? "已完成" : "未完成";
        pill.className = "pill" + (ok ? " ok" : "");

        const mcBox = $("mc-list");
        mcBox.innerHTML = "";
        if (!day.mc.length) {
          mcBox.innerHTML = '<p class="hint">还没有选择题任务。例：习思想 7–9 章刷到全对。</p>';
        }
        day.mc.forEach((item) => {
          const info = sumMc(item.course, item.from, item.to);
          const div = document.createElement("div");
          div.className = "item" + (item.done ? " done" : "");
          div.innerHTML =
            '<div class="item-head">' +
            '<input type="checkbox" data-kind="mc" data-id="' +
            item.id +
            '"' +
            (item.done ? " checked" : "") +
            ">" +
            "<div><h3>" +
            courseName[item.course] +
            " 第" +
            info.from +
            "–" +
            info.to +
            " 章 · 刷到 100%</h3>" +
            '<div class="meta">题库合计 <b>' +
            info.count +
            "</b> 道选择 · 在 fuxi 对应章节做到全对再勾</div>" +
            '<input data-note-mc="' +
            item.id +
            '" placeholder="备注（可选）" value="' +
            (item.note || "").replace(/"/g, "&quot;") +
            '" style="margin-top:6px;width:100%">' +
            '</div><div class="actions"><button type="button" class="danger" data-del-mc="' +
            item.id +
            '">删</button></div></div>';
          mcBox.appendChild(div);
        });

        const shBox = $("short-list");
        shBox.innerHTML = "";
        if (!day.short.length) {
          shBox.innerHTML = '<p class="hint">还没有简答任务。例：习思想 1–2 章，今天背 6 道。</p>';
        }
        day.short.forEach((item) => {
          const info = sumShort(item.course, item.from, item.to);
          const div = document.createElement("div");
          div.className = "item" + (item.done ? " done" : "");
          div.innerHTML =
            '<div class="item-head">' +
            '<input type="checkbox" data-kind="short" data-id="' +
            item.id +
            '"' +
            (item.done ? " checked" : "") +
            ">" +
            "<div><h3>" +
            courseName[item.course] +
            " 第" +
            info.from +
            "–" +
            info.to +
            " 章简答 · 背 " +
            item.target +
            " 道</h3>" +
            '<div class="meta">该区间题库共 ' +
            info.available +
            " 道（" +
            info.titles +
            "）</div>" +
            '<div class="row" style="margin-top:6px;"><label class="field">已背<input type="number" min="0" max="80" data-done-count="' +
            item.id +
            '" value="' +
            (item.doneCount || 0) +
            '" style="width:72px"></label>' +
            '<input data-note-short="' +
            item.id +
            '" class="grow" placeholder="备注（可选）" value="' +
            (item.note || "").replace(/"/g, "&quot;") +
            '"></div>' +
            '</div><div class="actions"><button type="button" class="danger" data-del-short="' +
            item.id +
            '">删</button></div></div>';
          shBox.appendChild(div);
        });

        updateShortHint();
        renderLock();
      }

      function updateShortHint() {
        const course = $("short-course").value;
        const info = sumShort(course, $("short-from").value, $("short-to").value);
        $("short-range-hint").textContent =
          courseName[course] +
          " 第" +
          info.from +
          "–" +
          info.to +
          " 章题库共 " +
          info.available +
          " 道简答。今天背几道可自己改。";
        const max = maxCh[course];
        $("short-from").max = max;
        $("short-to").max = max;
        $("mc-from").max = maxCh[$("mc-course").value];
        $("mc-to").max = maxCh[$("mc-course").value];
      }

      function render() {
        renderLists();
      }

      $("btn-today").addEventListener("click", () => {
        date = todayStr();
        render();
      });
      $("plan-date").addEventListener("change", () => {
        date = $("plan-date").value || todayStr();
        render();
      });
      $("day-note").addEventListener("input", () => {
        ensureDay(date).note = $("day-note").value;
        save();
      });
      $("day-done").addEventListener("change", () => {
        ensureDay(date).done = $("day-done").checked;
        save();
        render();
      });

      ["mc-course", "short-course", "short-from", "short-to"].forEach((id) => {
        $(id).addEventListener("change", updateShortHint);
        $(id).addEventListener("input", updateShortHint);
      });
      $("mc-course").addEventListener("change", () => {
        const max = maxCh[$("mc-course").value];
        $("mc-from").max = max;
        $("mc-to").max = max;
        if (Number($("mc-to").value) > max) $("mc-to").value = max;
        if (Number($("mc-from").value) > max) $("mc-from").value = max;
      });

      $("btn-add-mc").addEventListener("click", () => {
        const course = $("mc-course").value;
        const info = sumMc(course, $("mc-from").value, $("mc-to").value);
        if (!info.count) {
          toast("这个区间没有选择题");
          return;
        }
        ensureDay(date).mc.push({
          id: uid(),
          course,
          from: info.from,
          to: info.to,
          count: info.count,
          done: false,
          note: "",
        });
        save();
        render();
        toast("已加入：刷 " + info.count + " 道选择到 100%");
      });

      $("btn-add-short").addEventListener("click", () => {
        const course = $("short-course").value;
        const info = sumShort(course, $("short-from").value, $("short-to").value);
        let target = Math.max(1, Number($("short-count").value) || 1);
        if (info.available > 0) target = Math.min(target, info.available);
        if (!info.available) {
          toast("这个区间没有简答题");
          return;
        }
        ensureDay(date).short.push({
          id: uid(),
          course,
          from: info.from,
          to: info.to,
          available: info.available,
          target,
          doneCount: 0,
          done: false,
          note: "",
        });
        save();
        render();
        toast("已加入：背 " + target + " 道简答");
      });

      document.addEventListener("change", (e) => {
        const t = e.target;
        const day = ensureDay(date);
        if (t.matches('input[data-kind="mc"]')) {
          const item = day.mc.find((x) => x.id === t.getAttribute("data-id"));
          if (item) item.done = t.checked;
          save();
          render();
        }
        if (t.matches('input[data-kind="short"]')) {
          const item = day.short.find((x) => x.id === t.getAttribute("data-id"));
          if (item) {
            item.done = t.checked;
            if (t.checked && !item.doneCount) item.doneCount = item.target;
          }
          save();
          render();
        }
        if (t.matches("input[data-done-count]")) {
          const item = day.short.find((x) => x.id === t.getAttribute("data-done-count"));
          if (item) {
            item.doneCount = Math.max(0, Number(t.value) || 0);
            if (item.doneCount >= item.target) item.done = true;
          }
          save();
          render();
        }
      });

      document.addEventListener("input", (e) => {
        const t = e.target;
        const day = ensureDay(date);
        if (t.matches("input[data-note-mc]")) {
          const item = day.mc.find((x) => x.id === t.getAttribute("data-note-mc"));
          if (item) {
            item.note = t.value;
            save();
          }
        }
        if (t.matches("input[data-note-short]")) {
          const item = day.short.find((x) => x.id === t.getAttribute("data-note-short"));
          if (item) {
            item.note = t.value;
            save();
          }
        }
      });

      document.addEventListener("click", (e) => {
        const t = e.target;
        if (!(t instanceof HTMLElement)) return;
        const day = ensureDay(date);
        if (t.matches("button[data-del-mc]")) {
          const id = t.getAttribute("data-del-mc");
          day.mc = day.mc.filter((x) => x.id !== id);
          save();
          render();
        }
        if (t.matches("button[data-del-short]")) {
          const id = t.getAttribute("data-del-short");
          day.short = day.short.filter((x) => x.id !== id);
          save();
          render();
        }
      });

      function buildExport() {
        return {
          v: 2,
          type: "fuxi-zuoye-daily",
          exportedAt: new Date().toISOString(),
          examDates: BANK.examDates,
          mustReadyBy: BANK.mustReadyBy,
          days: state.days,
        };
      }

      function downloadText(filename, text) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1200);
      }

      $("btn-export").addEventListener("click", () => {
        const payload = buildExport();
        const text = JSON.stringify(payload, null, 2);
        const day = new Date().toISOString().slice(0, 10);
        downloadText("fuxi-zuoye-" + day + ".json", text);
        toast("已下载计划文件，发到另一台再点「导入」");
      });

      $("btn-import").addEventListener("click", () => $("import-file").click());
      $("import-file").addEventListener("change", () => {
        const file = $("import-file").files && $("import-file").files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const payload = JSON.parse(String(reader.result || ""));
            if (!payload || (payload.v !== 2 && payload.type !== "fuxi-zuoye-daily")) {
              throw new Error("格式不对");
            }
            const incoming = payload.days || {};
            Object.keys(incoming).forEach((d) => {
              const cur = ensureDay(d);
              const src = incoming[d] || {};
              /* 同日合并：按 id 去重，没有的补上；勾选状态取「已完成」优先 */
              const mergeArr = (oldArr, newArr, key) => {
                const map = new Map();
                (oldArr || []).forEach((x) => map.set(x.id || key(x), x));
                (newArr || []).forEach((x) => {
                  const id = x.id || key(x);
                  const prev = map.get(id);
                  if (!prev) map.set(id, x);
                  else map.set(id, Object.assign({}, prev, x, { done: !!(prev.done || x.done) }));
                });
                return Array.from(map.values());
              };
              cur.mc = mergeArr(cur.mc, src.mc, (x) => x.course + "-" + x.from + "-" + x.to + "-mc");
              cur.short = mergeArr(
                cur.short,
                src.short,
                (x) => x.course + "-" + x.from + "-" + x.to + "-s" + x.target
              );
              if (src.note && (!cur.note || src.note.length > cur.note.length)) cur.note = src.note;
              cur.done = !!(cur.done || src.done);
            });
            save();
            render();
            toast("已导入并合并计划");
          } catch (err) {
            toast("导入失败：请用本页导出的 json");
          }
          $("import-file").value = "";
        };
        reader.readAsText(file);
      });

      $("btn-teacher").addEventListener("click", async () => {
        const day = ensureDay(date);
        const lines = [];
        lines.push("【请老师看】日期 " + date + (dayFinished(day) ? " · 今日已完成" : " · 今日未完成"));
        lines.push("目标：10/23 前两门 ≥60（去年 53/54）");
        if (!day.mc.length && !day.short.length) lines.push("还没填任务。");
        day.mc.forEach((item) => {
          const info = sumMc(item.course, item.from, item.to);
          lines.push(
            (item.done ? "✅" : "⬜") +
              " 选择 " +
              courseName[item.course] +
              " 第" +
              info.from +
              "–" +
              info.to +
              "章（" +
              info.count +
              "题刷到100%）" +
              (item.note ? "｜" + item.note : "")
          );
        });
        day.short.forEach((item) => {
          lines.push(
            (item.done ? "✅" : "⬜") +
              " 简答 " +
              courseName[item.course] +
              " 第" +
              item.from +
              "–" +
              item.to +
              "章 背" +
              (item.doneCount || 0) +
              "/" +
              item.target +
              (item.note ? "｜" + item.note : "")
          );
        });
        if (day.note) lines.push("备注：" + day.note);
        const text = lines.join("\n");
        let ok = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            ok = true;
          }
        } catch (_) {}
        if (!ok) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try {
            ok = document.execCommand("copy");
          } catch (_) {}
          ta.remove();
        }
        toast(ok ? "状态已复制，发给老师即可" : "复制失败，请手动选中发送");
        console.log(text);
      });

      renderBank();
      render();
    })();
  </script>
</body>
</html>
