<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星际裂变 · 方格沙盘（初版）</title>
<style>
  :root {
    --bg: #e8ecf1;
    --panel: #fff;
    --line: #c5ccd6;
    --text: #2a3038;
    --muted: #6b7585;
    --accent: #2f9d84;
    --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .side h1 { margin: 0; font-size: 1.05rem; }
  .side .sub { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.4; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav a, .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: .8rem; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .nav a:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: #e8f6f2; border-color: var(--accent); color: var(--accent); }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; }
  .palette { display: grid; gap: 6px; }
  .palette.reordering { touch-action: none; }
  .pal {
    display: grid; grid-template-columns: 36px 1fr auto auto auto; gap: 4px; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: grab; background: #fafbfc;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .pal:hover, .pal.on { border-color: var(--accent); background: #eef8f5; }
  .pal.dragging {
    opacity: .92; cursor: grabbing; border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(40,50,70,.22); transform: scale(1.02);
    background: #eef8f5; z-index: 2; touch-action: none;
  }
  .pal .ico {
    width: 36px; height: 28px; border-radius: 4px;
    box-shadow: 2px 2px 0 rgba(0,0,0,.12); pointer-events: none;
  }
  .pal .name { font-size: .82rem; font-weight: 600; }
  .pal .sz { font-size: .72rem; color: var(--muted); }
  .pal .edit, .pal .del {
    border: 0; background: transparent; cursor: pointer;
    font-size: .75rem; font-weight: 700; padding: 4px 6px; border-radius: 6px;
  }
  .pal .edit { color: var(--accent); }
  .pal .edit:hover { background: #e8f6f2; }
  .pal .del { color: #b91c1c; }
  .pal .del:hover { background: #fef2f2; }
  .shape-grid {
    display: none;
  }
  .paint-wrap {
    position: relative; display: inline-block; max-width: 100%;
    border: 1px solid var(--line); border-radius: 10px; overflow: auto;
    background: #f3f5f8; touch-action: none;
  }
  .paint-wrap canvas {
    display: block; cursor: crosshair; background:
      linear-gradient(#d9dee6 1px, transparent 1px) 0 0 / var(--pc, 28px) var(--pc, 28px),
      linear-gradient(90deg, #d9dee6 1px, transparent 1px) 0 0 / var(--pc, 28px) var(--pc, 28px),
      #fff;
  }
  .paint-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .paint-tools .btn.on { background: #e8f6f2; border-color: var(--accent); color: var(--accent); }
  .paint-tools label { font-size: .72rem; color: var(--muted); margin: 0; }
  .paint-tools input[type="range"] { width: 88px; }
  .port-fields label.mini { margin: 0 0 4px; }
  .port-fields select, .port-fields input[type="range"] { width: 100%; }
  .modal { max-height: 92vh; overflow: auto; width: min(420px, 94vw); }
  .modal-mask {
    display: none; position: fixed; inset: 0; z-index: 60;
    background: rgba(30,40,55,.35); align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: min(360px, 92vw); background: #fff; border-radius: 14px;
    border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(40,50,70,.2);
    padding: 16px 18px;
  }
  .modal h2 { margin: 0 0 12px; font-size: 1rem; }
  .modal label { display: block; font-size: .78rem; color: var(--muted); margin: 0 0 4px; }
  .modal .field { margin: 0 0 12px; }
  .modal input[type="text"], .modal input[type="number"] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .9rem;
  }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .color-row { display: flex; align-items: center; gap: 10px; }
  .modal input[type="color"] { width: 48px; height: 36px; border: 0; padding: 0; background: transparent; cursor: pointer; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .modal .preview {
    height: 40px; border-radius: 8px; border: 1px solid var(--line);
    box-shadow: 2px 2px 0 rgba(0,0,0,.1);
  }
  .keys {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    background: #fafbfc; font-size: .75rem;
  }
  .keys h3 { margin: 0 0 6px; font-size: .8rem; }
  .keys .row {
    display: grid; grid-template-columns: 1fr 72px; gap: 6px; align-items: center;
    margin: 0 0 4px; color: var(--muted);
  }
  .keys button.keycap {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 4px 6px; font-size: .72rem; font-weight: 700; cursor: pointer; color: var(--text);
  }
  .keys button.keycap.listening { border-color: var(--accent); color: var(--accent); background: #e8f6f2; }
  .keys .hint { color: var(--muted); font-size: .7rem; margin-top: 4px; }
  .status {
    margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: .78rem; color: var(--muted); line-height: 1.45;
  }
  .status strong { color: #b91c1c; }
  .main { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; background: #f3f5f8; }
  .ctx {
    display: none; position: fixed; z-index: 50; min-width: 150px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(40,50,70,.18); padding: 4px; overflow: hidden;
  }
  .ctx.show { display: block; }
  .ctx button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 9px 12px; font-size: .85rem; cursor: pointer; color: var(--text); border-radius: 8px;
  }
  .ctx button:hover { background: #eef6f3; }
  .ctx button.danger { color: #b91c1c; }
  .ctx button.danger:hover { background: #fef2f2; }
  .ctx .sep { height: 1px; background: var(--line); margin: 4px 0; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>方格沙盘 · 初版</h1>
    <p class="sub">点「改」打开画像画板：按沙盘格画曲线外形；进出口也可改。</p>
    <div class="nav">
      <a href="../pc/">合成路线</a>
      <a href="../full/">全链路</a>
      <a href="../?stay=1">入口</a>
    </div>
    <div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">模式</div>
      <div class="modes">
        <button class="btn" type="button" data-mode="place" id="modePlace">放置</button>
        <button class="btn active" type="button" data-mode="link" id="modeLink">连轨</button>
        <button class="btn" type="button" data-mode="erase" id="modeErase">擦除</button>
        <button class="btn" type="button" id="btnRot">旋转</button>
        <button class="btn" type="button" id="btnClear">清空</button>
      </div>
    </div>
    <div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span>建筑（点选放置 · 长按拖动排序）</span>
      </div>
      <button class="btn" type="button" id="btnCustom" style="width:100%;margin-bottom:8px">+ 自定义建筑</button>
      <div class="palette" id="palette"></div>
      <button class="btn" type="button" id="btnRestoreCatalog" style="width:100%;margin-top:8px">恢复默认建筑列表</button>
    </div>
    <div class="keys" id="keysPanel">
      <h3>快捷键（点右侧改键）</h3>
      <div id="keysList"></div>
      <div class="hint">拖动画布：按住空格拖，或中键拖。删除：右键菜单 / Delete。</div>
      <button class="btn" type="button" id="btnResetKeys" style="margin-top:8px;width:100%">恢复默认快捷键</button>
    </div>
    <div class="status" id="status">就绪</div>
  </aside>
  <main class="main">
    <canvas id="cv"></canvas>
  </main>
</div>
<div class="ctx" id="ctxMenu" role="menu">
  <button type="button" data-act="rotate">旋转</button>
  <button type="button" data-act="delete" class="danger">清除建筑</button>
  <div class="sep"></div>
  <button type="button" data-act="cancel">取消</button>
</div>
<div class="modal-mask" id="customModal">
  <div class="modal" role="dialog" aria-labelledby="customTitle">
    <h2 id="customTitle">自定义建筑</h2>
    <div class="field">
      <label for="customName">名称</label>
      <input id="customName" type="text" maxlength="12" placeholder="例如：缓冲仓" value="自定义" />
    </div>
    <div class="field">
      <label>建筑颜色</label>
      <div class="color-row">
        <input id="customColor" type="color" value="#7c5cff" />
        <div class="preview" id="customPreview" style="flex:1;background:#7c5cff"></div>
      </div>
    </div>
    <div class="field row2">
      <div>
        <label for="customW">宽（格）</label>
        <input id="customW" type="number" min="1" max="12" value="3" />
      </div>
      <div>
        <label for="customH">高（格）</label>
        <input id="customH" type="number" min="1" max="12" value="3" />
      </div>
    </div>
    <div class="field">
      <label>建筑画像（画板=沙盘格 · 用笔画曲线外形）</label>
      <div class="paint-wrap" id="paintWrap">
        <canvas id="paintCv" width="84" height="84"></canvas>
      </div>
      <div class="paint-tools">
        <button class="btn on" type="button" id="paintBrush">画笔</button>
        <button class="btn" type="button" id="paintEraser">橡皮</button>
        <label>粗细</label>
        <input id="paintSize" type="range" min="4" max="48" value="16" />
        <button class="btn" type="button" id="paintClear">清空</button>
        <button class="btn" type="button" id="paintBlob">一键圆润</button>
      </div>
    </div>
    <div class="field row2 port-fields">
      <div>
        <label class="mini" for="portOutSide">输出口（绿）</label>
        <select id="portOutSide">
          <option value="E">右</option>
          <option value="S">下</option>
          <option value="W">左</option>
          <option value="N">上</option>
        </select>
        <label class="mini" for="portOutT" style="margin-top:8px">沿边位置</label>
        <input id="portOutT" type="range" min="0" max="100" value="50" />
      </div>
      <div>
        <label class="mini" for="portInSide">输入口（黄）</label>
        <select id="portInSide">
          <option value="W">左</option>
          <option value="N">上</option>
          <option value="E">右</option>
          <option value="S">下</option>
        </select>
        <label class="mini" for="portInT" style="margin-top:8px">沿边位置</label>
        <input id="portInT" type="range" min="0" max="100" value="50" />
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="customCancel">取消</button>
      <button class="btn active" type="button" id="customOk">生效并选用</button>
    </div>
  </div>
</div>
<script>
const CELL = 28;
const COLS = 48;
const ROWS = 32;
const PORT_R = 7;
const PORT_HIT = 12;
const KEYS_LS = "starrupture_sandbox_hotkeys_v1";
const CATALOG_LS = "starrupture_sandbox_catalog_v3";
const CATALOG_LS_OLD = ["starrupture_sandbox_catalog_v2", "starrupture_sandbox_catalog_v1"];
const HIT_SUB = 4; // 每格细分，碰撞按画像采样

function fullMask(w, h) { return "1".repeat(w * h); }
function fullHit(w, h) { return "1".repeat(w * h * HIT_SUB * HIT_SUB); }

function makePaintCanvas(w, h) {
  const cnv = document.createElement("canvas");
  cnv.width = Math.max(1, w) * CELL;
  cnv.height = Math.max(1, h) * CELL;
  return cnv;
}
function roundRectPath(g, x, y, rw, rh, r) {
  const rr = Math.min(r, rw / 2, rh / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + rw, y, x + rw, y + rh, rr);
  g.arcTo(x + rw, y + rh, x, y + rh, rr);
  g.arcTo(x, y + rh, x, y, rr);
  g.arcTo(x, y, x + rw, y, rr);
  g.closePath();
}
function paintDefaultSilhouette(g, w, h, recipe) {
  const W = w * CELL, H = h * CELL;
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#111";
  if (recipe === "circle" || (recipe === "fabricator")) {
    g.beginPath();
    g.ellipse(W / 2, H / 2, W * 0.36, H * 0.36, 0, 0, Math.PI * 2);
    g.fill();
    return;
  }
  if (recipe === "smelter") {
    // 阶梯：后柱 + 前主体（圆角）
    roundRectPath(g, W * 0.28, H * 0.06, W * 0.44, H * 0.42, 10);
    g.fill();
    roundRectPath(g, W * 0.12, H * 0.32, W * 0.76, H * 0.58, 14);
    g.fill();
    return;
  }
  if (recipe === "furnace") {
    roundRectPath(g, W * 0.1, H * 0.08, W * 0.8, H * 0.55, 12);
    g.fill();
    roundRectPath(g, W * 0.22, H * 0.48, W * 0.56, H * 0.42, 10);
    g.fill();
    return;
  }
  // 默认圆角矩形，略缩边，方便穿线
  roundRectPath(g, W * 0.08, H * 0.08, W * 0.84, H * 0.84, Math.min(W, H) * 0.18);
  g.fill();
}
function canvasToHit(cnv, w, h) {
  const hw = w * HIT_SUB, hh = h * HIT_SUB;
  const tmp = document.createElement("canvas");
  tmp.width = hw;
  tmp.height = hh;
  const tg = tmp.getContext("2d");
  tg.clearRect(0, 0, hw, hh);
  tg.drawImage(cnv, 0, 0, hw, hh);
  const data = tg.getImageData(0, 0, hw, hh).data;
  let s = "";
  for (let i = 0; i < hw * hh; i++) s += data[i * 4 + 3] > 24 ? "1" : "0";
  if (![...s].some((ch) => ch === "1")) return fullHit(w, h);
  return s;
}
function canvasToArt(cnv) {
  return cnv.toDataURL("image/png");
}
function maskToArtAndHit(mask, w, h) {
  const cnv = makePaintCanvas(w, h);
  const g = cnv.getContext("2d");
  g.clearRect(0, 0, cnv.width, cnv.height);
  g.fillStyle = "#111";
  const m = (mask && mask.length === w * h) ? mask : fullMask(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (m[y * w + x] !== "1") continue;
      roundRectPath(g, x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4, 6);
      g.fill();
    }
  }
  return { art: canvasToArt(cnv), hit: canvasToHit(cnv, w, h), mask: m };
}
function bakeRecipe(recipe, w, h) {
  const cnv = makePaintCanvas(w, h);
  paintDefaultSilhouette(cnv.getContext("2d"), w, h, recipe);
  const art = canvasToArt(cnv);
  const hit = canvasToHit(cnv, w, h);
  // 粗 mask：子格有墨则整格算占（仅兼容旧逻辑/标签）
  let mask = "";
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let on = false;
      for (let sy = 0; sy < HIT_SUB && !on; sy++) {
        for (let sx = 0; sx < HIT_SUB; sx++) {
          if (hit[(y * HIT_SUB + sy) * (w * HIT_SUB) + (x * HIT_SUB + sx)] === "1") { on = true; break; }
        }
      }
      mask += on ? "1" : "0";
    }
  }
  if (![...mask].some((ch) => ch === "1")) mask = fullMask(w, h);
  return { art, hit, mask };
}

const DEFAULT_CATALOG = [
  {
    id: "furnace", name: "熔炉", w: 3, h: 4, color: "#c45c26", top: "#e07a3a",
    recipe: "furnace",
    ports: { out: { side: "E", t: 0.62 }, in: { side: "W", t: 0.62 } },
  },
  {
    id: "smelter", name: "冶炼厂", w: 3, h: 4, color: "#5b9fd4", top: "#7eb8e8",
    recipe: "smelter",
    ports: { out: { side: "S", t: 0.5 }, in: { side: "W", t: 0.38 } },
  },
  {
    id: "fabricator", name: "制造厂", w: 3, h: 3, color: "#3d6ea8", top: "#5b8ec8",
    recipe: "fabricator",
    ports: { out: { side: "E", t: 0.5 }, in: { side: "W", t: 0.5 } },
  },
  {
    id: "storage", name: "仓储", w: 2, h: 2, color: "#5a6b7d", top: "#7a8b9d",
    recipe: "box",
    ports: { out: { side: "E", t: 0.5 }, in: { side: "W", t: 0.5 } },
  },
  {
    id: "raw", name: "原料点", w: 2, h: 2, color: "#c4a35a", top: "#e0c07a",
    recipe: "box",
    ports: { out: { side: "E", t: 0.5 }, in: { side: "W", t: 0.5 } },
  },
  {
    id: "splitter", name: "调制器3", w: 2, h: 2, color: "#2f9d84", top: "#4db8a0",
    recipe: "circle",
    ports: { out: { side: "E", t: 0.5 }, in: { side: "W", t: 0.5 } },
  },
];

function lightenHex(hex, amt) {
  const h = (hex || "#888888").replace("#", "");
  if (h.length !== 6) return "#bbbbbb";
  const n = parseInt(h, 16);
  let r = (n >> 16) + amt;
  let g = ((n >> 8) & 0xff) + amt;
  let b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function normalizeMask(mask, w, h, fallback) {
  const fb = fallback && fallback.length === w * h ? fallback : fullMask(w, h);
  if (typeof mask !== "string" || mask.length !== w * h) return fb;
  if (![...mask].some((ch) => ch === "1")) return fb;
  return [...mask].map((ch) => (ch === "1" ? "1" : "0")).join("");
}
function normalizeHit(hit, w, h, fallback) {
  const need = w * h * HIT_SUB * HIT_SUB;
  const fb = fallback && fallback.length === need ? fallback : fullHit(w, h);
  if (typeof hit !== "string" || hit.length !== need) return fb;
  if (![...hit].some((ch) => ch === "1")) return fb;
  return [...hit].map((ch) => (ch === "1" ? "1" : "0")).join("");
}

function normalizePort(p, fallback) {
  const fb = fallback || { side: "E", t: 0.5 };
  const side = p && ["E", "S", "W", "N"].includes(p.side) ? p.side : fb.side;
  let t = Number(p && p.t);
  if (!Number.isFinite(t)) t = fb.t;
  t = Math.max(0, Math.min(1, t));
  return { side, t };
}

function normalizeCatalogItem(c) {
  const base = DEFAULT_CATALOG.find((d) => d.id === c.id);
  const w = Math.max(1, Math.min(12, Number(c.w) || (base && base.w) || 2));
  const h = Math.max(1, Math.min(12, Number(c.h) || (base && base.h) || 2));
  const color = /^#[0-9a-fA-F]{6}$/.test(c.color) ? c.color : (base ? base.color : "#7c5cff");
  const portsIn = (c.ports && c.ports.in) || (base && base.ports && base.ports.in);
  const portsOut = (c.ports && c.ports.out) || (base && base.ports && base.ports.out);

  let art = typeof c.art === "string" && c.art.startsWith("data:image") ? c.art : null;
  let hit = c.hit;
  let mask = c.mask;
  if (!art) {
    if (base && base.recipe && base.w === w && base.h === h && !c.custom) {
      const baked = bakeRecipe(base.recipe, w, h);
      art = baked.art; hit = baked.hit; mask = baked.mask;
    } else if (mask && mask.length === w * h) {
      const baked = maskToArtAndHit(mask, w, h);
      art = baked.art; hit = baked.hit; mask = baked.mask;
    } else {
      const baked = bakeRecipe((base && base.recipe) || "box", w, h);
      art = baked.art; hit = baked.hit; mask = baked.mask;
    }
  } else if (!hit || hit.length !== w * h * HIT_SUB * HIT_SUB) {
    // 有画像无 hit：离线重采样
    const img = new Image();
    // 同步不了 Image，用临时 canvas + 若失败则 full
    hit = fullHit(w, h);
    mask = normalizeMask(mask, w, h, fullMask(w, h));
  }

  return {
    id: String(c.id || ("custom_" + Date.now())),
    name: String(c.name || "自定义").slice(0, 12),
    w, h,
    color,
    top: c.top && /^#[0-9a-fA-F]{6}$/.test(c.top) ? c.top : lightenHex(color, 36),
    mask: normalizeMask(mask, w, h, fullMask(w, h)),
    hit: normalizeHit(hit, w, h, fullHit(w, h)),
    art,
    ports: {
      out: normalizePort(portsOut, (base && base.ports && base.ports.out) || { side: "E", t: 0.5 }),
      in: normalizePort(portsIn, (base && base.ports && base.ports.in) || { side: "W", t: 0.5 }),
    },
    custom: !!c.custom,
  };
}

function loadCatalog() {
  try {
    let fromOld = false;
    let raw = JSON.parse(localStorage.getItem(CATALOG_LS) || "null");
    if (!Array.isArray(raw) || !raw.length) {
      for (const k of CATALOG_LS_OLD) {
        raw = JSON.parse(localStorage.getItem(k) || "null");
        if (Array.isArray(raw) && raw.length) { fromOld = true; break; }
      }
    }
    if (!Array.isArray(raw) || !raw.length) return DEFAULT_CATALOG.map((c) => normalizeCatalogItem(c));
    const list = raw.map((c) => {
      const base = DEFAULT_CATALOG.find((d) => d.id === c.id);
      // 升级：无 art 的内置项用新圆润画像
      if (base && !c.art) {
        return normalizeCatalogItem({
          ...base,
          name: c.name || base.name,
          color: /^#[0-9a-fA-F]{6}$/.test(c.color) ? c.color : base.color,
          ports: c.ports || base.ports,
          custom: false,
        });
      }
      return normalizeCatalogItem(c);
    });
    if (fromOld) {
      try { localStorage.setItem(CATALOG_LS, JSON.stringify(list)); } catch (_) {}
    }
    return list;
  } catch (_) {
    return DEFAULT_CATALOG.map((c) => normalizeCatalogItem(c));
  }
}

function resize() {

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.floor(r.width * dpr);

function cat(type) { return state.catalog.find((c) => c.id === type); }
function dimsFor(type, rot) {
  const c = cat(type);
  if (!c) return { w: 2, h: 2 };
  const swap = (rot % 2) === 1;
  return { w: swap ? c.h : c.w, h: swap ? c.w : c.h };
}
function rotateHitXY(x, y, w, h, rot) {
  if (rot === 1) return { x: h - 1 - y, y: x };
  if (rot === 2) return { x: w - 1 - x, y: h - 1 - y };
  if (rot === 3) return { x: y, y: w - 1 - x };
  return { x, y };
}
function hitKeysOf(b) {
  const c = cat(b.type);
  const keys = [];
  if (!c || !c.hit) {
    for (let dy = 0; dy < b.h * HIT_SUB; dy++) {
      for (let dx = 0; dx < b.w * HIT_SUB; dx++) keys.push((b.gx * HIT_SUB + dx) + "," + (b.gy * HIT_SUB + dy));
    }
    return keys;
  }
  const uw = c.w * HIT_SUB, uh = c.h * HIT_SUB;
  const rot = b.rot || 0;
  const hit = c.hit;
  for (let y = 0; y < uh; y++) {
    for (let x = 0; x < uw; x++) {
      if (hit[y * uw + x] !== "1") continue;
      const r = rotateHitXY(x, y, uw, uh, rot);
      keys.push((b.gx * HIT_SUB + r.x) + "," + (b.gy * HIT_SUB + r.y));
    }
  }
  return keys;
}
function worldCellsOf(b) {
  const set = new Set();
  for (const k of hitKeysOf(b)) {
    const [sx, sy] = k.split(",").map(Number);
    set.add(Math.floor(sx / HIT_SUB) + "," + Math.floor(sy / HIT_SUB));
  }
  return [...set].map((s) => {
    const [x, y] = s.split(",").map(Number);
    return { x, y };
  });
}
function portWorld(b, kind) {
  const c = cat(b.type);
  const def = { out: { side: "E", t: 0.5 }, in: { side: "W", t: 0.5 } };
  const p = normalizePort(c && c.ports && c.ports[kind], def[kind]);
  const uw = c ? c.w : b.w;
  const uh = c ? c.h : b.h;
  const t = p.t;
  let lx, ly;
  if (p.side === "E") { lx = uw; ly = t * uh; }
  else if (p.side === "W") { lx = 0; ly = t * uh; }
  else if (p.side === "S") { lx = t * uw; ly = uh; }
  else { lx = t * uw; ly = 0; }
  const rot = b.rot || 0;
  let rx = lx, ry = ly;
  if (rot === 1) { rx = uh - ly; ry = lx; }
  else if (rot === 2) { rx = uw - lx; ry = uh - ly; }
  else if (rot === 3) { rx = ly; ry = uw - lx; }
  return { x: (b.gx + rx) * CELL, y: (b.gy + ry) * CELL };
}

const artImageCache = new Map();

}

const LONG_PRESS_MS = 380;
let palDrag = null;

function commitPaletteOrder() {
  const ids = [...paletteEl.querySelectorAll(".pal")].map((x) => x.dataset.id);
  const map = new Map(state.catalog.map((c) => [c.id, c]));
  const next = ids.map((id) => map.get(id)).filter(Boolean);
  if (next.length !== state.catalog.length) return;
  state.catalog = next;
  saveCatalog();
}

function bindPaletteLongPress(el) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (e.target.closest("[data-del], [data-edit]")) return;
    if (palDrag) return;
    const startX = e.clientX;
    const startY = e.clientY;
    const pointerId = e.pointerId;
    palDrag = {
      el,
      timer: null,
      active: false,
      moved: false,
      startX,
      startY,
      pointerId,
    };
    palDrag.timer = setTimeout(() => {
      if (!palDrag || palDrag.el !== el) return;
      palDrag.active = true;
      palDrag.moved = true;
      el.classList.add("dragging");
      paletteEl.classList.add("reordering");
      try { el.setPointerCapture(pointerId); } catch (_) {}
    }, LONG_PRESS_MS);

    const onMove = (ev) => {
      if (!palDrag || palDrag.el !== el) return;
      const dx = ev.clientX - palDrag.startX;
      const dy = ev.clientY - palDrag.startY;
      if (!palDrag.active) {
        if (Math.hypot(dx, dy) > 8) {
          clearTimeout(palDrag.timer);
          palDrag.timer = null;
          cleanup();
        }
        return;
      }
      ev.preventDefault();
      const y = ev.clientY;
      const others = [...paletteEl.querySelectorAll(".pal")].filter((x) => x !== el);
      let before = null;
      for (const item of others) {
        const r = item.getBoundingClientRect();
        if (y < r.top + r.height / 2) {
          before = item;
          break;
        }
      }
      if (before) paletteEl.insertBefore(el, before);
      else paletteEl.appendChild(el);
    };

    const cleanup = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (!palDrag || palDrag.el !== el) return;
      if (palDrag.timer) clearTimeout(palDrag.timer);
      const didReorder = palDrag.active;
      el.classList.remove("dragging");
      paletteEl.classList.remove("reordering");
      if (didReorder) commitPaletteOrder();
      if (palDrag.moved) el.dataset.skipClick = "1";
      palDrag = null;
    };

    const onUp = () => cleanup();

    document.addEventListener("pointermove", onMove, { passive: false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

function renderPalette() {
  if (palDrag) {
    if (palDrag.timer) clearTimeout(palDrag.timer);
    palDrag = null;
  }
  paletteEl.classList.remove("reordering");
  paletteEl.innerHTML = "";
  state.catalog.forEach((c) => {
    const el = document.createElement("div");
    el.className = "pal" + (c.id === state.selected ? " on" : "");
    el.dataset.id = c.id;
    el.innerHTML = `<div class="ico" style="background:linear-gradient(145deg,${c.top},${c.color})"></div>
      <div><div class="name">${c.name}</div><div class="sz">${c.w}×${c.h} 格</div></div>
      <button class="edit" type="button" title="改形状/端口" data-edit="${c.id}">改</button>
      <button class="del" type="button" title="从列表删除" data-del="${c.id}">删</button>`;
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-del], [data-edit]")) return;
      if (el.dataset.skipClick === "1") {
        delete el.dataset.skipClick;
        return;
      }
      if (state.selected === c.id) state.selected = null;
      else {
        state.selected = c.id;
        state.mode = "place";
        syncModes();
      }
      syncPalette();
      draw();
    });
    el.querySelector("[data-edit]").addEventListener("click", (e) => {
      e.stopPropagation();
      openEditModal(c.id);
    });
    el.querySelector("[data-del]").addEventListener("click", (e) => {
      e.stopPropagation();
      removeCatalogItem(c.id);
    });
    bindPaletteLongPress(el);
    paletteEl.appendChild(el);
  });
}

function removeCatalogItem(id) {
  if (state.catalog.length <= 1) {
    alert("至少保留一种建筑");
    return;
  }
  const item = cat(id);
  const onMap = state.buildings.filter((b) => b.type === id).length;
  const msg = onMap
    ? `从列表删除「${item ? item.name : id}」？沙盘上已放置的 ${onMap} 个也会一起清除。`
    : `从列表删除「${item ? item.name : id}」？`;
  if (!confirm(msg)) return;
  state.catalog = state.catalog.filter((c) => c.id !== id);
  saveCatalog();
  if (state.selected === id) state.selected = null;
  state.buildings = state.buildings.filter((b) => b.type !== id);
  state.rails = state.rails.filter((r) => {
    const a = state.buildings.find((b) => b.id === r.fromId);
    const bb = state.buildings.find((b) => b.id === r.toId);
    return a && bb;
  });
  if (state.focusId && !state.buildings.some((b) => b.id === state.focusId)) state.focusId = null;
  renderPalette();
  draw();
}

const customModal = document.getElementById("customModal");

const paintWrap = document.getElementById("paintWrap");
const portOutSide = document.getElementById("portOutSide");

const portOutT = document.getElementById("portOutT");
const portInT = document.getElementById("portInT");
let editingId = null;
let paintTool = "brush";
let paintDrawing = false;
let paintLast = null;

function readModalSize() {
  return {
    w: Math.max(1, Math.min(12, parseInt(customW.value, 10) || 1)),
    h: Math.max(1, Math.min(12, parseInt(customH.value, 10) || 1)),
  };
}
function paintPos(e) {
  const r = paintCv.getBoundingClientRect();
  const scaleX = paintCv.width / r.width;
  const scaleY = paintCv.height / r.height;
  return {
    x: (e.clientX - r.left) * scaleX,
    y: (e.clientY - r.top) * scaleY,
  };
}
function strokePaint(from, to) {
  const size = Number(document.getElementById("paintSize").value) || 16;
  paintCtx.lineCap = "round";
  paintCtx.lineJoin = "round";
  paintCtx.lineWidth = size;
  if (paintTool === "eraser") {
    paintCtx.globalCompositeOperation = "destination-out";
    paintCtx.strokeStyle = "rgba(0,0,0,1)";
  } else {
    paintCtx.globalCompositeOperation = "source-over";
    paintCtx.strokeStyle = "#1a1a1a";
  }
  paintCtx.beginPath();
  paintCtx.moveTo(from.x, from.y);
  paintCtx.lineTo(to.x, to.y);
  paintCtx.stroke();
  paintCtx.globalCompositeOperation = "source-over";
}
function resizePaintBoard(keepContent) {
  const { w, h } = readModalSize();
  const nw = w * CELL, nh = h * CELL;
  let backup = null;
  if (keepContent && paintCv.width && paintCv.height) {
    backup = document.createElement("canvas");
    backup.width = paintCv.width;
    backup.height = paintCv.height;
    backup.getContext("2d").drawImage(paintCv, 0, 0);
  }
  paintCv.width = nw;
  paintCv.height = nh;
  paintWrap.style.setProperty("--pc", CELL + "px");
  paintCtx.clearRect(0, 0, nw, nh);
  if (backup) {
    paintCtx.drawImage(backup, 0, 0, backup.width, backup.height, 0, 0, nw, nh);
  }
}
function loadArtToPaint(art, w, h) {
  paintCv.width = w * CELL;
  paintCv.height = h * CELL;
  paintWrap.style.setProperty("--pc", CELL + "px");
  paintCtx.clearRect(0, 0, paintCv.width, paintCv.height);
  if (!art) {
    paintDefaultSilhouette(paintCtx, w, h, "box");
    return;
  }
  const img = new Image();
  img.onload = () => {
    paintCtx.clearRect(0, 0, paintCv.width, paintCv.height);
    paintCtx.drawImage(img, 0, 0, paintCv.width, paintCv.height);
  };
  img.src = art;
}
function exportPaintPayload(w, h) {
  const art = canvasToArt(paintCv);
  const hit = canvasToHit(paintCv, w, h);
  let mask = "";
  const hw = w * HIT_SUB;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let on = false;
      for (let sy = 0; sy < HIT_SUB && !on; sy++) {
        for (let sx = 0; sx < HIT_SUB; sx++) {
          if (hit[(y * HIT_SUB + sy) * hw + (x * HIT_SUB + sx)] === "1") { on = true; break; }
        }
      }
      mask += on ? "1" : "0";
    }
  }
  if (![...mask].some((ch) => ch === "1")) {
    alert("画像是空的，先用画笔画一下外形");
    return null;
  }
  return { art, hit, mask };
}
function fillModalFromItem(item) {
  customName.value = item.name;
  customColor.value = item.color;
  customW.value = String(item.w);
  customH.value = String(item.h);
  customPreview.style.background = item.color;
  portOutSide.value = item.ports.out.side;
  portInSide.value = item.ports.in.side;
  portOutT.value = String(Math.round(item.ports.out.t * 100));
  portInT.value = String(Math.round(item.ports.in.t * 100));
  customW.dataset.prevW = String(item.w);
  customH.dataset.prevH = String(item.h);
  loadArtToPaint(item.art, item.w, item.h);
}
function openCustomModal() {
  editingId = null;
  customTitle.textContent = "自定义建筑";
  document.getElementById("customOk").textContent = "生效并选用";
  const baked = bakeRecipe("box", 3, 3);
  fillModalFromItem(normalizeCatalogItem({
    id: "tmp", name: "自定义", w: 3, h: 3, color: "#7c5cff",

}
function openEditModal(id) {
  const item = cat(id);
  if (!item) return;
  editingId = id;
  customTitle.textContent = "编辑建筑 · " + item.name;
  document.getElementById("customOk").textContent = "保存并选用";

function closeCustomModal() {
  customModal.classList.remove("show");

}
function readModalPorts() {
  return {
    out: { side: portOutSide.value, t: Number(portOutT.value) / 100 },
    in: { side: portInSide.value, t: Number(portInT.value) / 100 },
  };
}
function applyCustomBuilding() {
  const name = (customName.value || "自定义").trim().slice(0, 12) || "自定义";
  const { w, h } = readModalSize();
  const color = customColor.value || "#7c5cff";
  const ports = readModalPorts();
  const painted = exportPaintPayload(w, h);
  if (!painted) return;
  if (editingId) {
    const idx = state.catalog.findIndex((c) => c.id === editingId);
    if (idx < 0) return;
    const prev = state.catalog[idx];
    const item = normalizeCatalogItem({
      ...prev, name, w, h, color, ports,
      art: painted.art, hit: painted.hit, mask: painted.mask,
      custom: prev.custom || !DEFAULT_CATALOG.some((d) => d.id === prev.id),
    });
    item.id = prev.id;
    state.catalog[idx] = item;
    artImageCache.clear();
    for (const b of state.buildings) {
      if (b.type !== item.id) continue;
      const d = dimsFor(item.id, b.rot || 0);
      b.w = d.w;
      b.h = d.h;
      b.gx = Math.max(0, Math.min(COLS - b.w, b.gx));
      b.gy = Math.max(0, Math.min(ROWS - b.h, b.gy));
    }
    saveCatalog();
    state.selected = item.id;
    state.mode = "place";
    syncModes();
    renderPalette();
    closeCustomModal();
    draw();
    return;
  }
  const item = normalizeCatalogItem({
    id: "custom_" + Date.now().toString(36),
    name, w, h, color, ports,
    art: painted.art, hit: painted.hit, mask: painted.mask,
    custom: true,
  });
  state.catalog.push(item);
  saveCatalog();
  state.selected = item.id;
  state.mode = "place";
  syncModes();
  renderPalette();
  closeCustomModal();
  draw();
}

document.getElementById("btnClear").addEventListener("click", () => {

function rotateAction() {
  if (state.mode === "place" && state.selected) {
    state.placeRot = (state.placeRot + 1) % 4;
    draw();
    return;
  }
  const b = getFocusBuilding() || (state.hover && buildingAt(state.hover.gx, state.hover.gy));
  if (b) rotateBuilding(b);
}
function getFocusBuilding() {
  return state.buildings.find((b) => b.id === state.focusId) || null;
}
function rotateBuilding(b) {

  b.w = d.w;
  b.h = d.h;
  if (b.gx + b.w > COLS || b.gy + b.h > ROWS || collides(b, b.id)) {

  return true;
}
function deleteBuilding(id) {
  state.buildings = state.buildings.filter((b) => b.id !== id);
  state.rails = state.rails.filter((r) => r.fromId !== id && r.toId !== id);
  if (state.focusId === id) state.focusId = null;
  if (state.linkFrom && state.linkFrom.buildingId === id) state.linkFrom = null;
  draw();
}
function collides(nb, ignoreId) {
  const setA = new Set(hitKeysOf(nb));
  for (const b of state.buildings) {
    if (b.id === ignoreId) continue;
    if (nb.gx >= b.gx + b.w || nb.gx + nb.w <= b.gx || nb.gy >= b.gy + b.h || nb.gy + nb.h <= b.gy) continue;
    for (const k of hitKeysOf(b)) {
      if (setA.has(k)) return true;
    }
  }
  return false;
}
function canMoveTo(b, gx, gy) {
  if (gx < 0 || gy < 0 || gx + b.w > COLS || gy + b.h > ROWS) return false;
  return !collides({ ...b, gx, gy }, b.id);
}
function screenToGrid(sx, sy) {
  return { gx: Math.floor((sx - state.panX) / CELL), gy: Math.floor((sy - state.panY) / CELL) };
}
function toWorld(sx, sy) {
  return { x: sx - state.panX, y: sy - state.panY };
}
function buildingAt(gx, gy) {
  for (let i = state.buildings.length - 1; i >= 0; i--) {
    const b = state.buildings[i];
    if (gx < b.gx || gy < b.gy || gx >= b.gx + b.w || gy >= b.gy + b.h) continue;
    // 子格命中才算点到建筑（空角可点穿）
    const sx0 = gx * HIT_SUB, sy0 = gy * HIT_SUB;
    const keys = new Set(hitKeysOf(b));
    let hit = false;
    for (let sy = 0; sy < HIT_SUB && !hit; sy++) {
      for (let sx = 0; sx < HIT_SUB; sx++) {
        if (keys.has((sx0 + sx) + "," + (sy0 + sy))) { hit = true; break; }
      }
    }
    if (hit) return b;
  }

}
function canPlace(type, gx, gy, rot) {
  if (!type) return false;
  const d = dimsFor(type, rot);
  if (gx < 0 || gy < 0 || gx + d.w > COLS || gy + d.h > ROWS) return false;
  return !collides({ gx, gy, w: d.w, h: d.h, type, rot }, null);
}
function portOut(b) { return portWorld(b, "out"); }
function portIn(b) { return portWorld(b, "in"); }
function hitPort(wx, wy) {
  let best = null;
  let bestD = PORT_HIT;
  for (const b of state.buildings) {
    const o = portOut(b);
    const i = portIn(b);
    const do_ = Math.hypot(wx - o.x, wy - o.y);
    const di = Math.hypot(wx - i.x, wy - i.y);
    if (do_ < bestD) { bestD = do_; best = { building: b, kind: "out", pos: o }; }
    if (di < bestD) { bestD = di; best = { building: b, kind: "in", pos: i }; }
  }
  return best;
}
function nearPt(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y) < 1.5;
}
function segmentsCross(p1, p2, q1, q2) {
  if (nearPt(p1, q1) || nearPt(p1, q2) || nearPt(p2, q1) || nearPt(p2, q2)) return false;
  const dx1 = p2.x - p1.x, dy1 = p2.y - p1.y;
  const dx2 = q2.x - q1.x, dy2 = q2.y - q1.y;
  const cross = dx1 * dy2 - dy1 * dx2;
  if (Math.abs(cross) < 1e-6) return false;
  const t = ((q1.x - p1.x) * dy2 - (q1.y - p1.y) * dx2) / cross;
  const u = ((q1.x - p1.x) * dy1 - (q1.y - p1.y) * dx1) / cross;
  const eps = 0.02;
  return t > eps && t < 1 - eps && u > eps && u < 1 - eps;
}
function railSeg(r) {
  const a = state.buildings.find((b) => b.id === r.fromId);
  const b = state.buildings.find((b) => b.id === r.toId);
  if (!a || !b) return null;

function findCrossings() {

  const bad = new Set();
  let pairs = 0;
  for (let i = 0; i < segs.length; i++) {
    for (let j = i + 1; j < segs.length; j++) {
      const A = segs[i], B = segs[j];
      if (A.a.id === B.a.id || A.a.id === B.b.id || A.b.id === B.a.id || A.b.id === B.b.id) continue;
      if (!segmentsCross(A.p1, A.p2, B.p1, B.p2)) continue;

function drawBuildingBody(bOrGhost, color, top, focused, showBBox) {
  const gx = bOrGhost.gx, gy = bOrGhost.gy;
  const c = cat(bOrGhost.type);
  const rot = bOrGhost.rot || 0;
  if (showBBox) {
    ctx.strokeStyle = "rgba(47,157,132,.25)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(gx * CELL + 0.5, gy * CELL + 0.5, bOrGhost.w * CELL - 1, bOrGhost.h * CELL - 1);
    ctx.setLineDash([]);
  }
  const bw = bOrGhost.w * CELL;
  const bh = bOrGhost.h * CELL;
  const cx = gx * CELL + bw / 2;
  const cy = gy * CELL + bh / 2;

  const drawTinted = (img) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot * Math.PI / 2);
    const iw = (c ? c.w : bOrGhost.w) * CELL;
    const ih = (c ? c.h : bOrGhost.h) * CELL;
    ctx.translate(-iw / 2, -ih / 2);
    // 阴影
    ctx.fillStyle = "rgba(0,0,0,.12)";
    ctx.beginPath();
    ctx.rect(3, 4, iw, ih);
    // 用画像裁剪着色
    const off = document.createElement("canvas");
    off.width = iw;
    off.height = ih;
    const og = off.getContext("2d");
    if (img) {
      og.drawImage(img, 0, 0, iw, ih);
      og.globalCompositeOperation = "source-in";
      const grd = og.createLinearGradient(0, 0, 0, ih);
      grd.addColorStop(0, top || lightenHex(color, 30));
      grd.addColorStop(1, color);
      og.fillStyle = grd;
      og.fillRect(0, 0, iw, ih);
    } else {
      og.fillStyle = color;
      roundRectPath(og, 4, 4, iw - 8, ih - 8, 10);
      og.fill();
    }
    ctx.drawImage(off, 0, 0);
    if (focused) {
      ctx.strokeStyle = "#2f9d84";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(1, 1, iw - 2, ih - 2);
    }
    ctx.restore();
  };

    const key = c.id + ":" + c.art.slice(-48);
    const cached = artImageCache.get(key);
    if (cached && cached.complete) {
      drawTinted(cached);
    } else {
      getArtImage(c, () => {});
      // 加载前先用 hit 粗略填色，避免空白闪烁
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot * Math.PI / 2);
      const iw = c.w * CELL, ih = c.h * CELL;
      ctx.translate(-iw / 2, -ih / 2);
      ctx.fillStyle = color;
      const hw = c.w * HIT_SUB;
      for (let y = 0; y < c.h * HIT_SUB; y++) {
        for (let x = 0; x < hw; x++) {
          if (c.hit[y * hw + x] !== "1") continue;

function drawPort(pos, kind, highlight) {

  ctx.fill();
  ctx.strokeStyle = highlight ? "#111" : "rgba(0,0,0,.35)";
  ctx.lineWidth = highlight ? 2 : 1;
  ctx.stroke();

function draw() {
  const w = cv.clientWidth;
  const h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(state.panX, state.panY);

  ctx.strokeStyle = "#d9dee6";
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
  }

  const { pairs, bad } = findCrossings();
  for (const r of state.rails) {
    const seg = railSeg(r);
    if (!seg) continue;
    const crossed = bad.has(r.id);
    ctx.strokeStyle = crossed ? "#dc2626" : "#4b6a88";
    ctx.lineWidth = crossed ? 3 : 2;
    ctx.setLineDash(crossed ? [7, 4] : []);
    ctx.beginPath();
    ctx.moveTo(seg.p1.x, seg.p1.y);
    const mx = (seg.p1.x + seg.p2.x) / 2;

    ctx.stroke();
    ctx.setLineDash([]);

    const b = state.buildings.find((x) => x.id === state.linkFrom.buildingId);

      const o = portOut(b);
      ctx.strokeStyle = "#2f9d84";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(state.mouseWorld.x, state.mouseWorld.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  const hoverPort = state.mouseWorld ? hitPort(state.mouseWorld.x, state.mouseWorld.y) : null;
  for (const b of state.buildings) {
    const c = cat(b.type);
    if (!c) continue;
    drawBuildingBody(b, c.color, c.top, b.id === state.focusId, true);
    ctx.fillStyle = "#fff";
    ctx.font = "600 11px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const cells = worldCellsOf(b);
    const ax = cells.reduce((s, p) => s + p.x, 0) / (cells.length || 1);
    const ay = cells.reduce((s, p) => s + p.y, 0) / (cells.length || 1);
    ctx.fillText(c.name, (ax + 0.5) * CELL, (ay + 0.5) * CELL);
    const o = portOut(b), i = portIn(b);
    const ho = hoverPort && hoverPort.building.id === b.id && hoverPort.kind === "out";
    const hi = hoverPort && hoverPort.building.id === b.id && hoverPort.kind === "in";
    const selOut = state.linkFrom && state.linkFrom.buildingId === b.id;
    drawPort(o, "out", ho || selOut);
    drawPort(i, "in", hi);
  }

  if (state.mode === "place" && state.selected && state.hover && !state.moving) {
    const d = dimsFor(state.selected, state.placeRot);
    const c = cat(state.selected);
    const ok = canPlace(state.selected, state.hover.gx, state.hover.gy, state.placeRot);
    const ghost = {
      gx: state.hover.gx, gy: state.hover.gy, w: d.w, h: d.h,
      rot: state.placeRot, type: state.selected,
    };
    ctx.globalAlpha = 0.5;
    drawBuildingBody(ghost, ok ? c.color : "#dc2626", ok ? c.top : "#f87171", false, true);
    ctx.globalAlpha = 1;
    drawPort(portOut(ghost), "out", false);
    drawPort(portIn(ghost), "in", false);
  }

  ctx.restore();

  const focus = getFocusBuilding();
  statusEl.innerHTML = `交叉：<strong>${pairs}</strong> 对 · 建筑 ${state.buildings.length} · 轨道 ${state.rails.length}` +
    (focus ? ` · 焦点：${cat(focus.type).name}` : "") + "<br>" +
    (state.mode === "place"
      ? (state.selected ? `放置中 · 朝向 ${state.placeRot * 90}° · 拖已有建筑可移动` : "请先点左侧建筑；拖已有建筑可移动")
      : state.mode === "link"
        ? (state.linkFrom ? "已点绿口，再点黄口；或拖建筑移动" : "连轨：绿→黄；拖建筑本体可移动，轨道跟随")
        : "擦除：点建筑/轨道；也可用右键清除");
}

function clientPos(e) {

  const mh = ctxMenu.offsetHeight || 120;

  let y = clientY;

  if (y + mh > window.innerHeight - pad) y = window.innerHeight - mh - pad;

  ctxMenu.style.top = y + "px";

ctxMenu.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");

  const act = btn.dataset.act;
  const id = state.ctxTargetId;
  hideCtx();
  if (!id) return;
  if (act === "delete") deleteBuilding(id);
  if (act === "rotate") {
    const b = state.buildings.find((x) => x.id === id);

document.addEventListener("click", (e) => {
  if (!ctxMenu.contains(e.target)) hideCtx();
});

cv.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const p = clientPos(e);
  const g = screenToGrid(p.x, p.y);

  if (hit) showCtx(e.clientX, e.clientY, hit.id);
  else hideCtx();

cv.addEventListener("mousemove", (e) => {
  const p = clientPos(e);
  state.hover = screenToGrid(p.x, p.y);
  state.mouseWorld = toWorld(p.x, p.y);

  if (state.panning) {
    state.panX += e.clientX - state.lastX;
    state.panY += e.clientY - state.lastY;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    draw();
    return;
  }

  if (state.moving) {
    const b = state.buildings.find((x) => x.id === state.moving.id);
    if (b) {
      const dx = e.clientX - state.moving.startX;
      const dy = e.clientY - state.moving.startY;
      if (Math.hypot(dx, dy) > 4) state.moving.dragged = true;
      const gx = state.hover.gx - state.moving.ox;
      const gy = state.hover.gy - state.moving.oy;
      if (canMoveTo(b, gx, gy)) {
        b.gx = gx;
        b.gy = gy;
      }

    cv.style.cursor = "grabbing";
    draw();
    return;
  }

  const hp = state.mouseWorld ? hitPort(state.mouseWorld.x, state.mouseWorld.y) : null;
  const onBuild = state.hover && buildingAt(state.hover.gx, state.hover.gy);
  if (state.mode === "link" && hp) cv.style.cursor = "pointer";
  else if (onBuild && !hp) cv.style.cursor = "grab";
  else cv.style.cursor = state.mode === "link" ? "crosshair" : "default";

let skipClick = false;

cv.addEventListener("mousedown", (e) => {
  if (e.button === 1 || (e.button === 0 && state.spacePan)) {
    state.panning = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  hideCtx();
  const p = clientPos(e);
  const world = toWorld(p.x, p.y);
  const g = screenToGrid(p.x, p.y);
  const hp = hitPort(world.x, world.y);
  if (hp && state.mode === "link") return;
  const hit = buildingAt(g.gx, g.gy);
  if (hit && !hp) {
    state.focusId = hit.id;
    state.moving = {
      id: hit.id,
      ox: g.gx - hit.gx,
      oy: g.gy - hit.gy,
      startX: e.clientX,
      startY: e.clientY,
      dragged: false,
    };
    e.preventDefault();
  }

window.addEventListener("mouseup", () => {
  if (state.moving) {
    if (state.moving.dragged) skipClick = true;
    state.moving = null;
    draw();
  }
  state.panning = false;
});

cv.addEventListener("click", (e) => {
  if (state.spacePan) return;
  if (skipClick) {
    skipClick = false;
    return;
  }
  const p = clientPos(e);
  const g = screenToGrid(p.x, p.y);
  const world = toWorld(p.x, p.y);

  if (state.mode === "place") {
    if (!state.selected) return;
    // 点在已有建筑上：只聚焦，不叠放
    if (buildingAt(g.gx, g.gy)) return;
    if (!canPlace(state.selected, g.gx, g.gy, state.placeRot)) return;
    const d = dimsFor(state.selected, state.placeRot);
    const nb = {
      id: "b" + (bid++),
      type: state.selected,
      gx: g.gx,
      gy: g.gy,
      w: d.w,
      h: d.h,
      rot: state.placeRot,
    };
    state.buildings.push(nb);
    state.focusId = nb.id;
    draw();
    return;
  }

  if (state.mode === "link") {
    const hp = hitPort(world.x, world.y);
    if (!hp) {
      state.linkFrom = null;
      draw();
      return;
    }
    if (!state.linkFrom) {
      if (hp.kind !== "out") return;
      state.linkFrom = { buildingId: hp.building.id };
      state.focusId = hp.building.id;
      draw();
      return;
    }
    if (hp.kind !== "in") return;
    if (hp.building.id === state.linkFrom.buildingId) {
      state.linkFrom = null;
      draw();
      return;
    }
    const exists = state.rails.some(
      (r) => r.fromId === state.linkFrom.buildingId && r.toId === hp.building.id
    );
    if (!exists) {
      state.rails.push({
        id: "r" + (rid++),
        fromId: state.linkFrom.buildingId,
        toId: hp.building.id,
      });
    }
    state.linkFrom = null;
    draw();
    return;
  }

  if (state.mode === "erase") {
    const wx = world.x, wy = world.y;
    let best = null, bestD = 14;
    for (const r of state.rails) {
      const s = railSeg(r);
      if (!s) continue;
      const d = distToSeg(wx, wy, s.p1, s.p2);
      if (d < bestD) { bestD = d; best = r.id; }
    }
    if (best) {
      state.rails = state.rails.filter((r) => r.id !== best);
      draw();
      return;
    }
    const hit = buildingAt(g.gx, g.gy);
    if (hit) deleteBuilding(hit.id);
  }
});

function distToSeg(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

function matchHotkey(e, action) {
  return e.code === state.hotkeys[action];
}

window.addEventListener("keydown", (e) => {
  if (state.listeningKey) {
    e.preventDefault();
    // 忽略纯修饰键
    if (["ShiftLeft", "ShiftRight", "ControlLeft", "ControlRight", "AltLeft", "AltRight", "MetaLeft", "MetaRight"].includes(e.code)) return;
    state.hotkeys[state.listeningKey] = e.code;
    saveHotkeys();
    state.listeningKey = null;
    renderKeysPanel();
    return;
  }

  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;

  if (matchHotkey(e, "pan")) {
    state.spacePan = true;
    cv.style.cursor = "grab";
    return;
  }
  if (matchHotkey(e, "rotate")) {
    e.preventDefault();
    rotateAction();
    return;
  }
  if (matchHotkey(e, "modePlace")) {
    e.preventDefault();
    state.mode = "place";
    syncModes();
    draw();
    return;
  }
  if (matchHotkey(e, "modeLink")) {
    e.preventDefault();
    state.mode = "link";
    syncModes();
    draw();
    return;
  }
  if (matchHotkey(e, "modeErase")) {
    e.preventDefault();
    state.mode = "erase";
    syncModes();
    draw();
    return;
  }
  if (matchHotkey(e, "delete") || e.code === "Backspace") {
    e.preventDefault();
    if (state.focusId) deleteBuilding(state.focusId);
    return;
  }
  if (matchHotkey(e, "cancel")) {
    e.preventDefault();
    hideCtx();
    state.selected = null;
    state.linkFrom = null;
    state.listeningKey = null;
    syncPalette();
    draw();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === state.hotkeys.pan || e.code === "Space") {
    state.spacePan = false;
    cv.style.cursor = state.mode === "link" ? "crosshair" : "default";
  }
});

(function seed() {
  state.buildings.push(
    { id: "b" + (bid++), type: "raw", gx: 2, gy: 4, w: 2, h: 2, rot: 0 },
    { id: "b" + (bid++), type: "raw", gx: 2, gy: 12, w: 2, h: 2, rot: 0 },
    { id: "b" + (bid++), type: "furnace", gx: 14, gy: 3, w: 3, h: 4, rot: 0 },
    { id: "b" + (bid++), type: "smelter", gx: 14, gy: 12, w: 3, h: 4, rot: 0 },
  );
  state.rails.push(
    { id: "r" + (rid++), fromId: state.buildings[0].id, toId: state.buildings[3].id },
    { id: "r" + (rid++), fromId: state.buildings[1].id, toId: state.buildings[2].id },
  );
})();

renderKeysPanel();
renderPalette();
state.catalog.forEach((c) => getArtImage(c, () => {}));
syncModes();
resize();
</script>
