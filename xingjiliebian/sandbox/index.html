<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星际裂变 · 方格沙盘（初版）</title>
<style>
  :root {
    --bg: #e8ecf1;
    --panel: #fff;
    --line: #c5ccd6;
    --text: #2a3038;
    --muted: #6b7585;
    --accent: #2f9d84;
    --cell: 28px;
    --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .side h1 { margin: 0; font-size: 1.05rem; }
  .side .sub { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.4; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav a, .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: .8rem; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .nav a:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: #e8f6f2; border-color: var(--accent); color: var(--accent); }
  .btn.danger:hover { border-color: #dc2626; color: #dc2626; }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; }
  .palette { display: grid; gap: 6px; }
  .pal {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; background: #fafbfc;
  }
  .pal:hover, .pal.on { border-color: var(--accent); background: #eef8f5; }
  .pal .ico {
    width: 36px; height: 28px; border-radius: 4px;
    box-shadow: 2px 2px 0 rgba(0,0,0,.12);
  }
  .pal .name { font-size: .82rem; font-weight: 600; }
  .pal .sz { font-size: .72rem; color: var(--muted); }
  .status {
    margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: .78rem; color: var(--muted); line-height: 1.45;
  }
  .status strong { color: #b91c1c; }
  .main { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; background: #f3f5f8; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>方格沙盘 · 初版</h1>
    <p class="sub">俯视格子摆厂 + 拉轨道。红线 = 真交叉堵路。建筑是简化色块（非游戏原模），方便先验证沙盘思路。</p>
    <div class="nav">
      <a href="../pc/">合成路线</a>
      <a href="../full/">全链路</a>
      <a href="../?stay=1">入口</a>
    </div>
    <div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">模式</div>
      <div class="modes">
        <button class="btn active" type="button" data-mode="place" id="modePlace">放置</button>
        <button class="btn" type="button" data-mode="link" id="modeLink">连轨</button>
        <button class="btn" type="button" data-mode="erase" id="modeErase">擦除</button>
        <button class="btn" type="button" id="btnClear">清空</button>
      </div>
    </div>
    <div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">建筑（点击选中后点格子放下）</div>
      <div class="palette" id="palette"></div>
    </div>
    <div class="status" id="status">
      交叉：0 对 · 建筑 0 · 轨道 0<br>
      提示：连轨时先点「输出建筑」，再点「输入建筑」。
    </div>
  </aside>
  <main class="main">
    <canvas id="cv"></canvas>
  </main>
</div>
<script>
const CELL = 28;
const COLS = 48;
const ROWS = 32;

/** 简化占地（格），接近公开资料量级，非精确碰撞 */
const CATALOG = [
  { id: "furnace", name: "熔炉", w: 3, h: 4, color: "#c45c26", top: "#e07a3a" },
  { id: "smelter", name: "冶炼厂", w: 3, h: 3, color: "#8b5a2b", top: "#b8834a" },
  { id: "fabricator", name: "制造厂", w: 3, h: 3, color: "#3d6ea8", top: "#5b8ec8" },
  { id: "storage", name: "仓储", w: 2, h: 2, color: "#5a6b7d", top: "#7a8b9d" },
  { id: "raw", name: "原料点", w: 2, h: 2, color: "#c4a35a", top: "#e0c07a" },
  { id: "splitter", name: "调制器3", w: 2, h: 2, color: "#2f9d84", top: "#4db8a0" },
];

const state = {
  mode: "place",
  selected: "furnace",
  buildings: [], // {id, type, gx, gy, w, h}
  rails: [], // {id, fromId, toId}
  linkFrom: null,
  hover: null, // {gx, gy}
  panX: 40,
  panY: 40,
  dragging: false,
  lastX: 0,
  lastY: 0,
  spacePan: false,
};

let bid = 1;
let rid = 1;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const paletteEl = document.getElementById("palette");
const statusEl = document.getElementById("status");

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.floor(r.width * dpr);
  cv.height = Math.floor(r.height * dpr);
  cv.style.width = r.width + "px";
  cv.style.height = r.height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener("resize", resize);

CATALOG.forEach((c) => {
  const el = document.createElement("div");
  el.className = "pal" + (c.id === state.selected ? " on" : "");
  el.dataset.id = c.id;
  el.innerHTML = `<div class="ico" style="background:linear-gradient(145deg,${c.top},${c.color})"></div>
    <div><div class="name">${c.name}</div><div class="sz">${c.w}×${c.h} 格</div></div>
    <div class="sz">选</div>`;
  el.addEventListener("click", () => {
    state.selected = c.id;
    state.mode = "place";
    syncModes();
    [...paletteEl.children].forEach((x) => x.classList.toggle("on", x.dataset.id === c.id));
  });
  paletteEl.appendChild(el);
});

function syncModes() {
  document.querySelectorAll(".modes .btn[data-mode]").forEach((b) => {
    b.classList.toggle("active", b.dataset.mode === state.mode);
  });
  state.linkFrom = null;
}
document.querySelectorAll(".modes .btn[data-mode]").forEach((b) => {
  b.addEventListener("click", () => {
    state.mode = b.dataset.mode;
    syncModes();
    draw();
  });
});
document.getElementById("btnClear").addEventListener("click", () => {
  if (!confirm("清空沙盘？")) return;
  state.buildings = [];
  state.rails = [];
  state.linkFrom = null;
  draw();
});

function cat(type) { return CATALOG.find((c) => c.id === type); }

function screenToGrid(sx, sy) {
  const gx = Math.floor((sx - state.panX) / CELL);
  const gy = Math.floor((sy - state.panY) / CELL);
  return { gx, gy };
}

function buildingAt(gx, gy) {
  for (let i = state.buildings.length - 1; i >= 0; i--) {
    const b = state.buildings[i];
    if (gx >= b.gx && gx < b.gx + b.w && gy >= b.gy && gy < b.gy + b.h) return b;
  }
  return null;
}

function canPlace(type, gx, gy) {
  const c = cat(type);
  if (!c) return false;
  if (gx < 0 || gy < 0 || gx + c.w > COLS || gy + c.h > ROWS) return false;
  for (const b of state.buildings) {
    if (gx < b.gx + b.w && gx + c.w > b.gx && gy < b.gy + b.h && gy + c.h > b.gy) return false;
  }
  return true;
}

function portOut(b) {
  return { x: (b.gx + b.w) * CELL, y: (b.gy + b.h / 2) * CELL };
}
function portIn(b) {
  return { x: b.gx * CELL, y: (b.gy + b.h / 2) * CELL };
}

function nearPt(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y) < 1.5;
}
function segmentsCross(p1, p2, q1, q2) {
  if (nearPt(p1, q1) || nearPt(p1, q2) || nearPt(p2, q1) || nearPt(p2, q2)) return false;
  const dx1 = p2.x - p1.x, dy1 = p2.y - p1.y;
  const dx2 = q2.x - q1.x, dy2 = q2.y - q1.y;
  const cross = dx1 * dy2 - dy1 * dx2;
  if (Math.abs(cross) < 1e-6) return false;
  const t = ((q1.x - p1.x) * dy2 - (q1.y - p1.y) * dx2) / cross;
  const u = ((q1.x - p1.x) * dy1 - (q1.y - p1.y) * dx1) / cross;
  const eps = 0.02;
  return t > eps && t < 1 - eps && u > eps && u < 1 - eps;
}

function railSeg(r) {
  const a = state.buildings.find((b) => b.id === r.fromId);
  const b = state.buildings.find((b) => b.id === r.toId);
  if (!a || !b) return null;
  return { p1: portOut(a), p2: portIn(b), a, b, r };
}

function findCrossings() {
  const segs = state.rails.map(railSeg).filter(Boolean);
  const bad = new Set();
  let pairs = 0;
  for (let i = 0; i < segs.length; i++) {
    for (let j = i + 1; j < segs.length; j++) {
      const A = segs[i], B = segs[j];
      if (A.a.id === B.a.id || A.a.id === B.b.id || A.b.id === B.a.id || A.b.id === B.b.id) continue;
      if (!segmentsCross(A.p1, A.p2, B.p1, B.p2)) continue;
      pairs++;
      bad.add(A.r.id);
      bad.add(B.r.id);
    }
  }
  return { pairs, bad };
}

function drawIsoBlock(gx, gy, w, h, color, top) {
  const x = gx * CELL;
  const y = gy * CELL;
  const pw = w * CELL;
  const ph = h * CELL;
  // 轻微 2.5D：顶面 + 侧面
  ctx.fillStyle = color;
  ctx.fillRect(x, y + 4, pw, ph - 4);
  ctx.fillStyle = top;
  ctx.beginPath();
  ctx.moveTo(x, y + 4);
  ctx.lineTo(x + 6, y);
  ctx.lineTo(x + pw + 6, y);
  ctx.lineTo(x + pw, y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.12)";
  ctx.fillRect(x + pw, y + 4, 6, ph - 4);
  ctx.strokeStyle = "rgba(0,0,0,.25)";
  ctx.strokeRect(x, y + 4, pw, ph - 4);
}

function draw() {
  const w = cv.clientWidth;
  const h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);

  ctx.save();
  ctx.translate(state.panX, state.panY);

  // grid
  ctx.strokeStyle = "#d9dee6";
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, ROWS * CELL);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(COLS * CELL, y * CELL);
    ctx.stroke();
  }

  const { pairs, bad } = findCrossings();

  // rails
  for (const r of state.rails) {
    const seg = railSeg(r);
    if (!seg) continue;
    const crossed = bad.has(r.id);
    ctx.strokeStyle = crossed ? "#dc2626" : "#4b6a88";
    ctx.lineWidth = crossed ? 3 : 2;
    if (crossed) ctx.setLineDash([7, 4]);
    else ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(seg.p1.x, seg.p1.y);
    const mx = (seg.p1.x + seg.p2.x) / 2;
    ctx.bezierCurveTo(mx, seg.p1.y, mx, seg.p2.y, seg.p2.x, seg.p2.y);
    ctx.stroke();
    ctx.setLineDash([]);
    // arrow
    ctx.fillStyle = crossed ? "#dc2626" : "#4b6a88";
    ctx.beginPath();
    ctx.moveTo(seg.p2.x, seg.p2.y);
    ctx.lineTo(seg.p2.x - 8, seg.p2.y - 4);
    ctx.lineTo(seg.p2.x - 8, seg.p2.y + 4);
    ctx.fill();
  }

  // buildings
  for (const b of state.buildings) {
    const c = cat(b.type);
    drawIsoBlock(b.gx, b.gy, b.w, b.h, c.color, c.top);
    ctx.fillStyle = "#fff";
    ctx.font = "600 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(c.name, (b.gx + b.w / 2) * CELL, (b.gy + b.h / 2) * CELL + 6);
    // ports
    const o = portOut(b), i = portIn(b);
    ctx.fillStyle = "#22c55e";
    ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#eab308";
    ctx.beginPath(); ctx.arc(i.x, i.y, 4, 0, Math.PI * 2); ctx.fill();
    if (state.linkFrom === b.id) {
      ctx.strokeStyle = varAccent();
      ctx.lineWidth = 2;
      ctx.strokeRect(b.gx * CELL - 2, b.gy * CELL + 2, b.w * CELL + 4, b.h * CELL);
    }
  }

  // ghost
  if (state.mode === "place" && state.hover) {
    const c = cat(state.selected);
    const ok = canPlace(state.selected, state.hover.gx, state.hover.gy);
    ctx.globalAlpha = 0.45;
    drawIsoBlock(state.hover.gx, state.hover.gy, c.w, c.h, ok ? c.color : "#dc2626", ok ? c.top : "#f87171");
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  statusEl.innerHTML = `交叉：<strong>${pairs}</strong> 对 · 建筑 ${state.buildings.length} · 轨道 ${state.rails.length}<br>` +
    (state.mode === "place" ? "放置：选建筑 → 点空地。中键/空格拖动画布。" :
     state.mode === "link" ? (state.linkFrom ? "已选输出，再点输入建筑。" : "连轨：先点绿色输出侧建筑。") :
     "擦除：点建筑删建筑（连带轨道），点轨道附近可删轨。");
}

function varAccent() { return "#2f9d84"; }

function clientPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

cv.addEventListener("mousemove", (e) => {
  const p = clientPos(e);
  if (state.dragging || state.spacePan && e.buttons === 1) {
    state.panX += e.clientX - state.lastX;
    state.panY += e.clientY - state.lastY;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    draw();
    return;
  }
  const g = screenToGrid(p.x, p.y);
  state.hover = g;
  draw();
});

cv.addEventListener("mousedown", (e) => {
  if (e.button === 1 || (e.button === 0 && state.spacePan)) {
    state.dragging = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    e.preventDefault();
  }
});
window.addEventListener("mouseup", () => { state.dragging = false; });

cv.addEventListener("click", (e) => {
  if (state.spacePan) return;
  const p = clientPos(e);
  const g = screenToGrid(p.x, p.y);

  if (state.mode === "place") {
    if (!canPlace(state.selected, g.gx, g.gy)) return;
    const c = cat(state.selected);
    state.buildings.push({ id: "b" + (bid++), type: c.id, gx: g.gx, gy: g.gy, w: c.w, h: c.h });
    draw();
    return;
  }

  if (state.mode === "link") {
    const hit = buildingAt(g.gx, g.gy);
    if (!hit) return;
    if (!state.linkFrom) {
      state.linkFrom = hit.id;
      draw();
      return;
    }
    if (state.linkFrom === hit.id) { state.linkFrom = null; draw(); return; }
    const exists = state.rails.some((r) => r.fromId === state.linkFrom && r.toId === hit.id);
    if (!exists) state.rails.push({ id: "r" + (rid++), fromId: state.linkFrom, toId: hit.id });
    state.linkFrom = null;
    draw();
    return;
  }

  if (state.mode === "erase") {
    const hit = buildingAt(g.gx, g.gy);
    if (hit) {
      state.buildings = state.buildings.filter((b) => b.id !== hit.id);
      state.rails = state.rails.filter((r) => r.fromId !== hit.id && r.toId !== hit.id);
      draw();
      return;
    }
    // erase nearest rail
    const wx = p.x - state.panX, wy = p.y - state.panY;
    let best = null, bestD = 14;
    for (const r of state.rails) {
      const s = railSeg(r);
      if (!s) continue;
      const d = distToSeg(wx, wy, s.p1, s.p2);
      if (d < bestD) { bestD = d; best = r.id; }
    }
    if (best) {
      state.rails = state.rails.filter((r) => r.id !== best);
      draw();
    }
  }
});

function distToSeg(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { state.spacePan = true; cv.style.cursor = "grab"; }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") { state.spacePan = false; cv.style.cursor = "crosshair"; }
});

// seed demo: two crossing rails to show detection
(function seed() {
  state.buildings.push(
    { id: "b" + (bid++), type: "raw", gx: 2, gy: 4, w: 2, h: 2 },
    { id: "b" + (bid++), type: "raw", gx: 2, gy: 12, w: 2, h: 2 },
    { id: "b" + (bid++), type: "furnace", gx: 14, gy: 3, w: 3, h: 4 },
    { id: "b" + (bid++), type: "smelter", gx: 14, gy: 12, w: 3, h: 3 },
  );
  // intentionally crossed
  state.rails.push(
    { id: "r" + (rid++), fromId: state.buildings[0].id, toId: state.buildings[3].id },
    { id: "r" + (rid++), fromId: state.buildings[1].id, toId: state.buildings[2].id },
  );
})();

resize();
</script>
</body>
</html>
