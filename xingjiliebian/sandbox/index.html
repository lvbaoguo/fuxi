<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星际裂变 · 方格沙盘（初版）</title>
<style>
  :root {
    --bg: #e8ecf1;
    --panel: #fff;
    --line: #c5ccd6;
    --text: #2a3038;
    --muted: #6b7585;
    --accent: #2f9d84;
    --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--text); background: var(--bg); overflow: hidden; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  .side {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .side h1 { margin: 0; font-size: 1.05rem; }
  .side .sub { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.4; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav a, .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: .8rem; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .nav a:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: #e8f6f2; border-color: var(--accent); color: var(--accent); }
  .modes { display: flex; flex-wrap: wrap; gap: 6px; }
  .palette { display: grid; gap: 6px; }
  .palette.reordering { touch-action: none; }
  .pal {
    display: grid; grid-template-columns: 36px 1fr auto auto auto; gap: 4px; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: grab; background: #fafbfc;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .pal:hover, .pal.on { border-color: var(--accent); background: #eef8f5; }
  .pal.dragging {
    opacity: .92; cursor: grabbing; border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(40,50,70,.22); transform: scale(1.02);
    background: #eef8f5; z-index: 2; touch-action: none;
  }
  .pal .ico {
    width: 36px; height: 28px; border-radius: 4px;
    box-shadow: 2px 2px 0 rgba(0,0,0,.12); pointer-events: none;
  }
  .pal .name { font-size: .82rem; font-weight: 600; }
  .pal .sz { font-size: .72rem; color: var(--muted); }
  .pal .edit, .pal .del {
    border: 0; background: transparent; cursor: pointer;
    font-size: .75rem; font-weight: 700; padding: 4px 6px; border-radius: 6px;
  }
  .pal .edit { color: var(--accent); }
  .pal .edit:hover { background: #e8f6f2; }
  .pal .del { color: #b91c1c; }
  .pal .del:hover { background: #fef2f2; }
  .shape-grid {
    display: none;
  }
  .paint-wrap {
    position: relative; display: inline-block; max-width: 100%;
    border: 1px solid var(--line); border-radius: 10px; overflow: auto;
    background: #f3f5f8; touch-action: none;
  }
  .paint-wrap canvas {
    display: block; cursor: crosshair; background:
      linear-gradient(#d9dee6 1px, transparent 1px) 0 0 / var(--pc, 28px) var(--pc, 28px),
      linear-gradient(90deg, #d9dee6 1px, transparent 1px) 0 0 / var(--pc, 28px) var(--pc, 28px),
      #fff;
  }
  .paint-wrap #portCv {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: transparent; pointer-events: none; cursor: crosshair;
  }
  .paint-wrap.port-mode #portCv { pointer-events: auto; }
  .paint-wrap.port-mode #paintCv { cursor: default; }
  .paint-wrap.scale-mode #portCv { pointer-events: auto; cursor: default; }
  .paint-wrap.scale-mode #paintCv { cursor: default; }
  .paint-preview-row {
    display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;
  }
  .paint-preview-slot {
    flex: 0 0 auto;
  }
  .paint-preview-slot .paint-wrap {
    width: 148px;
    user-select: none;
  }
  .paint-preview-slot.is-preview .paint-wrap {
    pointer-events: none;
  }
  .paint-preview-slot .paint-wrap canvas {
    width: 100% !important;
    height: auto !important;
  }
  .paint-preview-slot:not(.is-preview) .paint-wrap canvas {
    cursor: crosshair;
  }
  .paint-tools .btn.on.scale { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
  .port-hint { font-size: .72rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .paint-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .paint-tools .btn.on { background: #e8f6f2; border-color: var(--accent); color: var(--accent); }
  .paint-tools .btn.on.out { background: #ecfdf5; border-color: #16a34a; color: #15803d; }
  .paint-tools .btn.on.in { background: #fffbeb; border-color: #d97706; color: #b45309; }
  .paint-tools label { font-size: .72rem; color: var(--muted); margin: 0; }
  .paint-tools input[type="range"] { width: 88px; }
  .edit-steps {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 12px;
  }
  .edit-steps button {
    border: 1px solid var(--line); background: #f5f7fa; border-radius: 8px;
    padding: 8px 10px; font-size: .8rem; font-weight: 700; cursor: pointer; color: var(--muted);
  }
  .edit-steps button.on {
    background: #e8f6f2; border-color: var(--accent); color: var(--accent);
  }
  .edit-panel { display: none; }
  .edit-panel.on { display: block; }
  .paint-wrap.art-locked #paintCv { cursor: default; }
  .paint-wrap.port-step #portCv { pointer-events: auto; cursor: crosshair; }
  .paint-zoom-mask {
    display: none; position: fixed; inset: 0; z-index: 80;
    background: rgba(20,28,40,.55); align-items: center; justify-content: center;
    padding: 12px;
  }
  .paint-zoom-mask.show { display: flex; }
  .paint-zoom-modal {
    width: min(720px, 96vw); max-height: 94vh; overflow: auto;
    background: #fff; border-radius: 14px; border: 1px solid var(--line);
    box-shadow: 0 20px 48px rgba(20,30,45,.35); padding: 16px 18px;
  }
  .paint-zoom-modal h2 { margin: 0 0 10px; font-size: 1.05rem; }
  .paint-zoom-board {
    display: flex; justify-content: center; margin: 0 0 10px;
    padding: 10px; background: #eef1f5; border-radius: 12px; border: 1px solid var(--line);
    overflow: auto; max-height: min(62vh, 560px);
  }
  .paint-zoom-board .paint-wrap {
    width: min(86vw, 560px);
    pointer-events: auto;
  }
  .paint-zoom-board .paint-wrap canvas {
    width: 100% !important;
    height: auto !important;
  }
  .modal {
    width: min(420px, 94vw); background: #fff; border-radius: 14px;
    border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(40,50,70,.2);
    padding: 16px 18px; max-height: 92vh; overflow: auto;
  }
  .modal-mask {
    display: none; position: fixed; inset: 0; z-index: 60;
    background: rgba(30,40,55,.35); align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal h2 { margin: 0 0 12px; font-size: 1rem; }
  .modal label { display: block; font-size: .78rem; color: var(--muted); margin: 0 0 4px; }
  .modal .field { margin: 0 0 12px; }
  .modal input[type="text"], .modal input[type="number"] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .9rem;
  }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .color-row { display: flex; align-items: center; gap: 10px; }
  .modal input[type="color"] { width: 48px; height: 36px; border: 0; padding: 0; background: transparent; cursor: pointer; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .modal .preview {
    height: 40px; border-radius: 8px; border: 1px solid var(--line);
    box-shadow: 2px 2px 0 rgba(0,0,0,.1);
  }
  .keys {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    background: #fafbfc; font-size: .75rem;
  }
  .keys h3 { margin: 0 0 6px; font-size: .8rem; }
  .keys .row {
    display: grid; grid-template-columns: 1fr 72px; gap: 6px; align-items: center;
    margin: 0 0 4px; color: var(--muted);
  }
  .keys button.keycap {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 4px 6px; font-size: .72rem; font-weight: 700; cursor: pointer; color: var(--text);
  }
  .keys button.keycap.listening { border-color: var(--accent); color: var(--accent); background: #e8f6f2; }
  .keys .hint { color: var(--muted); font-size: .7rem; margin-top: 4px; }
  .status {
    margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: .78rem; color: var(--muted); line-height: 1.45;
  }
  .status strong { color: #b91c1c; }
  .main { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; background: #f3f5f8; }
  .ctx {
    display: none; position: fixed; z-index: 50; min-width: 150px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(40,50,70,.18); padding: 4px; overflow: hidden;
  }
  .ctx.show { display: block; }
  .ctx button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 9px 12px; font-size: .85rem; cursor: pointer; color: var(--text); border-radius: 8px;
  }
  .ctx button:hover { background: #eef6f3; }
  .ctx button.danger { color: #b91c1c; }
  .ctx button.danger:hover { background: #fef2f2; }
  .ctx .sep { height: 1px; background: var(--line); margin: 4px 0; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>方格沙盘 · 初版</h1>
    <p class="sub">点「改」打开画像画板：画外形后，用绿/黄工具在画像上点放进出口。</p>
    <div class="nav">
      <a href="../pc/?v=20260803">合成路线</a>
      <a href="../?stay=1">入口</a>
    </div>
    <div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">模式</div>
      <div class="modes">
        <button class="btn" type="button" data-mode="place" id="modePlace">放置</button>
        <button class="btn active" type="button" data-mode="link" id="modeLink">连轨</button>
        <button class="btn" type="button" data-mode="erase" id="modeErase">擦除</button>
        <button class="btn" type="button" id="btnRot">旋转</button>
        <button class="btn" type="button" id="btnClear">清空</button>
      </div>
    </div>
    <div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span>建筑（点选放置 · 长按拖动排序）</span>
      </div>
      <button class="btn" type="button" id="btnCustom" style="width:100%;margin-bottom:8px">+ 自定义建筑</button>
      <div class="palette" id="palette"></div>
      <button class="btn" type="button" id="btnRestoreCatalog" style="width:100%;margin-top:8px">恢复默认建筑列表</button>
    </div>
    <div class="keys" id="keysPanel">
      <h3>快捷键（点右侧改键）</h3>
      <div id="keysList"></div>
      <div class="hint">拖动画布：按住空格拖，或中键拖。删除：右键菜单 / Delete。</div>
      <button class="btn" type="button" id="btnResetKeys" style="margin-top:8px;width:100%">恢复默认快捷键</button>
    </div>
    <div class="status" id="status">就绪</div>
  </aside>
  <main class="main">
    <canvas id="cv"></canvas>
  </main>
</div>
<div class="ctx" id="ctxMenu" role="menu">
  <button type="button" data-act="rotate">旋转</button>
  <button type="button" data-act="delete" class="danger">清除建筑</button>
  <div class="sep"></div>
  <button type="button" data-act="cancel">取消</button>
</div>
<div class="modal-mask" id="customModal">
  <div class="modal" role="dialog" aria-labelledby="customTitle">
    <h2 id="customTitle">自定义建筑</h2>
    <div class="edit-steps">
      <button type="button" class="on" id="stepArtBtn">① 编辑画像</button>
      <button type="button" id="stepPortBtn">② 安进出口</button>
    </div>
    <div class="field">
      <label for="customName">名称</label>
      <input id="customName" type="text" maxlength="12" placeholder="例如：缓冲仓" value="自定义" />
    </div>
    <div class="field">
      <label>建筑颜色</label>
      <div class="color-row">
        <input id="customColor" type="color" value="#7c5cff" />
        <div class="preview" id="customPreview" style="flex:1;background:#7c5cff"></div>
      </div>
    </div>
    <div class="field row2">
      <div>
        <label for="customW">宽（格）</label>
        <input id="customW" type="number" min="1" max="12" value="3" />
      </div>
      <div>
        <label for="customH">高（格）</label>
        <input id="customH" type="number" min="1" max="12" value="3" />
      </div>
    </div>
    <div class="field">
      <label id="paintAreaLabel">建筑画像</label>
      <div class="paint-preview-row">
        <div class="paint-preview-slot" id="paintPreviewSlot">
          <div class="paint-wrap" id="paintWrap">
            <canvas id="paintCv" width="84" height="84"></canvas>
            <canvas id="portCv" width="84" height="84"></canvas>
          </div>
        </div>
        <button class="btn active" type="button" id="btnExpandPaint" style="display:none">放大编辑进出口</button>
      </div>
      <div class="edit-panel on" id="panelArt">
        <div class="paint-tools">
          <button class="btn on" type="button" id="paintBrush">画笔</button>
          <button class="btn" type="button" id="paintEraser">橡皮</button>
          <label>粗细</label>
          <input id="paintSize" type="range" min="4" max="48" value="16" />
          <button class="btn" type="button" id="paintClear">清空画像</button>
          <button class="btn" type="button" id="paintBlob">一键圆润</button>
          <button class="btn" type="button" id="paintScale">缩放</button>
        </div>
        <p class="port-hint">直接在上方预览里改外形。进出口请点「② 安进出口」后放大编辑。</p>
      </div>
      <p class="port-hint" id="paintPreviewHint" style="display:none">进出口请点「放大编辑进出口」在大画布上安口，确定后回预览。</p>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="customCancel">取消</button>
      <button class="btn" type="button" id="customBack" style="display:none">上一步</button>
      <button class="btn active" type="button" id="customOk">下一步 · 安进出口</button>
    </div>
  </div>
</div>
<div class="paint-zoom-mask" id="paintZoomMask">
  <div class="paint-zoom-modal" role="dialog" aria-labelledby="paintZoomTitle">
    <h2 id="paintZoomTitle">放大编辑 · 进出口</h2>
    <div class="paint-zoom-board" id="paintZoomBoard"></div>
    <div class="edit-panel on" id="panelPort">
      <div class="paint-tools">
        <button class="btn" type="button" id="paintPortOut">绿·出口</button>
        <button class="btn" type="button" id="paintPortIn">黄·入口</button>
        <button class="btn" type="button" id="paintPortAdd">增加新口</button>
        <button class="btn" type="button" id="paintPortDel">删选中口</button>
      </div>
      <p class="port-hint">点绿/黄选中（再点一次取消）。选中后可点空白或「增加新口」加口；未选中时点空白不会加口，仍可拖已有竖条。「删选中口」删除。</p>
    </div>
    <div class="actions">
      <button class="btn active" type="button" id="paintZoomOk">确定 · 回到预览</button>
    </div>
  </div>
</div>
<script>
const CELL = 28;
const COLS = 48;
const ROWS = 32;
const PORT_R = 7;
const PORT_HIT = 20; // 基础命中；近邻口会再按间距收紧
const PORT_MAX = 8;
const RAIL_END_HIT = 16;
const RAIL_HOLD_MS = 380;
const KEYS_LS = "starrupture_sandbox_hotkeys_v1";
const CATALOG_LS = "starrupture_sandbox_catalog_v3";
const CATALOG_LS_OLD = ["starrupture_sandbox_catalog_v2", "starrupture_sandbox_catalog_v1"];
const HIT_SUB = 4; // 每格细分，碰撞按画像采样

function fullMask(w, h) { return "1".repeat(w * h); }
function fullHit(w, h) { return "1".repeat(w * h * HIT_SUB * HIT_SUB); }

function makePaintCanvas(w, h) {
  const cnv = document.createElement("canvas");
  cnv.width = Math.max(1, w) * CELL;
  cnv.height = Math.max(1, h) * CELL;
  return cnv;
}
function roundRectPath(g, x, y, rw, rh, r) {
  const rr = Math.min(r, rw / 2, rh / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + rw, y, x + rw, y + rh, rr);
  g.arcTo(x + rw, y + rh, x, y + rh, rr);
  g.arcTo(x, y + rh, x, y, rr);
  g.arcTo(x, y, x + rw, y, rr);
  g.closePath();
}
function paintDefaultSilhouette(g, w, h, recipe) {
  const W = w * CELL, H = h * CELL;
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#111";
  if (recipe === "circle" || (recipe === "fabricator")) {
    g.beginPath();
    g.ellipse(W / 2, H / 2, W * 0.36, H * 0.36, 0, 0, Math.PI * 2);
    g.fill();
    return;
  }
  if (recipe === "smelter") {
    // 阶梯：后柱 + 前主体（圆角）
    roundRectPath(g, W * 0.28, H * 0.06, W * 0.44, H * 0.42, 10);
    g.fill();
    roundRectPath(g, W * 0.12, H * 0.32, W * 0.76, H * 0.58, 14);
    g.fill();
    return;
  }
  if (recipe === "furnace") {
    roundRectPath(g, W * 0.1, H * 0.08, W * 0.8, H * 0.55, 12);
    g.fill();
    roundRectPath(g, W * 0.22, H * 0.48, W * 0.56, H * 0.42, 10);
    g.fill();
    return;
  }
  // 默认圆角矩形，略缩边，方便穿线
  roundRectPath(g, W * 0.08, H * 0.08, W * 0.84, H * 0.84, Math.min(W, H) * 0.18);
  g.fill();
}
function canvasToHit(cnv, w, h) {
  const hw = w * HIT_SUB, hh = h * HIT_SUB;
  const tmp = document.createElement("canvas");
  tmp.width = hw;
  tmp.height = hh;
  const tg = tmp.getContext("2d");
  tg.clearRect(0, 0, hw, hh);
  tg.drawImage(cnv, 0, 0, hw, hh);
  const data = tg.getImageData(0, 0, hw, hh).data;
  let s = "";
  for (let i = 0; i < hw * hh; i++) s += data[i * 4 + 3] > 24 ? "1" : "0";
  if (![...s].some((ch) => ch === "1")) return fullHit(w, h);
  return s;
}
function canvasToArt(cnv) {
  return cnv.toDataURL("image/png");
}
function maskToArtAndHit(mask, w, h) {
  const cnv = makePaintCanvas(w, h);
  const g = cnv.getContext("2d");
  g.clearRect(0, 0, cnv.width, cnv.height);
  g.fillStyle = "#111";
  const m = (mask && mask.length === w * h) ? mask : fullMask(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (m[y * w + x] !== "1") continue;
      roundRectPath(g, x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4, 6);
      g.fill();
    }
  }
  return { art: canvasToArt(cnv), hit: canvasToHit(cnv, w, h), mask: m };
}
function bakeRecipe(recipe, w, h) {
  const cnv = makePaintCanvas(w, h);
  paintDefaultSilhouette(cnv.getContext("2d"), w, h, recipe);
  const art = canvasToArt(cnv);
  const hit = canvasToHit(cnv, w, h);
  // 粗 mask：子格有墨则整格算占（仅兼容旧逻辑/标签）
  let mask = "";
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let on = false;
      for (let sy = 0; sy < HIT_SUB && !on; sy++) {
        for (let sx = 0; sx < HIT_SUB; sx++) {
          if (hit[(y * HIT_SUB + sy) * (w * HIT_SUB) + (x * HIT_SUB + sx)] === "1") { on = true; break; }
        }
      }
      mask += on ? "1" : "0";
    }
  }
  if (![...mask].some((ch) => ch === "1")) mask = fullMask(w, h);
  return { art, hit, mask };
}

const DEFAULT_CATALOG = [
  {
    id: "furnace", name: "熔炉", w: 3, h: 4, color: "#c45c26", top: "#e07a3a",
    recipe: "furnace",
    ports: { out: [{ x: 1, y: 0.62 }], in: [{ x: 0, y: 0.62 }] },
  },
  {
    id: "smelter", name: "冶炼厂", w: 3, h: 4, color: "#5b9fd4", top: "#7eb8e8",
    recipe: "smelter",

function lightenHex(hex, amt) {
  const h = (hex || "#888888").replace("#", "");
  if (h.length !== 6) return "#bbbbbb";
  const n = parseInt(h, 16);
  let r = (n >> 16) + amt;
  let g = ((n >> 8) & 0xff) + amt;
  let b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function normalizeMask(mask, w, h, fallback) {

  if (![...mask].some((ch) => ch === "1")) return fb;

  if (side === "W") return { x: 0, y: t };

    return {
      x: Math.max(0, Math.min(1, Number(p.x))),
      y: Math.max(0, Math.min(1, Number(p.y))),

  }
  const fromSide = sidePortToXY(p);
  if (fromSide) return fromSide;
  if (fb && Number.isFinite(Number(fb.x)) && Number.isFinite(Number(fb.y))) {
    return {
      x: Math.max(0, Math.min(1, Number(fb.x))),
      y: Math.max(0, Math.min(1, Number(fb.y))),

function normalizeCatalogItem(c) {

  const w = Math.max(1, Math.min(12, Number(c.w) || (base && base.w) || 2));
  const h = Math.max(1, Math.min(12, Number(c.h) || (base && base.h) || 2));

  let art = typeof c.art === "string" && c.art.startsWith("data:image") ? c.art : null;

  if (rot === 1) return { x: h - 1 - y, y: x };

  if (rot === 3) return { x: y, y: w - 1 - x };

  const c = cat(b.type);

    for (let dy = 0; dy < b.h * HIT_SUB; dy++) {
      for (let dx = 0; dx < b.w * HIT_SUB; dx++) keys.push((b.gx * HIT_SUB + dx) + "," + (b.gy * HIT_SUB + dy));
    }
    return keys;
  }
  const uw = c.w * HIT_SUB, uh = c.h * HIT_SUB;
  const rot = b.rot || 0;
  const hit = c.hit;
  for (let y = 0; y < uh; y++) {
    for (let x = 0; x < uw; x++) {
      if (hit[y * uw + x] !== "1") continue;
      const r = rotateHitXY(x, y, uw, uh, rot);

function portWorld(b, kind, index) {

  const rawIdx = Number(index);
  const idx = Math.max(0, Math.min(list.length - 1, Number.isFinite(rawIdx) ? rawIdx : 0));
  const p = list.length ? list[idx] : defaultPort(kind);
  const uw = c ? c.w : b.w;
  const uh = c ? c.h : b.h;
  const lx = p.x * uw;
  const ly = p.y * uh;
  const rot = b.rot || 0;
  let rx = lx, ry = ly;
  if (rot === 1) { rx = uh - ly; ry = lx; }
  else if (rot === 2) { rx = uw - lx; ry = uh - ly; }

function portOutwardDir(b, kind, index) {
  const c = cat(b.type);

  const rawIdx = Number(index);
  const idx = Math.max(0, Math.min(list.length - 1, Number.isFinite(rawIdx) ? rawIdx : 0));
  const p = list[idx] || defaultPort(kind);
  const dL = p.x, dR = 1 - p.x, dT = p.y, dB = 1 - p.y;
  const m = Math.min(dL, dR, dT, dB);
  let lx = 0, ly = -1;
  if (m === dB) { lx = 0; ly = 1; }
  else if (m === dL) { lx = -1; ly = 0; }
  else if (m === dR) { lx = 1; ly = 0; }
  else { lx = 0; ly = -1; }
  const rot = b.rot || 0;
  if (rot === 1) return { x: -ly, y: lx };
  if (rot === 2) return { x: -lx, y: -ly };

/** 导线：从两端各自沿口法线离开，终点严格落在口心，避免中点汇聚造成「接到邻口」错觉 */
function strokeRailCurve(g, p1, p2, dir1, dir2) {
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const pull = Math.max(16, Math.min(56, dist * 0.35));
  const d1 = dir1 || { x: 0, y: Math.sign(p2.y - p1.y) || 1 };
  const d2 = dir2 || { x: 0, y: Math.sign(p1.y - p2.y) || -1 };
  g.beginPath();
  g.moveTo(p1.x, p1.y);
  g.bezierCurveTo(
    p1.x + d1.x * pull,
    p1.y + d1.y * pull,
    p2.x + d2.x * pull,
    p2.y + d2.y * pull,
    p2.x,
    p2.y

function commitPaletteOrder() {

  const map = new Map(state.catalog.map((c) => [c.id, c]));

function bindPaletteLongPress(el) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (e.target.closest("[data-del], [data-edit]")) return;
    if (palDrag) return;
    const startX = e.clientX;
    const startY = e.clientY;
    const pointerId = e.pointerId;
    palDrag = {
      el,
      timer: null,
      active: false,
      moved: false,
      startX,
      startY,
      pointerId,
    };
    palDrag.timer = setTimeout(() => {
      if (!palDrag || palDrag.el !== el) return;
      palDrag.active = true;
      palDrag.moved = true;
      el.classList.add("dragging");
      paletteEl.classList.add("reordering");
      try { el.setPointerCapture(pointerId); } catch (_) {}
    }, LONG_PRESS_MS);

    const onMove = (ev) => {
      if (!palDrag || palDrag.el !== el) return;
      const dx = ev.clientX - palDrag.startX;
      const dy = ev.clientY - palDrag.startY;
      if (!palDrag.active) {
        if (Math.hypot(dx, dy) > 8) {
          clearTimeout(palDrag.timer);
          palDrag.timer = null;
          cleanup();
        }
        return;
      }
      ev.preventDefault();
      const y = ev.clientY;
      const others = [...paletteEl.querySelectorAll(".pal")].filter((x) => x !== el);
      let before = null;
      for (const item of others) {
        const r = item.getBoundingClientRect();
        if (y < r.top + r.height / 2) {
          before = item;
          break;
        }
      }
      if (before) paletteEl.insertBefore(el, before);
      else paletteEl.appendChild(el);
    };

    const cleanup = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (!palDrag || palDrag.el !== el) return;
      if (palDrag.timer) clearTimeout(palDrag.timer);
      const didReorder = palDrag.active;
      el.classList.remove("dragging");
      paletteEl.classList.remove("reordering");
      if (didReorder) commitPaletteOrder();
      if (palDrag.moved) el.dataset.skipClick = "1";
      palDrag = null;
    };

    const onUp = () => cleanup();

    document.addEventListener("pointermove", onMove, { passive: false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

function getPaintContentBBox() {
  const w = paintCv.width, h = paintCv.height;
  if (!w || !h) return null;
  let data;
  try { data = paintCtx.getImageData(0, 0, w, h).data; } catch (_) { return null; }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 24) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}
function refreshScaleBox() {
  scaleBox = getPaintContentBBox();
}
function clampScaleBox(box) {
  const cw = paintCv.width, ch = paintCv.height;
  let { x, y, w, h } = box;
  w = Math.max(SCALE_MIN, Math.min(cw, w));
  h = Math.max(SCALE_MIN, Math.min(ch, h));
  x = Math.max(0, Math.min(cw - w, x));
  y = Math.max(0, Math.min(ch - h, y));
  return { x, y, w, h };
}
function extractPaintRegion(box) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(box.w));
  c.height = Math.max(1, Math.round(box.h));
  c.getContext("2d").drawImage(
    paintCv,
    box.x, box.y, box.w, box.h,
    0, 0, c.width, c.height
  );
  return c;
}
function paintScaledContent(content, box) {
  paintCtx.clearRect(0, 0, paintCv.width, paintCv.height);
  paintCtx.drawImage(content, 0, 0, content.width, content.height, box.x, box.y, box.w, box.h);
}
function scaleHandlePoints(box) {
  if (!box) return [];
  const x0 = box.x, y0 = box.y, x1 = box.x + box.w, y1 = box.y + box.h;
  return [
    { id: "nw", x: x0, y: y0, cursor: "nwse-resize" },
    { id: "ne", x: x1, y: y0, cursor: "nesw-resize" },
    { id: "sw", x: x0, y: y1, cursor: "nesw-resize" },
    { id: "se", x: x1, y: y1, cursor: "nwse-resize" },
  ];
}
function hitScaleHandle(p) {
  if (!scaleBox) return null;
  const hitR = SCALE_HANDLE + 6;
  for (const h of scaleHandlePoints(scaleBox)) {
    if (Math.hypot(p.x - h.x, p.y - h.y) <= hitR) return h.id;
  }
  if (
    p.x >= scaleBox.x && p.x <= scaleBox.x + scaleBox.w &&
    p.y >= scaleBox.y && p.y <= scaleBox.y + scaleBox.h
  ) return "move";
  return null;
}
function boxFromCornerDrag(startBox, corner, px, py) {
  const x0 = startBox.x, y0 = startBox.y;
  const x1 = startBox.x + startBox.w, y1 = startBox.y + startBox.h;
  let L = x0, T = y0, R = x1, B = y1;
  if (corner === "nw") { L = px; T = py; }
  else if (corner === "ne") { R = px; T = py; }
  else if (corner === "sw") { L = px; B = py; }
  else if (corner === "se") { R = px; B = py; }
  if (R - L < SCALE_MIN) {
    if (corner === "nw" || corner === "sw") L = R - SCALE_MIN;
    else R = L + SCALE_MIN;
  }
  if (B - T < SCALE_MIN) {
    if (corner === "nw" || corner === "ne") T = B - SCALE_MIN;
    else B = T + SCALE_MIN;
  }
  return clampScaleBox({ x: L, y: T, w: R - L, h: B - T });
}
function drawDraftPorts() {
  const w = portCv.width, h = portCv.height;
  portCtx.clearRect(0, 0, w, h);
  if (editStep === 1 && paintTool === "scale" && scaleBox) {
    const b = scaleBox;
    portCtx.save();
    portCtx.strokeStyle = "rgba(99,102,241,.95)";
    portCtx.lineWidth = 1.5;
    portCtx.setLineDash([5, 4]);
    portCtx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    portCtx.setLineDash([]);
    // 半透明遮罩框外（微信裁剪感）
    portCtx.fillStyle = "rgba(30,40,55,.18)";
    portCtx.fillRect(0, 0, w, b.y);
    portCtx.fillRect(0, b.y + b.h, w, h - (b.y + b.h));
    portCtx.fillRect(0, b.y, b.x, b.h);
    portCtx.fillRect(b.x + b.w, b.y, w - (b.x + b.w), b.h);
    for (const hp of scaleHandlePoints(b)) {
      portCtx.beginPath();
      portCtx.rect(hp.x - SCALE_HANDLE / 2, hp.y - SCALE_HANDLE / 2, SCALE_HANDLE, SCALE_HANDLE);
      portCtx.fillStyle = "#fff";
      portCtx.fill();
      portCtx.lineWidth = 1.5;
      portCtx.strokeStyle = "#6366f1";
      portCtx.stroke();
    }
    portCtx.restore();
  }
  // 安口步才画可选中态；画像步只淡淡预览口位置
  const scale = Math.min(w, h) / 84;
  const drawList = (list, kind) => {
    (list || []).forEach((p, i) => {
      const sel = editStep === 2 && draftPortSel && draftPortSel.kind === kind && draftPortSel.index === i;
      if (editStep === 1) {
        portCtx.globalAlpha = 0.45;
        drawPortBarOn(portCtx, p.x * w, p.y * h, p.x, p.y, kind, false, scale);
        portCtx.globalAlpha = 1;
      } else {
        drawPortBarOn(portCtx, p.x * w, p.y * h, p.x, p.y, kind, !!sel, scale);

  drawList(draftPorts.in, "in");

function readModalSize() {

function paintPos(e) {
  const r = paintCv.getBoundingClientRect();

    x: (e.clientX - r.left) * scaleX,

function strokePaint(from, to) {
  const size = Number(document.getElementById("paintSize").value) || 16;

  paintCtx.moveTo(from.x, from.y);

function resizePaintBoard(keepContent) {

function loadArtToPaint(art, w, h) {

function exportPaintPayload(w, h) {

    for (let x = 0; x < w; x++) {
      let on = false;
      for (let sy = 0; sy < HIT_SUB && !on; sy++) {
        for (let sx = 0; sx < HIT_SUB; sx++) {
          if (hit[(y * HIT_SUB + sy) * hw + (x * HIT_SUB + sx)] === "1") { on = true; break; }
        }
      }
      mask += on ? "1" : "0";
    }
  }
  if (![...mask].some((ch) => ch === "1")) {

  if (state.railDrag && state.mouseWorld) {
    const r = state.rails.find((x) => x.id === state.railDrag.id);
    const seg = r ? railSeg(r) : null;
    if (seg) {
      const fixed = state.railDrag.end === "from" ? seg.p2 : seg.p1;
      const fixedDir = state.railDrag.end === "from"
        ? portOutwardDir(seg.b, "in", seg.toPort)
        : portOutwardDir(seg.a, "out", seg.fromPort);
      const wantKind = state.railDrag.end === "from" ? "out" : "in";
      const hp = hitPort(state.mouseWorld.x, state.mouseWorld.y, {
        kind: wantKind,
        excludeBuildingId: state.railDrag.end === "from" ? r.toId : r.fromId,
      });
      const tip = hp ? hp.pos : state.mouseWorld;
      const tipDir = hp ? portOutwardDir(hp.building, hp.kind, hp.index) : { x: 0, y: 0 };
      ctx.strokeStyle = "#2f9d84";
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 4]);
      strokeRailCurve(ctx, fixed, tip, fixedDir, tipDir);
      ctx.setLineDash([]);
    }
  }

  if (state.linkFrom && state.mouseWorld) {
    const b = state.buildings.find((x) => x.id === state.linkFrom.buildingId);
    if (b) {
      const fromIdx = Number.isFinite(state.linkFrom.portIndex) ? state.linkFrom.portIndex : 0;
      const o = portWorld(b, "out", fromIdx);
      const d1 = portOutwardDir(b, "out", fromIdx);
      const hp = hitPort(state.mouseWorld.x, state.mouseWorld.y, {
        kind: "in",
        excludeBuildingId: b.id,
      });
      const tip = hp ? hp.pos : state.mouseWorld;
      const d2 = hp ? portOutwardDir(hp.building, "in", hp.index) : { x: 0, y: 0 };
      ctx.strokeStyle = "#2f9d84";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      strokeRailCurve(ctx, o, tip, d1, d2);
      ctx.setLineDash([]);
    }
  }

  const hoverPort = state.mouseWorld ? hitPort(state.mouseWorld.x, state.mouseWorld.y) : null;
  for (const b of state.buildings) {
    const c = cat(b.type);
    if (!c) continue;
    drawBuildingBody(b, c.color, c.top, b.id === state.focusId, true);
    ctx.fillStyle = "#fff";
    ctx.font = "600 11px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const cells = worldCellsOf(b);
    const ax = cells.reduce((s, p) => s + p.x, 0) / (cells.length || 1);
    const ay = cells.reduce((s, p) => s + p.y, 0) / (cells.length || 1);
    ctx.fillText(c.name, (ax + 0.5) * CELL, (ay + 0.5) * CELL);
    for (const kind of ["out", "in"]) {
      const list = normalizePortList(c.ports && c.ports[kind], kind);
      list.forEach((p, index) => {
        const pos = portWorld(b, kind, index);
        const ho = hoverPort && hoverPort.building.id === b.id && hoverPort.kind === kind && hoverPort.index === index;
        const selOut = state.linkFrom && state.linkFrom.buildingId === b.id
          && kind === "out" && (Number.isFinite(state.linkFrom.portIndex) ? state.linkFrom.portIndex : 0) === index;
        drawPort(pos, kind, ho || selOut, p.x, p.y);
      });
    }
  }

  if (state.mode === "place" && state.selected && state.hover && !state.moving) {
    const d = dimsFor(state.selected, state.placeRot);
    const c = cat(state.selected);
    const ok = canPlace(state.selected, state.hover.gx, state.hover.gy, state.placeRot);
    const ghost = {
      gx: state.hover.gx, gy: state.hover.gy, w: d.w, h: d.h,
      rot: state.placeRot, type: state.selected,
    };
    ctx.globalAlpha = 0.5;
    drawBuildingBody(ghost, ok ? c.color : "#dc2626", ok ? c.top : "#f87171", false, true);
    ctx.globalAlpha = 1;
    if (c) {
      for (const kind of ["out", "in"]) {
        const list = normalizePortList(c.ports && c.ports[kind], kind);
        list.forEach((p, index) => {
          drawPort(portWorld(ghost, kind, index), kind, false, p.x, p.y);
        });
      }
    }
  }

  ctx.restore();

  const focus = getFocusBuilding();
  statusEl.innerHTML = `交叉：<strong>${pairs}</strong> 对 · 建筑 ${state.buildings.length} · 轨道 ${state.rails.length}` +
    (focus ? ` · 焦点：${cat(focus.type).name}` : "") + "<br>" +
    (state.mode === "place"
      ? (state.selected ? `放置中 · 朝向 ${state.placeRot * 90}° · 拖已有建筑可移动` : "请先点左侧建筑；拖已有建筑可移动")
      : state.mode === "link"
        ? (state.railDrag
          ? (state.railDrag.end === "from" ? "拖线中：接到绿色出口" : "拖线中：接到黄色入口")
          : (state.linkFrom ? "已点绿口，再点黄口（可点具体某一个口）" : "连轨：绿出口→黄入口；改接请拖线端或长按轨道"))
        : "擦除：点建筑/轨道；也可用右键清除");
}

function clientPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function hideCtx() {
  ctxMenu.classList.remove("show");
  state.ctxTargetId = null;
}
function showCtx(clientX, clientY, buildingId) {
  state.ctxTargetId = buildingId;
  state.focusId = buildingId;
  ctxMenu.classList.add("show");
  const pad = 8;
  const mw = ctxMenu.offsetWidth || 160;
  const mh = ctxMenu.offsetHeight || 120;
  let x = clientX;
  let y = clientY;
  if (x + mw > window.innerWidth - pad) x = window.innerWidth - mw - pad;
  if (y + mh > window.innerHeight - pad) y = window.innerHeight - mh - pad;
  ctxMenu.style.left = x + "px";
  ctxMenu.style.top = y + "px";
  draw();
}

ctxMenu.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const id = state.ctxTargetId;
  hideCtx();
  if (!id) return;
  if (act === "delete") deleteBuilding(id);
  if (act === "rotate") {
    const b = state.buildings.find((x) => x.id === id);
    if (b) rotateBuilding(b);
  }
});
document.addEventListener("click", (e) => {
  if (!ctxMenu.contains(e.target)) hideCtx();
});

cv.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const p = clientPos(e);
  const g = screenToGrid(p.x, p.y);
  const hit = buildingAt(g.gx, g.gy);
  if (hit) showCtx(e.clientX, e.clientY, hit.id);
  else hideCtx();
});

cv.addEventListener("mousemove", (e) => {
  const p = clientPos(e);
  state.hover = screenToGrid(p.x, p.y);
  state.mouseWorld = toWorld(p.x, p.y);

  if (state.panning) {
    state.panX += e.clientX - state.lastX;
    state.panY += e.clientY - state.lastY;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    draw();
    return;
  }

  if (state.railHold && Math.hypot(e.clientX - state.railHold.cx, e.clientY - state.railHold.cy) > 6) {
    clearRailHold();
  }

  if (state.railDrag) {
    if (state.mouseWorld && state.railDrag.ox != null) {
      if (Math.hypot(state.mouseWorld.x - state.railDrag.ox, state.mouseWorld.y - state.railDrag.oy) > 6) {
        state.railDrag.moved = true;
      }
    } else {
      state.railDrag.moved = true;
    }
    cv.style.cursor = "grabbing";
    draw();
    return;
  }

  if (state.moving) {
    const b = state.buildings.find((x) => x.id === state.moving.id);
    if (b) {
      const dx = e.clientX - state.moving.startX;
      const dy = e.clientY - state.moving.startY;
      if (Math.hypot(dx, dy) > 4) state.moving.dragged = true;
      const gx = state.hover.gx - state.moving.ox;
      const gy = state.hover.gy - state.moving.oy;
      if (canMoveTo(b, gx, gy)) {
        b.gx = gx;
        b.gy = gy;
      }
    }
    cv.style.cursor = "grabbing";
    draw();
    return;
  }

  const hp = state.mouseWorld ? hitPort(state.mouseWorld.x, state.mouseWorld.y) : null;
  const re = state.mouseWorld ? hitRailEnd(state.mouseWorld.x, state.mouseWorld.y) : null;
  const onBuild = state.hover && buildingAt(state.hover.gx, state.hover.gy);
  if (state.mode === "link" && (hp || re)) cv.style.cursor = "pointer";
  else if (onBuild && !hp) cv.style.cursor = "grab";
  else cv.style.cursor = state.mode === "link" ? "crosshair" : "default";
  draw();
});

let skipClick = false;

cv.addEventListener("mousedown", (e) => {
  if (e.button === 1 || (e.button === 0 && state.spacePan)) {
    state.panning = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  hideCtx();
  clearRailHold();
  const p = clientPos(e);
  const world = toWorld(p.x, p.y);
  const g = screenToGrid(p.x, p.y);
  const hp = hitPort(world.x, world.y);

  if (state.mode === "link") {
    // 点在口上：只走「新建连轨」click，绝不抢成改旧线
    // （旧线终点就在黄口上，若先判端点会把原料2连口2误判成拖动原料1的线）
    if (hp) return;

    // 端点拖改接：仅当没点中口时
    const re = hitRailEnd(world.x, world.y);
    if (re) {
      state.linkFrom = null;
      state.railDrag = { id: re.rail.id, end: re.end, moved: false, ox: world.x, oy: world.y };
      e.preventDefault();
      draw();
      return;
    }
    // 长按轨道中段 → 拖较近端点改接
    const body = hitRailBody(world.x, world.y);
    if (body) {
      state.railHold = {
        cx: e.clientX,
        cy: e.clientY,
        timer: setTimeout(() => {
          if (!state.railHold) return;
          state.railDrag = { id: body.rail.id, end: body.end, moved: false };
          state.railHold = null;
          state.linkFrom = null;
          skipClick = true;
          draw();
        }, RAIL_HOLD_MS),
      };
      e.preventDefault();
      return;
    }
  }

  const hit = buildingAt(g.gx, g.gy);
  if (hit && !hp) {
    state.focusId = hit.id;
    state.moving = {
      id: hit.id,
      ox: g.gx - hit.gx,
      oy: g.gy - hit.gy,
      startX: e.clientX,
      startY: e.clientY,
      dragged: false,
    };
    e.preventDefault();
  }
});

window.addEventListener("mouseup", () => {
  clearRailHold();
  if (state.railDrag) {
    const drag = state.railDrag;
    state.railDrag = null;
    const world = state.mouseWorld;
    const r = state.rails.find((x) => x.id === drag.id);
    let rewired = false;
    if (r && world) {
      const moved = drag.moved || (drag.ox != null && Math.hypot(world.x - drag.ox, world.y - drag.oy) > 6);
      if (moved) {
        if (drag.end === "from") {
          const hp = hitPort(world.x, world.y, { kind: "out", excludeBuildingId: r.toId });
          if (hp) {
            r.fromId = hp.building.id;
            r.fromPort = hp.index;
            rewired = true;
          }
        } else {
          const hp = hitPort(world.x, world.y, { kind: "in", excludeBuildingId: r.fromId });
          if (hp) {
            r.toId = hp.building.id;
            r.toPort = hp.index;
            rewired = true;
          }
        }
      }
    }
    if (rewired || drag.moved) skipClick = true;
    draw();
  }
  if (state.moving) {
    if (state.moving.dragged) skipClick = true;
    state.moving = null;
    draw();
  }
  state.panning = false;
});

cv.addEventListener("click", (e) => {
  if (state.spacePan) return;
  if (skipClick) {
    skipClick = false;
    return;
  }
  const p = clientPos(e);
  const g = screenToGrid(p.x, p.y);
  const world = toWorld(p.x, p.y);

  if (state.mode === "place") {
    if (!state.selected) return;
    // 点在已有建筑上：只聚焦，不叠放
    if (buildingAt(g.gx, g.gy)) return;
    if (!canPlace(state.selected, g.gx, g.gy, state.placeRot)) return;
    const d = dimsFor(state.selected, state.placeRot);
    const nb = {
      id: "b" + (bid++),
      type: state.selected,
      gx: g.gx,
      gy: g.gy,
      w: d.w,
      h: d.h,
      rot: state.placeRot,
    };
    state.buildings.push(nb);
    state.focusId = nb.id;
    draw();
    return;
  }

  if (state.mode === "link") {
    if (!state.linkFrom) {
      const hp = hitPort(world.x, world.y, { kind: "out" });
      if (!hp) {
        state.linkFrom = null;
        draw();
        return;
      }
      state.linkFrom = { buildingId: hp.building.id, portIndex: hp.index };
      state.focusId = hp.building.id;
      draw();
      return;
    }
    const hp = hitPort(world.x, world.y, {
      kind: "in",
      excludeBuildingId: state.linkFrom.buildingId,
    });
    if (!hp) {
      state.linkFrom = null;
      draw();
      return;
    }
    const fromPort = Number.isFinite(state.linkFrom.portIndex) ? state.linkFrom.portIndex : 0;
    const toPort = hp.index;
    const exists = state.rails.some(
      (r) => r.fromId === state.linkFrom.buildingId && r.toId === hp.building.id
        && (Number.isFinite(r.fromPort) ? r.fromPort : 0) === fromPort
        && (Number.isFinite(r.toPort) ? r.toPort : 0) === toPort
    );
    if (!exists) {
      state.rails.push({
        id: "r" + (rid++),
        fromId: state.linkFrom.buildingId,
        toId: hp.building.id,
        fromPort,
        toPort,
      });
    }
    state.linkFrom = null;
    draw();
    return;
  }

  if (state.mode === "erase") {
    const wx = world.x, wy = world.y;
    let best = null, bestD = 14;
    for (const r of state.rails) {
      const s = railSeg(r);
      if (!s) continue;
      const d = distToSeg(wx, wy, s.p1, s.p2);
      if (d < bestD) { bestD = d; best = r.id; }
    }
    if (best) {
      state.rails = state.rails.filter((r) => r.id !== best);
      draw();
      return;
    }
    const hit = buildingAt(g.gx, g.gy);
    if (hit) deleteBuilding(hit.id);
  }
});

function distToSeg(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
}

function matchHotkey(e, action) {
  return e.code === state.hotkeys[action];
}

window.addEventListener("keydown", (e) => {
  if (state.listeningKey) {
    e.preventDefault();
    // 忽略纯修饰键
    if (["ShiftLeft", "ShiftRight", "ControlLeft", "ControlRight", "AltLeft", "AltRight", "MetaLeft", "MetaRight"].includes(e.code)) return;
    state.hotkeys[state.listeningKey] = e.code;
    saveHotkeys();
    state.listeningKey = null;
    renderKeysPanel();
    return;
  }

  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;

  if (matchHotkey(e, "pan")) {
    state.spacePan = true;
    cv.style.cursor = "grab";
    return;
  }
  if (matchHotkey(e, "rotate")) {
    e.preventDefault();
    rotateAction();
    return;
  }
  if (matchHotkey(e, "modePlace")) {
    e.preventDefault();
    state.mode = "place";
    syncModes();
    draw();
    return;
  }
  if (matchHotkey(e, "modeLink")) {
    e.preventDefault();
    state.mode = "link";
    syncModes();
    draw();
    return;
  }
  if (matchHotkey(e, "modeErase")) {
    e.preventDefault();
    state.mode = "erase";
    syncModes();
    draw();
    return;
  }
  if (matchHotkey(e, "delete") || e.code === "Backspace") {
    e.preventDefault();
    if (state.focusId) deleteBuilding(state.focusId);
    return;
  }
  if (matchHotkey(e, "cancel")) {
    e.preventDefault();
    hideCtx();
    state.selected = null;
    state.linkFrom = null;
    state.listeningKey = null;
    syncPalette();
    draw();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === state.hotkeys.pan || e.code === "Space") {
    state.spacePan = false;
    cv.style.cursor = state.mode === "link" ? "crosshair" : "default";
  }
});

(function seed() {
  state.buildings.push(
    { id: "b" + (bid++), type: "raw", gx: 2, gy: 4, w: 2, h: 2, rot: 0 },
    { id: "b" + (bid++), type: "raw", gx: 2, gy: 12, w: 2, h: 2, rot: 0 },
    { id: "b" + (bid++), type: "furnace", gx: 14, gy: 3, w: 3, h: 4, rot: 0 },
    { id: "b" + (bid++), type: "smelter", gx: 14, gy: 12, w: 3, h: 4, rot: 0 },
  );
  state.rails.push(
    { id: "r" + (rid++), fromId: state.buildings[0].id, toId: state.buildings[3].id, fromPort: 0, toPort: 0 },
    { id: "r" + (rid++), fromId: state.buildings[1].id, toId: state.buildings[2].id, fromPort: 0, toPort: 0 },
  );
})();

renderKeysPanel();
renderPalette();
state.catalog.forEach((c) => getArtImage(c, () => {}));
syncModes();
resize();
</script>
</body>
