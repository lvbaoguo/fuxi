}

function buildRoute(target) {
  const nodes = new Map(); // name -> {name, recipe|null, raw, cycle, depth}
  const edges = []; // {from, to, machine}
  const stack = new Set();

  function walk(name) {
    if (stack.has(name)) {
      const hit = nodes.get(name);
      if (hit) { hit.cycle = true; return hit; }
      const stub = { name, recipe: null, raw: true, cycle: true, depth: 0 };
      nodes.set(name, stub);
      return stub;
    }
    if (nodes.has(name)) return nodes.get(name);

    const node = { name, recipe: null, raw: false, cycle: false, depth: 0 };
    nodes.set(name, node);

    const recipe = pickRecipe(name);
    if (!recipe) {
      node.raw = true;
      node.depth = 0;
      return node;
    }

    stack.add(name);
    node.recipe = recipe;
    let maxD = 0;
    for (const mat of recipe.materials) {
      // skip self-edge loops
      if (mat === name) continue;
      // if material is already on stack, mark cycle and still show edge once
      const onStack = stack.has(mat);
      const child = walk(mat);
      if (onStack) child.cycle = true;
      edges.push({ from: mat, to: name, machine: recipe.machine });
      if (!onStack) maxD = Math.max(maxD, child.depth);
    }
    stack.delete(name);
    node.depth = maxD + 1;
    return node;
  }

  walk(target);

  // recompute depths in topological fashion (longest path from raw)
  let changed = true;
  let guard = 0;
  while (changed && guard++ < 50) {
    changed = false;
    for (const e of edges) {
      const a = nodes.get(e.from);
      const b = nodes.get(e.to);
      if (!a || !b) continue;
      const nd = a.depth + 1;
      if (nd > b.depth) { b.depth = nd; changed = true; }
    }
  }

  return { nodes, edges, target };
}

function layoutRoute(graph) {
  const { nodes } = graph;
  const byDepth = new Map();
  for (const n of nodes.values()) {
    if (!byDepth.has(n.depth)) byDepth.set(n.depth, []);
    byDepth.get(n.depth).push(n);
  }
  const depths = [...byDepth.keys()].sort((a, b) => a - b);
  const nodeW = PLAN_NODE_W, nodeH = PLAN_NODE_H, gapX = PLAN_NODE_W + 22, gapY = PLAN_NODE_H + 16;
  const positions = new Map();
  const vertical = routeState.dir === "v";

  depths.forEach((d, di) => {
    const col = byDepth.get(d);
    col.sort((a, b) => a.name.localeCompare(b.name, "zh"));
    if (vertical) {
      // 竖向：深度向下；同层横向居中铺开。原料(depth小)在上，成品在下
      const totalW = col.length * gapX;
      col.forEach((n, i) => {
        positions.set(n.name, {
          x: i * gapX - totalW / 2 + gapX / 2,
          y: di * gapY,
          w: nodeW,
          h: nodeH,
        });
      });
    } else {
      const totalH = col.length * gapY;
      col.forEach((n, i) => {
        positions.set(n.name, {
          x: di * gapX,
          y: i * gapY - totalH / 2 + gapY / 2,
          w: nodeW,
          h: nodeH,
        });
      });
    }
  });

  return { positions, nodeW, nodeH, gapX, gapY, depths, byDepth, vertical };
}

function prevLayerSets(focus, edges) {
  const prev = new Set();
  const edgeKeys = new Set();
  for (const e of edges) {
    if (e.to !== focus) continue;
    prev.add(e.from);
    edgeKeys.add(e.from + "->" + e.to);
  }
  return { prev, nodes: new Set([focus, ...prev]), edgeKeys };
}

/** 本路线内：出=供给几个下游，进=吃几种原料 */
function portStats(graph) {
  const outMap = new Map();
  const inMap = new Map();
  for (const e of graph.edges) {
    if (!outMap.has(e.from)) outMap.set(e.from, new Set());
    outMap.get(e.from).add(e.to);
    if (!inMap.has(e.to)) inMap.set(e.to, new Set());
    inMap.get(e.to).add(e.from);
  }
  const stats = new Map();
  for (const name of graph.nodes.keys()) {
    const o = outMap.has(name) ? outMap.get(name).size : 0;
    const i = inMap.has(name) ? inMap.get(name).size : 0;
    stats.set(name, { out: o, in: i });
  }
  return stats;
}

function portBadgeBox(p, index) {
  const stackH = BADGE_H * 2 + BADGE_GAP;
  const x = p.x + (p.w - BADGE_W) / 2;
  const y0 = p.y + p.h - stackH - 4;
  return { x, y: y0 + index * (BADGE_H + BADGE_GAP), w: BADGE_W, h: BADGE_H };
}

function layoutPortBadges(g, p) {
  const bgs = [...g.querySelectorAll(".badge-bg")];
  const texts = [...g.querySelectorAll("text.badge")];
  bgs.forEach((el, i) => {
    const b = portBadgeBox(p, i);
    el.setAttribute("x", b.x);
    el.setAttribute("y", b.y);
    el.setAttribute("width", b.w);
    el.setAttribute("height", b.h);
  });
  texts.forEach((el, i) => {
    const b = portBadgeBox(p, i);
    el.setAttribute("x", b.x + b.w / 2);
    el.setAttribute("y", b.y + 8.4);
  });
}

function layoutWarehousePorts(g, p) {
  const ports = [...g.querySelectorAll(".wh-port")];
  ports.forEach((el, s) => {
    const b = warehousePortBox(p, s);
    el.setAttribute("x", b.x);
    el.setAttribute("y", b.y);
    el.setAttribute("width", b.w);
    el.setAttribute("height", b.h);
  });
}

function appendWarehousePorts(g, node, p) {
  const ns = "http://www.w3.org/2000/svg";
  const roles = ["free", "free", "free", "free"];
  for (const e of plan.edges) {
    if (e.from === node.id && e.fromPort != null) roles[Number(e.fromPort)] = "out";
    if (e.to === node.id && e.toPort != null) roles[Number(e.toPort)] = "in";
  }
  for (let s = 0; s < 4; s++) {
    const b = warehousePortBox(p, s);
    const r = document.createElementNS(ns, "rect");
    r.setAttribute("class", "wh-port " + roles[s]);
    r.setAttribute("rx", 2);
    r.setAttribute("ry", 2);
    r.setAttribute("x", b.x);
    r.setAttribute("y", b.y);
    r.setAttribute("width", b.w);
    r.setAttribute("height", b.h);
    g.appendChild(r);
  }
}

function appendPortBadges(g, p, outN, inN, alwaysColor) {
  const ns = "http://www.w3.org/2000/svg";
  function pill(label, cls) {
    const bg = document.createElementNS(ns, "rect");
    bg.setAttribute("class", "badge-bg " + cls);
    bg.setAttribute("stroke-width", "1");
    g.appendChild(bg);
    const t = document.createElementNS(ns, "text");
    t.setAttribute("class", "badge " + cls);
    t.setAttribute("text-anchor", "middle");
    t.textContent = label;
    g.appendChild(t);
  }
  const outCls = "out-multi";
  const inCls = "in-multi";
  pill(`出${outN}`, outCls);
  pill(`进${inN}`, inCls);
  layoutPortBadges(g, p);
}

function applyHighlight(focus, opts) {
  const world = document.getElementById("routeWorld");
  const force = !!(opts && opts.force);

  if (!focus || !routeState.graph) {
    routeState.highlight = null;
    if (world) {
      world.classList.remove("is-hl");
      world.querySelectorAll(".edge.hl").forEach(el => el.classList.remove("hl"));
      world.querySelectorAll(".node.hl, .node.hl-focus, .node.hl-prev").forEach(el => {
        el.classList.remove("hl", "hl-focus", "hl-prev");
      });
    }
    return;
  }

  if (!force && routeState.highlight === focus) {
    applyHighlight(null);
    return;
  }

  routeState.highlight = focus;
  const { prev, nodes, edgeKeys } = prevLayerSets(focus, routeState.graph.edges);
  world.classList.add("is-hl");

  world.querySelectorAll(".edge").forEach(el => {
    const key = el.dataset.from + "->" + el.dataset.to;
    el.classList.toggle("hl", edgeKeys.has(key));
  });
  world.querySelectorAll(".node").forEach(el => {
    const name = el.dataset.name;
    el.classList.remove("hl", "hl-focus", "hl-prev");
    if (!nodes.has(name)) return;
    el.classList.add("hl");
    if (name === focus) el.classList.add("hl-focus");
    else if (prev.has(name)) el.classList.add("hl-prev");
  });
}

function renderRouteGraph(target, opts = {}) {
  if (routeState.mode === "plan") return;
  const keepView = !!opts.keepView;
  const keepHighlight = opts.keepHighlight || null;
  const world = document.getElementById("routeWorld");
  const emptyEl = document.getElementById("routeEmpty");
  world.innerHTML = "";
  routeState.highlight = null;
  routeState.graph = null;
  routeState.nodeDrag = null;
  world.classList.remove("is-hl");

  if (!target) {
    emptyEl.classList.remove("hide");
    emptyEl.textContent = "搜索后出图。长按拖节点可并排；角标看出/进几路";
    applyTransform();
    return;
  }
  if (!recipeIndex.has(target) && !allItemNames.includes(target)) {
    emptyEl.classList.remove("hide");
    emptyEl.textContent = `未找到「${target}」`;
    applyTransform();
    return;
  }

  const graph = buildRoute(target);
  const layout = layoutRoute(graph);
  applyStoredOverrides(layout, target);
  routeState.layout = layout;
  const ports = portStats(graph);
  routeState.graph = graph;
  routeState.target = target;
  emptyEl.classList.add("hide");
  pushSearchHistory(target);

  const vertical = !!layout.vertical;
  for (const e of graph.edges) {
    const a = layout.positions.get(e.from);
    const b = layout.positions.get(e.to);
    if (!a || !b) continue;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "edge");
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    path.setAttribute("d", edgePathD(a, b, vertical));
    world.appendChild(path);
  }

  for (const n of graph.nodes.values()) {
    const p = layout.positions.get(n.name);
    if (!p) continue;
    const st = ports.get(n.name) || { out: 0, in: 0 };
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    let cls = "node " + gradeCls(itemGrade(n.name));
    if (n.name === target) cls += " node-target";
    if (n.cycle) cls += " node-cycle";
    if (n.raw) cls += " g0";
    g.setAttribute("class", cls);
    g.dataset.name = n.name;

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", p.x);
    rect.setAttribute("y", p.y);
    rect.setAttribute("rx", 7);
    rect.setAttribute("ry", 7);
    rect.setAttribute("width", p.w);
    rect.setAttribute("height", p.h);
    g.appendChild(rect);

    const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t1.setAttribute("class", "name");
    t1.setAttribute("x", p.x + p.w / 2);
    t1.setAttribute("y", p.y + 14);
    t1.setAttribute("text-anchor", "middle");
    t1.textContent = n.name.length > 7 ? n.name.slice(0, 6) + "…" : n.name;
    const outHint = st.out >= 2 ? `输出分 ${st.out} 路，建议调制器/分轨` : (st.out === 1 ? "输出单轨即可" : "终点，无下游输出");
    const inHint = st.in >= 2 ? `进料 ${st.in} 口，各原料独立进黄口` : (st.in === 1 ? "进料 1 口" : "原料点，无进料");
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = `${n.name}｜${outHint}；${inHint}｜单击高亮上一层｜长按拖动调整位置`;
    g.appendChild(title);
    g.appendChild(t1);

    const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t2.setAttribute("class", "meta");
    t2.setAttribute("x", p.x + p.w / 2);
    t2.setAttribute("y", p.y + 31);
    t2.setAttribute("text-anchor", "middle");
    if (n.cycle) t2.textContent = "循环截断";
    else if (n.raw) t2.textContent = "原料 / 采集";
    else t2.textContent = n.recipe.machine;
    g.appendChild(t2);

    appendPortBadges(g, p, st.out, st.in);

    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (g.dataset.skipClick === "1") {
        delete g.dataset.skipClick;
        return;
      }
      applyHighlight(n.name);
    });
    bindNodeDrag(g, n.name);
    world.appendChild(g);
  }

  if (!keepView) {
    routeState.scale = 1;
    const svgEl = document.getElementById("routeSvg");
    if (routeState.dir === "v") {
      routeState.tx = (svgEl.clientWidth || 800) / 2;
      routeState.ty = 56;
    } else {
      routeState.tx = 60;
      routeState.ty = (svgEl.clientHeight || 600) / 2;
    }
  }
  applyTransform();
  if (keepHighlight) applyHighlight(keepHighlight);
}

function applyTransform() {
  const world = document.getElementById("routeWorld");
  world.setAttribute("transform", `translate(${routeState.tx},${routeState.ty}) scale(${routeState.scale})`);
}

function edgePathD(a, b, vertical, fromPort, toPort) {
  const fp = fromPort === "" || fromPort == null ? null : Number(fromPort);
  const tp = toPort === "" || toPort == null ? null : Number(toPort);
  let x1, y1, x2, y2;
  if (fp != null && !Number.isNaN(fp)) {
    const pt = portAnchor(a, fp);
    x1 = pt.x; y1 = pt.y;
  } else if (vertical) {
    x1 = a.x + a.w / 2; y1 = a.y + a.h;
  } else {
    x1 = a.x + a.w; y1 = a.y + a.h / 2;
  }
  if (tp != null && !Number.isNaN(tp)) {
    const pt = portAnchor(b, tp);
    x2 = pt.x; y2 = pt.y;
  } else if (vertical) {
    x2 = b.x + b.w / 2; y2 = b.y;
  } else {
    x2 = b.x; y2 = b.y + b.h / 2;
  }
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}

function effectivePos(name) {
  const p = routeState.layout && routeState.layout.positions.get(name);
  if (!p) return null;
  const drag = routeState.nodeDrag;
  if (drag && drag.active && drag.name === name) {
    return { x: drag.curX, y: drag.curY, w: p.w, h: p.h };
  }
  return p;
}

function refreshEdgePaths() {
  if (!routeState.layout) return;
  const vertical = routeState.dir === "v";
  const world = document.getElementById("routeWorld");
  world.querySelectorAll(".edge, .edge-hit").forEach((path) => {
    const a = effectivePos(path.dataset.from);
    const b = effectivePos(path.dataset.to);
    if (!a || !b) return;
    path.setAttribute("d", edgePathD(a, b, vertical, path.dataset.fromPort, path.dataset.toPort));
  });
}

function clientToWorld(clientX, clientY) {
  const svgEl = document.getElementById("routeSvg");
  const rect = svgEl.getBoundingClientRect();
  return {
    x: (clientX - rect.left - routeState.tx) / routeState.scale,
    y: (clientY - rect.top - routeState.ty) / routeState.scale,
  };
}

function clearPosOverrides() {
  routeState.posOverride = {};
  routeState.overrideKey = "";
}

function applyStoredOverrides(layout, target) {
  const key = target + "|" + routeState.dir;
  if (routeState.overrideKey !== key) {
    routeState.posOverride = {};
    routeState.overrideKey = key;
  }
  for (const [name, pos] of Object.entries(routeState.posOverride)) {
    const p = layout.positions.get(name);
    if (!p) continue;
    p.x = pos.x;
    p.y = pos.y;
  }
}

const NODE_LONG_MS = 380;

function bindNodeDrag(g, name) {
  g.style.cursor = "grab";
  g.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.stopPropagation();
    const p = routeState.layout && routeState.layout.positions.get(name);
    if (!p) return;
    const startClient = { x: e.clientX, y: e.clientY };
    const startPos = { x: p.x, y: p.y };
    let timer = setTimeout(() => {
      routeState.nodeDrag = {
        name, el: g, active: true, moved: false,
        startClient, startPos,
        curX: startPos.x, curY: startPos.y,
      };
      g.classList.add("dragging-node");
      g.style.cursor = "grabbing";
      try { g.setPointerCapture(e.pointerId); } catch (_) {}
    }, NODE_LONG_MS);

    const onMove = (ev) => {
      if (!routeState.nodeDrag || routeState.nodeDrag.name !== name || !routeState.nodeDrag.active) {
        if (Math.hypot(ev.clientX - startClient.x, ev.clientY - startClient.y) > 9) {
          clearTimeout(timer);
          timer = null;
        }
        return;
      }
      ev.preventDefault();
      const w0 = clientToWorld(startClient.x, startClient.y);
      const w1 = clientToWorld(ev.clientX, ev.clientY);
      const dx = w1.x - w0.x;
      const dy = w1.y - w0.y;
      if (Math.hypot(dx, dy) > 2) routeState.nodeDrag.moved = true;
      routeState.nodeDrag.curX = startPos.x + dx;
      routeState.nodeDrag.curY = startPos.y + dy;
      g.setAttribute("transform", `translate(${dx},${dy})`);
      refreshEdgePaths();
    };

    const onUp = () => {
      if (timer) clearTimeout(timer);
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      const drag = routeState.nodeDrag;
      if (!drag || drag.name !== name) return;
      g.classList.remove("dragging-node");
      g.style.cursor = "grab";
      g.removeAttribute("transform");
      const moved = drag.moved;
      if (moved) {
        p.x = drag.curX;
        p.y = drag.curY;
        routeState.posOverride[name] = { x: p.x, y: p.y };
        g.dataset.skipClick = "1";
      }
      routeState.nodeDrag = null;
      if (moved) {
        const hl = routeState.highlight;
        renderRouteGraph(routeState.target, { keepView: true, keepHighlight: hl });
      }
      refreshEdgePaths();
    };

    document.addEventListener("pointermove", onMove, { passive: false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

function panByClientDelta(fromX, fromY, toX, toY) {
  routeState.tx += toX - fromX;
  routeState.ty += toY - fromY;
}

function zoomAtClient(clientX, clientY, nextScale) {
  const rect = document.getElementById("routeSvg").getBoundingClientRect();
  const c = { x: clientX - rect.left, y: clientY - rect.top };
  const next = Math.min(3.5, Math.max(0.3, nextScale));
  const k = next / routeState.scale;
  routeState.tx = c.x - (c.x - routeState.tx) * k;
  routeState.ty = c.y - (c.y - routeState.ty) * k;
  routeState.scale = next;
}

const HIST_KEY = "starrupture_search_hist";
const HIST_MAX = 12;
let suggestIndex = -1;

function loadHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
    return Array.isArray(arr) ? arr.filter(x => typeof x === "string") : [];
  } catch (_) { return []; }
}
function pushSearchHistory(name) {
  if (!name) return;
  const list = loadHistory().filter(x => x !== name);
  list.unshift(name);
  localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, HIST_MAX)));
}
function clearSearchHistory() {
  localStorage.removeItem(HIST_KEY);
}

function rankMatch(name, qq) {
  const n = name.toLowerCase();
  if (n === qq) return 0;
  if (n.startsWith(qq)) return 1;
  const idx = n.indexOf(qq);
  if (idx >= 0) return 2 + idx;
  return 99;
}

function resolveTarget(raw) {
  const name = (raw || "").trim();
  if (!name) return "";
  if (allItemNames.includes(name)) return name;
  const products = [...recipeIndex.keys()];
  const exactP = products.find(n => n === name);
  if (exactP) return exactP;
  const ranked = products
    .map(n => ({ n, r: rankMatch(n, name.toLowerCase()) }))
    .filter(x => x.r < 99)
    .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"));
  if (ranked.length) return ranked[0].n;
  const rankedAll = allItemNames
    .map(n => ({ n, r: rankMatch(n, name.toLowerCase()) }))
    .filter(x => x.r < 99)
    .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"));
  return rankedAll[0]?.n || name;
}

function goSearch(name) {
  if (routeState.mode === "plan") exitPlanMode();
  const target = resolveTarget(name);
  if (!target) return;
  document.getElementById("routeQ").value = target;
  hideSuggest();
  routeState.target = target;
  renderRouteGraph(target);
}

function hideSuggest() {
  const box = document.getElementById("routeSuggest");
  box.classList.remove("show");
  box.innerHTML = "";
  suggestIndex = -1;
}

function showSuggest(q, opts = {}) {
  const box = document.getElementById("routeSuggest");
  const qq = (q || "").trim().toLowerCase();
  const forceHist = !!opts.forceHist;
  box.innerHTML = "";
  suggestIndex = -1;

  const hist = loadHistory();
  const entries = [];

  if (!qq || forceHist) {
    const histShow = qq ? hist.filter(h => h.toLowerCase().includes(qq)) : hist;
    if (histShow.length) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "最近搜索";
      box.appendChild(sec);
      histShow.slice(0, 8).forEach(name => entries.push({ name, kind: "hist" }));
    }
  }

  if (qq) {
    const products = [...recipeIndex.keys()]
      .map(n => ({ n, r: rankMatch(n, qq) }))
      .filter(x => x.r < 99)
      .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"))
      .map(x => x.n);
    const others = allItemNames
      .filter(n => !recipeIndex.has(n))
      .map(n => ({ n, r: rankMatch(n, qq) }))
      .filter(x => x.r < 99)
      .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"))
      .map(x => x.n);
    const seen = new Set(entries.map(e => e.name));
    const matched = [...products, ...others].filter(n => !seen.has(n)).slice(0, 12);
    if (matched.length) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "联想匹配";
      box.appendChild(sec);
      matched.forEach(name => {
        entries.push({
          name,
          kind: recipeIndex.has(name) ? "prod" : "raw",
        });
      });
    }
  }

  if (!entries.length) {
    if (!qq && hist.length === 0) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "暂无历史，输入名称开始联想";
      box.appendChild(sec);
      box.classList.add("show");
      return;
    }
    box.classList.remove("show");
    return;
  }

  entries.forEach((item, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.idx = String(i);
    const label = document.createElement("span");
    label.textContent = item.name;
    b.appendChild(label);
    const tag = document.createElement("span");
    tag.className = "tag" + (item.kind === "hist" ? " hist" : item.kind === "raw" ? " raw" : "");
    tag.textContent = item.kind === "hist" ? "历史" : item.kind === "raw" ? "原料" : "产品";
    b.appendChild(tag);
    b.addEventListener("mousedown", (e) => {
      e.preventDefault(); // keep focus logic simple
      goSearch(item.name);
    });
    box.appendChild(b);
  });

  if (hist.length && (!qq || forceHist)) {
    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.textContent = "清空搜索历史";
    clearBtn.style.color = "#a66a18";
    clearBtn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      clearSearchHistory();
      showSuggest(document.getElementById("routeQ").value, { forceHist: true });
    });
    box.appendChild(clearBtn);
  }

  box.classList.add("show");
}

function moveSuggest(delta) {
  const box = document.getElementById("routeSuggest");
  if (!box.classList.contains("show")) return;
  const buttons = [...box.querySelectorAll("button[data-idx]")];
  if (!buttons.length) return;
  suggestIndex = (suggestIndex + delta + buttons.length) % buttons.length;
  buttons.forEach((b, i) => b.classList.toggle("active", i === suggestIndex));
  buttons[suggestIndex].scrollIntoView({ block: "nearest" });
}

const routeQ = document.getElementById("routeQ");
routeQ.addEventListener("input", (e) => showSuggest(e.target.value));
routeQ.addEventListener("focus", (e) => showSuggest(e.target.value, { forceHist: true }));
routeQ.addEventListener("blur", () => setTimeout(hideSuggest, 150));
routeQ.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSuggest(1); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); moveSuggest(-1); return; }
  if (e.key === "Escape") { hideSuggest(); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    const box = document.getElementById("routeSuggest");
    const buttons = [...box.querySelectorAll("button[data-idx]")];
    if (box.classList.contains("show") && suggestIndex >= 0 && buttons[suggestIndex]) {
      goSearch(buttons[suggestIndex].querySelector("span").textContent);
      return;
    }
    goSearch(e.target.value);
  }
});
document.getElementById("routeGo").addEventListener("click", () => {
  goSearch(document.getElementById("routeQ").value);
});

const mapQ = document.getElementById("mapQ");
if (mapQ) {
  mapQ.addEventListener("input", (e) => showMapSuggest(e.target.value));
  mapQ.addEventListener("focus", (e) => showMapSuggest(e.target.value));
  mapQ.addEventListener("blur", () => setTimeout(hideMapSuggest, 150));
  mapQ.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      hideMapSuggest();
      mapQ.blur();
      return;
    }
    const box = document.getElementById("mapSuggest");
    const buttons = box ? [...box.querySelectorAll("button[data-id]")] : [];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!buttons.length) return;
      e.preventDefault();
      let i = buttons.findIndex((b) => b.classList.contains("active"));
      if (i < 0) i = 0;
      else i = e.key === "ArrowDown" ? (i + 1) % buttons.length : (i - 1 + buttons.length) % buttons.length;
      buttons.forEach((b) => b.classList.remove("active"));
      buttons[i].classList.add("active");
      buttons[i].scrollIntoView({ block: "nearest" });
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      const active = buttons.find((b) => b.classList.contains("active"));
      if (active && box && box.classList.contains("show")) {
        focusPlanNodeById(Number(active.getAttribute("data-id")), { fromSuggest: true });
      } else {
        goMapSearch(mapQ.value);
      }
    }
  });
}
const mapGo = document.getElementById("mapGo");
if (mapGo) {
  mapGo.addEventListener("click", () => goMapSearch(document.getElementById("mapQ").value));
}
document.getElementById("pcList").addEventListener("click", () => {
  const sidebar = document.getElementById("synthList");
  if (routeState.mode !== "plan") {
    setSynthListOpen(true);
    return;
  }
  setSynthListOpen(!sidebar.classList.contains("show"));
  if (routeState.mode === "plan" && !document.getElementById("synthList").classList.contains("show")) {
    document.getElementById("pcList").classList.remove("active");
  }
});
function setLinkKind(kind) {
  plan.linkKind = plan.linkKind === kind ? null : kind;
  if (plan.linkKind) plan.unlinkOn = false;
  plan.linkFrom = null;
  syncPlanToolbar();
  renderPlanBoard();
}
function setUnlinkMode(on) {
  plan.unlinkOn = !!on;
  if (plan.unlinkOn) plan.linkKind = null;
  plan.linkFrom = null;
  syncPlanToolbar();
  renderPlanBoard();
}
document.getElementById("pcLink").addEventListener("click", () => setLinkKind("in"));
document.getElementById("pcOut").addEventListener("click", () => setLinkKind("out"));
document.getElementById("pcUnlink").addEventListener("click", () => setUnlinkMode(!plan.unlinkOn));
document.getElementById("pcUndo").addEventListener("click", () => undoPlan());
document.getElementById("pcRedo").addEventListener("click", () => redoPlan());
document.getElementById("pcDel").addEventListener("click", () => deletePlanSelection());
document.getElementById("pcClear").addEventListener("click", () => clearPlanBoard());
document.getElementById("pcNextGrade").addEventListener("click", () => appendNextGrade());
document.getElementById("pcTier1").addEventListener("click", () => switchMachineTier(1));
document.getElementById("pcTier2").addEventListener("click", () => switchMachineTier(2));
document.getElementById("synthTier1").addEventListener("click", () => switchMachineTier(1));
document.getElementById("synthTier2").addEventListener("click", () => switchMachineTier(2));
document.getElementById("pcDir").addEventListener("click", () => {
  routeState.dir = routeState.dir === "h" ? "v" : "h";
  clearPosOverrides();
  const btn = document.getElementById("pcDir");
  btn.classList.toggle("active", routeState.dir === "v");
  btn.title = routeState.dir === "v" ? "当前竖向，点击切回横向" : "当前横向，点击切换竖向";
  if (routeState.target) renderRouteGraph(routeState.target);
  else if (routeState.mode === "plan") renderPlanBoard();
});
document.getElementById("pcReset").addEventListener("click", () => {
  const svgEl = document.getElementById("routeSvg");
  clearPosOverrides();
  routeState.scale = 1;
  if (routeState.dir === "v") {
    routeState.tx = (svgEl.clientWidth || 800) / 2;
    routeState.ty = 56;
  } else {
    routeState.tx = 60;
    routeState.ty = (svgEl.clientHeight || 600) / 2;
  }
  if (routeState.mode === "plan") {
    applyTransform();
    return;
  }
  if (routeState.target) renderRouteGraph(routeState.target, { keepView: true });
  else applyTransform();
});
/* machineTier toggles preferBase via switchMachineTier */
(function initPlanAfterRecipes() {
  rebuildSynthCatalog();
  synthGrade = synthCatalog.grades.includes(1) ? 1 : (synthCatalog.grades[0] || 0);
  loadPlan();
  lastSaved = snapshotPlan();
  syncTierButtons();
  if (window.__justAppendedD5) {
    try { enterPlanMode(); } catch (_) {}
  }
})();
window.addEventListener("keydown", (e) => {
  if (routeState.mode !== "plan") return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
    e.preventDefault();
    if (e.shiftKey) redoPlan();
    else undoPlan();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "y" || e.key === "Y")) {
    e.preventDefault();
    redoPlan();
    return;
  }
  if (e.key === "2") {
    e.preventDefault();
    setLinkKind("in");
    return;
  }
  if (e.key === "3") {
    e.preventDefault();
    setLinkKind("out");
    return;
  }
  if (e.key === "4") {
    e.preventDefault();
    setUnlinkMode(!plan.unlinkOn);
    return;
  }
  if (e.key === "Escape") {
    plan.linkKind = null;
    plan.unlinkOn = false;
    plan.linkFrom = null;
    selectPlanNodes([]);
    hideMarquee();
    applyHighlight(null);
    syncPlanToolbar();
    renderPlanBoard();
  }
  if (e.key === "Backspace" || e.key === "Delete") {
    e.preventDefault();
    deletePlanSelection();
  }
});

const svg = document.getElementById("routeSvg");
svg.addEventListener("mousedown", (e) => {
  if (e.target.closest(".node") || e.target.closest(".edge, .edge-hit")) return;
  if (routeState.nodeDrag) return;
  if (routeState.mode === "plan") return;
  routeState.dragging = true;
  routeState.lastX = e.clientX;
  routeState.lastY = e.clientY;
  svg.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (routeState.canvasPtr) return;
  if (routeState.nodeDrag) return;
  if (!routeState.dragging) return;
  panByClientDelta(routeState.lastX, routeState.lastY, e.clientX, e.clientY);
  routeState.lastX = e.clientX;
  routeState.lastY = e.clientY;
  applyTransform();
});
window.addEventListener("mouseup", () => {
  routeState.dragging = false;
  svg.classList.remove("dragging");
});

function endCanvasPtr() {
  const p = routeState.canvasPtr;
  if (p && p.timer) clearTimeout(p.timer);
  routeState.canvasPtr = null;
  hideMarquee();
  routeState.dragging = false;
  svg.classList.remove("dragging");
}

svg.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest(".node") || e.target.closest(".edge, .edge-hit")) return;
  if (routeState.nodeDrag) return;
  if (routeState.mode !== "plan") return;
  e.preventDefault();
  const ptr = {
    mode: (plan.linkKind || plan.unlinkOn) ? "pan" : "wait",
    startX: e.clientX,
    startY: e.clientY,
    lastX: e.clientX,
    lastY: e.clientY,
    pointerId: e.pointerId,
    timer: null,
  };
  routeState.canvasPtr = ptr;
  if (ptr.mode === "pan") {
    routeState.dragging = true;
    svg.classList.add("dragging");
  } else {
    ptr.timer = setTimeout(() => {
      if (!routeState.canvasPtr || routeState.canvasPtr !== ptr || ptr.mode !== "wait") return;
      ptr.mode = "marquee";
      updateMarquee(ptr.startX, ptr.startY, ptr.startX, ptr.startY);
    }, 420);
  }
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
});
svg.addEventListener("pointermove", (e) => {
  const ptr = routeState.canvasPtr;
  if (!ptr) return;
  if (ptr.mode === "wait") {
    if (Math.hypot(e.clientX - ptr.startX, e.clientY - ptr.startY) > 8) {
      clearTimeout(ptr.timer);
      ptr.mode = "pan";
      ptr.lastX = e.clientX;
      ptr.lastY = e.clientY;
      routeState.dragging = true;
      svg.classList.add("dragging");
    }
    return;
  }
  if (ptr.mode === "pan") {
    panByClientDelta(ptr.lastX, ptr.lastY, e.clientX, e.clientY);
    ptr.lastX = e.clientX;
    ptr.lastY = e.clientY;
    applyTransform();
    return;
  }
  if (ptr.mode === "marquee") {
    updateMarquee(ptr.startX, ptr.startY, e.clientX, e.clientY);
    previewMarqueeSelection(nodesInMarquee(marqueeWorldBox(ptr.startX, ptr.startY, e.clientX, e.clientY)));
  }
});
svg.addEventListener("pointerup", (e) => {
  const ptr = routeState.canvasPtr;
  if (!ptr) return;
  if (ptr.timer) clearTimeout(ptr.timer);
  if (ptr.mode === "wait") {
    selectPlanNodes([]);
    if (!plan.linkKind && !plan.unlinkOn) plan.linkFrom = null;
    routeState.highlight = null;
    hideMarquee();
    routeState.canvasPtr = null;
    renderPlanBoard();
    return;
  }
  if (ptr.mode === "marquee") {
    const box = marqueeWorldBox(ptr.startX, ptr.startY, e.clientX, e.clientY);
    const hits = (box.w > 6 || box.h > 6) ? nodesInMarquee(box) : [];
    selectPlanNodes(hits);
    routeState.highlight = null;
    hideMarquee();
    routeState.canvasPtr = null;
    renderPlanBoard();
    return;
  }
  endCanvasPtr();
});
svg.addEventListener("pointercancel", () => endCanvasPtr());
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoomAtClient(e.clientX, e.clientY, routeState.scale * delta);
  applyTransform();
}, { passive: false });

const touchCtl = { mode: null, lastDist: 0 };
function touchDist(a, b) {
  const dx = a.clientX - b.clientX;
  const dy = a.clientY - b.clientY;
  return Math.hypot(dx, dy);
}
function touchCenter(a, b) {
  return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}
svg.addEventListener("touchstart", (e) => {
  if (e.target.closest(".node") && e.touches.length === 1) return;
  if (routeState.mode === "plan" && e.touches.length === 1) return;
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchCtl.mode = "pan";
    routeState.dragging = true;
    routeState.lastX = t.clientX;
    routeState.lastY = t.clientY;
    svg.classList.add("dragging");
  } else if (e.touches.length >= 2) {
    e.preventDefault();
    touchCtl.mode = "pinch";
    routeState.dragging = false;
    touchCtl.lastDist = touchDist(e.touches[0], e.touches[1]);
    svg.classList.remove("dragging");
  }
}, { passive: false });
svg.addEventListener("touchmove", (e) => {
  if (touchCtl.mode === "pan" && e.touches.length === 1) {
    e.preventDefault();
    const t = e.touches[0];
    panByClientDelta(routeState.lastX, routeState.lastY, t.clientX, t.clientY);
    routeState.lastX = t.clientX;
    routeState.lastY = t.clientY;
    applyTransform();
  } else if (e.touches.length >= 2) {
    e.preventDefault();
    touchCtl.mode = "pinch";
    const dist = touchDist(e.touches[0], e.touches[1]);
    if (touchCtl.lastDist > 0) {
      const factor = dist / touchCtl.lastDist;
      const c = touchCenter(e.touches[0], e.touches[1]);
      zoomAtClient(c.x, c.y, routeState.scale * factor);
      applyTransform();
    }
    touchCtl.lastDist = dist;
  }
}, { passive: false });
function endTouch() {
  touchCtl.mode = null;
  touchCtl.lastDist = 0;
  routeState.dragging = false;
  svg.classList.remove("dragging");
}
svg.addEventListener("touchend", endTouch);
svg.addEventListener("touchcancel", endTouch);


(function lockPageViewport() {
  document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gestureend", (e) => e.preventDefault(), { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 280) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
})();

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    routeState.ty = (document.getElementById("routeSvg").clientHeight || 360) / 2;
    applyTransform();
  }, 200);
});

(function bootAppendNextGrade() {
  try {
    const qs = new URLSearchParams(location.search);
    if (qs.get("appendNext") !== "1") return;
    enterPlanMode();
    appendNextGrade();
    qs.delete("appendNext");
    const q = qs.toString();
    history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash);
  } catch (_) {}
})();
</script>
