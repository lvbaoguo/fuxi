<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>星际裂变 · 线路规划</title>
<style>
  :root {
    --line: #c5ccd6;
    --text: #2a3038;
    --muted: #6b7585;
    --accent: #2f9d84;
    --raw: #f3e9d8;
    --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --synth-w: 292px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; max-width: 100%; height: 100%; overflow: hidden;
    font-family: var(--font); color: var(--text); background: #edf0f4;
    -webkit-text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none;
  }
  .route-layout { position: fixed; inset: 0; width: 100vw; height: 100dvh; height: 100vh; }
  .route-canvas-wrap {
    position: relative; width: 100%; height: 100%; background: #fff; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .route-canvas-wrap svg {
    width: 100%; height: 100%; cursor: grab; touch-action: none;
    background:
      linear-gradient(#eef1f5 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, #eef1f5 1px, transparent 1px) 0 0 / 24px 24px,
      #f8f9fb;
  }
  .route-canvas-wrap svg.dragging { cursor: grabbing; }
  .float-search {
    position: absolute; z-index: 40; display: flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 4px 16px rgba(40,50,70,.18); padding: 6px;
  }
  .float-search .suggest-wrap { position: relative; flex: 1; min-width: 0; }
  .float-search input {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 16px; outline: none; background: #fff; color: var(--text);
  }
  .float-search input:focus { border-color: var(--accent); }
  .float-search .go {
    flex-shrink: 0; border: 0; background: var(--accent); color: #fff; border-radius: 8px;
    padding: 8px 12px; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .pc-toolbar {
    position: absolute; z-index: 40; top: 12px; right: 12px;
    display: flex; gap: 8px;
  }
  .pc-toolbar .btn {
    display: inline-flex; align-items: center;
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-size: .85rem; font-weight: 600;
    cursor: pointer; box-shadow: 0 4px 16px rgba(40,50,70,.14);
  }
  .pc-toolbar .btn:hover { border-color: var(--accent); color: var(--accent); }
  .pc-toolbar .btn.active { border-color: var(--accent); background: #e8f6f2; color: var(--accent); }
  .pc-toolbar .btn:disabled { opacity: .4; cursor: default; }
  .pc-toolbar .btn:disabled:hover { border-color: var(--line); color: var(--text); }
  .keys-hint {
    display: none; position: absolute; z-index: 40; right: 12px; bottom: 12px;
    background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: .72rem; color: var(--muted); line-height: 1.55;

  .keys-hint.show { display: block; }
  .keys-hint b { color: var(--text); font-size: .74rem; }
  .keys-hint kbd {

    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;

  }
  .suggest {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; max-height: 240px;
    overflow: auto; box-shadow: 0 10px 28px rgba(40,50,70,.14);
  }
  .suggest.show { display: block; }
  .suggest .sg-sec { padding: 6px 12px 2px; font-size: .72rem; color: var(--muted); }
  .suggest button {
    display: flex; width: 100%; text-align: left; align-items: center; gap: 8px;

  }
  .suggest button:hover, .suggest button.active { background: #eef6f3; }

  .route-empty {

  .route-empty.hide { display: none; }

  .node .badge.in-multi { fill: #0f766e; }

  .route-world.is-hl .node.hl-focus rect {
    fill: #d8f0ea; stroke: #2f9d84; stroke-width: 3;
    filter: drop-shadow(0 0 6px rgba(47,157,132,.4));
  }
  .node { touch-action: none; }
  .node.dragging-node {
    cursor: grabbing;
    filter: drop-shadow(0 6px 12px rgba(40,50,70,.28));
  }
  .node.dragging-node > rect { stroke: var(--accent); stroke-width: 2.4; }

  .float-search {
    left: 12px; top: 12px; right: auto; width: min(420px, 46vw);
  }
  .route-canvas-wrap.plan-sidebar .float-search { left: calc(var(--synth-w, 292px) + 12px); width: min(280px, 28vw); }
  .float-map-search {
    display: none; position: absolute; z-index: 40; left: 12px; top: 58px;

    box-shadow: 0 4px 16px rgba(40,50,70,.18); padding: 5px;

  }
  .float-map-search.show { display: flex; }
  .route-canvas-wrap.plan-sidebar .float-map-search { left: calc(var(--synth-w, 292px) + 12px); }
  .float-map-search .suggest-wrap { position: relative; flex: 1; min-width: 0; }
  .float-map-search input {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
    font-size: 14px; outline: none; background: #fff; color: var(--text);
  }
  .float-map-search input:focus { border-color: var(--accent); }
  .float-map-search .go {

    padding: 7px 10px; font-size: .78rem; font-weight: 600; cursor: pointer;
  }
  .float-map-search .suggest {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    max-height: 220px; overflow: auto; background: #fff; border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(40,50,70,.16); z-index: 50;

  .float-map-search .suggest.show { display: block; }
  .float-map-search .suggest button {

    padding: 7px 10px; font-size: .8rem; cursor: pointer; color: var(--text);

  .float-map-search .suggest button:hover,
  .float-map-search .suggest button.active { background: #e8f6f2; color: var(--accent); }

  .synth-overlay {
    display: none; position: absolute; z-index: 36; left: 0; top: 0; bottom: 0;
    width: var(--synth-w, 292px); background: #fff; border-right: 1px solid var(--line);
    overflow: hidden; flex-direction: column;
    box-shadow: 8px 0 24px rgba(40,50,70,.08);

  .synth-resize {
    position: absolute; z-index: 6; top: 0; right: 0; bottom: 0; width: 10px;
    cursor: col-resize; touch-action: none;
  }
  .synth-resize::after {
    content: ""; position: absolute; top: 50%; left: 2px;
    width: 6px; height: 44px; margin-top: -22px;
    border-radius: 999px; background: #d5dbe3;
    box-shadow: inset 1px 0 0 #fff, inset -1px 0 0 #b8c0ca;
  }
  .synth-resize:hover::after, .synth-overlay.resizing .synth-resize::after {
    background: var(--accent);
    box-shadow: none;
  }
  .synth-overlay.resizing, .synth-overlay.resizing * { cursor: col-resize !important; user-select: none; }
  .synth-head {
    position: relative; z-index: 2; flex-shrink: 0;
    background: #fff; padding: 12px 12px 8px;
    border-bottom: 1px solid #e4e9ef;
  }
  .synth-head h2 { margin: 0 0 4px; font-size: .92rem; }
  .synth-head p { margin: 0 0 8px; font-size: .7rem; color: var(--muted); line-height: 1.4; }
  .synth-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
  .synth-tabs .tab {
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 999px; padding: 3px 8px; font-size: .7rem; font-weight: 700; cursor: pointer;
  }
  .synth-tabs .tab:hover { filter: brightness(0.97); }

  .synth-tabs .tab.g1 { background: #e8f1fb; border-color: #8aa9c9; }

  .synth-tabs .tab.g5 { background: #f8e8ef; border-color: #c4889e; }

  .synth-tabs .tab.g7 { background: #f7f0d8; border-color: #c4b06a; }
  .synth-tabs .tab.g8 { background: #e8eaf8; border-color: #8a90c4; }

<body>
<div class="route-layout" id="routeLayout">
  <div class="route-canvas-wrap">
    <div class="float-search">
      <div class="suggest-wrap">
        <input id="routeQ" type="search" placeholder="搜索产品…" autocomplete="off" enterkeyhint="search" />
        <div class="suggest" id="routeSuggest"></div>
      </div>
      <button class="go" type="button" id="routeGo">确定</button>
    </div>
    <div class="float-map-search" id="mapSearchBox" title="只搜当前规划板上已有的产品，定位过去">
      <div class="suggest-wrap">
        <input id="mapQ" type="search" placeholder="图上找产品…" autocomplete="off" enterkeyhint="search" />
        <div class="suggest" id="mapSuggest"></div>
      </div>
      <button class="go" type="button" id="mapGo">定位</button>
    </div>
    <div class="pc-toolbar">

      <button class="btn" type="button" id="pcTier1" title="零件库+规划板切到 1级机制造厂/熔炉配方" style="display:none">1级机</button>
      <button class="btn" type="button" id="pcTier2" title="零件库+规划板切到 2级机制造厂/熔炉配方" style="display:none">2级机</button>
      <button class="btn" type="button" id="pcLink" title="快捷键 2：进口，点产品再点仓库（或先点产出再点下游）" style="display:none">进口 2</button>

      <button class="btn danger" type="button" id="pcUnlink" title="快捷键 4：点产品每次断一条线（先进口后出口）；点线立刻切断" style="display:none">断开 4</button>

function applyPlanData(raw) {
  if (!raw || !Array.isArray(raw.nodes)) return false;
  plan.nodes = raw.nodes;
  plan.edges = Array.isArray(raw.edges) ? raw.edges : [];
  plan.nextId = Number(raw.nextId) || (plan.nodes.reduce((m, n) => Math.max(m, n.id || 0), 0) + 1);
  plan.layoutVersion = raw.layoutVersion || "";

function planTierKey(tier) {
  return Number(tier) === 2 ? PLAN_LS_T2 : PLAN_LS_T1;
}

function readStoredPlan(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (_) { return null; }
}

function planNodeCount(p) {
  return p && Array.isArray(p.nodes) ? p.nodes.length : 0;
}

function writeStoredPlan(key, raw) {
  if (!raw) return;
  localStorage.setItem(key, JSON.stringify({
    nodes: raw.nodes || [],
    edges: raw.edges || [],
    nextId: raw.nextId || 1,
    layoutVersion: raw.layoutVersion || "",
  }));
}

function currentTier() {
  return routeState.machineTier === 2 ? 2 : 1;
}

function setMachineTierState(tier) {
  const t = Number(tier) === 2 ? 2 : 1;
  routeState.machineTier = t;
  routeState.preferBase = t === 1;
  try { localStorage.setItem(PLAN_TIER_LS, String(t)); } catch (_) {}
}

function pickRecipeForTier(product, tier) {
  const list = recipeIndex.get(product) || [];
  if (!list.length) return null;
  if (Number(tier) === 1) {
    const base = list.find((r) => !isV2(r.machine));
    return base || list[0];
  }
  const v2 = list.find((r) => isV2(r.machine));
  return v2 || list[0];
}

function matsEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  const sa = [...a].sort().join("\0");
  const sb = [...b].sort().join("\0");
  return sa === sb;
}

/** 从 2 级板推导 1 级板：布局不动，只按 1 级配方裁掉多出来的进料线 */
function deriveTier1BoardFromTier2(raw) {
  const board = JSON.parse(JSON.stringify(raw || { nodes: [], edges: [], nextId: 1 }));
  const byId = new Map((board.nodes || []).map((n) => [n.id, n]));
  function srcCargo(id) {
    const n = byId.get(id);
    if (!n) return null;
    if (isWarehouse(n)) return n.cargo || null;
    return n.name || null;
  }
  board.edges = (board.edges || []).filter((e) => {
    const to = byId.get(e.to);
    if (!to || isWarehouse(to)) return true;
    const r1 = pickRecipeForTier(to.name, 1);
    const r2 = pickRecipeForTier(to.name, 2);
    if (!r1 || !r2 || matsEqual(r1.materials, r2.materials)) return true;
    const cargo = srcCargo(e.from);
    return !!(cargo && r1.materials.includes(cargo));
  });
  return board;
}

function migrateTierBoards() {
  const legacyMain = readStoredPlan(PLAN_LS);
  const legacyBak = readStoredPlan(PLAN_LS_BAK);
  let legacy = legacyMain;
  if (planNodeCount(legacyBak) > planNodeCount(legacy)) legacy = legacyBak;
  if (planNodeCount(legacy) <= 2 && typeof RECOVERED_PLAN !== "undefined" && planNodeCount(RECOVERED_PLAN) > 2) {
    legacy = RECOVERED_PLAN;
  }
  let t2 = readStoredPlan(PLAN_LS_T2);
  let t1 = readStoredPlan(PLAN_LS_T1);
  if (planNodeCount(t2) <= 2) {
    if (typeof RECOVERED_PLAN_T2 !== "undefined" && planNodeCount(RECOVERED_PLAN_T2) > 2) {
      t2 = JSON.parse(JSON.stringify(RECOVERED_PLAN_T2));
    } else if (planNodeCount(legacy) > 2) {
      t2 = JSON.parse(JSON.stringify(legacy));
    }
    if (planNodeCount(t2) > 2) writeStoredPlan(PLAN_LS_T2, t2);
  }
  const deriveFlag = "starrupture_t1_derive_wuban_v1";
  let needDerive = false;
  try { needDerive = localStorage.getItem(deriveFlag) !== "1"; } catch (_) { needDerive = true; }
  if (planNodeCount(t1) <= 2 && typeof RECOVERED_PLAN_T1 !== "undefined" && planNodeCount(RECOVERED_PLAN_T1) > 2 && !needDerive) {
    t1 = JSON.parse(JSON.stringify(RECOVERED_PLAN_T1));
    writeStoredPlan(PLAN_LS_T1, t1);
  } else if ((planNodeCount(t1) <= 2 || needDerive) && planNodeCount(t2) > 2) {
    t1 = (typeof RECOVERED_PLAN_T1 !== "undefined" && planNodeCount(RECOVERED_PLAN_T1) > 2)
      ? JSON.parse(JSON.stringify(RECOVERED_PLAN_T1))
      : deriveTier1BoardFromTier2(t2);
    writeStoredPlan(PLAN_LS_T1, t1);
    try { localStorage.setItem(deriveFlag, "1"); } catch (_) {}
  }
  if (planNodeCount(t2) <= 2 && planNodeCount(t1) > 2) {
    t2 = JSON.parse(JSON.stringify(t1));
    writeStoredPlan(PLAN_LS_T2, t2);
  }
}


function applyTier2MfgFixOnce() {
  try {
    if (typeof RECOVERED_PLAN_T2 === "undefined" || planNodeCount(RECOVERED_PLAN_T2) <= 2) return;
    const raw = readStoredPlan(PLAN_LS_T2);
    const wantVer = RECOVERED_PLAN_T2.layoutVersion || "";
    const haveVer = raw && raw.layoutVersion || "";
    const behind = !raw
      || planNodeCount(raw) < planNodeCount(RECOVERED_PLAN_T2)
      || (wantVer && haveVer !== wantVer);
    if (!behind) return;
    writeStoredPlan(PLAN_LS_T2, RECOVERED_PLAN_T2);
    if (currentTier() === 2) {
      applyPlanData(JSON.parse(JSON.stringify(RECOVERED_PLAN_T2)));
      writeStoredPlan(PLAN_LS, RECOVERED_PLAN_T2);
    }
  } catch (err) { try { console.error(err); } catch (_) {} }
}

function loadPlan() {
  let savedTier = 2;
  try {
    const raw = localStorage.getItem(PLAN_TIER_LS);
    if (raw === "1" || raw === "2") savedTier = Number(raw);
  } catch (_) {}
  setMachineTierState(savedTier);
  migrateTierBoards();
  applyDepth5DeltaOnce();
  applyTier2MfgFixOnce();
  // depth5 可能写在旧 PLAN_LS 上，再迁一次
  migrateTierBoards();
  const key = planTierKey(currentTier());
  let best = readStoredPlan(key);
  if (planNodeCount(best) <= 2) {
    const other = readStoredPlan(planTierKey(currentTier() === 1 ? 2 : 1));
    if (planNodeCount(other) > 2) best = other;
  }
  if (planNodeCount(best) <= 2 && typeof RECOVERED_PLAN !== "undefined") best = RECOVERED_PLAN;
  applyPlanData(best || { nodes: [], edges: [], nextId: 1 });
  try {
    writeStoredPlan(key, snapshotPlan());
    writeStoredPlan(PLAN_LS, snapshotPlan());
  } catch (_) {}
}

    if (Number(plan.nextId) !== 79) return;
    if (!plan.nodes.some((n) => n.id === 64 && n.cargo === "定子")) return;
    if (plan.nodes.some((n) => n.name === "电子元件" || n.cargo === "电子元件")) return;
    const ids = new Set(plan.nodes.map((n) => n.id));
    for (const n of DEPTH5_DELTA.nodes) {
      if (!ids.has(n.id)) plan.nodes.push(JSON.parse(JSON.stringify(n)));
    }
    const ek = new Set(plan.edges.map((e) => e.from + ">" + e.to));
    for (const e of DEPTH5_DELTA.edges) {
      const k = e.from + ">" + e.to;
      if (!ek.has(k)) plan.edges.push({ from: e.from, to: e.to });
    }
    plan.nextId = DEPTH5_DELTA.nextId;
    localStorage.setItem("starrupture_append_d5_once_v1", "1");
    localStorage.setItem(PLAN_LS, JSON.stringify({
      nodes: plan.nodes, edges: plan.edges, nextId: plan.nextId,
    }));
    window.__justAppendedD5 = true;
  } catch (_) {}
}

const UNDO_MAX = 50;
let undoStack = [];
let redoStack = [];
let undoBusy = false;
let lastSaved = null;

function snapshotPlan() {
  return JSON.parse(JSON.stringify({
    nodes: plan.nodes,
    edges: plan.edges,
    nextId: plan.nextId,
    layoutVersion: plan.layoutVersion || "",
  }));
}

function applySnapshot(s) {
  plan.nodes = JSON.parse(JSON.stringify(s.nodes || []));
  plan.edges = JSON.parse(JSON.stringify(s.edges || []));
  plan.nextId = Number(s.nextId) || (plan.nodes.reduce((m, n) => Math.max(m, n.id || 0), 0) + 1);
  plan.layoutVersion = s.layoutVersion || "";
  plan.selected = null;
  plan.selectedIds = [];
  plan.selectedEdge = null;
  plan.linkFrom = null;
}

function syncUndoButtons() {
  const u = document.getElementById("pcUndo");
  const r = document.getElementById("pcRedo");
  if (u) u.disabled = !undoStack.length;
  if (r) r.disabled = !redoStack.length;
}

function savePlan() {
  try {
    const payload = {
      nodes: plan.nodes, edges: plan.edges, nextId: plan.nextId,
      layoutVersion: plan.layoutVersion || "",
    };
    if (!undoBusy) {
      if (lastSaved) {
        undoStack.push(lastSaved);
        if (undoStack.length > UNDO_MAX) undoStack.shift();
      }
      redoStack = [];
    }
    lastSaved = JSON.parse(JSON.stringify(payload));
    const prev = localStorage.getItem(PLAN_LS);
    if (prev && plan.nodes.length) localStorage.setItem(PLAN_LS_BAK, prev);
    localStorage.setItem(PLAN_LS, JSON.stringify(payload));
    writeStoredPlan(planTierKey(currentTier()), payload);
  } catch (_) {}
  syncUndoButtons();
}

function syncTierButtons() {
  const t = currentTier();
  const map = [
    ["pcTier1", 1], ["pcTier2", 2],
    ["synthTier1", 1], ["synthTier2", 2],
  ];
  for (const [id, tier] of map) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("active", t === tier);
  }
  const tag = document.getElementById("synthTierTag");
  if (tag) tag.textContent = t === 1 ? "· 1级机" : "· 2级机";
}

function switchMachineTier(tier) {
  const next = Number(tier) === 2 ? 2 : 1;
  if (next === currentTier()) {
    syncTierButtons();
    return;
  }
  try { writeStoredPlan(planTierKey(currentTier()), snapshotPlan()); } catch (_) {}
  setMachineTierState(next);
  _depthMemo.clear();
  rebuildSynthCatalog();
  const raw = readStoredPlan(planTierKey(next));
  applyPlanData(raw && planNodeCount(raw) ? raw : { nodes: [], edges: [], nextId: 1 });
  undoStack = [];
  redoStack = [];
  lastSaved = snapshotPlan();
  plan.selected = null;
  plan.selectedIds = [];
  plan.selectedEdge = null;
  plan.linkFrom = null;
  syncTierButtons();
  syncPlanToolbar();
  if (routeState.mode === "plan") {
    renderSynthList(synthGrade);
    renderPlanBoard();
  }
  showPlanToast(next === 1 ? "已切到 1级机零件库/规划板" : "已切到 2级机零件库/规划板");
}

function undoPlan() {
  if (!undoStack.length) {
    showPlanToast("没有可撤销的操作");
    return;
  }
  undoBusy = true;
  redoStack.push(snapshotPlan());
  applySnapshot(undoStack.pop());
  savePlan();
  undoBusy = false;
  renderPlanBoard();
}

function redoPlan() {
  if (!redoStack.length) {
    showPlanToast("没有可恢复的操作");
    return;
  }
  undoBusy = true;
  undoStack.push(snapshotPlan());
  applySnapshot(redoStack.pop());
  savePlan();
  undoBusy = false;
  renderPlanBoard();
}

function clampSynthWidth(w) {

  return Math.round(Math.max(SYNTH_W_MIN, Math.min(max, w)));
}
function applySynthWidth(w) {
  const px = clampSynthWidth(w == null ? SYNTH_W_DEF : w);
  document.documentElement.style.setProperty("--synth-w", px + "px");
  return px;
}
function loadSynthWidth() {

    if (n) w = n;
  } catch (_) {}

function bindSynthResize() {
  const handle = document.getElementById("synthResize");
  const overlay = document.getElementById("synthList");
  if (!handle || !overlay) return;
  handle.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    overlay.classList.add("resizing");
    try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    const onMove = (ev) => {
      applySynthWidth(ev.clientX);
    };
    const onUp = (ev) => {
      overlay.classList.remove("resizing");
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
      handle.removeEventListener("pointercancel", onUp);
      const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--synth-w")) || SYNTH_W_DEF;
      saveSynthWidth(cur);
    };
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
    handle.addEventListener("pointercancel", onUp);
  });
  handle.addEventListener("dblclick", (e) => {
    e.preventDefault();
    applySynthWidth(SYNTH_W_DEF);
    saveSynthWidth(SYNTH_W_DEF);
  });
}

const recipeIndex = (() => {
  const map = new Map();
  for (const r of RECIPES) {
    if (!map.has(r.product)) map.set(r.product, []);
    map.get(r.product).push(r);
  }
  return map;
})();

const allItemNames = (() => {
  const s = new Set();
  for (const r of RECIPES) {
    s.add(r.product);
    r.materials.forEach(m => s.add(m));
  }
  return [...s].sort((a,b)=>a.localeCompare(b, "zh"));
})();

function pickRecipe(product) {
  const list = recipeIndex.get(product) || [];
  if (!list.length) return null;
  if (routeState.preferBase) {
    const base = list.find(r => !isV2(r.machine));
    return base || list[0];
  }
  // prefer v2 if exists else base
  const v2 = list.find(r => isV2(r.machine));
  return v2 || list[0];
}

function itemMachineLabel(name) {
  const r = pickRecipe(name);
  if (!r) return "原料 / 采集";
  return r.machine;
}

function itemInCount(name) {
  const r = pickRecipe(name);
  return r ? r.materials.length : 0;
}

function itemGrade(name) {
  if (name === "仓库") return "wh";
  const r = pickRecipe(name);
  if (!r) return 0;
  return Math.max(1, itemDepth(name));
}

function gradeCls(g) {
  if (g === "wh") return "gwh";
  return "g" + Math.max(0, Math.min(15, g | 0));
}

function isWarehouse(n) {
  if (n == null) return false;
  if (typeof n === "string") return n === "仓库";
  return n.kind === "warehouse" || n.name === "仓库";
}

const FAMILY_ORDER = ["钛", "钨", "钙", "氦", "硫"];
function familyOfName(name) {
  if (!name) return "其他";
  if (name.includes("钛")) return "钛";
  if (name.includes("钨")) return "钨";
  if (name.includes("钙") || name.includes("方解石") || name.includes("陶瓷")) return "钙";
  if (name.includes("氦")) return "氦";
  if (name.includes("硫") || name === "硫酸") return "硫";
  if (name === "针铁矿" || name.includes("针铁")) return "其他";
  if (name === "能源矿") return "其他";
  const rec = pickRecipe(name);
  if (!rec) return "其他";
  const seen = new Set([name]);
  const stack = [...rec.materials];
  const found = new Set();
  while (stack.length) {
    const m = stack.pop();
    if (seen.has(m)) continue;
    seen.add(m);
    const hint = familyOfNameHint(m);
    if (hint !== "其他") found.add(hint);
    const child = pickRecipe(m);
    if (child) child.materials.forEach((x) => stack.push(x));
  }
  for (const f of FAMILY_ORDER) {
    if (found.has(f)) return f;
  }
  return "其他";
}
function familyOfNameHint(name) {
  if (name.includes("钛")) return "钛";
  if (name.includes("钨")) return "钨";
  if (name.includes("钙") || name.includes("方解石")) return "钙";
  if (name.includes("氦")) return "氦";
  if (name.includes("硫")) return "硫";
  return "其他";
}
function familyRank(name) {
  const i = FAMILY_ORDER.indexOf(familyOfName(name));
  return i < 0 ? FAMILY_ORDER.length : i;
}
const _depthMemo = new Map();
function itemDepth(name, stack) {
  if (_depthMemo.has(name)) return _depthMemo.get(name);
  if (!stack) stack = new Set();
  if (stack.has(name)) return 0;
  const r = pickRecipe(name);
  if (!r || !r.materials.length) {
    _depthMemo.set(name, 0);
    return 0;
  }
  stack.add(name);
  let maxD = 0;
  for (const m of r.materials) {
    const d = itemDepth(m, stack);
    if (d > maxD) maxD = d;
  }
  stack.delete(name);
  const out = 1 + maxD;
  _depthMemo.set(name, out);
  return out;
}
function cmpParts(aName, bName) {
  const fa = familyRank(aName), fb = familyRank(bName);
  if (fa !== fb) return fa - fb;
  const da = itemDepth(aName), db = itemDepth(bName);
  if (da !== db) return da - db;
  return aName.localeCompare(bName, "zh");
}

/** 每个成品取当前机级配方，按离原料最长合成步数分级 */
function rebuildSynthCatalog() {
  _depthMemo.clear();
  const seen = new Set();
  const list = [];
  for (const r of RECIPES) {
    if (seen.has(r.product)) continue;
    seen.add(r.product);
    list.push(pickRecipe(r.product) || r);
  }
  list.sort((a, b) => cmpParts(a.product, b.product));
  const byGrade = new Map();
  byGrade.set(0, []);
  const products = new Set(list.map((r) => r.product));
  const raws = [];
  for (const name of allItemNames) {
    if (!products.has(name) && !pickRecipe(name)) raws.push(name);
  }
  raws.sort(cmpParts);
  byGrade.set(0, raws.map((name) => ({ product: name, machine: "原料 / 采集", materials: [] })));
  for (const r of list) {
    const g = Math.max(1, itemDepth(r.product));
    if (!byGrade.has(g)) byGrade.set(g, []);
    byGrade.get(g).push(r);
  }
  for (const [, arr] of byGrade) arr.sort((a, b) => cmpParts(a.product, b.product));
  byGrade.set("wh", [{
    product: "仓库",
    machine: "4口 · 2进口同名锁定 · 3出口可接下游",
    materials: [],
    kind: "warehouse",
  }]);
  const grades = [...[...byGrade.keys()].filter((g) => g !== "wh").sort((a, b) => a - b), "wh"];
  synthCatalog = { list, byGrade, grades };
}

/** 图上产品名：工厂用 name，仓库用 cargo */
function planNodeSearchKey(n) {
  if (!n) return "";
  if (isWarehouse(n)) return String(n.cargo || "").trim();
  return String(n.name || "").trim();
}

function listPlanSearchHits(q) {
  const raw = String(q || "").trim().toLowerCase();
  if (!raw) return [];
  const hits = [];
  for (const n of plan.nodes) {
    const key = planNodeSearchKey(n);
    if (!key) continue;
    const kl = key.toLowerCase();
    if (!kl.includes(raw)) continue;
    hits.push({
      id: n.id,
      key,
      wh: isWarehouse(n),
      exact: kl === raw,
      starts: kl.startsWith(raw),
      node: n,
    });
  }
  hits.sort((a, b) => {
    if (a.exact !== b.exact) return a.exact ? -1 : 1;
    if (a.starts !== b.starts) return a.starts ? -1 : 1;
    if (a.wh !== b.wh) return a.wh ? 1 : -1; // 工厂优先
    return a.key.localeCompare(b.key, "zh") || a.id - b.id;
  });
  return hits;
}

function hideMapSuggest() {
  const box = document.getElementById("mapSuggest");
  if (box) box.classList.remove("show");
}

function showMapSuggest(q) {
  const box = document.getElementById("mapSuggest");
  if (!box) return;
  const hits = listPlanSearchHits(q).slice(0, 12);
  if (!hits.length) {
    box.innerHTML = "";
    box.classList.remove("show");
    return;
  }
  box.innerHTML = hits.map((h, i) => (
    `<button type="button" data-id="${h.id}" class="${i === 0 ? "active" : ""}">`
    + h.key
    + `<span class="meta">${h.wh ? "仓库" : "工厂"}</span></button>`
  )).join("");
  box.classList.add("show");
  box.querySelectorAll("button[data-id]").forEach((btn) => {
    btn.addEventListener("mousedown", (e) => e.preventDefault());
    btn.addEventListener("click", () => {
      const id = Number(btn.getAttribute("data-id"));
      const hit = hits.find((h) => h.id === id);
      if (hit) focusPlanNodeById(hit.id, { fromSuggest: true });
    });
  });
}

function focusPlanNodeById(id, opts) {
  const node = plan.nodes.find((n) => n.id === id);
  if (!node) {
    showPlanToast("图上没有这个节点");
    return false;
  }
  selectPlanNodes([node.id]);
  plan.selectedEdge = null;
  const svgEl = document.getElementById("routeSvg");
  const box = nodeBox(node);
  const cx = box.x + box.w / 2;
  const cy = box.y + box.h / 2;
  const vw = svgEl.clientWidth || 800;
  const vh = svgEl.clientHeight || 600;
  // 规划侧栏时略偏右，避免被零件库挡住
  const sidebar = document.querySelector(".route-canvas-wrap.plan-sidebar");
  const leftPad = sidebar
    ? (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--synth-w")) || 292) * 0.35
    : 0;
  routeState.tx = (vw + leftPad) / 2 - cx * routeState.scale;
  routeState.ty = vh / 2 - cy * routeState.scale;
  renderPlanBoard();
  const g = document.querySelector(`#routeWorld .node[data-name="${node.id}"]`);
  if (g) {
    g.classList.add("plan-find");
    clearTimeout(focusPlanNodeById._t);
    focusPlanNodeById._t = setTimeout(() => g.classList.remove("plan-find"), 1800);
  }
  const label = planNodeSearchKey(node) || node.name || ("#" + node.id);
  showPlanToast("已定位：" + label + (isWarehouse(node) ? "（仓）" : ""));
  hideMapSuggest();
  const inp = document.getElementById("mapQ");
  if (inp && opts && opts.fromSuggest) inp.value = label;
  return true;
}

function goMapSearch(q) {
  const hits = listPlanSearchHits(q);
  if (!hits.length) {
    showPlanToast("图上没有匹配的产品");
    hideMapSuggest();
    return;
  }
  const qn = String(q || "").trim().toLowerCase();
  let idx = 0;
  if (goMapSearch._lastQ === qn && hits.length > 1) {
    idx = (goMapSearch._lastIdx + 1) % hits.length;
  }
  goMapSearch._lastQ = qn;
  goMapSearch._lastIdx = idx;
  focusPlanNodeById(hits[idx].id);
  if (hits.length > 1) {
    showPlanToast(`已定位：${hits[idx].key}（${idx + 1}/${hits.length}，再按定位下一项）`);
  }
}

function warehouseCounts(id) {
  let ins = 0, outs = 0;
  for (const e of plan.edges) {
    if (e.from === id) outs++;
    if (e.to === id) ins++;
  }
  return { ins, outs };
}

function inferWarehouseCargo(id) {
  for (const e of plan.edges) {
    if (e.to !== id) continue;
    const other = planNodeById(e.from);
    if (other && !isWarehouse(other)) return other.name;
  }
  for (const e of plan.edges) {
    if (e.to !== id) continue;
    const other = planNodeById(e.from);
    if (isWarehouse(other) && other.cargo) return other.cargo;
  }
  return null;
}

function syncWarehouseCargos() {
  let changed = true, guard = 0;
  while (changed && guard++ < 24) {
    changed = false;
    for (const n of plan.nodes) {
      if (!isWarehouse(n)) continue;
      const next = inferWarehouseCargo(n.id) || null;
      if ((n.cargo || null) !== next) {
        n.cargo = next;
        changed = true;
      }
    }
  }
}

function nodeCargo(n) {
  if (!n) return null;
  if (isWarehouse(n)) return n.cargo || inferWarehouseCargo(n.id) || null;
  return n.name;
}

function fitNodeLabel(s) {
  if (!s) return "";
  return s.length > 7 ? s.slice(0, 6) + "…" : s;
}

function pickWarehousePort(node, other) {
  const dx = other.x - node.x;
  const dy = other.y - node.y;
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 1 : 3;
  return dy > 0 ? 2 : 0;
}

function warehousePortBox(p, side) {
  const s = 8;
  const cx = p.x + p.w / 2 - s / 2;
  const cy = p.y + p.h / 2 - s / 2;
  if (side === 0) return { x: cx, y: p.y - s / 2, w: s, h: s };
  if (side === 1) return { x: p.x + p.w - s / 2, y: cy, w: s, h: s };
  if (side === 2) return { x: cx, y: p.y + p.h - s / 2, w: s, h: s };
  return { x: p.x - s / 2, y: cy, w: s, h: s };
}

function portAnchor(p, side) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (side === 0) return { x: cx, y: p.y };
  if (side === 1) return { x: p.x + p.w, y: cy };
  if (side === 2) return { x: cx, y: p.y + p.h };
  return { x: p.x, y: cy };
}

function planNodeById(id) {
  return plan.nodes.find((n) => n.id === id);
}

function planPortStats() {
  const outMap = new Map(), inMap = new Map();
  for (const e of plan.edges) {
    if (!outMap.has(e.from)) outMap.set(e.from, 0);
    outMap.set(e.from, outMap.get(e.from) + 1);
    if (!inMap.has(e.to)) inMap.set(e.to, 0);
    inMap.set(e.to, inMap.get(e.to) + 1);
  }
  return { outMap, inMap };
}

function incidentEdgeIndices(id) {
  const nid = Number(id);
  const ins = [], outs = [];
  plan.edges.forEach((e, i) => {
    if (Number(e.to) === nid) ins.push(i);
    else if (Number(e.from) === nid) outs.push(i);
  });
  const byOther = (isIn) => (ia, ib) => {
    const a = plan.edges[ia], b = plan.edges[ib];
    const na = planNodeById(isIn ? a.from : a.to);
    const nb = planNodeById(isIn ? b.from : b.to);
    const ax = na ? na.x : 0, ay = na ? na.y : 0;
    const bx = nb ? nb.x : 0, by = nb ? nb.y : 0;
    return ax - bx || ay - by || ia - ib;
  };
  ins.sort(byOther(true));
  outs.sort(byOther(false));
  return ins.concat(outs);
}

function nodeShortName(n) {
  if (!n) return "";
  if (isWarehouse(n)) return n.cargo || "仓库";
  return n.name || "";
}

function tryUnlinkPlan(nodeId) {
  selectPlanNodes([nodeId]);
  const idxs = incidentEdgeIndices(nodeId);
  if (!idxs.length) {
    showPlanToast("这条没有连线");
    renderPlanBoard();
    return;
  }
  const ei = idxs[0];
  const e = plan.edges[ei];
  const other = planNodeById(Number(e.from) === Number(nodeId) ? e.to : e.from);
  const dir = Number(e.to) === Number(nodeId) ? "进" : "出";
  cutPlanEdge(ei);
  showPlanToast("已断 " + dir + " · " + nodeShortName(other));
}

function cutPlanEdge(ei) {
  if (ei == null || ei < 0 || ei >= plan.edges.length) return;
  plan.edges.splice(ei, 1);
  plan.selectedEdge = null;
  plan.linkFrom = null;
  syncWarehouseCargos();
  savePlan();
  renderPlanBoard();
}

function onPlanEdgeClick(ev, ei) {
  ev.stopPropagation();
  if (plan.unlinkOn) {
    cutPlanEdge(ei);
    return;
  }
  plan.selected = null;
  plan.selectedIds = [];
  plan.selectedEdge = ei;
  plan.linkFrom = null;
  renderPlanBoard();
}

function tryLinkPlan(clickId) {
  const kind = plan.linkKind || "in";
  const fromId = plan.linkFrom;
  if (!fromId || fromId === clickId) {
    plan.linkFrom = clickId;
    renderPlanBoard();
    return;
  }
  const a = planNodeById(fromId);
  const b = planNodeById(clickId);
  if (!a || !b) return;
  let fromNode = a, toNode = b;
  const aWh = isWarehouse(a), bWh = isWarehouse(b);
  if (kind === "in") {
    if (aWh && !bWh) { fromNode = b; toNode = a; }
    else if (bWh && !aWh) { fromNode = a; toNode = b; }
  } else if (kind === "out") {
    if (aWh && !bWh) { fromNode = a; toNode = b; }
    else if (bWh && !aWh) { fromNode = b; toNode = a; }
  }
  const srcId = fromNode.id, dstId = toNode.id;
  if (plan.edges.some((e) => e.from === srcId && e.to === dstId)) {
    plan.linkFrom = null;
    renderPlanBoard();
    return;
  }
  if (kind === "in" && isWarehouse(toNode)) {
    const incoming = nodeCargo(fromNode);
    const stored = nodeCargo(toNode);
    if (stored && incoming && stored !== incoming) {
      showPlanToast("仓库已存「" + stored + "」，进口只能接同名");
      return;
    }
    if (isWarehouse(fromNode) && isWarehouse(toNode) && !stored && !incoming) {
      showPlanToast("先把仓库进口接到要存的产品上");
      return;
    }
  }
  if (kind === "out" && isWarehouse(fromNode)) {
    const stored = nodeCargo(fromNode);
    if (!stored) {
      showPlanToast("仓库还没进口，先按 2 接要存的产品");
      return;
    }
    if (isWarehouse(toNode)) {
      const destC = nodeCargo(toNode);
      if (destC && destC !== stored) {
        showPlanToast("下游仓库已存「" + destC + "」，对不上");
        return;
      }
    }
  }
  const edge = { from: srcId, to: dstId };
  if (isWarehouse(fromNode)) edge.fromPort = pickWarehousePort(fromNode, toNode);
  if (isWarehouse(toNode)) edge.toPort = pickWarehousePort(toNode, fromNode);
  plan.edges.push(edge);
  plan.linkFrom = null;
  selectPlanNodes([dstId]);
  syncWarehouseCargos();
  savePlan();
  renderPlanBoard();
}

function deletePlanSelection() {
  if (plan.selectedEdge != null && !(plan.selectedIds && plan.selectedIds.length)) {
    plan.edges.splice(plan.selectedEdge, 1);
    plan.selectedEdge = null;
    syncWarehouseCargos();
    savePlan();
    renderPlanBoard();
    return;
  }
  const ids = (plan.selectedIds && plan.selectedIds.length)
    ? [...plan.selectedIds]
    : (plan.selected != null ? [plan.selected] : []);
  if (!ids.length) return;
  const idSet = new Set(ids);
  plan.nodes = plan.nodes.filter((n) => !idSet.has(n.id));
  plan.edges = plan.edges.filter((e) => !idSet.has(e.from) && !idSet.has(e.to));
  selectPlanNodes([]);
  if (idSet.has(plan.linkFrom)) plan.linkFrom = null;
  syncWarehouseCargos();
  savePlan();
  renderPlanBoard();
}

function clearPlanBoard() {
  if (plan.nodes.length && !confirm("清空规划板上的建筑和连线？")) return;
  plan.nodes = [];
  plan.edges = [];
  plan.selected = null;
  plan.selectedIds = [];
  plan.selectedEdge = null;
  plan.linkFrom = null;
  savePlan();
  renderPlanBoard();
}

/** 现有节点坐标不动；在整图下方追加「当前最大深度+1」且材料仓库已齐的产品+仓库，并连线 */
function appendNextGrade() {
  const whByCargo = new Map();
  const present = new Set();
  for (const n of plan.nodes) {
    if (isWarehouse(n) && n.cargo) {
      if (!whByCargo.has(n.cargo)) whByCargo.set(n.cargo, []);
      whByCargo.get(n.cargo).push(n);
      present.add(n.cargo);
    } else if (n.name) {
      present.add(n.name);
    }
  }
  if (!whByCargo.size) {
    showPlanToast("板上还没有仓库，先把材料仓摆好");
    return 0;
  }
  let maxD = 0;
  for (const cargo of whByCargo.keys()) {
    const d = itemDepth(cargo);
    if (d > maxD) maxD = d;
  }
  const wantD = maxD + 1;
  const targets = [];
  const prodNames = new Set(RECIPES.map((r) => r.product));
  for (const prod of prodNames) {
    const recipe = pickRecipe(prod);
    if (!recipe) continue;
    if (itemDepth(prod) !== wantD) continue;
    if (present.has(prod)) continue;
    if (recipe.materials.some((m) => !whByCargo.has(m))) continue;
    targets.push(recipe);
  }
  targets.sort((a, b) => {
    const ax = avgCargoX(a.materials, whByCargo);
    const bx = avgCargoX(b.materials, whByCargo);
    return ax - bx || a.product.localeCompare(b.product, "zh");
  });
  if (!targets.length) {
    showPlanToast("没有可接的下一级（材料仓不齐或已铺完）");
    return 0;
  }
  const maxY = plan.nodes.reduce((m, n) => Math.max(m, n.y || 0), 0);
  const fy = maxY + 100;
  const wy = fy + 105;
  const xs = targets.map((r) => avgCargoX(r.materials, whByCargo));
  const order = xs.map((_, i) => i).sort((i, j) => xs[i] - xs[j]);
  for (let k = 1; k < order.length; k++) {
    const prev = order[k - 1];
    const cur = order[k];
    if (xs[cur] - xs[prev] < 120) xs[cur] = xs[prev] + 120;
  }
  let added = 0;
  for (let i = 0; i < targets.length; i++) {
    const recipe = targets[i];
    const x = xs[i];
    const fid = plan.nextId++;
    const wid = plan.nextId++;
    plan.nodes.push({ id: fid, name: recipe.product, x, y: fy });
    plan.nodes.push({
      id: wid, name: "仓库", x: x + 3, y: wy, kind: "warehouse", cargo: recipe.product,
    });
    plan.edges.push({ from: fid, to: wid });
    for (const mat of recipe.materials) {
      const src = bottomWarehouse(whByCargo.get(mat));
      if (src) plan.edges.push({ from: src.id, to: fid });
    }
    added++;
  }
  syncWarehouseCargos();
  savePlan();
  renderPlanBoard();
  showPlanToast("已追加 " + added + " 个 " + wantD + " 级产品（布局未动）");
  return added;
}

function avgCargoX(mats, whByCargo) {
  let sum = 0; let n = 0;
  for (const m of mats) {
    const wh = bottomWarehouse(whByCargo.get(m));
    if (!wh) continue;
    sum += wh.x; n++;
  }
  return n ? sum / n : 0;
}

function bottomWarehouse(list) {
  if (!list || !list.length) return null;
  return list.reduce((a, b) => ((a.y || 0) >= (b.y || 0) ? a : b));
}

function renderPlanBoard() {
  const world = document.getElementById("routeWorld");
  const emptyEl = document.getElementById("routeEmpty");
  world.innerHTML = "";
  world.classList.remove("is-hl");
  routeState.nodeDrag = null;
  if (!plan.nodes.length) {
    if (emptyEl) {
      emptyEl.classList.remove("hide");
      emptyEl.classList.add("plan-hint");
      emptyEl.textContent = "点「加入」摆块；「进口 2」接进仓库（同名）；「出口 3」从仓库接到下游；「断开」点产品依次断线";
    }
    applyTransform();
    return;
  }
  if (emptyEl) {
    emptyEl.classList.add("hide");
    emptyEl.classList.remove("plan-hint");
  }
  syncWarehouseCargos();

  const layout = { positions: new Map(), vertical: routeState.dir === "v" };
  for (const n of plan.nodes) {
    layout.positions.set(String(n.id), nodeBox(n));
  }
  routeState.layout = layout;
  routeState.graph = {
    nodes: new Map(plan.nodes.map((n) => [String(n.id), n])),
    edges: plan.edges.map((e) => ({ from: String(e.from), to: String(e.to) })),
  };

  const { outMap, inMap } = planPortStats();
  const ns = "http://www.w3.org/2000/svg";
  const vertical = routeState.dir === "v";

  plan.edges.forEach((e, ei) => {
    const a = layout.positions.get(String(e.from));
    const b = layout.positions.get(String(e.to));
    if (!a || !b) return;
    const d = edgePathD(a, b, vertical, e.fromPort, e.toPort);
    const hit = document.createElementNS(ns, "path");
    hit.setAttribute("class", "edge-hit");
    hit.dataset.from = String(e.from);
    hit.dataset.to = String(e.to);
    hit.dataset.fromPort = e.fromPort == null ? "" : String(e.fromPort);
    hit.dataset.toPort = e.toPort == null ? "" : String(e.toPort);
    hit.dataset.ei = String(ei);
    hit.setAttribute("d", d);
    hit.addEventListener("click", (ev) => onPlanEdgeClick(ev, ei));
    world.appendChild(hit);
    const path = document.createElementNS(ns, "path");
    path.setAttribute("class", "edge" + (plan.selectedEdge === ei ? " hl" : ""));
    path.dataset.from = String(e.from);
    path.dataset.to = String(e.to);
    path.dataset.fromPort = e.fromPort == null ? "" : String(e.fromPort);
    path.dataset.toPort = e.toPort == null ? "" : String(e.toPort);
    path.dataset.ei = String(ei);
    path.setAttribute("d", d);
    if (plan.selectedEdge === ei) {
      path.setAttribute("stroke", "#e07a2f");
      path.setAttribute("stroke-width", "2.8");
    }
    path.style.cursor = "pointer";
    path.addEventListener("click", (ev) => onPlanEdgeClick(ev, ei));
    world.appendChild(path);
  });

  for (const n of plan.nodes) {
    const p = nodeBox(n);
    const rec = pickRecipe(n.name);
    const wh = isWarehouse(n);
    let cls = "node " + gradeCls(itemGrade(n.name));
    if (wh) cls = "node gwh";
    else if (!rec) cls = "node g0";
    const g = document.createElementNS(ns, "g");
    g.setAttribute("class", cls + (nodeIsSelected(n.id) ? " plan-sel" : "") + (plan.linkFrom === n.id ? " plan-from" : ""));
    g.dataset.name = String(n.id);

    const rect = document.createElementNS(ns, "rect");
    rect.setAttribute("x", p.x);
    rect.setAttribute("y", p.y);
    rect.setAttribute("rx", 7);
    rect.setAttribute("ry", 7);
    rect.setAttribute("width", p.w);
    rect.setAttribute("height", p.h);
    g.appendChild(rect);

    const t1 = document.createElementNS(ns, "text");
    t1.setAttribute("class", "name");
    t1.setAttribute("x", p.x + p.w / 2);
    t1.setAttribute("y", p.y + (wh ? WH_NAME_DY : 14));
    t1.setAttribute("text-anchor", "middle");
    t1.textContent = fitNodeLabel(wh ? (n.cargo || "仓库") : n.name);
    g.appendChild(t1);
    const t2 = document.createElementNS(ns, "text");
    t2.setAttribute("class", "meta");
    t2.setAttribute("x", p.x + p.w / 2);
    t2.setAttribute("y", p.y + (wh ? WH_META_DY : 31));
    t2.setAttribute("text-anchor", "middle");
    t2.textContent = wh ? "仓库" : (rec ? rec.machine : "原料 / 采集");
    g.appendChild(t2);
    if (wh) {
      const c = warehouseCounts(n.id);
      appendWarehousePorts(g, n, p);
      appendPortBadges(g, p, c.outs, c.ins, true);
    } else {
      appendPortBadges(g, p, outMap.get(n.id) || 0, inMap.get(n.id) || 0);
    }

    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (g.dataset.skipClick === "1") {
        delete g.dataset.skipClick;
        return;
      }
      if (plan.linkKind) {
        tryLinkPlan(n.id);
        return;
      }
      if (plan.unlinkOn) {
        tryUnlinkPlan(n.id);
        return;
      }
      const id = String(n.id);
      if (plan.selectedIds && plan.selectedIds.length > 1 && plan.selectedIds.includes(n.id)) {
        plan.selected = n.id;
        applyHighlight(id);
        return;
      }
      if (routeState.highlight === id) routeState.highlight = null;
      else routeState.highlight = id;
      selectPlanNodes([n.id]);
      renderPlanBoard();
    });
    bindPlanNodeDrag(g, n);
    world.appendChild(g);
  }
  applyTransform();
  if (routeState.highlight) {
    const keep = routeState.highlight;
    routeState.highlight = null;
    applyHighlight(keep, { force: true });
  }
}

function bindPlanNodeDrag(g, node) {
  g.style.cursor = "grab";
  g.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (plan.linkKind || plan.unlinkOn) return;
    e.stopPropagation();
    const startClient = { x: e.clientX, y: e.clientY };
    const groupIds = (plan.selectedIds && plan.selectedIds.includes(node.id) && plan.selectedIds.length > 1)
      ? [...plan.selectedIds]
      : [node.id];
    const group = groupIds.map((id) => planNodeById(id)).filter(Boolean);
    const starts = group.map((n) => ({ n, x: n.x, y: n.y }));
    routeState.nodeDrag = {
      name: String(node.id), el: g, active: true, moved: false,
      startClient, startPos: { x: node.x, y: node.y }, curX: node.x, curY: node.y, planNode: node,
    };
    try { g.setPointerCapture(e.pointerId); } catch (_) {}
    const onMove = (ev) => {
      const d = routeState.nodeDrag;
      if (!d || d.planNode !== node) return;
      const dx = (ev.clientX - startClient.x) / routeState.scale;
      const dy = (ev.clientY - startClient.y) / routeState.scale;
      if (Math.hypot(dx, dy) > 4) d.moved = true;
      if (!d.moved) return;
      const world = document.getElementById("routeWorld");
      for (const s of starts) {
        s.n.x = s.x + dx;
        s.n.y = s.y + dy;
        const p = routeState.layout && routeState.layout.positions.get(String(s.n.id));
        if (p) { p.x = s.n.x; p.y = s.n.y; }
        const el = world && world.querySelector('.node[data-name="' + s.n.id + '"]');
        if (el) {
          el.classList.add("dragging-node");
          refreshPlanNodePos(el, s.n);
        }
      }
      d.curX = node.x;
      d.curY = node.y;
      g.style.cursor = "grabbing";
      refreshEdgePaths();
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      const d = routeState.nodeDrag;
      document.querySelectorAll(".dragging-node").forEach((el) => el.classList.remove("dragging-node"));
      g.style.cursor = "grab";
      if (d && d.moved) {
        g.dataset.skipClick = "1";
        savePlan();
      }
      routeState.nodeDrag = null;
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}

function refreshPlanNodePos(g, node) {
  const p = nodeBox(node);
  const rect = g.querySelector("rect:not(.wh-port)");
  if (rect) {
    rect.setAttribute("x", p.x);
    rect.setAttribute("y", p.y);
    rect.setAttribute("width", p.w);
    rect.setAttribute("height", p.h);
  }
  const nameEl = g.querySelector("text.name");
  const metaEl = g.querySelector("text.meta");
  const wh = isWarehouse(node);
  if (nameEl) {
    nameEl.setAttribute("x", p.x + p.w / 2);
    nameEl.setAttribute("y", p.y + (wh ? WH_NAME_DY : 14));
  }
  if (metaEl) {
    metaEl.setAttribute("x", p.x + p.w / 2);
    metaEl.setAttribute("y", p.y + (wh ? WH_META_DY : 31));
  }
  if (wh) layoutWarehousePorts(g, p);
  layoutPortBadges(g, p);
}

function orderedSynthItems(grade) {
  const items = [...(synthCatalog.byGrade.get(grade) || [])];
  const order = synthOrder[String(grade)];
  if (!Array.isArray(order) || !order.length) return items;
  const map = new Map(items.map((r) => [r.product, r]));
  const out = [];
  const used = new Set();
  for (const name of order) {
    const r = map.get(name);
    if (r && !used.has(name)) {
      out.push(r);
      used.add(name);
    }
  }
  for (const r of items) if (!used.has(r.product)) out.push(r);
  return out;
}

function persistSynthGridOrder(grade) {
  const grid = document.getElementById("synthGrid");
  if (!grid) return;
  synthOrder[String(grade)] = [...grid.querySelectorAll(".synth-add")].map((el) => el.dataset.name).filter(Boolean);
  saveSynthOrder();
}

function bindSynthRowReorder(row) {
  row.addEventListener("contextmenu", (e) => e.preventDefault());
  row.addEventListener("click", (e) => {
    if (row.dataset.skipClick === "1") {
      delete row.dataset.skipClick;
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    addPlanItem(row.dataset.name);
  });
  row.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const pointerId = e.pointerId;
    const startX = e.clientX, startY = e.clientY;
    let armed = false;
    let placeholder = null;
    const timer = setTimeout(() => {
      armed = true;
      beginDrag();
    }, 420);

    function beginDrag() {
      row.dataset.skipClick = "1";
      const rect = row.getBoundingClientRect();
      placeholder = document.createElement("div");
      placeholder.className = "synth-ph";
      placeholder.style.height = rect.height + "px";
      row.parentNode.insertBefore(placeholder, row);
      row.classList.add("dragging");
      row.style.position = "fixed";
      row.style.left = rect.left + "px";
      row.style.width = rect.width + "px";
      row.style.top = rect.top + "px";
      row.style.margin = "0";
      row.style.pointerEvents = "none";
      row.style.touchAction = "none";
      try { row.setPointerCapture(pointerId); } catch (_) {}
      placeGap(startY);
    }

    function placeGap(clientY) {
      const grid = document.getElementById("synthGrid");
      if (!grid || !placeholder) return;
      const others = [...grid.querySelectorAll(".synth-add")].filter((el) => el !== row);
      let before = null;
      for (const other of others) {
        const r = other.getBoundingClientRect();
        if (clientY < r.top + r.height / 2) {
          before = other;
          break;
        }
      }
      if (before) grid.insertBefore(placeholder, before);
      else grid.appendChild(placeholder);
      const overlay = document.getElementById("synthList");
      if (!overlay) return;
      const ob = overlay.getBoundingClientRect();
      if (clientY < ob.top + 48) overlay.scrollTop -= 16;
      else if (clientY > ob.bottom - 48) overlay.scrollTop += 16;
    }

    function onMove(ev) {
      if (!armed) {
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
        return;
      }
      ev.preventDefault();
      const h = row.offsetHeight || 40;
      row.style.top = (ev.clientY - h / 2) + "px";
      placeGap(ev.clientY);
    }

    function onUp() {
      clearTimeout(timer);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      if (!armed) return;
      row.classList.remove("dragging");
      row.style.position = "";
      row.style.left = "";
      row.style.width = "";
      row.style.top = "";
      row.style.margin = "";
      row.style.pointerEvents = "";
      row.style.touchAction = "";
      if (placeholder && placeholder.parentNode) {
        placeholder.parentNode.insertBefore(row, placeholder);
        placeholder.remove();
      }
      persistSynthGridOrder(synthGrade);
    }

    window.addEventListener("pointermove", onMove, { passive: false });
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  });
}

function renderSynthList(grade) {
