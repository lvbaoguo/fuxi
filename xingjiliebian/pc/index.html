<style>

  .keys-hint {

  .node.dragging-node {

  .float-search {
    left: 12px; top: 12px; right: auto; width: min(420px, 46vw);

const PLAN_LS = "starrupture_plan_board_v1";
const PLAN_LS_BAK = PLAN_LS + "_bak";

const plan = {
  nodes: [], // {id, name, x, y}
  edges: [], // {from, to} id
  nextId: 1,
  selected: null, // node id
  selectedIds: [], // multi-select
  selectedEdge: null, // index
  linkKind: null, // 'in' 进口 | 'out' 出口
  unlinkOn: false,
  linkFrom: null,
};

function applyPlanData(raw) {
  if (!raw || !Array.isArray(raw.nodes)) return false;
  plan.nodes = raw.nodes;
  plan.edges = Array.isArray(raw.edges) ? raw.edges : [];
  plan.nextId = Number(raw.nextId) || (plan.nodes.reduce((m, n) => Math.max(m, n.id || 0), 0) + 1);
  return true;
}
function loadPlan() {
  try {
    const raw = JSON.parse(localStorage.getItem(PLAN_LS) || "null");
    applyPlanData(raw);
    if (!plan.nodes.length) {
      const bak = JSON.parse(localStorage.getItem(PLAN_LS_BAK) || "null");
      if (bak && Array.isArray(bak.nodes) && bak.nodes.length) applyPlanData(bak);
    }
  } catch (_) {}
}

const UNDO_MAX = 50;
let undoStack = [];
let redoStack = [];
let undoBusy = false;
let lastSaved = null;

function snapshotPlan() {
  return JSON.parse(JSON.stringify({
    nodes: plan.nodes,
    edges: plan.edges,
    nextId: plan.nextId,
  }));
}

function applySnapshot(s) {
  plan.nodes = JSON.parse(JSON.stringify(s.nodes || []));
  plan.edges = JSON.parse(JSON.stringify(s.edges || []));
  plan.nextId = Number(s.nextId) || (plan.nodes.reduce((m, n) => Math.max(m, n.id || 0), 0) + 1);
  plan.selected = null;
  plan.selectedIds = [];
  plan.selectedEdge = null;
  plan.linkFrom = null;
}

function syncUndoButtons() {
  const u = document.getElementById("pcUndo");
  const r = document.getElementById("pcRedo");
  if (u) u.disabled = !undoStack.length;
  if (r) r.disabled = !redoStack.length;
}

function savePlan() {
  try {
    const payload = {
      nodes: plan.nodes, edges: plan.edges, nextId: plan.nextId,
    };
    if (!undoBusy) {
      if (lastSaved) {
        undoStack.push(lastSaved);
        if (undoStack.length > UNDO_MAX) undoStack.shift();
      }
      redoStack = [];
    }
    lastSaved = JSON.parse(JSON.stringify(payload));
    const prev = localStorage.getItem(PLAN_LS);
    if (prev && plan.nodes.length) localStorage.setItem(PLAN_LS_BAK, prev);
    localStorage.setItem(PLAN_LS, JSON.stringify(payload));
  } catch (_) {}
  syncUndoButtons();
}

function undoPlan() {
  if (!undoStack.length) {
    showPlanToast("没有可撤销的操作");
    return;
  }
  undoBusy = true;
  redoStack.push(snapshotPlan());
  applySnapshot(undoStack.pop());
  savePlan();
  undoBusy = false;
  renderPlanBoard();
}

function redoPlan() {
  if (!redoStack.length) {
    showPlanToast("没有可恢复的操作");
    return;
  }
  undoBusy = true;
  undoStack.push(snapshotPlan());
  applySnapshot(redoStack.pop());
  savePlan();
  undoBusy = false;
  renderPlanBoard();
}

loadPlan();
lastSaved = snapshotPlan();

  } catch (_) { synthOrder = {}; }
}
function saveSynthOrder() {
  try { localStorage.setItem(SYNTH_ORDER_LS, JSON.stringify(synthOrder)); } catch (_) {}
}

    if (!map.has(r.product)) map.set(r.product, []);
    map.get(r.product).push(r);
  }
  return map;
})();

const allItemNames = (() => {
  const s = new Set();
  for (const r of RECIPES) {
    s.add(r.product);
    r.materials.forEach(m => s.add(m));
  }
  return [...s].sort((a,b)=>a.localeCompare(b, "zh"));
})();

function pickRecipe(product) {
  const list = recipeIndex.get(product) || [];
  if (!list.length) return null;
  if (routeState.preferBase) {
    const base = list.find(r => !isV2(r.machine));
    return base || list[0];
  }
  // prefer v2 if exists else base
  const v2 = list.find(r => isV2(r.machine));
  return v2 || list[0];
}

function itemMachineLabel(name) {
  const r = pickRecipe(name);
  if (!r) return "原料 / 采集";
  return r.machine;
}

function itemInCount(name) {
  const r = pickRecipe(name);
  return r ? r.materials.length : 0;
}

function itemGrade(name) {
  if (name === "仓库") return "wh";
  const r = pickRecipe(name);
  if (!r) return 0;
  return Math.max(1, itemDepth(name));
}

function gradeCls(g) {
  if (g === "wh") return "gwh";
  return "g" + Math.max(0, Math.min(15, g | 0));
}

function isWarehouse(n) {
  if (n == null) return false;
  if (typeof n === "string") return n === "仓库";
  return n.kind === "warehouse" || n.name === "仓库";
}

const FAMILY_ORDER = ["钛", "钨", "钙", "氦", "硫"];
function familyOfName(name) {
  if (!name) return "其他";
  if (name.includes("钛")) return "钛";
  if (name.includes("钨")) return "钨";
  if (name.includes("钙") || name.includes("方解石") || name.includes("陶瓷")) return "钙";
  if (name.includes("氦")) return "氦";
  if (name.includes("硫") || name === "硫酸") return "硫";
  if (name === "针铁矿" || name.includes("针铁")) return "其他";
  if (name === "能源矿") return "其他";
  const rec = pickRecipe(name);
  if (!rec) return "其他";
  const seen = new Set([name]);
  const stack = [...rec.materials];
  const found = new Set();
  while (stack.length) {
    const m = stack.pop();
    if (seen.has(m)) continue;
    seen.add(m);
    const hint = familyOfNameHint(m);
    if (hint !== "其他") found.add(hint);
    const child = pickRecipe(m);
    if (child) child.materials.forEach((x) => stack.push(x));
  }
  for (const f of FAMILY_ORDER) {
    if (found.has(f)) return f;
  }
  return "其他";
}
function familyOfNameHint(name) {
  if (name.includes("钛")) return "钛";
  if (name.includes("钨")) return "钨";
  if (name.includes("钙") || name.includes("方解石")) return "钙";
  if (name.includes("氦")) return "氦";
  if (name.includes("硫")) return "硫";
  return "其他";
}
function familyRank(name) {
  const i = FAMILY_ORDER.indexOf(familyOfName(name));
  return i < 0 ? FAMILY_ORDER.length : i;
}
const _depthMemo = new Map();
function itemDepth(name, stack) {
  if (_depthMemo.has(name)) return _depthMemo.get(name);
  if (!stack) stack = new Set();
  if (stack.has(name)) return 0;
  const r = pickRecipe(name);
  if (!r || !r.materials.length) {
    _depthMemo.set(name, 0);
    return 0;
  }
  stack.add(name);
  let maxD = 0;
  for (const m of r.materials) {
    const d = itemDepth(m, stack);
    if (d > maxD) maxD = d;
  }
  stack.delete(name);
  const out = 1 + maxD;
  _depthMemo.set(name, out);
  return out;
}
function cmpParts(aName, bName) {
  const fa = familyRank(aName), fb = familyRank(bName);
  if (fa !== fb) return fa - fb;
  const da = itemDepth(aName), db = itemDepth(bName);
  if (da !== db) return da - db;
  return aName.localeCompare(bName, "zh");
}

/** 每个成品取一条非 v.2 配方，按离原料最长合成步数分级（钛条1、钛棒2） */
const synthCatalog = (() => {
  const seen = new Set();
  const list = [];
  for (const r of RECIPES) {
    if (isV2(r.machine)) continue;
    if (seen.has(r.product)) continue;
    seen.add(r.product);
    list.push(r);
  }
  for (const r of RECIPES) {
    if (seen.has(r.product)) continue;
    seen.add(r.product);
    list.push(r);
  }
  list.sort((a, b) => cmpParts(a.product, b.product));
  const byGrade = new Map();
  byGrade.set(0, []);
  const products = new Set(list.map((r) => r.product));
  const raws = [];
  for (const name of allItemNames) {
    if (!products.has(name) && !pickRecipe(name)) raws.push(name);
  }
  raws.sort(cmpParts);
  byGrade.set(0, raws.map((name) => ({ product: name, machine: "原料 / 采集", materials: [] })));
  for (const r of list) {
    const g = Math.max(1, itemDepth(r.product));
    if (!byGrade.has(g)) byGrade.set(g, []);
    byGrade.get(g).push(r);
  }
  for (const [, arr] of byGrade) arr.sort((a, b) => cmpParts(a.product, b.product));
  byGrade.set("wh", [{
    product: "仓库",
    machine: "4口 · 2进口同名锁定 · 3出口可接下游",
    materials: [],
    kind: "warehouse",
  }]);
  const grades = [...[...byGrade.keys()].filter((g) => g !== "wh").sort((a, b) => a - b), "wh"];
  return { list, byGrade, grades };
})();

let synthGrade = synthCatalog.grades.includes(1) ? 1 : (synthCatalog.grades[0] || 0);

function nextPlanPos() {
  const i = plan.nodes.length;
  const col = i % 5, row = Math.floor(i / 5);
  return { x: 24 + col * 102, y: 24 + row * 86 };
}

function addPlanItem(name) {
  const pos = nextPlanPos();
  const node = { id: plan.nextId++, name, x: pos.x, y: pos.y };
  if (isWarehouse(name)) node.kind = "warehouse";
  plan.nodes.push(node);
  selectPlanNodes([node.id]);
  savePlan();
  renderPlanBoard();
}

function selectPlanNodes(ids) {
  const uniq = [];
  const seen = new Set();
  for (const id of ids || []) {
    if (id == null || seen.has(id)) continue;
    seen.add(id);
    uniq.push(id);
  }
  plan.selectedIds = uniq;
  plan.selected = uniq.length ? uniq[0] : null;
  plan.selectedEdge = null;
}

function nodeIsSelected(id) {
  if (plan.selectedIds && plan.selectedIds.length) return plan.selectedIds.includes(id);
  return plan.selected === id;
}

function hideMarquee() {
  const el = document.getElementById("marqueeBox");
  if (el) el.classList.remove("show");
}

function updateMarquee(x1, y1, x2, y2) {
  const el = document.getElementById("marqueeBox");
  const wrap = document.querySelector(".route-canvas-wrap");
  if (!el || !wrap) return;
  const r = wrap.getBoundingClientRect();
  el.style.left = (Math.min(x1, x2) - r.left) + "px";
  el.style.top = (Math.min(y1, y2) - r.top) + "px";
  el.style.width = Math.abs(x2 - x1) + "px";
  el.style.height = Math.abs(y2 - y1) + "px";
  el.classList.add("show");
}

function marqueeWorldBox(x1, y1, x2, y2) {
  const a = clientToWorld(x1, y1);
  const b = clientToWorld(x2, y2);
  return {
    x: Math.min(a.x, b.x),
    y: Math.min(a.y, b.y),
    w: Math.abs(a.x - b.x),
    h: Math.abs(a.y - b.y),
  };
}

function nodesInMarquee(box) {
  const hits = [];
  for (const n of plan.nodes) {
    const p = nodeBox(n);
    if (p.x < box.x + box.w && p.x + p.w > box.x && p.y < box.y + box.h && p.y + p.h > box.y) hits.push(n.id);
  }
  return hits;
}

function previewMarqueeSelection(ids) {
  const set = new Set(ids);
  document.querySelectorAll("#routeWorld .node").forEach((g) => {
    const id = Number(g.dataset.name);
    g.classList.toggle("plan-sel", set.has(id));
  });
}

function nodeBox(n) {
  if (isWarehouse(n)) return { x: n.x, y: n.y, w: WH_NODE_W, h: WH_NODE_H };
  return { x: n.x, y: n.y, w: PLAN_NODE_W, h: PLAN_NODE_H };
}

function showPlanToast(msg) {
  const el = document.getElementById("planToast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showPlanToast._t);
  showPlanToast._t = setTimeout(() => el.classList.remove("show"), 2400);
}

function warehouseCounts(id) {
  let ins = 0, outs = 0;
  for (const e of plan.edges) {
    if (e.from === id) outs++;
    if (e.to === id) ins++;
  }
  return { ins, outs };
}

function inferWarehouseCargo(id) {
  for (const e of plan.edges) {
    if (e.to !== id) continue;
    const other = planNodeById(e.from);
    if (other && !isWarehouse(other)) return other.name;
  }
  for (const e of plan.edges) {
    if (e.to !== id) continue;
    const other = planNodeById(e.from);
    if (isWarehouse(other) && other.cargo) return other.cargo;
  }
  return null;
}

function syncWarehouseCargos() {
  let changed = true, guard = 0;
  while (changed && guard++ < 24) {
    changed = false;
    for (const n of plan.nodes) {
      if (!isWarehouse(n)) continue;
      const next = inferWarehouseCargo(n.id) || null;
      if ((n.cargo || null) !== next) {
        n.cargo = next;
        changed = true;
      }
    }
  }
}

function nodeCargo(n) {
  if (!n) return null;
  if (isWarehouse(n)) return n.cargo || inferWarehouseCargo(n.id) || null;
  return n.name;
}

function fitNodeLabel(s) {
  if (!s) return "";
  return s.length > 7 ? s.slice(0, 6) + "…" : s;
}

function pickWarehousePort(node, other) {
  const dx = other.x - node.x;
  const dy = other.y - node.y;
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 1 : 3;
  return dy > 0 ? 2 : 0;
}

function warehousePortBox(p, side) {
  const s = 8;
  const cx = p.x + p.w / 2 - s / 2;
  const cy = p.y + p.h / 2 - s / 2;
  if (side === 0) return { x: cx, y: p.y - s / 2, w: s, h: s };
  if (side === 1) return { x: p.x + p.w - s / 2, y: cy, w: s, h: s };
  if (side === 2) return { x: cx, y: p.y + p.h - s / 2, w: s, h: s };
  return { x: p.x - s / 2, y: cy, w: s, h: s };
}

function portAnchor(p, side) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (side === 0) return { x: cx, y: p.y };
  if (side === 1) return { x: p.x + p.w, y: cy };
  if (side === 2) return { x: cx, y: p.y + p.h };
  return { x: p.x, y: cy };
}

function planNodeById(id) {
  return plan.nodes.find((n) => n.id === id);
}

function planPortStats() {
  const outMap = new Map(), inMap = new Map();
  for (const e of plan.edges) {
    if (!outMap.has(e.from)) outMap.set(e.from, 0);
    outMap.set(e.from, outMap.get(e.from) + 1);
    if (!inMap.has(e.to)) inMap.set(e.to, 0);
    inMap.set(e.to, inMap.get(e.to) + 1);
  }
  return { outMap, inMap };
}

function incidentEdgeIndices(id) {
  const nid = Number(id);
  const ins = [], outs = [];
  plan.edges.forEach((e, i) => {
    if (Number(e.to) === nid) ins.push(i);
    else if (Number(e.from) === nid) outs.push(i);
  });
  const byOther = (isIn) => (ia, ib) => {
    const a = plan.edges[ia], b = plan.edges[ib];
    const na = planNodeById(isIn ? a.from : a.to);
    const nb = planNodeById(isIn ? b.from : b.to);
    const ax = na ? na.x : 0, ay = na ? na.y : 0;
    const bx = nb ? nb.x : 0, by = nb ? nb.y : 0;
    return ax - bx || ay - by || ia - ib;
  };
  ins.sort(byOther(true));
  outs.sort(byOther(false));
  return ins.concat(outs);
}

function nodeShortName(n) {
  if (!n) return "";
  if (isWarehouse(n)) return n.cargo || "仓库";
  return n.name || "";
}

function tryUnlinkPlan(nodeId) {
  selectPlanNodes([nodeId]);
  const idxs = incidentEdgeIndices(nodeId);
  if (!idxs.length) {
    showPlanToast("这条没有连线");
    renderPlanBoard();
    return;
  }
  const ei = idxs[0];
  const e = plan.edges[ei];
  const other = planNodeById(Number(e.from) === Number(nodeId) ? e.to : e.from);
  const dir = Number(e.to) === Number(nodeId) ? "进" : "出";
  cutPlanEdge(ei);
  showPlanToast("已断 " + dir + " · " + nodeShortName(other));
}

function cutPlanEdge(ei) {
  if (ei == null || ei < 0 || ei >= plan.edges.length) return;
  plan.edges.splice(ei, 1);
  plan.selectedEdge = null;
  plan.linkFrom = null;
  syncWarehouseCargos();
  savePlan();
  renderPlanBoard();
}

function onPlanEdgeClick(ev, ei) {
  ev.stopPropagation();
  if (plan.unlinkOn) {
    cutPlanEdge(ei);
    return;
  }
  plan.selected = null;
  plan.selectedIds = [];
  plan.selectedEdge = ei;
  plan.linkFrom = null;
  renderPlanBoard();
}

function tryLinkPlan(clickId) {
  const kind = plan.linkKind || "in";
  const fromId = plan.linkFrom;
  if (!fromId || fromId === clickId) {
    plan.linkFrom = clickId;
    renderPlanBoard();
    return;
  }
  const a = planNodeById(fromId);
  const b = planNodeById(clickId);
  if (!a || !b) return;
  let fromNode = a, toNode = b;
  const aWh = isWarehouse(a), bWh = isWarehouse(b);
  if (kind === "in") {
    if (aWh && !bWh) { fromNode = b; toNode = a; }
    else if (bWh && !aWh) { fromNode = a; toNode = b; }
  } else if (kind === "out") {
    if (aWh && !bWh) { fromNode = a; toNode = b; }
    else if (bWh && !aWh) { fromNode = b; toNode = a; }
  }
  const srcId = fromNode.id, dstId = toNode.id;
  if (plan.edges.some((e) => e.from === srcId && e.to === dstId)) {
    plan.linkFrom = null;
    renderPlanBoard();
    return;
  }
  if (kind === "in" && isWarehouse(toNode)) {
    const incoming = nodeCargo(fromNode);
    const stored = nodeCargo(toNode);
    if (stored && incoming && stored !== incoming) {
      showPlanToast("仓库已存「" + stored + "」，进口只能接同名");
      return;
    }
    if (isWarehouse(fromNode) && isWarehouse(toNode) && !stored && !incoming) {
      showPlanToast("先把仓库进口接到要存的产品上");
      return;
    }
  }
  if (kind === "out" && isWarehouse(fromNode)) {
    const stored = nodeCargo(fromNode);
    if (!stored) {
      showPlanToast("仓库还没进口，先按 2 接要存的产品");
      return;
    }
    if (isWarehouse(toNode)) {
      const destC = nodeCargo(toNode);
      if (destC && destC !== stored) {
        showPlanToast("下游仓库已存「" + destC + "」，对不上");
        return;
      }
    }
  }
  const edge = { from: srcId, to: dstId };
  if (isWarehouse(fromNode)) edge.fromPort = pickWarehousePort(fromNode, toNode);
  if (isWarehouse(toNode)) edge.toPort = pickWarehousePort(toNode, fromNode);
  plan.edges.push(edge);
  plan.linkFrom = null;
  selectPlanNodes([dstId]);
  syncWarehouseCargos();
  savePlan();
  renderPlanBoard();
}

function deletePlanSelection() {
  if (plan.selectedEdge != null && !(plan.selectedIds && plan.selectedIds.length)) {
    plan.edges.splice(plan.selectedEdge, 1);
    plan.selectedEdge = null;
    syncWarehouseCargos();
    savePlan();
    renderPlanBoard();
    return;
  }
  const ids = (plan.selectedIds && plan.selectedIds.length)
    ? [...plan.selectedIds]
    : (plan.selected != null ? [plan.selected] : []);
  if (!ids.length) return;
  const idSet = new Set(ids);
  plan.nodes = plan.nodes.filter((n) => !idSet.has(n.id));
  plan.edges = plan.edges.filter((e) => !idSet.has(e.from) && !idSet.has(e.to));
  selectPlanNodes([]);
  if (idSet.has(plan.linkFrom)) plan.linkFrom = null;
  syncWarehouseCargos();
  savePlan();
  renderPlanBoard();
}

function clearPlanBoard() {
  if (plan.nodes.length && !confirm("清空规划板上的建筑和连线？")) return;
  plan.nodes = [];
  plan.edges = [];
  plan.selected = null;
  plan.selectedIds = [];
  plan.selectedEdge = null;
  plan.linkFrom = null;
  savePlan();
  renderPlanBoard();
}

function renderPlanBoard() {
  const world = document.getElementById("routeWorld");
  const emptyEl = document.getElementById("routeEmpty");
  world.innerHTML = "";
  world.classList.remove("is-hl");
  routeState.nodeDrag = null;
  if (!plan.nodes.length) {
    if (emptyEl) {
      emptyEl.classList.remove("hide");
      emptyEl.classList.add("plan-hint");
      emptyEl.textContent = "点「加入」摆块；「进口 2」接进仓库（同名）；「出口 3」从仓库接到下游；「断开」点产品依次断线";
    }
    applyTransform();
    return;
  }
  if (emptyEl) {
    emptyEl.classList.add("hide");
    emptyEl.classList.remove("plan-hint");
  }
  syncWarehouseCargos();

  const layout = { positions: new Map(), vertical: routeState.dir === "v" };
  for (const n of plan.nodes) {
    layout.positions.set(String(n.id), nodeBox(n));
  }
  routeState.layout = layout;
  routeState.graph = {
    nodes: new Map(plan.nodes.map((n) => [String(n.id), n])),
    edges: plan.edges.map((e) => ({ from: String(e.from), to: String(e.to) })),
  };

  const { outMap, inMap } = planPortStats();
  const ns = "http://www.w3.org/2000/svg";
  const vertical = routeState.dir === "v";

  plan.edges.forEach((e, ei) => {
    const a = layout.positions.get(String(e.from));
    const b = layout.positions.get(String(e.to));
    if (!a || !b) return;
    const d = edgePathD(a, b, vertical, e.fromPort, e.toPort);
    const hit = document.createElementNS(ns, "path");
    hit.setAttribute("class", "edge-hit");
    hit.dataset.from = String(e.from);
    hit.dataset.to = String(e.to);
    hit.dataset.fromPort = e.fromPort == null ? "" : String(e.fromPort);
    hit.dataset.toPort = e.toPort == null ? "" : String(e.toPort);
    hit.dataset.ei = String(ei);
    hit.setAttribute("d", d);
    hit.addEventListener("click", (ev) => onPlanEdgeClick(ev, ei));
    world.appendChild(hit);
    const path = document.createElementNS(ns, "path");
    path.setAttribute("class", "edge" + (plan.selectedEdge === ei ? " hl" : ""));
    path.dataset.from = String(e.from);
    path.dataset.to = String(e.to);
    path.dataset.fromPort = e.fromPort == null ? "" : String(e.fromPort);
    path.dataset.toPort = e.toPort == null ? "" : String(e.toPort);
    path.dataset.ei = String(ei);
    path.setAttribute("d", d);
    if (plan.selectedEdge === ei) {
      path.setAttribute("stroke", "#e07a2f");
      path.setAttribute("stroke-width", "2.8");
    }
    path.style.cursor = "pointer";
    path.addEventListener("click", (ev) => onPlanEdgeClick(ev, ei));
    world.appendChild(path);
  });

  for (const n of plan.nodes) {
    const p = nodeBox(n);
    const rec = pickRecipe(n.name);
    const wh = isWarehouse(n);
    let cls = "node " + gradeCls(itemGrade(n.name));
    if (wh) cls = "node gwh";
    else if (!rec) cls = "node g0";
    const g = document.createElementNS(ns, "g");
    g.setAttribute("class", cls + (nodeIsSelected(n.id) ? " plan-sel" : "") + (plan.linkFrom === n.id ? " plan-from" : ""));
    g.dataset.name = String(n.id);

    const rect = document.createElementNS(ns, "rect");
    rect.setAttribute("x", p.x);
    rect.setAttribute("y", p.y);
    rect.setAttribute("rx", 7);
    rect.setAttribute("ry", 7);
    rect.setAttribute("width", p.w);
    rect.setAttribute("height", p.h);
    g.appendChild(rect);

    const t1 = document.createElementNS(ns, "text");
    t1.setAttribute("class", "name");
    t1.setAttribute("x", p.x + p.w / 2);
    t1.setAttribute("y", p.y + (wh ? WH_NAME_DY : 14));
    t1.setAttribute("text-anchor", "middle");
    t1.textContent = fitNodeLabel(wh ? (n.cargo || "仓库") : n.name);
    g.appendChild(t1);
    const t2 = document.createElementNS(ns, "text");
    t2.setAttribute("class", "meta");
    t2.setAttribute("x", p.x + p.w / 2);
    t2.setAttribute("y", p.y + (wh ? WH_META_DY : 31));
    t2.setAttribute("text-anchor", "middle");
    t2.textContent = wh ? "仓库" : (rec ? rec.machine : "原料 / 采集");
    g.appendChild(t2);
    if (wh) {
      const c = warehouseCounts(n.id);
      appendWarehousePorts(g, n, p);
      appendPortBadges(g, p, c.outs, c.ins, true);
    } else {
      appendPortBadges(g, p, outMap.get(n.id) || 0, inMap.get(n.id) || 0);
    }

    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (g.dataset.skipClick === "1") {
        delete g.dataset.skipClick;
        return;
      }
      if (plan.linkKind) {
        tryLinkPlan(n.id);
        return;
      }
      if (plan.unlinkOn) {
        tryUnlinkPlan(n.id);
        return;
      }
      const id = String(n.id);
      if (plan.selectedIds && plan.selectedIds.length > 1 && plan.selectedIds.includes(n.id)) {
        plan.selected = n.id;
        applyHighlight(id);
        return;
      }
      if (routeState.highlight === id) routeState.highlight = null;
      else routeState.highlight = id;
      selectPlanNodes([n.id]);
      renderPlanBoard();
    });
    bindPlanNodeDrag(g, n);
    world.appendChild(g);
  }
  applyTransform();
  if (routeState.highlight) {
    const keep = routeState.highlight;
    routeState.highlight = null;
    applyHighlight(keep, { force: true });
  }
}

function bindPlanNodeDrag(g, node) {
  g.style.cursor = "grab";
  g.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (plan.linkKind || plan.unlinkOn) return;
    e.stopPropagation();
    const startClient = { x: e.clientX, y: e.clientY };
    const groupIds = (plan.selectedIds && plan.selectedIds.includes(node.id) && plan.selectedIds.length > 1)
      ? [...plan.selectedIds]
      : [node.id];
    const group = groupIds.map((id) => planNodeById(id)).filter(Boolean);
    const starts = group.map((n) => ({ n, x: n.x, y: n.y }));
    routeState.nodeDrag = {
      name: String(node.id), el: g, active: true, moved: false,
      startClient, startPos: { x: node.x, y: node.y }, curX: node.x, curY: node.y, planNode: node,
    };
    try { g.setPointerCapture(e.pointerId); } catch (_) {}
    const onMove = (ev) => {
      const d = routeState.nodeDrag;
      if (!d || d.planNode !== node) return;
      const dx = (ev.clientX - startClient.x) / routeState.scale;
      const dy = (ev.clientY - startClient.y) / routeState.scale;
      if (Math.hypot(dx, dy) > 4) d.moved = true;
      if (!d.moved) return;
      const world = document.getElementById("routeWorld");
      for (const s of starts) {
        s.n.x = s.x + dx;
        s.n.y = s.y + dy;
        const p = routeState.layout && routeState.layout.positions.get(String(s.n.id));
        if (p) { p.x = s.n.x; p.y = s.n.y; }
        const el = world && world.querySelector('.node[data-name="' + s.n.id + '"]');
        if (el) {
          el.classList.add("dragging-node");
          refreshPlanNodePos(el, s.n);
        }
      }
      d.curX = node.x;
      d.curY = node.y;
      g.style.cursor = "grabbing";
      refreshEdgePaths();
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      const d = routeState.nodeDrag;
      document.querySelectorAll(".dragging-node").forEach((el) => el.classList.remove("dragging-node"));
      g.style.cursor = "grab";
      if (d && d.moved) {
        g.dataset.skipClick = "1";
        savePlan();
      }
      routeState.nodeDrag = null;
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
}

function refreshPlanNodePos(g, node) {
  const p = nodeBox(node);
  const rect = g.querySelector("rect:not(.wh-port)");
  if (rect) {
    rect.setAttribute("x", p.x);
    rect.setAttribute("y", p.y);
    rect.setAttribute("width", p.w);
    rect.setAttribute("height", p.h);
  }
  const nameEl = g.querySelector("text.name");
  const metaEl = g.querySelector("text.meta");
  const wh = isWarehouse(node);
  if (nameEl) {
    nameEl.setAttribute("x", p.x + p.w / 2);
    nameEl.setAttribute("y", p.y + (wh ? WH_NAME_DY : 14));
  }
  if (metaEl) {
    metaEl.setAttribute("x", p.x + p.w / 2);
    metaEl.setAttribute("y", p.y + (wh ? WH_META_DY : 31));
  }
  if (wh) layoutWarehousePorts(g, p);
  layoutPortBadges(g, p);
}

function orderedSynthItems(grade) {
  const items = [...(synthCatalog.byGrade.get(grade) || [])];
  const order = synthOrder[String(grade)];
  if (!Array.isArray(order) || !order.length) return items;
  const map = new Map(items.map((r) => [r.product, r]));
  const out = [];
  const used = new Set();
  for (const name of order) {
    const r = map.get(name);
    if (r && !used.has(name)) {
      out.push(r);
      used.add(name);
    }
  }
  for (const r of items) if (!used.has(r.product)) out.push(r);
  return out;
}

function persistSynthGridOrder(grade) {
  const grid = document.getElementById("synthGrid");
  if (!grid) return;
  synthOrder[String(grade)] = [...grid.querySelectorAll(".synth-add")].map((el) => el.dataset.name).filter(Boolean);
  saveSynthOrder();
}

function bindSynthRowReorder(row) {
  row.addEventListener("contextmenu", (e) => e.preventDefault());
  row.addEventListener("click", (e) => {
    if (row.dataset.skipClick === "1") {
      delete row.dataset.skipClick;
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    addPlanItem(row.dataset.name);
  });
  row.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const pointerId = e.pointerId;
    const startX = e.clientX, startY = e.clientY;
    let armed = false;
    let placeholder = null;
    const timer = setTimeout(() => {
      armed = true;
      beginDrag();
    }, 420);

    function beginDrag() {
      row.dataset.skipClick = "1";
      const rect = row.getBoundingClientRect();
      placeholder = document.createElement("div");
      placeholder.className = "synth-ph";
      placeholder.style.height = rect.height + "px";
      row.parentNode.insertBefore(placeholder, row);
      row.classList.add("dragging");
      row.style.position = "fixed";
      row.style.left = rect.left + "px";
      row.style.width = rect.width + "px";
      row.style.top = rect.top + "px";
      row.style.margin = "0";
      row.style.pointerEvents = "none";
      row.style.touchAction = "none";
      try { row.setPointerCapture(pointerId); } catch (_) {}
      placeGap(startY);
    }

    function placeGap(clientY) {
      const grid = document.getElementById("synthGrid");
      if (!grid || !placeholder) return;
      const others = [...grid.querySelectorAll(".synth-add")].filter((el) => el !== row);
      let before = null;
      for (const other of others) {
        const r = other.getBoundingClientRect();
        if (clientY < r.top + r.height / 2) {
          before = other;
          break;
        }
      }
      if (before) grid.insertBefore(placeholder, before);
      else grid.appendChild(placeholder);
      const overlay = document.getElementById("synthList");
      if (!overlay) return;
      const ob = overlay.getBoundingClientRect();
      if (clientY < ob.top + 48) overlay.scrollTop -= 16;
      else if (clientY > ob.bottom - 48) overlay.scrollTop += 16;
    }

    function onMove(ev) {
      if (!armed) {
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
        return;
      }
      ev.preventDefault();
      const h = row.offsetHeight || 40;
      row.style.top = (ev.clientY - h / 2) + "px";
      placeGap(ev.clientY);
    }

    function onUp() {
      clearTimeout(timer);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      if (!armed) return;
      row.classList.remove("dragging");
      row.style.position = "";
      row.style.left = "";
      row.style.width = "";
      row.style.top = "";
      row.style.margin = "";
      row.style.pointerEvents = "";
      row.style.touchAction = "";
      if (placeholder && placeholder.parentNode) {
        placeholder.parentNode.insertBefore(row, placeholder);
        placeholder.remove();
      }
      persistSynthGridOrder(synthGrade);
    }

    window.addEventListener("pointermove", onMove, { passive: false });
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  });
}

function renderSynthList(grade) {
  synthGrade = grade;
  const tabs = document.getElementById("synthTabs");

  tabs.innerHTML = "";

  });
}

function buildRoute(target) {
  const nodes = new Map(); // name -> {name, recipe|null, raw, cycle, depth}
  const edges = []; // {from, to, machine}
  const stack = new Set();

  function walk(name) {
    if (stack.has(name)) {
      const hit = nodes.get(name);
      if (hit) { hit.cycle = true; return hit; }
      const stub = { name, recipe: null, raw: true, cycle: true, depth: 0 };
      nodes.set(name, stub);
      return stub;
    }
    if (nodes.has(name)) return nodes.get(name);

    const node = { name, recipe: null, raw: false, cycle: false, depth: 0 };
    nodes.set(name, node);

    const recipe = pickRecipe(name);
    if (!recipe) {
      node.raw = true;
      node.depth = 0;
      return node;
    }

    stack.add(name);
    node.recipe = recipe;
    let maxD = 0;
    for (const mat of recipe.materials) {
      // skip self-edge loops
      if (mat === name) continue;
      // if material is already on stack, mark cycle and still show edge once
      const onStack = stack.has(mat);
      const child = walk(mat);
      if (onStack) child.cycle = true;
      edges.push({ from: mat, to: name, machine: recipe.machine });
      if (!onStack) maxD = Math.max(maxD, child.depth);
    }
    stack.delete(name);
    node.depth = maxD + 1;
    return node;
  }

  walk(target);

  // recompute depths in topological fashion (longest path from raw)
  let changed = true;
  let guard = 0;
  while (changed && guard++ < 50) {
    changed = false;
    for (const e of edges) {
      const a = nodes.get(e.from);
      const b = nodes.get(e.to);
      if (!a || !b) continue;
      const nd = a.depth + 1;
      if (nd > b.depth) { b.depth = nd; changed = true; }
    }
  }

  return { nodes, edges, target };
}

function layoutRoute(graph) {
  const { nodes } = graph;
  const byDepth = new Map();
  for (const n of nodes.values()) {
    if (!byDepth.has(n.depth)) byDepth.set(n.depth, []);
    byDepth.get(n.depth).push(n);
  }
  const depths = [...byDepth.keys()].sort((a, b) => a - b);
  const nodeW = PLAN_NODE_W, nodeH = PLAN_NODE_H, gapX = PLAN_NODE_W + 22, gapY = PLAN_NODE_H + 16;
  const positions = new Map();
  const vertical = routeState.dir === "v";

  depths.forEach((d, di) => {
    const col = byDepth.get(d);
    col.sort((a, b) => a.name.localeCompare(b.name, "zh"));
    if (vertical) {
      // 竖向：深度向下；同层横向居中铺开。原料(depth小)在上，成品在下
      const totalW = col.length * gapX;
      col.forEach((n, i) => {
        positions.set(n.name, {
          x: i * gapX - totalW / 2 + gapX / 2,
          y: di * gapY,
          w: nodeW,
          h: nodeH,
        });
      });
    } else {
      const totalH = col.length * gapY;
      col.forEach((n, i) => {
        positions.set(n.name, {
          x: di * gapX,
          y: i * gapY - totalH / 2 + gapY / 2,
          w: nodeW,
          h: nodeH,
        });
      });
    }
  });

  return { positions, nodeW, nodeH, gapX, gapY, depths, byDepth, vertical };
}

function prevLayerSets(focus, edges) {
  const prev = new Set();
  const edgeKeys = new Set();
  for (const e of edges) {
    if (e.to !== focus) continue;
    prev.add(e.from);
    edgeKeys.add(e.from + "->" + e.to);
  }
  return { prev, nodes: new Set([focus, ...prev]), edgeKeys };
}

/** 本路线内：出=供给几个下游，进=吃几种原料 */
function portStats(graph) {
  const outMap = new Map();
  const inMap = new Map();
  for (const e of graph.edges) {
    if (!outMap.has(e.from)) outMap.set(e.from, new Set());
    outMap.get(e.from).add(e.to);
    if (!inMap.has(e.to)) inMap.set(e.to, new Set());
    inMap.get(e.to).add(e.from);
  }
  const stats = new Map();
  for (const name of graph.nodes.keys()) {
    const o = outMap.has(name) ? outMap.get(name).size : 0;
    const i = inMap.has(name) ? inMap.get(name).size : 0;
    stats.set(name, { out: o, in: i });
  }
  return stats;
}

function portBadgeBox(p, index) {
  const stackH = BADGE_H * 2 + BADGE_GAP;
  const x = p.x + (p.w - BADGE_W) / 2;
  const y0 = p.y + p.h - stackH - 4;
  return { x, y: y0 + index * (BADGE_H + BADGE_GAP), w: BADGE_W, h: BADGE_H };
}

function layoutPortBadges(g, p) {
  const bgs = [...g.querySelectorAll(".badge-bg")];
  const texts = [...g.querySelectorAll("text.badge")];
  bgs.forEach((el, i) => {
    const b = portBadgeBox(p, i);
    el.setAttribute("x", b.x);
    el.setAttribute("y", b.y);
    el.setAttribute("width", b.w);
    el.setAttribute("height", b.h);
  });
  texts.forEach((el, i) => {
    const b = portBadgeBox(p, i);
    el.setAttribute("x", b.x + b.w / 2);
    el.setAttribute("y", b.y + 8.4);
  });
}

function layoutWarehousePorts(g, p) {
  const ports = [...g.querySelectorAll(".wh-port")];
  ports.forEach((el, s) => {
    const b = warehousePortBox(p, s);
    el.setAttribute("x", b.x);
    el.setAttribute("y", b.y);
    el.setAttribute("width", b.w);
    el.setAttribute("height", b.h);
  });
}

function appendWarehousePorts(g, node, p) {
  const ns = "http://www.w3.org/2000/svg";
  const roles = ["free", "free", "free", "free"];
  for (const e of plan.edges) {
    if (e.from === node.id && e.fromPort != null) roles[Number(e.fromPort)] = "out";
    if (e.to === node.id && e.toPort != null) roles[Number(e.toPort)] = "in";
  }
  for (let s = 0; s < 4; s++) {
    const b = warehousePortBox(p, s);
    const r = document.createElementNS(ns, "rect");
    r.setAttribute("class", "wh-port " + roles[s]);
    r.setAttribute("rx", 2);
    r.setAttribute("ry", 2);
    r.setAttribute("x", b.x);
    r.setAttribute("y", b.y);
    r.setAttribute("width", b.w);
    r.setAttribute("height", b.h);
    g.appendChild(r);
  }
}

function appendPortBadges(g, p, outN, inN, alwaysColor) {
  const ns = "http://www.w3.org/2000/svg";
  function pill(label, cls) {
    const bg = document.createElementNS(ns, "rect");
    bg.setAttribute("class", "badge-bg " + cls);
    bg.setAttribute("stroke-width", "1");
    g.appendChild(bg);
    const t = document.createElementNS(ns, "text");
    t.setAttribute("class", "badge " + cls);
    t.setAttribute("text-anchor", "middle");
    t.textContent = label;
    g.appendChild(t);
  }
  const outCls = (alwaysColor || outN >= 2) ? "out-multi" : "out-single";
  const inCls = (alwaysColor || inN >= 2) ? "in-multi" : "in-single";
  pill(`出${outN}`, outCls);
  pill(`进${inN}`, inCls);
  layoutPortBadges(g, p);
}

function applyHighlight(focus, opts) {
  const world = document.getElementById("routeWorld");
  const force = !!(opts && opts.force);

  if (!focus || !routeState.graph) {
    routeState.highlight = null;
    if (world) {
      world.classList.remove("is-hl");
      world.querySelectorAll(".edge.hl").forEach(el => el.classList.remove("hl"));
      world.querySelectorAll(".node.hl, .node.hl-focus, .node.hl-prev").forEach(el => {
        el.classList.remove("hl", "hl-focus", "hl-prev");
      });
    }
    return;
  }

  if (!force && routeState.highlight === focus) {
    applyHighlight(null);
    return;
  }

  routeState.highlight = focus;
  const { prev, nodes, edgeKeys } = prevLayerSets(focus, routeState.graph.edges);
  world.classList.add("is-hl");

  world.querySelectorAll(".edge").forEach(el => {
    const key = el.dataset.from + "->" + el.dataset.to;
    el.classList.toggle("hl", edgeKeys.has(key));
  });
  world.querySelectorAll(".node").forEach(el => {
    const name = el.dataset.name;
    el.classList.remove("hl", "hl-focus", "hl-prev");
    if (!nodes.has(name)) return;
    el.classList.add("hl");
    if (name === focus) el.classList.add("hl-focus");
    else if (prev.has(name)) el.classList.add("hl-prev");
  });
}

function renderRouteGraph(target, opts = {}) {
  if (routeState.mode === "plan") return;
  const keepView = !!opts.keepView;
  const keepHighlight = opts.keepHighlight || null;
  const world = document.getElementById("routeWorld");
  const emptyEl = document.getElementById("routeEmpty");
  world.innerHTML = "";
  routeState.highlight = null;
  routeState.graph = null;
  routeState.nodeDrag = null;
  world.classList.remove("is-hl");

  if (!target) {
    emptyEl.classList.remove("hide");
    emptyEl.textContent = "搜索后出图。长按拖节点可并排；角标看出/进几路";
    applyTransform();
    return;
  }
  if (!recipeIndex.has(target) && !allItemNames.includes(target)) {
    emptyEl.classList.remove("hide");
    emptyEl.textContent = `未找到「${target}」`;
    applyTransform();
    return;
  }

  const graph = buildRoute(target);
  const layout = layoutRoute(graph);
  applyStoredOverrides(layout, target);
  routeState.layout = layout;
  const ports = portStats(graph);
  routeState.graph = graph;
  routeState.target = target;
  emptyEl.classList.add("hide");
  pushSearchHistory(target);

  const vertical = !!layout.vertical;
  for (const e of graph.edges) {
    const a = layout.positions.get(e.from);
    const b = layout.positions.get(e.to);
    if (!a || !b) continue;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "edge");
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    path.setAttribute("d", edgePathD(a, b, vertical));
    world.appendChild(path);
  }

  for (const n of graph.nodes.values()) {
    const p = layout.positions.get(n.name);
    if (!p) continue;
    const st = ports.get(n.name) || { out: 0, in: 0 };
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    let cls = "node " + gradeCls(itemGrade(n.name));
    if (n.name === target) cls += " node-target";
    if (n.cycle) cls += " node-cycle";
    if (n.raw) cls += " g0";
    g.setAttribute("class", cls);
    g.dataset.name = n.name;

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", p.x);
    rect.setAttribute("y", p.y);
    rect.setAttribute("rx", 7);
    rect.setAttribute("ry", 7);
    rect.setAttribute("width", p.w);
    rect.setAttribute("height", p.h);
    g.appendChild(rect);

    const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t1.setAttribute("class", "name");
    t1.setAttribute("x", p.x + p.w / 2);
    t1.setAttribute("y", p.y + 14);
    t1.setAttribute("text-anchor", "middle");
    t1.textContent = n.name.length > 7 ? n.name.slice(0, 6) + "…" : n.name;
    const outHint = st.out >= 2 ? `输出分 ${st.out} 路，建议调制器/分轨` : (st.out === 1 ? "输出单轨即可" : "终点，无下游输出");
    const inHint = st.in >= 2 ? `进料 ${st.in} 口，各原料独立进黄口` : (st.in === 1 ? "进料 1 口" : "原料点，无进料");
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = `${n.name}｜${outHint}；${inHint}｜单击高亮上一层｜长按拖动调整位置`;
    g.appendChild(title);
    g.appendChild(t1);

    const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t2.setAttribute("class", "meta");
    t2.setAttribute("x", p.x + p.w / 2);
    t2.setAttribute("y", p.y + 31);
    t2.setAttribute("text-anchor", "middle");
    if (n.cycle) t2.textContent = "循环截断";
    else if (n.raw) t2.textContent = "原料 / 采集";
    else t2.textContent = n.recipe.machine;
    g.appendChild(t2);

    appendPortBadges(g, p, st.out, st.in);

    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (g.dataset.skipClick === "1") {
        delete g.dataset.skipClick;
        return;
      }
      applyHighlight(n.name);
    });
    bindNodeDrag(g, n.name);
    world.appendChild(g);
  }

  if (!keepView) {
    routeState.scale = 1;
    const svgEl = document.getElementById("routeSvg");
    if (routeState.dir === "v") {
      routeState.tx = (svgEl.clientWidth || 800) / 2;
      routeState.ty = 56;
    } else {
      routeState.tx = 60;
      routeState.ty = (svgEl.clientHeight || 600) / 2;
    }
  }
  applyTransform();
  if (keepHighlight) applyHighlight(keepHighlight);
}

function applyTransform() {
  const world = document.getElementById("routeWorld");
  world.setAttribute("transform", `translate(${routeState.tx},${routeState.ty}) scale(${routeState.scale})`);
}

function edgePathD(a, b, vertical, fromPort, toPort) {
  const fp = fromPort === "" || fromPort == null ? null : Number(fromPort);
  const tp = toPort === "" || toPort == null ? null : Number(toPort);
  let x1, y1, x2, y2;
  if (fp != null && !Number.isNaN(fp)) {
    const pt = portAnchor(a, fp);
    x1 = pt.x; y1 = pt.y;
  } else if (vertical) {
    x1 = a.x + a.w / 2; y1 = a.y + a.h;
  } else {
    x1 = a.x + a.w; y1 = a.y + a.h / 2;
  }
  if (tp != null && !Number.isNaN(tp)) {
    const pt = portAnchor(b, tp);
    x2 = pt.x; y2 = pt.y;
  } else if (vertical) {
    x2 = b.x + b.w / 2; y2 = b.y;
  } else {
    x2 = b.x; y2 = b.y + b.h / 2;
  }
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}

function effectivePos(name) {
  const p = routeState.layout && routeState.layout.positions.get(name);
  if (!p) return null;
  const drag = routeState.nodeDrag;
  if (drag && drag.active && drag.name === name) {
    return { x: drag.curX, y: drag.curY, w: p.w, h: p.h };
  }
  return p;
}

function refreshEdgePaths() {
  if (!routeState.layout) return;
  const vertical = routeState.dir === "v";
  const world = document.getElementById("routeWorld");
  world.querySelectorAll(".edge, .edge-hit").forEach((path) => {
    const a = effectivePos(path.dataset.from);
    const b = effectivePos(path.dataset.to);
    if (!a || !b) return;
    path.setAttribute("d", edgePathD(a, b, vertical, path.dataset.fromPort, path.dataset.toPort));
  });
}

function clientToWorld(clientX, clientY) {
  const svgEl = document.getElementById("routeSvg");
  const rect = svgEl.getBoundingClientRect();
  return {
    x: (clientX - rect.left - routeState.tx) / routeState.scale,
    y: (clientY - rect.top - routeState.ty) / routeState.scale,
  };
}

function clearPosOverrides() {
  routeState.posOverride = {};
  routeState.overrideKey = "";
}

function applyStoredOverrides(layout, target) {
  const key = target + "|" + routeState.dir;
  if (routeState.overrideKey !== key) {
    routeState.posOverride = {};
    routeState.overrideKey = key;
  }
  for (const [name, pos] of Object.entries(routeState.posOverride)) {
    const p = layout.positions.get(name);
    if (!p) continue;
    p.x = pos.x;
    p.y = pos.y;
  }
}

const NODE_LONG_MS = 380;

function bindNodeDrag(g, name) {
  g.style.cursor = "grab";
  g.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.stopPropagation();
    const p = routeState.layout && routeState.layout.positions.get(name);
    if (!p) return;
    const startClient = { x: e.clientX, y: e.clientY };
    const startPos = { x: p.x, y: p.y };
    let timer = setTimeout(() => {
      routeState.nodeDrag = {
        name, el: g, active: true, moved: false,
        startClient, startPos,
        curX: startPos.x, curY: startPos.y,
      };
      g.classList.add("dragging-node");
      g.style.cursor = "grabbing";
      try { g.setPointerCapture(e.pointerId); } catch (_) {}
    }, NODE_LONG_MS);

    const onMove = (ev) => {
      if (!routeState.nodeDrag || routeState.nodeDrag.name !== name || !routeState.nodeDrag.active) {
        if (Math.hypot(ev.clientX - startClient.x, ev.clientY - startClient.y) > 9) {
          clearTimeout(timer);
          timer = null;
        }
        return;
      }
      ev.preventDefault();
      const w0 = clientToWorld(startClient.x, startClient.y);
      const w1 = clientToWorld(ev.clientX, ev.clientY);
      const dx = w1.x - w0.x;
      const dy = w1.y - w0.y;
      if (Math.hypot(dx, dy) > 2) routeState.nodeDrag.moved = true;
      routeState.nodeDrag.curX = startPos.x + dx;
      routeState.nodeDrag.curY = startPos.y + dy;
      g.setAttribute("transform", `translate(${dx},${dy})`);
      refreshEdgePaths();
    };

    const onUp = () => {
      if (timer) clearTimeout(timer);
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      const drag = routeState.nodeDrag;
      if (!drag || drag.name !== name) return;
      g.classList.remove("dragging-node");
      g.style.cursor = "grab";
      g.removeAttribute("transform");
      const moved = drag.moved;
      if (moved) {
        p.x = drag.curX;
        p.y = drag.curY;
        routeState.posOverride[name] = { x: p.x, y: p.y };
        g.dataset.skipClick = "1";
      }
      routeState.nodeDrag = null;
      if (moved) {
        const hl = routeState.highlight;
        renderRouteGraph(routeState.target, { keepView: true, keepHighlight: hl });
      }
      refreshEdgePaths();
    };

    document.addEventListener("pointermove", onMove, { passive: false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

function panByClientDelta(fromX, fromY, toX, toY) {
  routeState.tx += toX - fromX;
  routeState.ty += toY - fromY;
}

function zoomAtClient(clientX, clientY, nextScale) {
  const rect = document.getElementById("routeSvg").getBoundingClientRect();
  const c = { x: clientX - rect.left, y: clientY - rect.top };
  const next = Math.min(3.5, Math.max(0.3, nextScale));
  const k = next / routeState.scale;
  routeState.tx = c.x - (c.x - routeState.tx) * k;
  routeState.ty = c.y - (c.y - routeState.ty) * k;
  routeState.scale = next;
}

const HIST_KEY = "starrupture_search_hist";
const HIST_MAX = 12;
let suggestIndex = -1;

function loadHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
    return Array.isArray(arr) ? arr.filter(x => typeof x === "string") : [];
  } catch (_) { return []; }
}
function pushSearchHistory(name) {
  if (!name) return;
  const list = loadHistory().filter(x => x !== name);
  list.unshift(name);
  localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, HIST_MAX)));
}
function clearSearchHistory() {
  localStorage.removeItem(HIST_KEY);
}

function rankMatch(name, qq) {
  const n = name.toLowerCase();
  if (n === qq) return 0;
  if (n.startsWith(qq)) return 1;
  const idx = n.indexOf(qq);
  if (idx >= 0) return 2 + idx;
  return 99;
}

function resolveTarget(raw) {
  const name = (raw || "").trim();
  if (!name) return "";
  if (allItemNames.includes(name)) return name;
  const products = [...recipeIndex.keys()];
  const exactP = products.find(n => n === name);
  if (exactP) return exactP;
  const ranked = products
    .map(n => ({ n, r: rankMatch(n, name.toLowerCase()) }))
    .filter(x => x.r < 99)
    .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"));
  if (ranked.length) return ranked[0].n;
  const rankedAll = allItemNames
    .map(n => ({ n, r: rankMatch(n, name.toLowerCase()) }))
    .filter(x => x.r < 99)
    .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"));
  return rankedAll[0]?.n || name;
}

function goSearch(name) {
  if (routeState.mode === "plan") exitPlanMode();
  const target = resolveTarget(name);
  if (!target) return;
  document.getElementById("routeQ").value = target;
  hideSuggest();
  routeState.target = target;
  renderRouteGraph(target);
}

function hideSuggest() {
  const box = document.getElementById("routeSuggest");
  box.classList.remove("show");
  box.innerHTML = "";
  suggestIndex = -1;
}

function showSuggest(q, opts = {}) {
  const box = document.getElementById("routeSuggest");
  const qq = (q || "").trim().toLowerCase();
  const forceHist = !!opts.forceHist;
  box.innerHTML = "";
  suggestIndex = -1;

  const hist = loadHistory();
  const entries = [];

  if (!qq || forceHist) {
    const histShow = qq ? hist.filter(h => h.toLowerCase().includes(qq)) : hist;
    if (histShow.length) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "最近搜索";
      box.appendChild(sec);
      histShow.slice(0, 8).forEach(name => entries.push({ name, kind: "hist" }));
    }
  }

  if (qq) {
    const products = [...recipeIndex.keys()]
      .map(n => ({ n, r: rankMatch(n, qq) }))
      .filter(x => x.r < 99)
      .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"))
      .map(x => x.n);
    const others = allItemNames
      .filter(n => !recipeIndex.has(n))
      .map(n => ({ n, r: rankMatch(n, qq) }))
      .filter(x => x.r < 99)
      .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"))
      .map(x => x.n);
    const seen = new Set(entries.map(e => e.name));
    const matched = [...products, ...others].filter(n => !seen.has(n)).slice(0, 12);
    if (matched.length) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "联想匹配";
      box.appendChild(sec);
      matched.forEach(name => {
        entries.push({
          name,
          kind: recipeIndex.has(name) ? "prod" : "raw",
        });
      });
    }
  }

  if (!entries.length) {
    if (!qq && hist.length === 0) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "暂无历史，输入名称开始联想";
      box.appendChild(sec);
      box.classList.add("show");
      return;
    }
    box.classList.remove("show");
    return;
  }

  entries.forEach((item, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.idx = String(i);
    const label = document.createElement("span");
    label.textContent = item.name;
    b.appendChild(label);
    const tag = document.createElement("span");
    tag.className = "tag" + (item.kind === "hist" ? " hist" : item.kind === "raw" ? " raw" : "");
    tag.textContent = item.kind === "hist" ? "历史" : item.kind === "raw" ? "原料" : "产品";
    b.appendChild(tag);
    b.addEventListener("mousedown", (e) => {
      e.preventDefault(); // keep focus logic simple
      goSearch(item.name);
    });
    box.appendChild(b);
  });

  if (hist.length && (!qq || forceHist)) {
    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.textContent = "清空搜索历史";
    clearBtn.style.color = "#a66a18";
    clearBtn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      clearSearchHistory();
      showSuggest(document.getElementById("routeQ").value, { forceHist: true });
    });
    box.appendChild(clearBtn);
  }

  box.classList.add("show");
}

function moveSuggest(delta) {
  const box = document.getElementById("routeSuggest");
  if (!box.classList.contains("show")) return;
  const buttons = [...box.querySelectorAll("button[data-idx]")];
  if (!buttons.length) return;
  suggestIndex = (suggestIndex + delta + buttons.length) % buttons.length;
  buttons.forEach((b, i) => b.classList.toggle("active", i === suggestIndex));
  buttons[suggestIndex].scrollIntoView({ block: "nearest" });
}

const routeQ = document.getElementById("routeQ");
routeQ.addEventListener("input", (e) => showSuggest(e.target.value));
routeQ.addEventListener("focus", (e) => showSuggest(e.target.value, { forceHist: true }));
routeQ.addEventListener("blur", () => setTimeout(hideSuggest, 150));
routeQ.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSuggest(1); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); moveSuggest(-1); return; }
  if (e.key === "Escape") { hideSuggest(); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    const box = document.getElementById("routeSuggest");
    const buttons = [...box.querySelectorAll("button[data-idx]")];
    if (box.classList.contains("show") && suggestIndex >= 0 && buttons[suggestIndex]) {
      goSearch(buttons[suggestIndex].querySelector("span").textContent);
      return;
    }
    goSearch(e.target.value);
  }
});
document.getElementById("routeGo").addEventListener("click", () => {
  goSearch(document.getElementById("routeQ").value);
});
document.getElementById("pcList").addEventListener("click", () => {
  const sidebar = document.getElementById("synthList");
  if (routeState.mode !== "plan") {
    setSynthListOpen(true);
    return;
  }
  setSynthListOpen(!sidebar.classList.contains("show"));
  if (routeState.mode === "plan" && !document.getElementById("synthList").classList.contains("show")) {
    document.getElementById("pcList").classList.remove("active");
  }
});
function setLinkKind(kind) {
  plan.linkKind = plan.linkKind === kind ? null : kind;
  if (plan.linkKind) plan.unlinkOn = false;
  plan.linkFrom = null;
  syncPlanToolbar();
  renderPlanBoard();
}
function setUnlinkMode(on) {
  plan.unlinkOn = !!on;
  if (plan.unlinkOn) plan.linkKind = null;
  plan.linkFrom = null;
  syncPlanToolbar();
  renderPlanBoard();
}
document.getElementById("pcLink").addEventListener("click", () => setLinkKind("in"));
document.getElementById("pcOut").addEventListener("click", () => setLinkKind("out"));
document.getElementById("pcUnlink").addEventListener("click", () => setUnlinkMode(!plan.unlinkOn));
document.getElementById("pcUndo").addEventListener("click", () => undoPlan());
document.getElementById("pcRedo").addEventListener("click", () => redoPlan());
document.getElementById("pcDel").addEventListener("click", () => deletePlanSelection());
document.getElementById("pcClear").addEventListener("click", () => clearPlanBoard());
document.getElementById("pcDir").addEventListener("click", () => {
  routeState.dir = routeState.dir === "h" ? "v" : "h";
  clearPosOverrides();
  const btn = document.getElementById("pcDir");
  btn.classList.toggle("active", routeState.dir === "v");
  btn.title = routeState.dir === "v" ? "当前竖向，点击切回横向" : "当前横向，点击切换竖向";
  if (routeState.target) renderRouteGraph(routeState.target);
  else if (routeState.mode === "plan") renderPlanBoard();
});
document.getElementById("pcReset").addEventListener("click", () => {
  const svgEl = document.getElementById("routeSvg");
  clearPosOverrides();
  routeState.scale = 1;
  if (routeState.dir === "v") {
    routeState.tx = (svgEl.clientWidth || 800) / 2;
    routeState.ty = 56;
  } else {
    routeState.tx = 60;
    routeState.ty = (svgEl.clientHeight || 600) / 2;
  }
  if (routeState.mode === "plan") {
    applyTransform();
    return;
  }
  if (routeState.target) renderRouteGraph(routeState.target, { keepView: true });
  else applyTransform();
});
/* preferBase stays true */
window.addEventListener("keydown", (e) => {
  if (routeState.mode !== "plan") return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
    e.preventDefault();
    if (e.shiftKey) redoPlan();
    else undoPlan();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "y" || e.key === "Y")) {
    e.preventDefault();
    redoPlan();
    return;
  }
  if (e.key === "2") {
    e.preventDefault();
    setLinkKind("in");
    return;
  }
  if (e.key === "3") {
    e.preventDefault();
    setLinkKind("out");
    return;
  }
  if (e.key === "4") {
    e.preventDefault();
    setUnlinkMode(!plan.unlinkOn);
    return;
  }
  if (e.key === "Escape") {
    plan.linkKind = null;
    plan.unlinkOn = false;
    plan.linkFrom = null;
    selectPlanNodes([]);
    hideMarquee();
    applyHighlight(null);
    syncPlanToolbar();
    renderPlanBoard();
  }
  if (e.key === "Backspace" || e.key === "Delete") {
    e.preventDefault();
    deletePlanSelection();
  }
});

const svg = document.getElementById("routeSvg");
svg.addEventListener("mousedown", (e) => {
  if (e.target.closest(".node") || e.target.closest(".edge, .edge-hit")) return;
  if (routeState.nodeDrag) return;
  if (routeState.mode === "plan") return;
  routeState.dragging = true;
  routeState.lastX = e.clientX;
  routeState.lastY = e.clientY;
  svg.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (routeState.canvasPtr) return;
  if (routeState.nodeDrag) return;
  if (!routeState.dragging) return;
  panByClientDelta(routeState.lastX, routeState.lastY, e.clientX, e.clientY);
  routeState.lastX = e.clientX;
  routeState.lastY = e.clientY;
  applyTransform();
});
window.addEventListener("mouseup", () => {
  routeState.dragging = false;
  svg.classList.remove("dragging");
});

function endCanvasPtr() {
  const p = routeState.canvasPtr;
  if (p && p.timer) clearTimeout(p.timer);
  routeState.canvasPtr = null;
  hideMarquee();
  routeState.dragging = false;
  svg.classList.remove("dragging");
}

svg.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest(".node") || e.target.closest(".edge, .edge-hit")) return;
  if (routeState.nodeDrag) return;
  if (routeState.mode !== "plan") return;
  e.preventDefault();
  const ptr = {
    mode: (plan.linkKind || plan.unlinkOn) ? "pan" : "wait",
    startX: e.clientX,
    startY: e.clientY,
    lastX: e.clientX,
    lastY: e.clientY,
    pointerId: e.pointerId,
    timer: null,
  };
  routeState.canvasPtr = ptr;
  if (ptr.mode === "pan") {
    routeState.dragging = true;
    svg.classList.add("dragging");
  } else {
    ptr.timer = setTimeout(() => {
      if (!routeState.canvasPtr || routeState.canvasPtr !== ptr || ptr.mode !== "wait") return;
      ptr.mode = "marquee";
      updateMarquee(ptr.startX, ptr.startY, ptr.startX, ptr.startY);
    }, 420);
  }
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
});
svg.addEventListener("pointermove", (e) => {
  const ptr = routeState.canvasPtr;
  if (!ptr) return;
  if (ptr.mode === "wait") {
    if (Math.hypot(e.clientX - ptr.startX, e.clientY - ptr.startY) > 8) {
      clearTimeout(ptr.timer);
      ptr.mode = "pan";
      ptr.lastX = e.clientX;
      ptr.lastY = e.clientY;
      routeState.dragging = true;
      svg.classList.add("dragging");
    }
    return;
  }
  if (ptr.mode === "pan") {
    panByClientDelta(ptr.lastX, ptr.lastY, e.clientX, e.clientY);
    ptr.lastX = e.clientX;
    ptr.lastY = e.clientY;
    applyTransform();
    return;
  }
  if (ptr.mode === "marquee") {
    updateMarquee(ptr.startX, ptr.startY, e.clientX, e.clientY);
    previewMarqueeSelection(nodesInMarquee(marqueeWorldBox(ptr.startX, ptr.startY, e.clientX, e.clientY)));
  }
});
svg.addEventListener("pointerup", (e) => {
  const ptr = routeState.canvasPtr;
  if (!ptr) return;
  if (ptr.timer) clearTimeout(ptr.timer);
  if (ptr.mode === "wait") {
    selectPlanNodes([]);
    if (!plan.linkKind && !plan.unlinkOn) plan.linkFrom = null;
    routeState.highlight = null;
    hideMarquee();
    routeState.canvasPtr = null;
    renderPlanBoard();
    return;
  }
  if (ptr.mode === "marquee") {
    const box = marqueeWorldBox(ptr.startX, ptr.startY, e.clientX, e.clientY);
    const hits = (box.w > 6 || box.h > 6) ? nodesInMarquee(box) : [];
    selectPlanNodes(hits);
    routeState.highlight = null;
    hideMarquee();
    routeState.canvasPtr = null;
    renderPlanBoard();
    return;
  }
  endCanvasPtr();
});
svg.addEventListener("pointercancel", () => endCanvasPtr());
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoomAtClient(e.clientX, e.clientY, routeState.scale * delta);
  applyTransform();
}, { passive: false });

const touchCtl = { mode: null, lastDist: 0 };
function touchDist(a, b) {
  const dx = a.clientX - b.clientX;
  const dy = a.clientY - b.clientY;
  return Math.hypot(dx, dy);
}
function touchCenter(a, b) {
  return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}
svg.addEventListener("touchstart", (e) => {
  if (e.target.closest(".node") && e.touches.length === 1) return;
  if (routeState.mode === "plan" && e.touches.length === 1) return;
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchCtl.mode = "pan";
    routeState.dragging = true;
    routeState.lastX = t.clientX;
    routeState.lastY = t.clientY;
    svg.classList.add("dragging");
  } else if (e.touches.length >= 2) {
    e.preventDefault();
    touchCtl.mode = "pinch";
    routeState.dragging = false;
    touchCtl.lastDist = touchDist(e.touches[0], e.touches[1]);
    svg.classList.remove("dragging");
  }
}, { passive: false });
svg.addEventListener("touchmove", (e) => {
  if (touchCtl.mode === "pan" && e.touches.length === 1) {
    e.preventDefault();
    const t = e.touches[0];
    panByClientDelta(routeState.lastX, routeState.lastY, t.clientX, t.clientY);
    routeState.lastX = t.clientX;
    routeState.lastY = t.clientY;
    applyTransform();
  } else if (e.touches.length >= 2) {
    e.preventDefault();
    touchCtl.mode = "pinch";
    const dist = touchDist(e.touches[0], e.touches[1]);
    if (touchCtl.lastDist > 0) {
      const factor = dist / touchCtl.lastDist;
      const c = touchCenter(e.touches[0], e.touches[1]);
      zoomAtClient(c.x, c.y, routeState.scale * factor);
      applyTransform();
    }
    touchCtl.lastDist = dist;
  }
}, { passive: false });
function endTouch() {
  touchCtl.mode = null;
  touchCtl.lastDist = 0;
  routeState.dragging = false;
  svg.classList.remove("dragging");
}
svg.addEventListener("touchend", endTouch);
svg.addEventListener("touchcancel", endTouch);


(function lockPageViewport() {
  document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gestureend", (e) => e.preventDefault(), { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 280) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
})();

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    routeState.ty = (document.getElementById("routeSvg").clientHeight || 360) / 2;
    applyTransform();
  }, 200);
});
</script>
