<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>星际裂变 · 合成工具</title>
<style>
  :root {
    --bg: #e8eaee;
    --panel: #f6f7f9;
    --line: #c5ccd6;
    --text: #2a3038;
    --muted: #6b7585;
    --accent: #2f9d84;
    --accent2: #d4892a;
    --machine: #e4e9ef;
    --product: #e2eee9;
    --mat: #eef0f3;
    --hi: #2f9d8422;
    --hi-border: #2f9d84;
    --raw: #f3e9d8;
    --shadow: 0 6px 18px rgba(60,70,85,.12);
    --radius: 12px;
    --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    background: linear-gradient(180deg, #edf0f4 0%, var(--bg) 40%, #e2e6ec 100%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(14px);
    background: rgba(246,247,249,.94);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 14px 20px 12px;
    display: grid; gap: 12px;
  }
  .title-row {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
  h1 span { color: var(--accent); font-weight: 600; }
  .sub { color: var(--muted); font-size: .85rem; }
  .mode-tabs { display: flex; gap: 8px; margin-left: auto; }
  .mode-tab {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: .9rem;
    cursor: pointer;
    font-weight: 600;
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1; min-width: 220px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: .95rem;
    outline: none;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #2f9d8422; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip, .btn {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: .82rem;
    cursor: pointer;
    user-select: none;
  }
  .chip:hover, .btn:hover { color: var(--text); border-color: #9aa6b5; background: #f0f2f5; }
  .chip.active, .btn.active {
    color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600;
  }
  .btn.clear { color: #a66a18; border-color: #e0c49a; background: #fff8ee; }
  main { max-width: 1600px; margin: 0 auto; padding: 18px 20px 40px; }
  .panel { display: none; }
  .panel.show { display: block; }

  .focus-bar {
    display: none;
    margin-bottom: 16px;
    padding: 12px 14px;
    border: 1px solid var(--hi-border);
    background: var(--hi);
    border-radius: var(--radius);
    align-items: center; justify-content: space-between; gap: 10px;
  }
  .focus-bar.show { display: flex; }
  .focus-bar strong { color: #1f7a66; }
  .level-block { margin-bottom: 28px; }
  .level-head {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 0 12px;
    position: sticky; top: 130px; z-index: 20;
    background: linear-gradient(180deg, rgba(232,234,238,.96), rgba(232,234,238,.88));
    padding: 8px 0;
  }
  .level-badge {
    background: var(--accent2);
    color: #fff;
    font-weight: 700;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: .9rem;
  }
  .level-count { color: var(--muted); font-size: .85rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.25fr .85fr .95fr;
    min-height: 108px;
    transition: border-color .15s, transform .15s, opacity .15s;
  }
  .card:hover { border-color: #9aa8b8; transform: translateY(-1px); }
  .card.dim { opacity: .28; }
  .card.hit { border-color: var(--hi-border); box-shadow: 0 0 0 1px var(--hi-border), var(--shadow); }
  .col {
    padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
    justify-content: center;
  }
  .col.mats { background: var(--mat); }
  .col.machine {
    background: var(--machine);
    align-items: center; text-align: center;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  .col.product { background: var(--product); align-items: center; text-align: center; }
  .label {
    font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 2px;
  }
  .item {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; border-radius: 8px; padding: 6px 8px;
    font-size: .86rem; line-height: 1.25; cursor: pointer;
    border: 1px solid #d5dae2; background: #fff; color: var(--text);
  }
  .item:hover { background: #e8f6f2; border-color: #7bc4b2; }
  .item.active { background: #d8f0ea; border-color: var(--accent); font-weight: 600; }
  .machine-name { font-size: .92rem; font-weight: 600; color: #3d556e; }
  .machine-name.v2 { color: #b8741c; }
  .product-name { font-size: 1rem; font-weight: 700; color: #1f7a66; }
  .empty {
    display: none; text-align: center; color: var(--muted);
    padding: 40px 10px; border: 1px dashed var(--line); border-radius: var(--radius);
    background: #f4f5f7;
  }
  .empty.show { display: block; }

  /* ---- route ---- */
  .route-layout {
    min-height: calc(100vh - 170px);
    height: calc(100vh - 170px);
  }
  .suggest-wrap { flex: 1; min-width: 260px; position: relative; }
  .suggest {
    display: none;
    position: absolute;
    left: 0; right: 0; top: calc(100% + 4px);
    z-index: 50;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    max-height: 320px;
    overflow: auto;
    box-shadow: 0 10px 28px rgba(40,50,70,.14);
  }
  .suggest.show { display: block; }
  .suggest .sg-sec {
    padding: 6px 12px 2px;
    font-size: .72rem;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .suggest button {
    display: flex; width: 100%; text-align: left; align-items: center; gap: 8px;
    border: 0; background: transparent; padding: 8px 12px;
    cursor: pointer; color: var(--text); font-size: .9rem;
  }
  .suggest button:hover, .suggest button.active { background: #eef6f3; }
  .suggest .tag {
    margin-left: auto;
    font-size: .72rem;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 7px;
    flex-shrink: 0;
  }
  .suggest .tag.hist { color: #a66a18; border-color: #e0c49a; background: #fff8ee; }
  .suggest .tag.raw { color: #6b7585; }
  .hl-bar {
    display: none;
    position: absolute; left: 12px; top: 10px; z-index: 6;
    max-width: min(520px, calc(100% - 280px));
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #e0b07a;
    background: #fff7ee;
    font-size: .84rem;
    color: #6a4a22;
    box-shadow: var(--shadow);
  }
  .hl-bar.show { display: block; }
  .hl-bar strong { color: #c45e12; }
  .route-canvas-wrap {
    position: relative;
    height: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .route-toolbar {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
  }
  .route-canvas-wrap svg {
    width: 100%; height: 100%;
    cursor: grab;
    background:
      linear-gradient(#eef1f5 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, #eef1f5 1px, transparent 1px) 0 0 / 24px 24px,
      #f8f9fb;
  }
  .route-canvas-wrap svg.dragging { cursor: grabbing; }
  .node-raw rect { fill: var(--raw); stroke: #d2b48c; }
  .node-mid rect { fill: #fff; stroke: #9db0c2; }
  .node-target rect { fill: #d8f0ea; stroke: var(--accent); stroke-width: 2.2; }
  .node-cycle rect { fill: #fce8e8; stroke: #d88; }
  .node text.name { font-size: 13px; font-weight: 700; fill: var(--text); }
  .node text.meta { font-size: 11px; fill: var(--muted); }
  .edge { fill: none; stroke: #8aa0b5; stroke-width: 1.6; marker-end: url(#arrow); opacity: 1; transition: opacity .15s, stroke .15s, stroke-width .15s; }
  .route-world.is-hl .edge { opacity: .14; stroke: #b7c3d0; }
  .route-world.is-hl .edge.hl {
    opacity: 1;
    stroke: #e07a2f;
    stroke-width: 2.8;
    marker-end: url(#arrowHl);
  }
  .route-world.is-hl .node { opacity: .22; }
  .route-world.is-hl .node.hl { opacity: 1; }
  .route-world.is-hl .node.hl-focus rect {
    stroke: #e07a2f;
    stroke-width: 3;
    filter: drop-shadow(0 0 4px rgba(224,122,47,.45));
  }
  .route-world.is-hl .node.hl-up rect { stroke: #d4892a; stroke-width: 2.2; }
  .route-world.is-hl .node.hl-down rect { stroke: #2f9d84; stroke-width: 2.2; }
  .route-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: .95rem; pointer-events: none;
  }
  .route-empty.hide { display: none; }
  footer {
    max-width: 1400px; margin: 0 auto; padding: 0 20px 28px;
    color: var(--muted); font-size: .8rem;
  }

  /* mobile + landscape */
  /* 页面布局锁死，缩放只发生在路线画布内 */
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    touch-action: manipulation;
  }
  .route-canvas-wrap {
    touch-action: none; /* 禁止浏览器对画布区做页面缩放/滚动，交给我们自己处理 */
    -webkit-user-select: none;
    user-select: none;
  }
  .route-canvas-wrap svg {
    touch-action: none;
  }

  html, body {
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body.landscape-view {
    overflow: hidden;
    background: #f8f9fb;
  }
  body.landscape-view header,
  body.landscape-view footer,
  body.landscape-view #panelTable {
    display: none !important;
  }
  body.landscape-view main {
    max-width: none;
    margin: 0;
    padding: 0;
  }
  body.landscape-view #panelRoute.panel {
    display: block !important;
  }
  body.landscape-view .route-layout {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    height: 100vh;
    z-index: 2000;
    min-height: 0;
  }
  body.landscape-view .route-canvas-wrap {
    height: 100%;
    border-radius: 0;
    border: 0;
    box-shadow: none;
  }
  .ls-exit {
    display: none;
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 8;
  }
  body.landscape-view .ls-exit { display: inline-flex; }
  body.landscape-view .hl-bar {
    max-width: min(420px, calc(100% - 220px));
  }
  @media (max-width: 720px) {
    .header-inner { padding: 10px 12px; gap: 8px; }
    h1 { font-size: 1.05rem; }
    .sub { display: none; }
    .controls { gap: 8px; }
    .search { min-width: 0; width: 100%; font-size: 16px; /* 防 iOS 自动放大 */ }
    .btn, .chip, .mode-tab { min-height: 36px; padding: 8px 12px; }
    .route-layout {
      min-height: calc(100dvh - 150px);
      height: calc(100dvh - 150px);
    }
    .route-toolbar { gap: 4px; max-width: 58%; }
    .route-toolbar .btn { font-size: .75rem; padding: 6px 8px; }
    .hl-bar {
      left: 8px; top: 8px;
      max-width: calc(100% - 16px);
      font-size: .78rem;
    }
    /* footer removed */
  }
  @media (max-width: 720px) {
    main { max-width: 100%; padding: 10px 10px 24px; }
    .header-inner { max-width: 100%; }
    .card { grid-template-columns: 1fr; }
    .col.machine, .col.product { border: 0; border-top: 1px solid var(--line); }
    .level-head { top: 160px; }
    .mode-tabs { margin-left: 0; width: 100%; }
    .mode-tab { flex: 1; text-align: center; }
  }

  /* 真横屏：手机横过来后自动铺满 */
  @media (orientation: landscape) {
    body.route-mode header {
      padding: 0;
    }
    body.route-mode .header-inner {
      padding: 6px 10px;
      gap: 6px;
    }
    body.route-mode .title-row .sub { display: none; }
    body.route-mode .route-layout {
      min-height: calc(100dvh - 88px);
      height: calc(100dvh - 88px);
    }
    body.landscape-view .route-layout,
    body.route-mode.landscape-view .route-layout {
      height: 100dvh;
      height: 100vh;
    }
    body.landscape-view .ls-exit {
      left: 12px;
      top: 12px;
      bottom: auto;
    }
  }

  /* 顶栏折叠 */
  body.header-collapsed header .header-foldable { display: none !important; }
  body.header-collapsed header {
    border-bottom: 0;
  }
  body.header-collapsed .header-inner {
    padding: 0 !important;
    gap: 0 !important;
  }
  body.header-collapsed .title-row { display: none !important; }
  #headerToggle {
    display: none;
  }
  body.route-mode #headerToggle { display: inline-flex; }
  body.header-collapsed #headerToggle.expand-only { }
  @media (orientation: landscape) {
    footer { display: none !important; }
    body.route-mode:not(.landscape-view) .route-layout {
      min-height: calc(100dvh - 52px);
      height: calc(100dvh - 52px);
    }
    body.route-mode.header-collapsed:not(.landscape-view) .route-layout {
      min-height: 100dvh;
      height: 100dvh;
    }
    body.route-mode.header-collapsed main {
      padding: 0 !important;
      max-width: none;
    }
    body.route-mode .route-canvas-wrap {
      border-radius: 0;
    }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="title-row">
      <h1>星际裂变 <span>· 合成工具</span></h1>
      <div class="sub">合成表快查 + 合成路线流程图</div>
      <div class="mode-tabs">
        <button class="mode-tab active" type="button" data-mode="table">合成表</button>
        <button class="mode-tab" type="button" data-mode="route">合成路线</button>
      </div>
      <button class="btn" type="button" id="headerToggle" title="折叠/展开顶栏">收起顶栏</button>
    </div>

    <div class="header-foldable">
    <div class="controls" id="tableControls">
      <input class="search" id="q" type="search" placeholder="搜索产品 / 材料 / 机器…" autocomplete="off" />
      <button class="btn" id="toggleV2" type="button">隐藏 v.2</button>
      <button class="btn clear" id="clearFocus" type="button">清除高亮</button>
    </div>
    <div class="chip-row" id="levelChips"></div>

    <div class="controls" id="routeControls" style="display:none">
      <div class="suggest-wrap">
        <input class="search" id="routeQ" type="search" placeholder="搜索产品名，支持联想与历史…" autocomplete="off" />
        <div class="suggest" id="routeSuggest"></div>
      </div>
      <button class="btn active" id="preferBase" type="button">优先基础机</button>
      <button class="btn" id="routeGo" type="button">生成路线</button>
      <button class="btn clear" id="routeClear" type="button">清空</button>
    </div>
    </div>
  </div>
</header>

<main>
  <section class="panel show" id="panelTable">
    <div class="focus-bar" id="focusBar">
      <div>当前聚焦：<strong id="focusName"></strong> <span class="sub" id="focusMeta"></span></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" type="button" id="toRouteFromFocus">看合成路线</button>
        <button class="btn clear" type="button" id="clearFocus2">清除</button>
      </div>
    </div>
    <div id="boards"></div>
    <div class="empty" id="empty">没有匹配的配方</div>
  </section>

  <section class="panel" id="panelRoute">
    <div class="route-layout" id="routeLayout">
      <div class="route-canvas-wrap">
        <div class="route-toolbar">
          <button class="btn" type="button" id="headerToggle2">收起顶栏</button>
          <button class="btn" type="button" id="landscapeBtn" title="请将手机横过来">横屏全屏</button>
          <button class="btn clear" type="button" id="clearRouteHl">清除高亮</button>
          <button class="btn" type="button" id="zoomIn">放大</button>
          <button class="btn" type="button" id="zoomOut">缩小</button>
          <button class="btn" type="button" id="zoomReset">复位</button>
        </div>
        <button class="btn clear ls-exit" type="button" id="landscapeExit">退出横屏</button>
        <div id="lsTip" style="display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(42,48,56,.88);color:#fff;padding:12px 16px;border-radius:10px;font-size:.9rem;pointer-events:none;">请将手机横过来观看</div>
        <div class="route-empty" id="routeEmpty">搜索目标产品后点「生成路线」</div>
        <svg id="routeSvg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa0b5"></path>
            </marker>
            <marker id="arrowHl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#e07a2f"></path>
            </marker>
          </defs>
          <g id="routeWorld" class="route-world"></g>
        </svg>
      </div>
    </div>
  </section>

function isV2(machine) {
  return /v\.?2|V\.?2/.test(machine);
}

/* ========== 合成表 ========== */
const tableState = { q: "", level: 0, hideV2: false, focus: null };
const boards = document.getElementById("boards");
const empty = document.getElementById("empty");
const focusBar = document.getElementById("focusBar");
const focusName = document.getElementById("focusName");
const focusMeta = document.getElementById("focusMeta");
const levelChips = document.getElementById("levelChips");

function buildChips() {
  const all = document.createElement("button");
  all.className = "chip active";
  all.textContent = "全部";
  all.dataset.level = "0";
  levelChips.appendChild(all);
  for (let i = 1; i <= 13; i++) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = i + "级";
    b.dataset.level = String(i);
    levelChips.appendChild(b);
  }
  levelChips.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    tableState.level = Number(btn.dataset.level);
    [...levelChips.children].forEach(c => c.classList.toggle("active", c === btn));
    renderTable();
  });
}

function matchRecipe(r) {
  if (tableState.level && r.level !== tableState.level) return false;
  if (tableState.hideV2 && isV2(r.machine)) return false;
  const q = tableState.q.trim().toLowerCase();
  if (!q) return true;
  return [r.product, r.machine, ...r.materials].join(" ").toLowerCase().includes(q);
}

function setFocus(name) {
  tableState.focus = name;
  focusName.textContent = name;
  const makes = RECIPES.filter(r => r.product === name);
  const uses = RECIPES.filter(r => r.materials.includes(name));
  focusMeta.textContent = ` · 配方 ${makes.length} · 下游 ${uses.length}`;
  focusBar.classList.add("show");
  renderTable();
}

function clearFocus() {
  tableState.focus = null;
  focusBar.classList.remove("show");
  renderTable();
}

function itemBtn(name, extraClass="") {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "item" + (extraClass ? " " + extraClass : "") + (tableState.focus === name ? " active" : "");
  b.textContent = name;
  b.addEventListener("click", () => setFocus(name));
  return b;
}

function renderTable() {
  boards.innerHTML = "";
  const filtered = RECIPES.filter(matchRecipe);
  empty.classList.toggle("show", filtered.length === 0);
  const byLevel = {};
  for (const r of filtered) (byLevel[r.level] ||= []).push(r);
  Object.keys(byLevel).map(Number).sort((a,b)=>a-b).forEach((lv) => {
    const list = byLevel[lv];
    const block = document.createElement("section");
    block.className = "level-block";
    const head = document.createElement("div");
    head.className = "level-head";
    head.innerHTML = `<span class="level-badge">${lv}级材料</span><span class="level-count">${list.length} 条配方</span>`;
    block.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const r of list) {
      const card = document.createElement("article");
      card.className = "card";
      if (tableState.focus) {
        const hit = r.product === tableState.focus || r.materials.includes(tableState.focus);
        card.classList.add(hit ? "hit" : "dim");
      }
      const mats = document.createElement("div");
      mats.className = "col mats";
      mats.innerHTML = `<div class="label">材料</div>`;
      r.materials.forEach(m => mats.appendChild(itemBtn(m)));
      const mac = document.createElement("div");
      mac.className = "col machine";
      mac.innerHTML = `<div class="label">机器</div><div class="machine-name${isV2(r.machine)?" v2":""}">${r.machine}</div>`;
      const prod = document.createElement("div");
      prod.className = "col product";
      prod.innerHTML = `<div class="label">产品</div>`;
      prod.appendChild(itemBtn(r.product, "product-name"));
      card.append(mats, mac, prod);
      grid.appendChild(card);
    }
    block.appendChild(grid);
    boards.appendChild(block);
  });
}

document.getElementById("q").addEventListener("input", (e) => {
  tableState.q = e.target.value;
  renderTable();
});
document.getElementById("toggleV2").addEventListener("click", (e) => {
  tableState.hideV2 = !tableState.hideV2;
  e.currentTarget.classList.toggle("active", tableState.hideV2);
  e.currentTarget.textContent = tableState.hideV2 ? "已隐藏 v.2" : "隐藏 v.2";
  renderTable();
});
document.getElementById("clearFocus").addEventListener("click", clearFocus);
document.getElementById("clearFocus2").addEventListener("click", clearFocus);

  const map = new Map();
  for (const r of RECIPES) {
    if (!map.has(r.product)) map.set(r.product, []);
    map.get(r.product).push(r);
  }
  return map;
})();

const allItemNames = (() => {
  const s = new Set();
  for (const r of RECIPES) {
    s.add(r.product);
    r.materials.forEach(m => s.add(m));
  }
  return [...s].sort((a,b)=>a.localeCompare(b, "zh"));
})();

function pickRecipe(product) {
  const list = recipeIndex.get(product) || [];
  if (!list.length) return null;
  if (routeState.preferBase) {
    const base = list.find(r => !isV2(r.machine));
    return base || list[0];
  }
  // prefer v2 if exists else base
  const v2 = list.find(r => isV2(r.machine));
  return v2 || list[0];
}

function buildRoute(target) {
  const nodes = new Map(); // name -> {name, recipe|null, raw, cycle, depth}
  const edges = []; // {from, to, machine}
  const stack = new Set();

  function walk(name) {
    if (stack.has(name)) {
      const hit = nodes.get(name);
      if (hit) { hit.cycle = true; return hit; }
      const stub = { name, recipe: null, raw: true, cycle: true, depth: 0 };
      nodes.set(name, stub);
      return stub;
    }
    if (nodes.has(name)) return nodes.get(name);

    const node = { name, recipe: null, raw: false, cycle: false, depth: 0 };
    nodes.set(name, node);

    const recipe = pickRecipe(name);
    if (!recipe) {
      node.raw = true;
      node.depth = 0;
      return node;
    }

    stack.add(name);
    node.recipe = recipe;
    let maxD = 0;
    for (const mat of recipe.materials) {
      // skip self-edge loops
      if (mat === name) continue;
      // if material is already on stack, mark cycle and still show edge once
      const onStack = stack.has(mat);
      const child = walk(mat);
      if (onStack) child.cycle = true;
      edges.push({ from: mat, to: name, machine: recipe.machine });
      if (!onStack) maxD = Math.max(maxD, child.depth);
    }
    stack.delete(name);
    node.depth = maxD + 1;
    return node;
  }

  walk(target);

  // recompute depths in topological fashion (longest path from raw)
  let changed = true;
  let guard = 0;
  while (changed && guard++ < 50) {
    changed = false;
    for (const e of edges) {
      const a = nodes.get(e.from);
      const b = nodes.get(e.to);
      if (!a || !b) continue;
      const nd = a.depth + 1;
      if (nd > b.depth) { b.depth = nd; changed = true; }
    }
  }

  return { nodes, edges, target };
}

function layoutRoute(graph) {
  const { nodes, edges, target } = graph;
  const byDepth = new Map();
  for (const n of nodes.values()) {
    if (!byDepth.has(n.depth)) byDepth.set(n.depth, []);
    byDepth.get(n.depth).push(n);
  }
  const depths = [...byDepth.keys()].sort((a,b)=>a-b);
  const nodeW = 128, nodeH = 54, gapX = 170, gapY = 78;
  const positions = new Map();

  depths.forEach((d, di) => {
    const col = byDepth.get(d);
    col.sort((a,b) => a.name.localeCompare(b.name, "zh"));
    const totalH = col.length * gapY;
    col.forEach((n, i) => {
      positions.set(n.name, {
        x: di * gapX,
        y: i * gapY - totalH / 2 + gapY / 2,
        w: nodeW,
        h: nodeH,
      });
    });
  });

  // center vertically around 0 already; shift later in view
  return { positions, nodeW, nodeH, gapX, depths, byDepth };
}

function collectReachable(start, adj) {
  const set = new Set([start]);
  const q = [start];
  while (q.length) {
    const cur = q.shift();
    for (const nxt of (adj.get(cur) || [])) {
      if (!set.has(nxt)) { set.add(nxt); q.push(nxt); }
    }
  }
  return set;
}

function pathSets(focus, edges) {
  const fwd = new Map();
  const rev = new Map();
  for (const e of edges) {
    if (!fwd.has(e.from)) fwd.set(e.from, []);
    fwd.get(e.from).push(e.to);
    if (!rev.has(e.to)) rev.set(e.to, []);
    rev.get(e.to).push(e.from);
  }
  const up = collectReachable(focus, rev);   // ancestors + self
  const down = collectReachable(focus, fwd); // self + descendants
  const nodes = new Set([...up, ...down]);
  const edgeKeys = new Set();
  for (const e of edges) {
    if (nodes.has(e.from) && nodes.has(e.to)) {
      // keep only edges inside upstream cone or downstream cone
      const inUp = up.has(e.from) && up.has(e.to);
      const inDown = down.has(e.from) && down.has(e.to);
      if (inUp || inDown) edgeKeys.add(e.from + "->" + e.to);
    }
  }
  return { up, down, nodes, edgeKeys };
}

function applyHighlight(focus) {
  const world = document.getElementById("routeWorld");

  if (!focus || !routeState.graph) {
    routeState.highlight = null;
    world.classList.remove("is-hl");
    world.querySelectorAll(".edge.hl").forEach(el => el.classList.remove("hl"));
    world.querySelectorAll(".node.hl, .node.hl-focus, .node.hl-up, .node.hl-down").forEach(el => {
      el.classList.remove("hl", "hl-focus", "hl-up", "hl-down");
    });
    return;
  }

  if (routeState.highlight === focus) {
    applyHighlight(null);
    return;
  }

  routeState.highlight = focus;
  const { up, down, nodes, edgeKeys } = pathSets(focus, routeState.graph.edges);
  world.classList.add("is-hl");

  world.querySelectorAll(".edge").forEach(el => {
    const key = el.dataset.from + "->" + el.dataset.to;
    el.classList.toggle("hl", edgeKeys.has(key));
  });
  world.querySelectorAll(".node").forEach(el => {
    const name = el.dataset.name;
    el.classList.remove("hl", "hl-focus", "hl-up", "hl-down");
    if (!nodes.has(name)) return;
    el.classList.add("hl");
    if (name === focus) el.classList.add("hl-focus");
    else if (up.has(name) && name !== focus) el.classList.add("hl-up");
    else if (down.has(name) && name !== focus) el.classList.add("hl-down");
  });
}

function renderRouteGraph(target, opts = {}) {
  const keepView = !!opts.keepView;
  const world = document.getElementById("routeWorld");
  const emptyEl = document.getElementById("routeEmpty");
  world.innerHTML = "";
  routeState.highlight = null;
  routeState.graph = null;
  world.classList.remove("is-hl");

  if (!target) {
    emptyEl.classList.remove("hide");
    emptyEl.textContent = "搜索目标产品后点「生成路线」或点联想结果";
    applyTransform();
    return;
  }
  if (!recipeIndex.has(target) && !allItemNames.includes(target)) {
    emptyEl.classList.remove("hide");
    emptyEl.textContent = `未找到「${target}」`;
    applyTransform();
    return;
  }

  const graph = buildRoute(target);
  const layout = layoutRoute(graph);
  routeState.graph = graph;
  routeState.target = target;
  emptyEl.classList.add("hide");
  pushSearchHistory(target);

  for (const e of graph.edges) {
    const a = layout.positions.get(e.from);
    const b = layout.positions.get(e.to);
    if (!a || !b) continue;
    const x1 = a.x + a.w;
    const y1 = a.y + a.h / 2;
    const x2 = b.x;
    const y2 = b.y + b.h / 2;
    const mx = (x1 + x2) / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("class", "edge");
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    path.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    world.appendChild(path);
  }

  for (const n of graph.nodes.values()) {
    const p = layout.positions.get(n.name);
    if (!p) continue;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    let cls = "node node-mid";
    if (n.name === target) cls = "node node-target";
    else if (n.cycle) cls = "node node-cycle";
    else if (n.raw) cls = "node node-raw";
    g.setAttribute("class", cls);
    g.dataset.name = n.name;
    g.style.cursor = "pointer";

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", p.x);
    rect.setAttribute("y", p.y);
    rect.setAttribute("rx", 10);
    rect.setAttribute("ry", 10);
    rect.setAttribute("width", p.w);
    rect.setAttribute("height", p.h);
    g.appendChild(rect);

    const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t1.setAttribute("class", "name");
    t1.setAttribute("x", p.x + p.w / 2);
    t1.setAttribute("y", p.y + 22);
    t1.setAttribute("text-anchor", "middle");
    t1.textContent = n.name.length > 9 ? n.name.slice(0, 8) + "…" : n.name;
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = n.name + "（单击高亮线路）";
    g.appendChild(title);
    g.appendChild(t1);

    const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t2.setAttribute("class", "meta");
    t2.setAttribute("x", p.x + p.w / 2);
    t2.setAttribute("y", p.y + 40);
    t2.setAttribute("text-anchor", "middle");
    if (n.cycle) t2.textContent = "循环截断";
    else if (n.raw) t2.textContent = "原料 / 采集";
    else t2.textContent = n.recipe.machine;
    g.appendChild(t2);

    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      applyHighlight(n.name);
    });
    world.appendChild(g);
  }

  if (!keepView) {
    routeState.scale = 1;
    routeState.tx = 60;
    routeState.ty = (document.getElementById("routeSvg").clientHeight || 600) / 2;
  }
  applyTransform();
}

function applyTransform() {
  const world = document.getElementById("routeWorld");
  world.setAttribute("transform", `translate(${routeState.tx},${routeState.ty}) scale(${routeState.scale})`);
}

function panByClientDelta(fromX, fromY, toX, toY) {
  routeState.tx += toX - fromX;
  routeState.ty += toY - fromY;
}

function zoomAtClient(clientX, clientY, nextScale) {
  const rect = document.getElementById("routeSvg").getBoundingClientRect();
  const c = { x: clientX - rect.left, y: clientY - rect.top };
  const next = Math.min(3.5, Math.max(0.3, nextScale));
  const k = next / routeState.scale;
  routeState.tx = c.x - (c.x - routeState.tx) * k;
  routeState.ty = c.y - (c.y - routeState.ty) * k;
  routeState.scale = next;
}

const HIST_KEY = "starrupture_search_hist";
const HIST_MAX = 12;
let suggestIndex = -1;

function loadHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
    return Array.isArray(arr) ? arr.filter(x => typeof x === "string") : [];
  } catch (_) { return []; }
}
function pushSearchHistory(name) {
  if (!name) return;
  const list = loadHistory().filter(x => x !== name);
  list.unshift(name);
  localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, HIST_MAX)));
}
function clearSearchHistory() {
  localStorage.removeItem(HIST_KEY);
}

function rankMatch(name, qq) {
  const n = name.toLowerCase();
  if (n === qq) return 0;
  if (n.startsWith(qq)) return 1;
  const idx = n.indexOf(qq);
  if (idx >= 0) return 2 + idx;
  return 99;
}

function resolveTarget(raw) {
  const name = (raw || "").trim();
  if (!name) return "";
  if (allItemNames.includes(name)) return name;
  const products = [...recipeIndex.keys()];
  const exactP = products.find(n => n === name);
  if (exactP) return exactP;
  const ranked = products
    .map(n => ({ n, r: rankMatch(n, name.toLowerCase()) }))
    .filter(x => x.r < 99)
    .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"));
  if (ranked.length) return ranked[0].n;
  const rankedAll = allItemNames
    .map(n => ({ n, r: rankMatch(n, name.toLowerCase()) }))
    .filter(x => x.r < 99)
    .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"));
  return rankedAll[0]?.n || name;
}

function goSearch(name) {
  const target = resolveTarget(name);
  if (!target) return;
  document.getElementById("routeQ").value = target;
  hideSuggest();
  routeState.target = target;
  renderRouteGraph(target);
}

function hideSuggest() {
  const box = document.getElementById("routeSuggest");
  box.classList.remove("show");
  box.innerHTML = "";
  suggestIndex = -1;
}

function showSuggest(q, opts = {}) {
  const box = document.getElementById("routeSuggest");
  const qq = (q || "").trim().toLowerCase();
  const forceHist = !!opts.forceHist;
  box.innerHTML = "";
  suggestIndex = -1;

  const hist = loadHistory();
  const entries = [];

  if (!qq || forceHist) {
    const histShow = qq ? hist.filter(h => h.toLowerCase().includes(qq)) : hist;
    if (histShow.length) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "最近搜索";
      box.appendChild(sec);
      histShow.slice(0, 8).forEach(name => entries.push({ name, kind: "hist" }));
    }
  }

  if (qq) {
    const products = [...recipeIndex.keys()]
      .map(n => ({ n, r: rankMatch(n, qq) }))
      .filter(x => x.r < 99)
      .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"))
      .map(x => x.n);
    const others = allItemNames
      .filter(n => !recipeIndex.has(n))
      .map(n => ({ n, r: rankMatch(n, qq) }))
      .filter(x => x.r < 99)
      .sort((a,b) => a.r - b.r || a.n.localeCompare(b.n, "zh"))
      .map(x => x.n);
    const seen = new Set(entries.map(e => e.name));
    const matched = [...products, ...others].filter(n => !seen.has(n)).slice(0, 12);
    if (matched.length) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "联想匹配";
      box.appendChild(sec);
      matched.forEach(name => {
        entries.push({
          name,
          kind: recipeIndex.has(name) ? "prod" : "raw",
        });
      });
    }
  }

  if (!entries.length) {
    if (!qq && hist.length === 0) {
      const sec = document.createElement("div");
      sec.className = "sg-sec";
      sec.textContent = "暂无历史，输入名称开始联想";
      box.appendChild(sec);
      box.classList.add("show");
      return;
    }
    box.classList.remove("show");
    return;
  }

  entries.forEach((item, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.idx = String(i);
    const label = document.createElement("span");
    label.textContent = item.name;
    b.appendChild(label);
    const tag = document.createElement("span");
    tag.className = "tag" + (item.kind === "hist" ? " hist" : item.kind === "raw" ? " raw" : "");
    tag.textContent = item.kind === "hist" ? "历史" : item.kind === "raw" ? "原料" : "产品";
    b.appendChild(tag);
    b.addEventListener("mousedown", (e) => {
      e.preventDefault(); // keep focus logic simple
      goSearch(item.name);
    });
    box.appendChild(b);
  });

  if (hist.length && (!qq || forceHist)) {
    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.textContent = "清空搜索历史";
    clearBtn.style.color = "#a66a18";
    clearBtn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      clearSearchHistory();
      showSuggest(document.getElementById("routeQ").value, { forceHist: true });
    });
    box.appendChild(clearBtn);
  }

  box.classList.add("show");
}

function moveSuggest(delta) {
  const box = document.getElementById("routeSuggest");
  if (!box.classList.contains("show")) return;
  const buttons = [...box.querySelectorAll("button[data-idx]")];
  if (!buttons.length) return;
  suggestIndex = (suggestIndex + delta + buttons.length) % buttons.length;
  buttons.forEach((b, i) => b.classList.toggle("active", i === suggestIndex));
  buttons[suggestIndex].scrollIntoView({ block: "nearest" });
}

const routeQ = document.getElementById("routeQ");
routeQ.addEventListener("input", (e) => showSuggest(e.target.value));
routeQ.addEventListener("focus", (e) => showSuggest(e.target.value, { forceHist: true }));
routeQ.addEventListener("blur", () => setTimeout(hideSuggest, 150));
routeQ.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSuggest(1); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); moveSuggest(-1); return; }
  if (e.key === "Escape") { hideSuggest(); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    const box = document.getElementById("routeSuggest");
    const buttons = [...box.querySelectorAll("button[data-idx]")];
    if (box.classList.contains("show") && suggestIndex >= 0 && buttons[suggestIndex]) {
      goSearch(buttons[suggestIndex].querySelector("span").textContent);
      return;
    }
    goSearch(e.target.value);
  }
});
document.getElementById("routeGo").addEventListener("click", () => {
  goSearch(document.getElementById("routeQ").value);
});
document.getElementById("routeClear").addEventListener("click", () => {
  document.getElementById("routeQ").value = "";
  routeState.target = "";
  hideSuggest();
  renderRouteGraph("");
});
document.getElementById("preferBase").addEventListener("click", (e) => {
  routeState.preferBase = !routeState.preferBase;
  e.currentTarget.classList.toggle("active", routeState.preferBase);
  e.currentTarget.textContent = routeState.preferBase ? "优先基础机" : "优先 v.2";
  if (routeState.target) renderRouteGraph(routeState.target);
});

const svg = document.getElementById("routeSvg");
svg.addEventListener("mousedown", (e) => {
  if (e.target.closest(".node")) return;
  routeState.dragging = true;
  routeState.lastX = e.clientX;
  routeState.lastY = e.clientY;
  svg.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (!routeState.dragging) return;
  panByClientDelta(routeState.lastX, routeState.lastY, e.clientX, e.clientY);
  routeState.lastX = e.clientX;
  routeState.lastY = e.clientY;
  applyTransform();
});
window.addEventListener("mouseup", () => {
  routeState.dragging = false;
  svg.classList.remove("dragging");
});
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoomAtClient(e.clientX, e.clientY, routeState.scale * delta);
  applyTransform();
}, { passive: false });
document.getElementById("zoomIn").addEventListener("click", () => {
  routeState.scale = Math.min(2.5, routeState.scale * 1.15);
  applyTransform();
});
document.getElementById("zoomOut").addEventListener("click", () => {
  routeState.scale = Math.max(0.35, routeState.scale / 1.15);
  applyTransform();
});
document.getElementById("zoomReset").addEventListener("click", () => {
  routeState.scale = 1;
  routeState.tx = 60;
  routeState.ty = (svg.clientHeight || 600) / 2;
  applyTransform();
});

document.getElementById("clearRouteHl").addEventListener("click", () => applyHighlight(null));

/* ---- page locked; zoom only inside route canvas ---- */
(function lockPageViewport() {
  document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gestureend", (e) => e.preventDefault(), { passive: false });
  // 阻止双击放大页面
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 280) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
})();

/* ---- 真横屏全屏（请把手机横过来，不再假旋转） ---- */
async function enterLandscapeView() {
  setMode("route");
  document.body.classList.add("landscape-view", "route-mode");
  document.getElementById("landscapeBtn")?.classList.add("active");
  try {
    const root = document.documentElement;
    if (!document.fullscreenElement && root.requestFullscreen) {
      await root.requestFullscreen();
    }
  } catch (_) {}
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch (_) {
    // iOS 等常锁不住，提示用户手动横拿
    const tip = document.getElementById("lsTip");
    if (tip) {
      tip.style.display = "block";
      clearTimeout(tip._t);
      tip._t = setTimeout(() => { tip.style.display = "none"; }, 2500);
    }
  }
  setTimeout(() => {
    routeState.tx = 60;
    routeState.ty = (document.getElementById("routeSvg").clientHeight || 360) / 2;
    applyTransform();
  }, 120);
}

async function exitLandscapeView() {
  document.body.classList.remove("landscape-view");
  document.getElementById("landscapeBtn")?.classList.remove("active");
  const tip = document.getElementById("lsTip");
  if (tip) tip.style.display = "none";
  try {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  } catch (_) {}
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
  } catch (_) {}
}

document.getElementById("landscapeBtn").addEventListener("click", () => {
  if (document.body.classList.contains("landscape-view")) exitLandscapeView();
  else enterLandscapeView();
});
document.getElementById("landscapeExit").addEventListener("click", () => exitLandscapeView());

// 手机横过来时自动进入路线全屏；竖回来可保持，点退出横屏即可
window.matchMedia("(orientation: landscape)").addEventListener("change", (e) => {
  if (e.matches && document.getElementById("panelRoute").classList.contains("show")) {
    document.body.classList.add("landscape-view", "route-mode");
    document.getElementById("landscapeBtn")?.classList.add("active");
    setTimeout(() => {
      routeState.ty = (document.getElementById("routeSvg").clientHeight || 360) / 2;
      applyTransform();
    }, 100);
  }
});

// 单指拖动 + 双指捏合：坐标按 SVG CTM 换算，假横屏旋转后方向正确
const touchCtl = { mode: null, lastDist: 0 };
function touchDist(a, b) {
  const dx = a.clientX - b.clientX;
  const dy = a.clientY - b.clientY;
  return Math.hypot(dx, dy);
}
function touchCenter(a, b) {
  return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
}
svg.addEventListener("touchstart", (e) => {
  if (e.target.closest(".node") && e.touches.length === 1) return;
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchCtl.mode = "pan";
    routeState.dragging = true;
    routeState.lastX = t.clientX;
    routeState.lastY = t.clientY;
    svg.classList.add("dragging");
  } else if (e.touches.length >= 2) {
    e.preventDefault();
    touchCtl.mode = "pinch";
    routeState.dragging = false;
    touchCtl.lastDist = touchDist(e.touches[0], e.touches[1]);
    svg.classList.remove("dragging");
  }
}, { passive: false });
svg.addEventListener("touchmove", (e) => {
  if (touchCtl.mode === "pan" && e.touches.length === 1) {
    e.preventDefault();
    const t = e.touches[0];
    panByClientDelta(routeState.lastX, routeState.lastY, t.clientX, t.clientY);
    routeState.lastX = t.clientX;
    routeState.lastY = t.clientY;
    applyTransform();
  } else if (e.touches.length >= 2) {
    e.preventDefault();
    touchCtl.mode = "pinch";
    const dist = touchDist(e.touches[0], e.touches[1]);
    if (touchCtl.lastDist > 0) {
      const factor = dist / touchCtl.lastDist;
      const c = touchCenter(e.touches[0], e.touches[1]);
      zoomAtClient(c.x, c.y, routeState.scale * factor);
      applyTransform();
    }
    touchCtl.lastDist = dist;
  }
}, { passive: false });
function endTouch() {
  touchCtl.mode = null;
  touchCtl.lastDist = 0;
  routeState.dragging = false;
  svg.classList.remove("dragging");
}
svg.addEventListener("touchend", endTouch);
svg.addEventListener("touchcancel", endTouch);



/* ========== mode switch ========== */
function setMode(mode) {
  document.querySelectorAll(".mode-tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
  document.getElementById("panelTable").classList.toggle("show", mode === "table");
  document.getElementById("panelRoute").classList.toggle("show", mode === "route");
  document.getElementById("tableControls").style.display = mode === "table" ? "flex" : "none";
  document.getElementById("levelChips").style.display = mode === "table" ? "flex" : "none";
  document.getElementById("routeControls").style.display = mode === "route" ? "flex" : "none";
  document.querySelector("h1 span").textContent = mode === "table" ? "· 合成表" : "· 合成路线";
  document.body.classList.toggle("route-mode", mode === "route");
  if (mode === "table" && document.body.classList.contains("landscape-view")) {
    exitLandscapeView();
  }
  if (mode === "route" && window.matchMedia("(orientation: landscape)").matches) {
    setHeaderCollapsed(true);
  } else if (mode === "table") {
    setHeaderCollapsed(false);
  }
}

document.querySelectorAll(".mode-tab").forEach(tab => {
  tab.addEventListener("click", () => setMode(tab.dataset.mode));
});

document.getElementById("toRouteFromFocus").addEventListener("click", () => {
  if (!tableState.focus) return;
  setMode("route");
  document.getElementById("routeQ").value = tableState.focus;
  routeState.target = tableState.focus;
  renderRouteGraph(tableState.focus);
});

// from table item: double path via focus + button; also allow right-click? skip


function setHeaderCollapsed(on) {
  document.body.classList.toggle("header-collapsed", !!on);
  const label = on ? "展开顶栏" : "收起顶栏";
  const a = document.getElementById("headerToggle");
  const b = document.getElementById("headerToggle2");
  if (a) { a.textContent = label; a.classList.toggle("active", !!on); }
  if (b) { b.textContent = label; b.classList.toggle("active", !!on); }
  setTimeout(() => {
    const svg = document.getElementById("routeSvg");
    if (svg) {
      routeState.ty = (svg.clientHeight || 360) / 2;
      applyTransform();
    }
  }, 60);
}
function toggleHeaderCollapsed() {
  setHeaderCollapsed(!document.body.classList.contains("header-collapsed"));
}
document.getElementById("headerToggle")?.addEventListener("click", toggleHeaderCollapsed);
document.getElementById("headerToggle2")?.addEventListener("click", toggleHeaderCollapsed);

// 横屏自动收起顶栏，竖屏恢复
window.matchMedia("(orientation: landscape)").addEventListener("change", (e) => {
  if (document.getElementById("panelRoute").classList.contains("show")) {
    setHeaderCollapsed(e.matches);
  }
});

buildChips();
renderTable();
</script>
