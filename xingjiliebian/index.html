<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>星际裂变 · 路线工具</title>
<style>
  :root {
    --text: #2a3038;
    --muted: #6b7585;
    --accent: #2f9d84;
    --line: #c5ccd6;
    --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: var(--font); color: var(--text);
    background: radial-gradient(circle at 20% 10%, #e8f6f2, transparent 40%),
                radial-gradient(circle at 80% 0%, #eef2f8, #edf0f4 55%);
    padding: 24px;
  }
  .card {
    width: min(480px, 100%); background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 24px; box-shadow: 0 12px 36px rgba(40,50,70,.1);
  }
  h1 { margin: 0 0 8px; font-size: 1.35rem; }
  p { margin: 0 0 20px; color: var(--muted); font-size: .92rem; line-height: 1.5; }
  .links { display: grid; gap: 10px; }
  a {
    display: block; text-align: center; text-decoration: none; font-weight: 600;
    border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); color: var(--text);
  }
  a.m { background: var(--accent); color: #fff; border-color: var(--accent); }
  a.pc:hover { border-color: var(--accent); color: var(--accent); }
  .tip { margin-top: 14px; font-size: .8rem; color: var(--muted); }
</style>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var mobile = /Android|iPhone|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)
    || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua));
  if (/[?&]stay=1(?:&|$)/.test(location.search)) return;
  location.replace(mobile ? "./m/index.html" : "./pc/index.html");
})();
</script>
</head>
<body>
  <div class="card">
    <h1>星际裂变 · 路线工具</h1>
    <p>电脑两个页对照：线路规划自己摆线，合成查看查一路配方。</p>
    <div class="links">
      <a class="m" href="./m/index.html?v=20260803c">手机 · 合成路线</a>
      <a class="pc" href="./pc/index.html?v=20260814e">电脑 · 线路规划</a>
      <a class="pc" href="./debug/index.html?v=20260814e">电脑 · 合成查看</a>
    </div>
    <p class="tip">强制留在本页：加 <code>?stay=1</code></p>
  </div>
</body>
</html>
