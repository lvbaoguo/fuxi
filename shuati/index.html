<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>阵地清剿 · 刷题闯关</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- 章节选择 -->
  <section class="screen" id="screen-pick">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <h1>阵地清剿</h1>
      <p>答对开火 · 清完这一章</p>
    </header>
    <div class="tabs" role="tablist">
      <button type="button" class="tab on" data-course="history" id="tab-history">近代史</button>
      <button type="button" class="tab" data-course="xi" id="tab-xi">习思想</button>
    </div>
    <div class="chapter-list" id="chapter-list"></div>
  </section>

  <!-- 关卡 -->
  <section class="screen" id="screen-play" hidden>
    <div class="play-hud">
      <button type="button" class="ghost" id="btn-back-chapters">章节</button>
      <div class="hud-mid">
        <span id="hud-title">第 1 章</span>
        <span class="hud-sep">·</span>
        <span id="hud-progress">0/40</span>
      </div>
      <div class="hud-score" id="hud-combo" aria-live="polite"></div>
    </div>

    <div class="stage-wrap">
      <canvas id="stage" width="360" height="280"></canvas>
      <div class="lives" id="lives" aria-label="生命">♥♥♥</div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="quiz" id="quiz">
      <div class="qmeta" id="qmeta"></div>
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback" hidden></div>
    </div>
  </section>

  <!-- 弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">结算</h2>
      <p class="modal-body" id="modal-body"></p>
      <div class="modal-actions">
        <button type="button" class="btn primary" id="btn-restart">重新开始</button>
        <button type="button" class="btn" id="btn-to-chapters">返回章节</button>
      </div>
    </div>
  </div>

</div>
<script src="../zuoye/data.js"></script>
<script src="app.js"></script>
</body>
</html>
