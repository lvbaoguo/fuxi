<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>情侣盯梢 · 三件套</title>
<style>
  :root {
    --ink: #1c1916;
    --mute: #6f645a;
    --line: #e5d9cf;
    --bg: #f4eee7;
    --card: #fff;
    --accent: #2f6f5e;
    --warn: #b54a32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    background: var(--bg);
    padding: 16px 14px 48px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--mute); font-size: 13px; margin: 0 0 14px; line-height: 1.45; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--mute); margin-bottom: 6px; }
  input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font: inherit;
    background: #fff;
  }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button {
    border: 0;
    border-radius: 10px;
    padding: 11px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; }
  button.ghost { background: #efe8e0; color: var(--ink); }
  button:disabled { opacity: .55; }
  .status { margin-top: 8px; font-size: 13px; color: var(--mute); min-height: 1.2em; }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--warn); }
  .warn-box {
    border-color: #e0b56a;
    background: #fff8ec;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .grid button {
    padding: 0;
    border: 2px solid transparent;
    background: #f3ebe3;
    overflow: hidden;
    aspect-ratio: 1;
  }
  .grid button.on { border-color: var(--accent); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .log {
    margin-top: 8px;
    max-height: 120px;
    overflow: auto;
    font-size: 12px;
    color: var(--mute);
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>情侣盯梢 · 三件套</h1>
  <p class="sub">人设/定时等仍只在电脑本地改。手机只做：真人问候、消息同步、表情包。</p>

  <div class="card" id="api-card">
    <h2>1. 连本机后台</h2>
    <label>穿透地址（loca.lt）</label>
    <input id="api-base" type="url" placeholder="https://xxxx.loca.lt" autocomplete="off" />
    <div class="row">
      <button type="button" class="primary" id="api-save">保存</button>
      <button type="button" class="ghost" id="api-ping">测连通</button>
    </div>
    <div class="status" id="api-status"></div>
  </div>

  <div class="card">
    <h2>2. 真人问候 → 她</h2>
    <label>内容（正式通道，不加【真人】标签）</label>
    <textarea id="human-msg" placeholder="想跟她说的话…"></textarea>
    <div class="row">
      <button type="button" class="primary" id="human-send">发出去</button>
    </div>
    <div class="status" id="human-status"></div>
    <div class="log" id="human-log"></div>
  </div>

  <div class="card">
    <h2>3. 消息同步</h2>
    <p class="sub" style="margin-bottom:8px">把测试窗暗语那套同步动作，一键打到本机中继。</p>
    <div class="row">
      <button type="button" class="primary" id="sync-today">同步今天</button>
      <button type="button" class="ghost" id="sync-latest">同步最新</button>
    </div>
    <div class="status" id="sync-status"></div>
  </div>

  <div class="card">
    <h2>4. 表情包 → 她</h2>
    <div class="row" style="margin-top:0">
      <button type="button" class="ghost" id="sticker-refresh">刷新图库</button>
    </div>
    <div class="grid" id="sticker-grid"></div>
    <label style="margin-top:10px">配文（可空）</label>
    <input id="sticker-caption" placeholder="可选配文" />
    <div class="row">
      <button type="button" class="primary" id="sticker-send">发选中表情</button>
    </div>
    <div class="status" id="sticker-status"></div>
    <div class="log" id="sticker-log"></div>
  </div>

<script>
(function () {
  const KEY = "couple-api-base";
  let API = "";
  let selectedRel = "";
  let lastStreamError = "";

  function $(id) { return document.getElementById(id); }
  function setStatus(el, text, ok) {
    el.textContent = text || "";
    el.className = "status" + (ok === true ? " ok" : ok === false ? " err" : "");
  }
  function apiUrl(path) {
    if (/^https?:\/\//i.test(path)) return path;
    const base = API.replace(/\/$/, "");
    if (!base) throw new Error("先填并保存穿透地址");
    return base + (path.charAt(0) === "/" ? path : "/" + path);
  }
  async function api(path, opts) {
    const res = await fetch(apiUrl(path), opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText || "请求失败");
    return data;
  }
  async function readNdjsonStream(path, body, logEl) {
    lastStreamError = "";
    if (logEl) logEl.textContent = "";
    const res = await fetch(apiUrl(path), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let finalOk = null;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n");
      buf = parts.pop() || "";
      for (const line of parts) {
        if (!line.trim()) continue;
        let obj;
        try { obj = JSON.parse(line); } catch (_) { continue; }
        if (logEl && (obj.msg || obj.line || obj.text)) {
          logEl.textContent += (obj.msg || obj.line || obj.text) + "\n";
        }
        if (obj.error) lastStreamError = String(obj.error);
        if (typeof obj.ok === "boolean") finalOk = obj.ok;
        if (typeof obj.finalOk === "boolean") finalOk = obj.finalOk;
      }
    }
    return finalOk === true;
  }

  function loadApi() {
    try { API = String(localStorage.getItem(KEY) || "").replace(/\/$/, ""); } catch (_) { API = ""; }
    $("api-base").value = API;
    $("api-card").classList.toggle("warn-box", !API);
    setStatus($("api-status"), API ? ("已保存：" + API) : "未连接：填 loca.lt 地址", !!API);
  }
  $("api-save").onclick = () => {
    API = String($("api-base").value || "").trim().replace(/\/$/, "");
    try {
      if (API) localStorage.setItem(KEY, API);
      else localStorage.removeItem(KEY);
    } catch (_) {}
    loadApi();
  };
  $("api-ping").onclick = async () => {
    try {
      const r = await api("/api/status");
      setStatus($("api-status"), "连通 · " + (r.time || r.ok || "ok"), true);
    } catch (e) {
      setStatus($("api-status"), String(e), false);
    }
  };

  $("human-send").onclick = async () => {
    const msg = String($("human-msg").value || "").trim();
    if (!msg) return setStatus($("human-status"), "先写内容", false);
    setStatus($("human-status"), "发送中…", null);
    try {
      const ok = await readNdjsonStream("/api/send/human/stream", {
        scope: "girlfriend",
        message: msg,
        title: "真人问候",
      }, $("human-log"));
      setStatus($("human-status"), ok ? "✓ 已发出（看她微信）" : ("✗ " + (lastStreamError || "失败")), !!ok);
    } catch (e) {
      setStatus($("human-status"), String(e), false);
    }
  };

  async function sync(mode) {
    setStatus($("sync-status"), mode === "today" ? "同步今天…" : "同步最新…", null);
    try {
      const r = await api("/api/relay/sync", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode }),
      });
      setStatus(
        $("sync-status"),
        "完成 · 匹配 " + (r.matched || 0) + " · 送达 " + (r.delivered || 0) + (r.truncated ? "（已截断）" : ""),
        !!r.ok
      );
    } catch (e) {
      setStatus($("sync-status"), String(e), false);
    }
  }
  $("sync-today").onclick = () => sync("today");
  $("sync-latest").onclick = () => sync("latest");

  async function loadStickers() {
    setStatus($("sticker-status"), "加载图库…", null);
    selectedRel = "";
    const grid = $("sticker-grid");
    grid.innerHTML = "";
    try {
      const r = await api("/api/stickers");
      const items = r.items || [];
      if (!items.length) {
        setStatus($("sticker-status"), "图库空（电脑 stickers/ 目录）", false);
        return;
      }
      items.slice(0, 60).forEach((it) => {
        const btn = document.createElement("button");
        btn.type = "button";
        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = it.name || "";
        img.src = apiUrl("/api/stickers/file?rel=" + encodeURIComponent(it.rel));
        btn.appendChild(img);
        btn.onclick = () => {
          selectedRel = it.rel;
          grid.querySelectorAll("button").forEach((b) => b.classList.remove("on"));
          btn.classList.add("on");
          setStatus($("sticker-status"), "已选 " + it.name, true);
        };
        grid.appendChild(btn);
      });
      setStatus($("sticker-status"), "共 " + items.length + " 张，点选后发送", true);
    } catch (e) {
      setStatus($("sticker-status"), String(e), false);
    }
  }
  $("sticker-refresh").onclick = () => loadStickers();
  $("sticker-send").onclick = async () => {
    if (!selectedRel) return setStatus($("sticker-status"), "先点选一张", false);
    setStatus($("sticker-status"), "发送中…", null);
    try {
      const ok = await readNdjsonStream("/api/stickers/send/stream", {
        scope: "girlfriend",
        rel: selectedRel,
        caption: String($("sticker-caption").value || "").trim(),
      }, $("sticker-log"));
      setStatus($("sticker-status"), ok ? "✓ 表情已发" : ("✗ " + (lastStreamError || "失败")), !!ok);
    } catch (e) {
      setStatus($("sticker-status"), String(e), false);
    }
  };

  loadApi();
  if (API) loadStickers().catch(() => {});
})();
</script>
</body>
</html>
